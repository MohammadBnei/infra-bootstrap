# Single, hand-maintained host — nfs-storage is one static VM (see
# terraform/nfs.tf), not a fleet. Keep ansible_host in sync with
# terraform.tfvars' nfs_ip by hand. Unlike garage-storage (LXC, root user),
# this is a cloud-init VM with the same "core" user + sudo pattern as the
# k8s VMs (terraform/k8s-vms.tf) — matches its own dedicated id_nfs key,
# not id_k8s_vms/id_garage.
all:
  hosts:
    nfs-storage:
      ansible_host: 192.168.1.198 # matches terraform.tfvars' nfs_ip
      ansible_user: core
      ansible_ssh_private_key_file: ~/.ssh/id_nfs
      ansible_become: true
      ansible_become_method: sudo
