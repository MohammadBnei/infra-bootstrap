# Single, hand-maintained host — the Pi 4 is physical hardware, not
# Terraform-managed, so unlike garage-storage/nfs-storage there's no
# locally-generated dedicated keypair for it. Access is via Infisical's
# SSH_PI4_KEY — fetch it to a local file first and override
# ansible_ssh_private_key_file on the command line, e.g.:
#   infisical secrets get SSH_PI4_KEY --projectId=<id> --env=dev --plain > /tmp/pi4_key
#   chmod 600 /tmp/pi4_key
#   ansible-playbook -i ansible/inventories/pihole/hosts.yml \
#     -e ansible_ssh_private_key_file=/tmp/pi4_key ansible/playbooks/pihole-configure.yml
all:
  hosts:
    pihole:
      ansible_host: 192.168.1.55
      ansible_user: mohammad
      ansible_become: true
      ansible_become_method: sudo
