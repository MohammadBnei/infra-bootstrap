# Single, hand-maintained host — the Pi 4 is physical hardware, not
# Terraform-managed, so there's no generated inventory for it. Matches
# garage-storage/nfs-storage's "dedicated local key" convention rather
# than a Terraform-seeded one.
all:
  hosts:
    pihole:
      ansible_host: 192.168.1.55
      ansible_user: mohammad
      ansible_ssh_private_key_file: ~/.ssh/id_ed_pi
      ansible_become: true
      ansible_become_method: sudo
