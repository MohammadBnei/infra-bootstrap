# Single, hand-maintained host — build-runner is one static LXC (see
# terraform/build-runner.tf), not a fleet, same reasoning as the garage and
# k9s-dashboard inventories. Keep ansible_host in sync with
# terraform.tfvars' build_runner_ip by hand.
all:
  hosts:
    build-runner:
      ansible_host: 192.168.1.111 # matches terraform.tfvars' build_runner_ip
      ansible_user: root
      ansible_ssh_private_key_file: ~/.ssh/id_build_runner
