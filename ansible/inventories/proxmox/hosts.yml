# PVE-host inventory for ansible/playbooks/pve-postinstall.yml — separate
# from inventory/ukubi/hosts.yaml (that one targets K8s VMs, this one
# targets the Proxmox hosts themselves). Root SSH key access to both hosts
# must already be in place before running anything against this inventory
# (same root-account pattern terraform/providers.tf uses against .165) —
# not something this playbook sets up.
#
# zfs_pool_name/zfs_pool_device are placeholders — confirm the real device
# path via `lsblk`/`pvesm status` on each host before the first real run;
# don't guess (same discipline as terraform/variables.tf's
# template_storage_id). `proxmox` (.165) is included only as a delegation
# target (corosync join and `qm migrate` for template propagation are both
# issued *from* the existing cluster member, against a new node) — it's
# already PVE and otherwise out of this playbook's scope (no tasks target
# it directly; it's absent from both pve_new and pve_laptop).
all:
  hosts:
    proxmox:
      ansible_host: 192.168.1.165
      ansible_user: root
    server1:
      ansible_host: 192.168.1.200
      ansible_user: root
      pve_node_name: "" # confirm via `pvesh get /nodes` after join — not guaranteed identical to "server1"
      zfs_pool_name: zfs-server1
      zfs_pool_device: "" # confirm via `lsblk` on server1 — NVMe 476GB per ARCHITECTURE.md §1
    ex-laptop:
      ansible_host: 192.168.1.161
      ansible_user: root
      pve_node_name: "" # confirm via `pvesh get /nodes` after join — not guaranteed identical to "ex-laptop"
      zfs_pool_name: zfs-exlaptop
      zfs_pool_device: "" # confirm via `lsblk` on ex-laptop — SSD 238GB per ARCHITECTURE.md §1
  children:
    pve_new:
      hosts:
        server1:
        ex-laptop:
    pve_laptop:
      hosts:
        ex-laptop:
