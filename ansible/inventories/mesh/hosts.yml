# Every host that joins NetBird as an SSH peer (ADR-0055), one group per
# rollout stage. netbird-client.yml enrolls one stage at a time:
#   -e netbird_stage=<group>
#
# One name per machine: each alias here is the host's OS hostname, its
# Proxmox name, its Pi-hole record and its NetBird peer name
# (<alias>.bnei.mesh). netbird-client.yml refuses a host that is not in
# ansible/playbooks/vars/bnei-lan-records.yml under the same name and IP.
#
# ansible_host is the LAN address: enrollment has to run over the LAN,
# before the host is a peer.
#
# The kubespray and pigsty inventories stay the source of truth for those
# hosts and are never pointed at the mesh. Keep the addresses here in sync
# with inventory/ukubi/hosts.yaml, pigsty/pigsty.yml and terraform.tfvars.
all:
  children:
    spike:
      hosts:
        pg-etcd-witness:
          ansible_host: 192.168.1.197
          ansible_user: core
          ansible_become: true
          ansible_ssh_private_key_file: ~/.ssh/id_pg_etcd_witness
        k8s-worker-02:
          ansible_host: 192.168.1.203
          ansible_user: core
          ansible_become: true
          ansible_ssh_private_key_file: ~/.ssh/id_k8s_vms
        build-runner:
          ansible_host: 192.168.1.111
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_build_runner
          netbird_lxc_ctid: 103
          netbird_pve_node: server1

    # The rest of the k8s nodes. Cilium's devices are pinned to eth0 first
    # (k8s-net-cilium.yml), so wt0 never becomes a Cilium device. Run with
    # -e netbird_serial=1: one node at a time.
    k8s:
      vars:
        ansible_user: core
        ansible_become: true
        ansible_ssh_private_key_file: ~/.ssh/id_k8s_vms
      hosts:
        k8s-worker-01:
          ansible_host: 192.168.1.202
        k8s-cp-01:
          ansible_host: 192.168.1.201
        k8s-cp-02:
          ansible_host: 192.168.1.204
        k8s-cp-03:
          ansible_host: 192.168.1.206

    # PVE hosts, here only to give LXCs /dev/net/tun with `pct`. Not a stage:
    # enrolling the hypervisors themselves is a later stage of its own.
    pve_hosts:
      hosts:
        server1:
          ansible_host: 192.168.1.200
          ansible_user: root
          # PVE_SSH_PRIVATE_KEY, written to a temp file by netbird-client.yml
          ansible_ssh_private_key_file: "{{ hostvars['localhost'].pve_key_file }}"
