# Every host that joins NetBird as an SSH peer (ADR-0055), one group per
# rollout stage. netbird-client.yml enrolls one stage at a time:
#   -e netbird_stage=<group>
#
# One name per machine: each alias here is the host's OS hostname, its
# Proxmox name, its Pi-hole record and its NetBird peer name
# (<alias>.bnei.mesh). netbird-client.yml refuses a host that is not in
# ansible/playbooks/vars/bnei-lan-records.yml under the same name and IP.
#
# ansible_host is the LAN address: enrollment has to run over the LAN,
# before the host is a peer.
#
# The kubespray and pigsty inventories stay the source of truth for those
# hosts and are never pointed at the mesh. Keep the addresses here in sync
# with inventory/ukubi/hosts.yaml, pigsty/pigsty.yml and terraform.tfvars.
all:
  children:
    spike:
      hosts:
        pg-etcd-witness:
          ansible_host: 192.168.1.197
          ansible_user: core
          ansible_become: true
          ansible_ssh_private_key_file: ~/.ssh/id_pg_etcd_witness
        k8s-worker-02:
          ansible_host: 192.168.1.203
          ansible_user: core
          ansible_become: true
          ansible_ssh_private_key_file: ~/.ssh/id_k8s_vms
        build-runner:
          ansible_host: 192.168.1.111
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_build_runner
          netbird_lxc_ctid: 103
          netbird_pve_node: server1

    # The rest of the k8s nodes. Cilium's devices are pinned to eth0 first
    # (k8s-net-cilium.yml), so wt0 never becomes a Cilium device. Run with
    # -e netbird_serial=1: one node at a time.
    k8s:
      vars:
        ansible_user: core
        ansible_become: true
        ansible_ssh_private_key_file: ~/.ssh/id_k8s_vms
      hosts:
        k8s-worker-01:
          ansible_host: 192.168.1.202
        k8s-cp-01:
          ansible_host: 192.168.1.201
        k8s-cp-02:
          ansible_host: 192.168.1.204
        k8s-cp-03:
          ansible_host: 192.168.1.206
        k8s-worker-03:
          ansible_host: 192.168.1.208
        k8s-worker-04:
          ansible_host: 192.168.1.209

    # Patroni members. Replica first, leader last — check `curl -s
    # http://192.168.1.205:8008/cluster` and reorder if roles changed. Run with
    # -e netbird_serial=1. Their key is SSH_OLDPG_KEY (Infisical), not a local
    # file: fetch it to a 0600 temp file and pass
    # -e ansible_ssh_private_key_file=<path>.
    pg:
      vars:
        ansible_user: vagrant
        ansible_become: true
        node_ssh_key_secret: SSH_OLDPG_KEY # read by ansible/scripts/node.sh --lan
      hosts:
        pg02:
          ansible_host: 192.168.1.207
        pg01:
          ansible_host: 192.168.1.205

    # Non-storage LXCs. Each gets /dev/net/tun from its PVE host and one
    # container reboot. hermesagent (LXC 101) is not here yet: its inbound SSH
    # key is recorded nowhere, so it needs a pct-exec path first.
    lxc:
      hosts:
        k9s-dashboard:
          ansible_host: 192.168.1.110
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_k9s_dashboard
          netbird_lxc_ctid: 102
          netbird_pve_node: server1

    # The hypervisors. Key: PVE_SSH_PRIVATE_KEY via
    # -e ansible_ssh_private_key_file=<temp file>. Run with -e netbird_serial=1.
    pve:
      vars:
        node_ssh_key_secret: PVE_SSH_PRIVATE_KEY # read by ansible/scripts/node.sh --lan
      hosts:
        bnei:
          ansible_host: 192.168.1.165
          ansible_user: root
        server1:
        ex-laptop:
          ansible_host: 192.168.1.161
          ansible_user: root
        pve-mini-01:
          ansible_host: 192.168.1.20
          ansible_user: root
        pve-mini-02:
          ansible_host: 192.168.1.21
          ansible_user: root

    # The Pi running Pi-hole (arm64). Key: SSH_PI4_KEY via
    # -e ansible_ssh_private_key_file=<temp file>.
    pi:
      vars:
        node_ssh_key_secret: SSH_PI4_KEY # read by ansible/scripts/node.sh --lan
      hosts:
        pihole:
          ansible_host: 192.168.1.55
          ansible_user: mohammad
          ansible_become: true

    # PVE hosts, here only to give LXCs /dev/net/tun with `pct`. Not a stage:
    # enrolling the hypervisors themselves is a later stage of its own.
    pve_hosts:
      hosts:
        server1:
          ansible_host: 192.168.1.200
          ansible_user: root
          # PVE_SSH_PRIVATE_KEY, written to a temp file by netbird-client.yml
          ansible_ssh_private_key_file: "{{ hostvars['localhost'].pve_key_file }}"
