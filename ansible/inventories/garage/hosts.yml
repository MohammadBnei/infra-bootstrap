# Single, hand-maintained host — garage-storage is one static LXC (see
# terraform/garage.tf), not a fleet, so it doesn't earn Terraform-generated
# inventory machinery like inventory/ukubi/hosts.yaml has for the k8s_nodes
# map. Keep ansible_host in sync with terraform.tfvars' garage_ip by hand;
# revisit if Garage ever actually goes multi-node (ARCHITECTURE.md §7).
all:
  hosts:
    garage-storage:
      ansible_host: 192.168.1.199 # matches terraform.tfvars' garage_ip
      ansible_user: root
      ansible_ssh_private_key_file: ~/.ssh/id_garage
