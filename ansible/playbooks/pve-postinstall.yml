# PVE post-install prep for `.200` (server1) and `.161` (ex-laptop) — Stage 2
# of the multi-host expansion (see docs/adr/0020-pve-corosync-cluster.md,
# docs/runbook-pve-postinstall.md). Authored ahead of hardware/connectivity
# being available; safe to review/lint now, run once both hosts have PVE
# installed and are SSH-reachable as root.
#
# WHY THIS PLAYBOOK EXISTS
# `.200`/`.161` currently run Debian 12 + libvirt/KVM (legacy k8s nodes,
# to be decommissioned separately). Once reinstalled with PVE, they join
# `.165` as a single corosync-clustered PVE datacenter (ADR-0020) — this
# playbook is everything needed between "fresh PVE install" and "ready for
# Terraform to place K8s VMs on them" (Phase B/C of the plan).
#
# No template-propagation step here on purpose: corosync clustering already
# lets any node clone/manage any other node's VMs through the shared cluster
# filesystem, so a future `vm-provision.yml` can do `qm clone 9001 <newid>
# --target <node> --full` directly at VM-creation time — no need to
# pre-stage a local copy of the golden template (VMID 9001, stays on
# proxmox) on every new node ahead of time. An earlier version of this
# playbook tried to pre-stage it via `qm migrate`, which actually *relocates*
# a VM rather than copying it (a VMID is cluster-wide unique in PVE's
# pmxcfs) — confirmed live when "propagating" the template this way silently
# moved it off proxmox entirely instead of leaving a copy behind.
#
# Requires: ansible.posix collection — ansible-galaxy collection install -r
# ansible/requirements.yml
#
# The corosync-join play (tag: corosync) also needs PVE_SSH_PRIVATE_KEY in
# its environment (e.g. via `infisical run --projectId=<id> --env=dev --`) —
# it reuses the same shared PVE root key already trusted for root@proxmox to
# pre-establish trust FROM the new node TO proxmox, so `pvecm add` never
# blocks on an interactive password prompt.
#
# Run order matters — see docs/runbook-pve-postinstall.md. Plays are tagged
# so the corosync join can be run separately from the rest:
#   ansible-playbook -i ansible/inventories/proxmox/hosts.yml \
#     ansible/playbooks/pve-postinstall.yml --skip-tags corosync
#   infisical run --projectId=<id> --env=dev -- ansible-playbook \
#     -i ansible/inventories/proxmox/hosts.yml \
#     ansible/playbooks/pve-postinstall.yml --tags corosync --limit=server1
#   infisical run --projectId=<id> --env=dev -- ansible-playbook \
#     -i ansible/inventories/proxmox/hosts.yml \
#     ansible/playbooks/pve-postinstall.yml --tags corosync --limit=ex-laptop
# The corosync join must run against one new host at a time (never both via
# a bare --limit=pve_new) — simultaneous joins are a known corosync footgun.
---
- name: Disable suspend/sleep on ex-laptop (ADR-0013 — PVE node must never sleep)
  hosts: pve_laptop
  gather_facts: false
  tasks:
    - name: Set lid-switch behavior to ignore in logind.conf
      ansible.builtin.lineinfile:
        path: /etc/systemd/logind.conf
        regexp: "^#?{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
      loop:
        - { key: HandleLidSwitch, value: ignore }
        - { key: HandleLidSwitchDocked, value: ignore }
        - { key: HandleLidSwitchExternalPower, value: ignore }
      loop_control:
        label: "{{ item.key }}"
      notify: Restart systemd-logind

    - name: Mask sleep/suspend/hibernate targets (belt-and-suspenders vs. non-lid triggers)
      ansible.builtin.systemd:
        name: "{{ item }}"
        masked: true
      loop:
        - sleep.target
        - suspend.target
        - hibernate.target
        - hybrid-sleep.target

    - name: Flush handlers now so verification below sees the final state
      ansible.builtin.meta: flush_handlers

    - name: Verify all 4 targets are masked
      ansible.builtin.command: "systemctl status {{ item }}"
      register: mask_status
      changed_when: false
      failed_when: "'masked' not in mask_status.stdout"
      loop:
        - sleep.target
        - suspend.target
        - hibernate.target
        - hybrid-sleep.target

  handlers:
    - name: Restart systemd-logind
      ansible.builtin.systemd:
        name: systemd-logind
        state: restarted

- name: Common PVE host prep (repos, time sync, SSH access)
  hosts: pve_new
  gather_facts: true
  vars:
    pve_admin_ssh_public_key_file: "" # path to hermesagent's public key (bastion pattern, ARCHITECTURE.md §8) — confirm before running
    pve_sysctl_settings: {} # none locked in yet for the PVE host layer itself (separate from k8s-node-prereqs.yml's kernel/sysctl scope) — add here if/when a real requirement shows up
  tasks:
    # PVE 9 (Debian 13/trixie) ships repo files in the deb822 .sources format,
    # not the old one-line .list format — confirm the exact enterprise-repo
    # filename on first run (`ls /etc/apt/sources.list.d/`) since it can vary
    # by point release; this task tolerates either by disabling whichever
    # exists (failed_when: false, both attempts are safe no-ops otherwise).
    #
    # PVE's stock pve-enterprise.sources often omits the `Enabled:` key
    # entirely (deb822 defaults an absent key to enabled) — `insertafter`
    # adds an explicit `Enabled: no` right after `Components:` when no
    # `Enabled:` line exists yet, instead of only rewriting one that does.
    - name: Disable the pve-enterprise repo, .sources form (no active subscription)
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list.d/pve-enterprise.sources
        regexp: "^Enabled:"
        insertafter: "^Components:"
        line: "Enabled: no"
      failed_when: false

    - name: Disable the pve-enterprise repo, legacy .list form (no active subscription)
      ansible.builtin.replace:
        path: /etc/apt/sources.list.d/pve-enterprise.list
        regexp: "^deb "
        replace: "# deb "
      failed_when: false

    - name: Add the pve-no-subscription repo
      ansible.builtin.deb822_repository:
        name: pve-no-subscription
        types: deb
        uris: http://download.proxmox.com/debian/pve
        suites: "{{ ansible_distribution_release }}"
        components: pve-no-subscription
        signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg

    # PVE hosts ship with either systemd-timesyncd or chrony depending on the
    # install media/point release (confirmed live: server1 has
    # systemd-timesyncd, ex-laptop only has chrony) — enable whichever is
    # actually present instead of assuming one.
    - name: Detect which time-sync service is available on this host
      ansible.builtin.service_facts:

    - name: Ensure systemd-timesyncd is enabled and running (NTP), if present
      ansible.builtin.systemd:
        name: systemd-timesyncd
        enabled: true
        state: started
      when: "'systemd-timesyncd.service' in ansible_facts.services"

    - name: Ensure chrony is enabled and running (NTP), if present instead
      ansible.builtin.systemd:
        name: chrony
        enabled: true
        state: started
      when: "'chrony.service' in ansible_facts.services"

    - name: Apply PVE host sysctl settings (currently empty — see pve_sysctl_settings above)
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_set: true
        reload: true
      loop: "{{ pve_sysctl_settings | dict2items }}"
      when: pve_sysctl_settings | length > 0

    - name: Authorize the hermesagent bastion SSH key for root
      ansible.posix.authorized_key:
        user: root
        key: "{{ lookup('file', pve_admin_ssh_public_key_file) }}"
      when: pve_admin_ssh_public_key_file | length > 0

- name: Create dedicated ZFS pool per host (ADR-0014)
  hosts: pve_new
  gather_facts: false
  tasks:
    - name: Check whether the ZFS pool already exists
      ansible.builtin.command: "zpool list {{ zfs_pool_name }}"
      register: zpool_check
      changed_when: false
      failed_when: false

    - name: Create the ZFS pool
      ansible.builtin.command: "zpool create -f {{ zfs_pool_name }} {{ zfs_pool_device }}"
      when:
        - zpool_check.rc != 0
        - zfs_pool_device | length > 0

    # ponytail: "already defined" is PVE's typical conflict wording but is
    # unconfirmed against a live host (unlike the enterprise-repo task above,
    # which is confirmed) — verify on first real run; if PVE's wording ever
    # differs, a legitimate re-run would misreport as failed here.
    - name: Register the pool as PVE storage
      ansible.builtin.command: "pvesm add zfspool {{ zfs_pool_name }} -pool {{ zfs_pool_name }}"
      register: pvesm_add
      changed_when: "'already defined' not in (pvesm_add.stderr | default(''))"
      failed_when:
        - pvesm_add.rc != 0
        - "'already defined' not in (pvesm_add.stderr | default(''))"
      when: zfs_pool_device | length > 0

- name: Keep the USB NIC advertising gigabit (see docs/bootstrap-test-notes.md 2026-08-31)
  # server1 was found running at 100Mb/s while its switch port offered gigabit:
  #
  #   Supported:               10 / 100 / 1000baseT   <- adapter can do it
  #   Advertised:              10 / 100baseT only     <- adapter was not offering it
  #   Link partner advertised: 10 / 100 / 1000baseT   <- switch was offering it
  #
  # Not a cable and not a switch port — the adapter's advertised set had been
  # clamped, almost certainly by the `carrier off`/`carrier on` bounce in dmesg
  # after a reboot. Nothing in /etc/network/interfaces or udev sets it, so it is
  # runtime state that a plain `ethtool -s` restores and a reboot loses again.
  #
  # It cost more than it looks: zot and half the k8s nodes live behind that link,
  # so registry pushes crawled at ~2.2MB/s and died on a 60s timeout, and a
  # Longhorn rebuild sat at 74% for ages. Restoring gigabit took it to 99% in
  # minutes.
  #
  # A systemd oneshot rather than `post-up` in /etc/network/interfaces: PVE's own
  # UI writes that file, and this has no business fighting it over ownership.
  hosts: pve_new
  become: true
  # Tagged so this can be applied on its own. This playbook also creates ZFS
  # pools and joins corosync; an untagged run to fix a NIC would be wildly
  # disproportionate to the change.
  tags: nic-speed
  tasks:
    - name: Detect the bridge uplink driver
      ansible.builtin.command: ethtool -i nic0
      register: nic0_driver
      changed_when: false
      failed_when: false

    - name: Install the gigabit-advertise unit
      # 0x03f = 10baseT H/F + 100baseT H/F + 1000baseT H/F. Advertising the full
      # set and leaving autoneg on, rather than forcing `speed 1000`, so a
      # genuinely degraded cable still negotiates down instead of losing link.
      ansible.builtin.copy:
        dest: /etc/systemd/system/nic0-advertise-gigabit.service
        mode: "0644"
        owner: root
        group: root
        content: |
          # Managed by ansible/playbooks/pve-postinstall.yml.
          [Unit]
          Description=Re-advertise 10/100/1000 on nic0 (USB NIC loses it on carrier bounce)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/sbin/ethtool -s nic0 autoneg on advertise 0x03f

          [Install]
          WantedBy=multi-user.target
      when: nic0_driver.rc == 0
      register: nic0_unit

    - name: Enable it
      ansible.builtin.systemd_service:
        name: nic0-advertise-gigabit.service
        enabled: true
        state: started
        daemon_reload: true
      when: nic0_driver.rc == 0

    - name: Report the negotiated speed
      ansible.builtin.shell: |
        set -o pipefail
        ethtool nic0 | awk '/Speed:/{print $2}'
      args:
        executable: /bin/bash
      register: nic0_speed
      changed_when: false
      failed_when: false

    - name: Warn if the link is still not gigabit
      # Deliberately a warning, not a failure: a real cable fault should not
      # block the rest of a host build, but it must not pass silently either.
      ansible.builtin.debug:
        msg: >-
          nic0 negotiated {{ nic0_speed.stdout | trim }} — expected 1000Mb/s.
          Check the cable and switch port; see docs/bootstrap-test-notes.md.
      when: nic0_driver.rc == 0 and (nic0_speed.stdout | trim) != "1000Mb/s"

- name: Join the corosync PVE cluster (ADR-0020) — run one host at a time via --limit
  hosts: pve_new
  gather_facts: false
  tags: corosync
  vars:
    pve_cluster_name: ukubi
  tasks:
    # ADR-0020: "`.165` stays the founding member" — but nothing ever actually
    # ran `pvecm create` on it, so every `pvecm add`/addnode attempt failed
    # with "invalid corosync.conf" / "error0: no nodes found" (confirmed live
    # via the task log: proxmox had no corosync cluster to add a node *to*).
    # Guarded the same way as the ZFS-pool/join checks below: only creates
    # once, safe to leave in place permanently. `run_once` because this only
    # ever needs to happen a single time regardless of how many pve_new hosts
    # this play targets.
    - name: Check whether proxmox (.165) is already a corosync cluster
      ansible.builtin.command: pvecm status
      delegate_to: proxmox
      run_once: true
      register: proxmox_pvecm_status
      changed_when: false
      failed_when: false

    - name: Bootstrap the corosync cluster on proxmox (.165), if not already done
      ansible.builtin.command: "pvecm create {{ pve_cluster_name }}"
      delegate_to: proxmox
      run_once: true
      when: >-
        proxmox_pvecm_status.rc != 0 or
        'Cluster information' not in proxmox_pvecm_status.stdout

    # `pvecm create` returns before corosync/pmxcfs actually reach quorum —
    # confirmed live: the very next task (the join attempt below) ran too
    # soon after and got "cluster not ready - no quorum?" from proxmox, even
    # though `pvecm create` itself had already succeeded. Same guard
    # condition as the bootstrap task above: only need to wait right after
    # we were the one who just created it.
    - name: Wait for proxmox (.165) to reach quorum after cluster bootstrap
      ansible.builtin.command: pvecm status
      delegate_to: proxmox
      run_once: true
      register: proxmox_quorum_wait
      until: "'Quorate:' in proxmox_quorum_wait.stdout and 'Yes' in proxmox_quorum_wait.stdout"
      retries: 10
      delay: 3
      changed_when: false
      when: >-
        proxmox_pvecm_status.rc != 0 or
        'Cluster information' not in proxmox_pvecm_status.stdout

    - name: Check current corosync membership
      ansible.builtin.command: pvecm status
      register: pvecm_status
      changed_when: false
      failed_when: false

    # `pvecm add` connects FROM this node TO proxmox over SSH as root — pre-seed
    # its known_hosts so the first contact doesn't hang on an unattended
    # fingerprint prompt.
    - name: Pre-trust proxmox's SSH host key (avoid an unattended fingerprint prompt)
      ansible.builtin.shell: |
        ssh-keyscan -H {{ hostvars['proxmox'].ansible_host }} >> ~/.ssh/known_hosts
      changed_when: true
      when: >-
        pvecm_status.rc != 0 or
        'Cluster information' not in pvecm_status.stdout

    # `pvecm add` also needs root-SSH auth FROM this node TO proxmox — a
    # *separate* trust relationship from the ansible-control-node -> PVE-host
    # trust this playbook's own connection relies on. Without it, `pvecm add`
    # blocks on an interactive password prompt that a non-tty ansible task can
    # never answer (confirmed live: it just sits there running indefinitely).
    # Reusing the same shared PVE_SSH_PRIVATE_KEY that's already trusted for
    # root@proxmox (terraform/ansible use it there too) makes this fully
    # unattended and idempotent instead — same fix covers ex-laptop's join
    # later for free. Value comes from the calling shell's environment
    # (`infisical run` sets it), never written to this repo.
    #
    # `infisical run` strips the value's trailing newline when injecting it
    # as an env var — an OpenSSH private key file without that final newline
    # after "-----END OPENSSH PRIVATE KEY-----" fails to parse ("error in
    # libcrypto"), confirmed live (this task wrote a 398-byte, newline-less
    # file that left `pvecm add` hung on a key that could never work). Same
    # trailing-newline-corruption class as the GitHub PAT bug fixed in
    # ansible/playbooks/register-repos.yml — opposite direction here (add one
    # back, rather than trim an extra one), so `trim` first to normalize
    # whatever whitespace made it through, then append exactly one newline.
    - name: Write the shared PVE root SSH key for this node's outbound use
      ansible.builtin.copy:
        content: "{{ (lookup('ansible.builtin.env', 'PVE_SSH_PRIVATE_KEY') | trim) ~ '\n' }}"
        dest: /root/.ssh/id_pve_cluster
        mode: "0600"
      no_log: true
      when: >-
        pvecm_status.rc != 0 or
        'Cluster information' not in pvecm_status.stdout

    - name: Point outbound SSH to proxmox at that key
      ansible.builtin.blockinfile:
        path: /root/.ssh/config
        create: true
        mode: "0600"
        marker: "# {mark} ANSIBLE MANAGED BLOCK - pve cluster trust"
        block: |
          Host {{ hostvars['proxmox'].ansible_host }}
            IdentityFile /root/.ssh/id_pve_cluster
      when: >-
        pvecm_status.rc != 0 or
        'Cluster information' not in pvecm_status.stdout

    # `--use_ssh 1` matters: PVE 9's `pvecm add` defaults to its *API*-based
    # join (PVE::CLI::pvecm's `code` sub always calls
    # PVE::PTY::read_password("Please enter superuser (root) password for
    # ...") first when `use_ssh` isn't set — confirmed by reading
    # /usr/share/perl5/PVE/CLI/pvecm.pm live) and prompts for proxmox's root
    # password unconditionally, ignoring any SSH key trust entirely. That's
    # what was actually hanging the join, not a missing/broken key (the
    # trust tasks above are correct and necessary, just for the *other* join
    # path). `--use_ssh 1` forces the old SSH-based method, which does
    # respect the key trust (PVE's own ssh calls for this path use `-o
    # BatchMode=yes`).
    - name: Join the cluster hosted at proxmox (.165)
      ansible.builtin.command: "pvecm add {{ hostvars['proxmox'].ansible_host }} --use_ssh 1"
      when: >-
        pvecm_status.rc != 0 or
        'Cluster information' not in pvecm_status.stdout
