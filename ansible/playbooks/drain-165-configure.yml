#!/usr/bin/env ansible-playbook
---
# Configures .165 (the PVE host that dual-boots into Windows for gaming) to
# automatically drain k8s-cp-01/k8s-worker-01 before every graceful
# shutdown/reboot. Confirmed live 2026-07-30: an ungraceful .165 outage
# left Longhorn volumes stuck Multi-Attach (Grafana's pod couldn't start on
# another node while the old one, stuck on the dead node, still "held" the
# volume) — Kubernetes' default node-eviction timer reschedules *pods* but
# never force-detaches CSI volumes from a node it can't confirm is gone.
# Draining *before* the node disappears avoids this entirely: pods get
# evicted and volumes cleanly detached while the node is still reachable.
# See docs/bootstrap-test-notes.md's 2026-07-30 entries and
# gitops/bootstrap/node-drainer-rbac.yaml (the scoped RBAC this depends on).
#
# WHY A DEDICATED, NON-ADMIN CREDENTIAL
# .165 is a dual-boot consumer OS, more exposed than the other infra hosts
# — the kubeconfig this playbook installs there is deliberately scoped to
# just `kubectl drain` (cordon a node, evict its pods), never cluster-admin.
# The actual bearer token is minted live via `kubectl create token` and
# never committed to git or printed to a terminal — this playbook writes it
# straight into the target kubeconfig file.
#
# WHY A SYSTEMD SERVICE, NOT A /usr/lib/systemd/system-shutdown/ SCRIPT
# Scripts in system-shutdown/ run *after* the network is already torn
# down — too late to reach the cluster. A oneshot service ordered
# `Before=shutdown.target` + `After=network-online.target` runs its
# `ExecStop` *during* the shutdown sequence but before networking goes
# away. `TimeoutStopSec` bounds how long systemd waits for it, so a hung
# drain can't block a real shutdown indefinitely — worst case, it times
# out and shutdown proceeds anyway (no worse than not draining at all).
#
# REAL BUG FOUND 2026-07-30, FIXED HERE: the first version of this unit
# only ordered itself against shutdown.target/network-online.target — it
# never raced against Proxmox's OWN guest-shutdown service
# (pve_guests_service below, confirmed as `pve-guests.service` on this
# host), which stops every running VM/LXC (including k8s-cp-01 and
# k8s-worker-01 THEMSELVES) as part of .165's own shutdown sequence. Live
# test: cordon succeeded instantly, but eviction only got through ~1 of 34
# pods before the nodes went NotReady — the guest VMs were being powered
# off concurrently with (or before) the drain script's eviction loop,
# killing kubelet mid-drain. Fixed with an explicit
# `Before=pve-guests.service` so the full drain completes before Proxmox
# even starts stopping the guest VMs, and generous timeouts (well above
# how long evicting ~30+ pods with real termination grace periods takes)
# rather than the original, too-tight 75s/90s.
#
# COUNTERPART NEEDED ON THE WAY BACK UP: draining cordons the nodes but
# never uncordons them — without uncordon-165.service (below), every
# `.165` boot leaves k8s-cp-01/k8s-worker-01 permanently unschedulable
# even once they're healthy and rejoined. That service polls until both
# nodes report Ready, then uncordons — it can't just run unconditionally
# at boot, since `.165` finishing its own boot doesn't mean the guest VMs
# (which ARE these two K8s nodes) have finished booting and rejoining the
# cluster yet.
#
# LIMITATION (accepted, not fixable from here): only fires on a graceful,
# systemd-initiated shutdown/reboot — not a hard power-cut. Acceptable
# since switching to Windows on this dual-boot host normally goes through
# a real `reboot`/`shutdown`, not a cold power-off.
#
# PREREQUISITES
# - gitops/bootstrap/node-drainer-rbac.yaml already applied (self-syncs
#   via ADR-0021's bootstrap Application once merged to main).
# - Root SSH access to .165 (PVE_SSH_PRIVATE_KEY from Infisical) AND to a
#   reachable K8s control-plane node (this repo's ~/.ssh/id_k8s_vms, user
#   `core`) simultaneously — two different keys, so run this via an
#   ssh-agent with both loaded rather than a single
#   ANSIBLE_PRIVATE_KEY_FILE override:
#     ssh-agent bash -c '
#       ssh-add /tmp/pve_root_key
#       ssh-add ~/.ssh/id_k8s_vms
#       ansible-playbook -i ansible/inventories/proxmox/hosts.yml \
#         -l proxmox ansible/playbooks/drain-165-configure.yml
#     '
# - k8s_control_plane_host below must be a *currently reachable* CP node —
#   deliberately hardcoded to k8s-cp-02 (server1) rather than k8s-cp-01
#   (.165 itself — can't delegate to the host being configured to reach
#   its own cluster membership before this playbook has even run).

- name: Configure .165's pre-shutdown drain automation
  hosts: proxmox
  become: false
  gather_facts: false
  vars:
    k8s_control_plane_host: 192.168.1.204 # k8s-cp-02, server1 — any reachable CP works, this one just isn't .165 itself
    k8s_vip: 192.168.1.180
    kube_version: v1.35.4
    node_drainer_namespace: kube-system
    node_drainer_sa: node-drainer
    drain_nodes: [k8s-cp-01, k8s-worker-01] # both physically on .165
    pve_guests_service: pve-guests.service # confirmed live 2026-07-30 via `systemctl list-units | grep pve` — Proxmox's own guest-shutdown unit; drain-165.service MUST order Before= this
    drain_timeout: 180s # generous — evicting ~30+ real pods with normal termination grace periods needs real wall-clock time; the original 75s only got through ~1 pod before losing the node
    drain_stop_timeout_sec: 240 # > drain_timeout, gives the script room to hit its own internal timeout and exit cleanly before systemd gives up on it
    uncordon_max_wait_sec: 600 # how long uncordon-165.service polls for both nodes to report Ready before giving up (manual `kubectl uncordon` remains the fallback)
    uncordon_poll_interval_sec: 10

  tasks:
    - name: Fetch cluster CA cert (delegated to a live CP node)
      delegate_to: "{{ k8s_control_plane_host }}"
      remote_user: core
      become: true
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - config
          - view
          - --raw
          - -o
          - jsonpath={.clusters[0].cluster.certificate-authority-data}
      register: ca_cert_result
      changed_when: false

    - name: Mint a long-lived scoped token for node-drainer (delegated)
      delegate_to: "{{ k8s_control_plane_host }}"
      remote_user: core
      become: true
      no_log: true
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig=/etc/kubernetes/admin.conf
          - --server=https://{{ k8s_vip }}:6443
          - create
          - token
          - "{{ node_drainer_sa }}"
          - -n
          - "{{ node_drainer_namespace }}"
          - --duration=87600h
      register: token_result
      changed_when: true

    - name: Ensure /etc/k8s-drain exists
      become: true
      ansible.builtin.file:
        path: /etc/k8s-drain
        state: directory
        mode: "0700"
        owner: root
        group: root

    - name: Write the scoped kubeconfig
      become: true
      no_log: true
      ansible.builtin.copy:
        dest: /etc/k8s-drain/kubeconfig
        mode: "0600"
        owner: root
        group: root
        content: |
          apiVersion: v1
          kind: Config
          clusters:
          - name: ukubi-cluster
            cluster:
              server: https://{{ k8s_vip }}:6443
              certificate-authority-data: {{ ca_cert_result.stdout }}
          contexts:
          - name: node-drainer
            context:
              cluster: ukubi-cluster
              user: node-drainer
          current-context: node-drainer
          users:
          - name: node-drainer
            user:
              token: {{ token_result.stdout }}

    - name: Check whether kubectl is already installed
      become: true
      ansible.builtin.stat:
        path: /usr/local/bin/kubectl
      register: kubectl_stat

    - name: Install kubectl (matching cluster version)
      become: true
      when: not kubectl_stat.stat.exists
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kube_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"

    - name: Write the drain script
      become: true
      ansible.builtin.copy:
        dest: /usr/local/bin/drain-165.sh
        mode: "0755"
        owner: root
        group: root
        content: |
          #!/bin/bash
          # Drains k8s-cp-01/k8s-worker-01 (both hosted on this PVE node) before a
          # graceful shutdown/reboot — run by systemd (drain-165.service), never
          # by hand. Bounded by the calling systemd unit's TimeoutStopSec, but also
          # self-bounds via --timeout so it never hangs indefinitely on its own.
          #
          # Uses a scoped kubeconfig (/etc/k8s-drain/kubeconfig, ServiceAccount
          # node-drainer, RBAC: gitops/bootstrap/node-drainer-rbac.yaml) — cordon +
          # evict only, not cluster-admin, since this credential lives on a
          # dual-boot gaming host.
          set -uo pipefail

          export KUBECONFIG=/etc/k8s-drain/kubeconfig
          LOG_TAG="drain-165"

          logger -t "$LOG_TAG" "starting drain of {{ drain_nodes | join(', ') }}"

          /usr/local/bin/kubectl drain {{ drain_nodes | join(' ') }} \
            --ignore-daemonsets \
            --delete-emptydir-data \
            --force \
            --timeout={{ drain_timeout }}

          rc=$?
          if [ "$rc" -eq 0 ]; then
            logger -t "$LOG_TAG" "drain completed cleanly"
          else
            logger -t "$LOG_TAG" "drain exited $rc (timed out or partially failed) — proceeding with shutdown anyway"
          fi

          exit 0

    - name: Write the systemd unit
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/system/drain-165.service
        mode: "0644"
        owner: root
        group: root
        content: |
          [Unit]
          Description=Drain k8s-cp-01/k8s-worker-01 before this hypervisor shuts down
          Documentation=file:///usr/local/bin/drain-165.sh
          DefaultDependencies=no
          Before=shutdown.target reboot.target halt.target {{ pve_guests_service }}
          After=network-online.target
          Wants=network-online.target
          Conflicts=shutdown.target reboot.target halt.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/true
          ExecStop=/usr/local/bin/drain-165.sh
          TimeoutStopSec={{ drain_stop_timeout_sec }}

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start drain-165.service
      become: true
      ansible.builtin.systemd:
        name: drain-165.service
        daemon_reload: true
        enabled: true
        state: started

    - name: Write the uncordon script (startup counterpart)
      become: true
      ansible.builtin.copy:
        dest: /usr/local/bin/uncordon-165.sh
        mode: "0755"
        owner: root
        group: root
        content: |
          #!/bin/bash
          # Counterpart to drain-165.sh: draining cordons k8s-cp-01/k8s-worker-01
          # but never uncordons them, so every .165 boot would otherwise leave
          # both nodes permanently unschedulable even once healthy. Polls
          # because .165 finishing its own boot doesn't mean the guest VMs
          # (which ARE these two K8s nodes) have finished booting and
          # rejoining the cluster yet — run by systemd (uncordon-165.service)
          # on every boot, never by hand.
          set -uo pipefail

          export KUBECONFIG=/etc/k8s-drain/kubeconfig
          LOG_TAG="uncordon-165"
          MAX_WAIT={{ uncordon_max_wait_sec }}
          INTERVAL={{ uncordon_poll_interval_sec }}
          elapsed=0

          logger -t "$LOG_TAG" "waiting for {{ drain_nodes | join(', ') }} to report Ready"

          both_ready() {
            local status
            status=$(/usr/local/bin/kubectl get nodes {{ drain_nodes | join(' ') }} \
              -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' 2>/dev/null)
            [ "$(printf '%s\n' "$status" | sort -u)" = "True" ]
          }

          while [ "$elapsed" -lt "$MAX_WAIT" ]; do
            if both_ready; then
              logger -t "$LOG_TAG" "both nodes Ready, uncordoning"
              /usr/local/bin/kubectl uncordon {{ drain_nodes | join(' ') }}
              exit $?
            fi
            sleep "$INTERVAL"
            elapsed=$((elapsed + INTERVAL))
          done

          logger -t "$LOG_TAG" "gave up after ${MAX_WAIT}s waiting for {{ drain_nodes | join(', ') }} to be Ready — uncordon manually: kubectl uncordon {{ drain_nodes | join(' ') }}"
          exit 1

    - name: Write the uncordon systemd unit
      become: true
      ansible.builtin.copy:
        dest: /etc/systemd/system/uncordon-165.service
        mode: "0644"
        owner: root
        group: root
        content: |
          [Unit]
          Description=Uncordon k8s-cp-01/k8s-worker-01 once they rejoin after this hypervisor boots
          Documentation=file:///usr/local/bin/uncordon-165.sh
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/bin/uncordon-165.sh
          TimeoutStartSec={{ uncordon_max_wait_sec | int + 30 }}

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start uncordon-165.service
      become: true
      ansible.builtin.systemd:
        name: uncordon-165.service
        daemon_reload: true
        enabled: true
        state: started

#--------------------------------------------------------------#
# Usage
#--------------------------------------------------------------#
# First run (or to rotate the token): see PREREQUISITES above. Re-running
# this playbook (e.g. after editing timeouts/ordering) re-applies both
# services idempotently — `state: started` on uncordon-165.service also
# means a re-run immediately tries to uncordon k8s-cp-01/k8s-worker-01 if
# they're currently cordoned-but-Ready, useful right after a botched
# manual drain test.
#
# Verify: ssh root@192.168.1.165 systemctl status drain-165.service uncordon-165.service
#
# Test the drain without a real reboot:
#   ssh root@192.168.1.165 systemctl stop drain-165.service
#   (fires ExecStop — the actual drain — without shutting the host down;
#   re-run `systemctl start drain-165.service` after)
#
# Test the uncordon without a real reboot:
#   ssh root@192.168.1.165 systemctl restart uncordon-165.service
#   (safe to run any time — it only acts once both nodes report Ready,
#   and uncordon is a no-op if they're already schedulable)
#
# Confirm pve_guests_service is the right name on THIS host before
# trusting the ordering fix: `systemctl list-units | grep -i pve` — if
# Proxmox ever renames/replaces this unit, update the var at the top of
# this playbook, don't hardcode a fix elsewhere.
...
