---
# Configure Garage (S3-compatible object storage) on the bare garage-storage
# LXC that terraform/garage.tf creates. Safe to re-run — see the caveat
# below.
#
# WHY THIS PLAYBOOK EXISTS
# terraform/garage.tf used to rely on a community-scripts.org installer to
# create AND configure the container in one non-interactive-sounding step.
# In practice that installer drops into an interactive whiptail menu and
# hangs forever under Terraform's non-interactive SSH provisioner
# (docs/bootstrap-test-notes.md). Terraform now only creates a bare,
# SSH-reachable Debian LXC — this playbook does everything else: install
# the Garage binary, write its config, start it, assign single-node cluster
# layout, create the buckets Longhorn/pgBackRest need, issue S3 keys for
# each, and write the resulting credentials to Infisical. Zero manual CLI
# steps, zero TUI.
#
# PREREQUISITES
# - garage-storage LXC already created (terraform apply -target=... per
#   terraform/README.md) and reachable at the IP in
#   ansible/inventories/garage/hosts.yml (fill in ansible_host there first).
# - SSH access via the dedicated garage keypair (~/.ssh/id_garage, see
#   variables.tf's garage_ssh_public_key_file) already seeded via cloud-init.
# - Infisical CLI session already authenticated in the invoking shell
#   (source ~/.hermes/cache/inf-env.sh) — this playbook writes secrets
#   directly via `infisical secrets set`, it does not create K8s Secrets
#   (there's no cluster involved here, unlike register-repos.yml).
# - GARAGE_VERSION and GARAGE_SHA256 env vars set before running — check
#   https://garagehq.deuxfleurs.fr/download/ for the current stable release
#   and the sha256 for the x86_64-unknown-linux-musl static binary. Not
#   hardcoded here on purpose — same "confirm, don't guess" discipline as
#   terraform/variables.tf's pve_node_name/template_storage_id.
#
# RE-RUN SAFETY
# Every mutating step checks current state first (layout/buckets/keys) or is
# naturally idempotent (get_url checksum, config-file secret extraction
# instead of regeneration, infisical secrets set is an upsert). One real
# caveat: re-running this against a *destroyed-and-recreated* LXC (not just
# a live re-run) generates a brand-new rpc_secret and brand-new S3 keys and
# overwrites Infisical with them — correct behavior, but any prior bucket
# data is gone with the old container.
#
# ADDING A BUCKET WITHOUT TOUCHING INSTALL/SERVICE STATE
# `--tags bucket_ops` runs only the "read existing garage.toml -> buckets ->
# keys -> write to Infisical" tail — no binary download/checksum, no
# garage.toml rewrite, no systemd restart, no cluster-layout assignment.
# Requires Garage to already be installed and configured (an existing
# garage.toml) — the tag deliberately skips the "generate a fresh
# rpc_secret" branch, so it fails loudly instead of silently reconfiguring
# a live cluster if that assumption is ever wrong. GARAGE_VERSION/
# GARAGE_SHA256 aren't needed for a bucket_ops-only run.
#   ansible-playbook -i ansible/inventories/garage/hosts.yml \
#     ansible/playbooks/garage-configure.yml --tags bucket_ops
- name: Install and configure Garage on garage-storage
  hosts: garage-storage
  gather_facts: false
  vars:
    infisical_project_id: "{{ lookup('env', 'INFISICAL_PROJECT_ID') | default('8a3fa54f-be22-488a-bf51-55158f65c0f2', true) }}"
    infisical_env: "{{ lookup('env', 'INFISICAL_ENV') | default('dev', true) }}"
    garage_version: "{{ lookup('env', 'GARAGE_VERSION') }}"
    garage_sha256: "{{ lookup('env', 'GARAGE_SHA256') }}"
    garage_arch: "x86_64-unknown-linux-musl"
    garage_layout_zone: "dc1"
    garage_layout_capacity: "180G"
    # One entry per managed bucket+key. Each key gets read+write on
    # exactly its own bucket (garage bucket allow, below) — nothing more.
    # infisical_prefix becomes <prefix>_S3_ACCESS_KEY/_SECRET in Infisical.
    # To add a bucket (internal or external-facing — exposure is decided
    # at the Traefik layer, not here, see gitops/bootstrap/garage-s3.yaml),
    # add an entry and re-run this playbook.
    garage_buckets:
      - name: "k8s-longhorn-backup"
        key_name: "longhorn-backup-key"
        infisical_prefix: "LONGHORN_S3"
      - name: "pg-backup" # provisional — not fixed anywhere else yet, rename freely once pigsty's pgbackrest_repo config is written
        key_name: "pgbackrest-backup-key"
        infisical_prefix: "PGBACKREST_S3"
      - name: "agent-fleet-files" # agent-fleet's fleet-wide shared file space — core mints presigned PUT/GET URLs, the dashboard's Files page (fleet.bnei.dev) uploads/downloads directly against Garage (agent-fleet ADR-0031)
        key_name: "agent-fleet-files-key"
        infisical_prefix: "AGENTFLEET_FILES_S3"
        cors:
          - AllowedOrigin: ["https://fleet.bnei.dev"]
            AllowedMethod: ["GET", "PUT", "DELETE", "HEAD"]
            AllowedHeader: ["*"]
            ExposeHeader: ["ETag"]
            MaxAgeSeconds: 3000
      - name: "ente-photos" # Ente's primary photo/video object store, reached both internally and via s3.bnei.dev (ADR-0030)
        # Rotated 2026-08-25: the original ente-photos-key was disclosed in
        # plaintext (a redaction that only masked fields named *pass* while
        # dumping the surrounding museum.yaml block). The old key is deleted
        # from Garage manually — this playbook only ever creates and grants.
        # Bumping key_name is how a rotation is expressed here.
        key_name: "ente-photos-key-2"
        infisical_prefix: "ENTE_S3"
        # Ente's web client uploads directly browser -> S3 via a presigned
        # URL (the whole point of its S3-native design) — a real cross-origin
        # request from ente.bnei.dev's JS to s3.bnei.dev, so the browser
        # enforces CORS regardless of the presigned URL's own validity.
        # Optional per bucket — omit for buckets nothing browser-side talks
        # to directly (k8s-longhorn-backup, pg-backup).
        # A *list* of CORS rules, one origin each — Garage's own field
        # names directly (AllowedOrigin/AllowedMethod/...), fed to
        # UpdateBucket's corsRules as-is, no key-renaming layer. Confirmed
        # live: a single rule with multiple AllowedOrigin entries makes
        # Garage join them into ONE comma-separated
        # Access-Control-Allow-Origin value ("https://ente.bnei.dev, null")
        # — invalid per spec (browsers require an exact single-origin
        # match or "*"), so the browser rejects it regardless. Separate
        # rules make Garage echo back just the one matching origin per
        # request, which is what's actually needed.
        cors:
          - AllowedOrigin: ["https://ente.bnei.dev"]
            AllowedMethod: ["GET", "PUT", "POST", "HEAD"]
            AllowedHeader: ["*"]
            ExposeHeader: ["ETag"]
            MaxAgeSeconds: 3000
          # Public Albums app — separate origin, same reasoning as the
          # main ente.bnei.dev rule (direct, non-redirected fetches from
          # that page).
          - AllowedOrigin: ["https://album.ente.bnei.dev"]
            AllowedMethod: ["GET", "PUT", "POST", "HEAD"]
            AllowedHeader: ["*"]
            ExposeHeader: ["ETag"]
            MaxAgeSeconds: 3000
          # "null" (the literal string), not a mistake: museum's
          # /files/preview redirect crosses from api.ente.bnei.dev to
          # s3.bnei.dev — a THIRD distinct origin from the page
          # (ente.bnei.dev or album.ente.bnei.dev). Per the Fetch spec, a
          # CORS-mode request redirected across origins gets its Origin
          # header scrubbed to the literal string "null" (an anti-leak
          # measure) — this one rule covers redirected requests from
          # either page origin, not just one. Confirmed live via CDP
          # network capture — without this rule Garage omits
          # Access-Control-Allow-Origin for exactly that redirected
          # request, browser reports corsError: 'MissingAllowOriginHeader',
          # even though the underlying HTTP request/response succeeds fine
          # (real auth is SigV4 on the presigned URL regardless of Origin).
          - AllowedOrigin: ["null"]
            AllowedMethod: ["GET", "PUT", "POST", "HEAD"]
            AllowedHeader: ["*"]
            ExposeHeader: ["ETag"]
            MaxAgeSeconds: 3000
      - name: "zot-registry" # OCI image blobs for the in-cluster registry (ADR-0034)
        key_name: "zot-registry-key"
        infisical_prefix: "ZOT_S3"
        # The only bucket here that grows purely as a side effect of CI —
        # nothing prunes it, and every build adds layers. This LXC has 200GB
        # total shared with k8s-longhorn-backup, pg-backup, agent-fleet-files
        # and ente-photos, so an unbounded registry doesn't just fill its own
        # space, it takes the *backups* down with it: Longhorn PV backups,
        # pgBackRest's off-host target and image pulls would start failing
        # together, which is a data-durability failure, not a registry
        # failure. Retention policy is deferred (ADR-0034); this bound isn't.
        # Garage's own size format ("40GB"/"1TB", or "none" to lift it).
        max_size: "40GB"
      - name: "wedding-wall" # guest photos posted to wedding.bnei.dev's live projector wall
        key_name: "wedding-wall-key"
        infisical_prefix: "WEDDING_WALL_S3"
        # NO cors: block, deliberately. Nothing browser-side ever touches Garage
        # for this bucket — unlike ente-photos and agent-fleet-files, which both
        # genuinely do. The wedding app proxies BOTH directions: uploads arrive
        # as a multipart POST to a SvelteKit form action (the pod has to hold
        # the bytes anyway, because re-encoding them through Bun.Image is the
        # trust boundary), and wall images are served back through
        # /api/wall/img/<id>.jpg. An <img src> is not a CORS request, so there
        # is nothing for a rule to permit. Serving them through
        # wedding.bnei.dev, which is Cloudflare-proxied, also puts a CDN in
        # front of every slide — a presigned URL against grey s3.bnei.dev would
        # pull each one over the home uplink instead, all evening.
        #
        # Two objects per post: orig/<uuid> (the untouched upload, write-only,
        # kept so the originals can be pulled down and dragged into ente by
        # hand afterwards) and wall/<uuid>.jpg (the 1080p derivative the
        # projector shows). Bounded because nothing prunes it and it shares this
        # LXC's 200GB with the Longhorn and pgBackRest targets — see the
        # zot-registry note above for why that matters more than it looks.
        max_size: "10GB"

  handlers:
    - name: Restart garage
      ansible.builtin.systemd:
        name: garage
        state: restarted
        daemon_reload: true

  tasks:
    # -------------------------------------------------------------------
    # Preflight
    # -------------------------------------------------------------------
    - name: Assert GARAGE_VERSION/GARAGE_SHA256 are set
      ansible.builtin.assert:
        that: lookup('env', item) | length > 0
        fail_msg: "{{ item }} is not set — check https://garagehq.deuxfleurs.fr/download/ for the current stable release and its x86_64-unknown-linux-musl sha256"
      loop:
        - GARAGE_VERSION
        - GARAGE_SHA256
      loop_control:
        label: "{{ item }}"

    - name: Check Infisical CLI session is authenticated
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - infisical
          - secrets
          - get
          - PVE_API_TOKEN
          - --projectId={{ infisical_project_id }}
          - --env={{ infisical_env }}
          - --plain
      register: infisical_check
      changed_when: false
      failed_when: false
      tags: [bucket_ops]

    - name: Fail if Infisical session isn't authenticated
      ansible.builtin.assert:
        that: infisical_check.rc == 0
        fail_msg: "Infisical CLI not authenticated in this shell — run `source ~/.hermes/cache/inf-env.sh` first"
      tags: [bucket_ops]

    # -------------------------------------------------------------------
    # 1. Install the Garage binary
    # -------------------------------------------------------------------
    - name: Download pinned Garage binary
      ansible.builtin.get_url:
        url: "https://garagehq.deuxfleurs.fr/_releases/{{ garage_version }}/{{ garage_arch }}/garage"
        dest: /usr/local/bin/garage
        checksum: "sha256:{{ garage_sha256 }}"
        mode: "0755"

    - name: Create Garage data directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - /var/lib/garage/meta
        - /var/lib/garage/data

    # -------------------------------------------------------------------
    # 2. Generate (once) or recover the existing rpc_secret/admin_token
    # -------------------------------------------------------------------
    - name: Check for existing garage.toml
      ansible.builtin.stat:
        path: /etc/garage.toml # Garage's own default config path — NOT /etc/garage/garage.toml
      register: garage_toml_stat
      tags: [bucket_ops]

    - name: Read existing garage.toml (if already configured)
      ansible.builtin.slurp:
        src: /etc/garage.toml
      register: garage_toml_existing
      when: garage_toml_stat.stat.exists
      no_log: true
      tags: [bucket_ops]

    # Two mutually-exclusive `when`-gated tasks, not a single ternary
    # expression — combining regex_search with a Jinja `if/else` ternary
    # evaluates eagerly regardless of the branch taken and blows up with
    # "'NoneType' object has no attribute 'group'" on whichever branch isn't
    # supposed to run. regex_search with a group backreference also returns
    # a list, not a scalar — hence `| first`.
    - name: Extract existing rpc_secret/admin_token (config already exists)
      ansible.builtin.set_fact:
        garage_rpc_secret: "{{ (garage_toml_existing.content | b64decode | regex_search('rpc_secret = \"([0-9a-f]+)\"', '\\1')) | first }}"
        garage_admin_token: "{{ (garage_toml_existing.content | b64decode | regex_search('admin_token = \"([0-9a-f]+)\"', '\\1')) | first }}"
      when: garage_toml_stat.stat.exists
      no_log: true
      tags: [bucket_ops]

    # bucket_ops assumes Garage is already installed and configured (there's
    # always a garage.toml by then) — this branch only exists for the
    # full/install run, deliberately left untagged so a bucket_ops-only run
    # fails loudly (undefined garage_rpc_secret) instead of silently
    # regenerating rpc_secret against a live cluster if that assumption ever
    # breaks.
    - name: Generate new rpc_secret/admin_token (config doesn't exist yet)
      ansible.builtin.set_fact:
        garage_rpc_secret: "{{ lookup('pipe', 'openssl rand -hex 32') }}"
        garage_admin_token: "{{ lookup('pipe', 'openssl rand -hex 32') }}"
      when: not garage_toml_stat.stat.exists
      no_log: true

    # -------------------------------------------------------------------
    # 3. Write garage.toml
    # -------------------------------------------------------------------
    - name: Write /etc/garage.toml
      ansible.builtin.copy:
        dest: /etc/garage.toml
        mode: "0600"
        content: |
          metadata_dir = "/var/lib/garage/meta"
          data_dir = "/var/lib/garage/data"
          db_engine = "sqlite"

          replication_factor = 1

          rpc_bind_addr = "[::]:3901"
          rpc_public_addr = "{{ ansible_host }}:3901"
          rpc_secret = "{{ garage_rpc_secret }}"

          [s3_api]
          # "garage" is a hard requirement, not a free choice — Longhorn's
          # backupTarget (gitops/platform/values/longhorn/values.yaml) is
          # already committed to s3://k8s-longhorn-backup@garage/, and
          # Longhorn's S3 syntax is s3://<bucket>@<region>/.
          s3_region = "garage"
          api_bind_addr = "[::]:3900"

          [admin]
          # Localhost-only: nothing remote consumes the admin API yet, so
          # admin_token is generated but never synced to Infisical.
          api_bind_addr = "127.0.0.1:3903"
          admin_token = "{{ garage_admin_token }}"
      no_log: true
      notify: Restart garage

    # -------------------------------------------------------------------
    # 4. systemd unit
    # -------------------------------------------------------------------
    - name: Write garage.service systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/garage.service
        mode: "0644"
        content: |
          [Unit]
          Description=Garage S3-compatible object storage
          After=network-online.target
          Wants=network-online.target

          [Service]
          ExecStart=/usr/local/bin/garage server
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart garage

    - name: Enable and start garage
      ansible.builtin.systemd:
        name: garage
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for Garage S3 API port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 3900
        timeout: 30

    - name: Wait for Garage RPC port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 3901
        timeout: 30

    # -------------------------------------------------------------------
    # 5. Cluster layout (single node) — idempotent
    # -------------------------------------------------------------------
    - name: Get this node's Garage node ID
      ansible.builtin.command: /usr/local/bin/garage node id -q
      register: garage_node_id
      changed_when: false

    - name: Extract bare node pubkey (garage node id prints pubkey@address:port, layout assign wants only the pubkey)
      ansible.builtin.set_fact:
        garage_node_pubkey: "{{ garage_node_id.stdout.split('@')[0] }}"

    - name: Check current cluster layout
      ansible.builtin.command: /usr/local/bin/garage layout show
      register: garage_layout_show
      changed_when: false

    - name: Assign this node to the cluster layout
      ansible.builtin.command: >
        /usr/local/bin/garage layout assign
        -z {{ garage_layout_zone }} -c {{ garage_layout_capacity }}
        {{ garage_node_pubkey }}
      when: garage_node_pubkey[:16] not in garage_layout_show.stdout

    # Re-check regardless of whether assign ran above — `assign` only
    # stages a change and can be left pending from a prior interrupted run
    # (e.g. this playbook failed on a later step last time), so "did assign
    # just run" is not a reliable signal for "is there a pending apply".
    - name: Re-read cluster layout to check for a pending apply
      ansible.builtin.command: /usr/local/bin/garage layout show
      register: garage_layout_show_current
      changed_when: false

    - name: Extract pending layout version to apply
      ansible.builtin.set_fact:
        # `layout show` prints a "garage layout apply --version N" hint
        # only when there's a staged change waiting to be applied.
        garage_layout_version: "{{ (garage_layout_show_current.stdout | regex_search('apply --version ([0-9]+)', '\\1')) | first }}"
      when: "'apply --version' in garage_layout_show_current.stdout"

    - name: Apply the cluster layout
      ansible.builtin.command: /usr/local/bin/garage layout apply --version {{ garage_layout_version }}
      when: "'apply --version' in garage_layout_show_current.stdout"

    # -------------------------------------------------------------------
    # 6. Buckets — idempotent, one iteration per garage_buckets entry
    # -------------------------------------------------------------------
    - name: List existing buckets
      ansible.builtin.command: /usr/local/bin/garage bucket list
      register: garage_bucket_list
      changed_when: false
      tags: [bucket_ops]

    - name: Create buckets
      ansible.builtin.command: /usr/local/bin/garage bucket create {{ item.name }}
      loop: "{{ garage_buckets }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name not in garage_bucket_list.stdout
      tags: [bucket_ops]

    # Optional per-bucket size cap. Opt-in (`max_size` defined) rather than
    # applied to every bucket: the backup buckets are sized by their own
    # retention policies, and capping those would silently drop a backup
    # rather than fail loudly. Set it for buckets that grow as a side effect
    # of something else and have no pruning of their own — zot-registry is
    # the current case. Unconditional and idempotent, same rationale as the
    # `bucket allow` grant below: re-setting an identical quota is a no-op
    # in garage itself.
    - name: Apply per-bucket size quotas
      ansible.builtin.command: >
        /usr/local/bin/garage bucket set-quotas
        --max-size {{ item.max_size }} {{ item.name }}
      loop: "{{ garage_buckets | selectattr('max_size', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }} <= {{ item.max_size }}"
      changed_when: false
      tags: [bucket_ops]

    # -------------------------------------------------------------------
    # 7. Keys — idempotent creation, unconditional (idempotent) grant
    # -------------------------------------------------------------------
    - name: List existing keys
      ansible.builtin.command: /usr/local/bin/garage key list
      register: garage_key_list
      changed_when: false
      tags: [bucket_ops]

    - name: Create keys
      ansible.builtin.command: /usr/local/bin/garage key create {{ item.key_name }}
      loop: "{{ garage_buckets }}"
      loop_control:
        label: "{{ item.key_name }}"
      when: item.key_name not in garage_key_list.stdout
      tags: [bucket_ops]

    - name: Grant each key read+write on exactly its own bucket
      ansible.builtin.command: >
        /usr/local/bin/garage bucket allow {{ item.name }}
        --read --write --key {{ item.key_name }}
      loop: "{{ garage_buckets }}"
      loop_control:
        label: "{{ item.name }} <- {{ item.key_name }}"
      changed_when: false # re-granting identical perms is a no-op in garage itself
      tags: [bucket_ops]

    - name: Read key ID/secret for each bucket's key
      ansible.builtin.command: /usr/local/bin/garage key info {{ item.key_name }} --show-secret
      loop: "{{ garage_buckets }}"
      loop_control:
        label: "{{ item.key_name }}"
      register: garage_key_info
      changed_when: false
      no_log: true
      tags: [bucket_ops]

    # -------------------------------------------------------------------
    # 8. Write everything to Infisical (upsert — safe to re-run)
    # -------------------------------------------------------------------
    - name: Write GARAGE_ROOT_TOKEN to Infisical
      delegate_to: localhost
      become: false
      no_log: true
      ansible.builtin.command:
        argv:
          - infisical
          - secrets
          - set
          - --projectId={{ infisical_project_id }}
          - --env={{ infisical_env }}
          - --type=shared
          - GARAGE_ROOT_TOKEN={{ garage_rpc_secret }}
      changed_when: true
      tags: [bucket_ops]

    - name: Write per-bucket S3 access key/secret to Infisical
      delegate_to: localhost
      become: false
      no_log: true
      ansible.builtin.command:
        argv:
          - infisical
          - secrets
          - set
          - --projectId={{ infisical_project_id }}
          - --env={{ infisical_env }}
          - --type=shared
          - >-
            {{ item.0.infisical_prefix }}_ACCESS_KEY={{
            (item.1.stdout | regex_search('Key ID:\s*(\S+)', '\1')) | first }}
          - >-
            {{ item.0.infisical_prefix }}_SECRET={{
            (item.1.stdout | regex_search('Secret key:\s*(\S+)', '\1')) | first }}
      loop: "{{ garage_buckets | zip(garage_key_info.results) | list }}"
      loop_control:
        label: "{{ item.0.infisical_prefix }}"
      changed_when: true
      tags: [bucket_ops]

    # -------------------------------------------------------------------
    # 9. CORS — declarative per-bucket, via the admin API (127.0.0.1:3903,
    #    localhost-only — never exposed remotely, per the [admin] section's
    #    own security note above; this task calls it from garage-storage
    #    itself, not from outside). Full-replace + idempotent (UpdateBucket
    #    always sets the whole CORS ruleset, safe to re-run with the same
    #    config), needs the bucket's read+write key (ente-photos-key) can't
    #    do this itself — CORS is an --owner-level admin operation, which
    #    that key deliberately doesn't have (least privilege).
    # -------------------------------------------------------------------
    - name: Look up bucket ID for CORS-enabled buckets
      ansible.builtin.uri:
        url: "http://127.0.0.1:3903/v2/GetBucketInfo?globalAlias={{ item.name }}"
        headers:
          Authorization: "Bearer {{ garage_admin_token }}"
        return_content: true
      register: garage_cors_bucket_info
      loop: "{{ garage_buckets | selectattr('cors', 'defined') | list }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [bucket_ops]

    - name: Apply CORS rules
      ansible.builtin.uri:
        url: "http://127.0.0.1:3903/v2/UpdateBucket?id={{ item.1.json.id }}"
        method: POST
        headers:
          Authorization: "Bearer {{ garage_admin_token }}"
        body_format: json
        body:
          corsRules: "{{ item.0.cors }}"
        status_code: [200]
      loop: "{{ (garage_buckets | selectattr('cors', 'defined') | list) | zip(garage_cors_bucket_info.results) | list }}"
      loop_control:
        label: "{{ item.0.name }}"
      changed_when: true
      tags: [bucket_ops]

    # -------------------------------------------------------------------
    # Done
    # -------------------------------------------------------------------
    - name: Garage configured
      ansible.builtin.debug:
        msg:
          - "Garage is up and configured. GARAGE_ROOT_TOKEN and one"
          - "<PREFIX>_S3_ACCESS_KEY/_SECRET pair per garage_buckets entry"
          - "({{ garage_buckets | map(attribute='infisical_prefix') | join(', ') }})"
          - "are now in Infisical."
          - ""
          - "Verify:"
          - "  ssh -i ~/.ssh/id_garage root@{{ ansible_host }} garage status"
          - "  ssh -i ~/.ssh/id_garage root@{{ ansible_host }} garage bucket list"
          - "  curl -s http://{{ ansible_host }}:3900"
          - ""
