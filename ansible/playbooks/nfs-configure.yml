---
# Configure NFS export on the bare nfs-storage VM that terraform/nfs.tf
# creates. Safe to re-run — every task is naturally idempotent (mkfs
# guarded by a blkid check, mount/exports are declarative, exportfs -ra
# just re-reads current state).
#
# WHY THIS PLAYBOOK EXISTS
# terraform/nfs.tf only creates a bare VM with raw extra disks — same
# "Terraform stops at bare, SSH-reachable" split as garage.tf/
# garage-configure.yml. This playbook formats those disks, exports them over
# NFS, and registers the first one as shared PVE storage so
# terraform/k8s-vms.tf's cross-node clone (docs/adr/0026) has somewhere
# shared to clone from/to. The second export (/export/k8s, docs/adr/0036)
# backs the cluster's unreplicated `nfs` StorageClass and is deliberately
# NOT a PVE storage pool.
#
# PREREQUISITES
# - nfs-storage VM already created (terraform apply -target=... per
#   terraform/README.md) and reachable at the IP in
#   ansible/inventories/nfs/hosts.yml (fill in ansible_host first).
# - SSH access via the dedicated nfs keypair (~/.ssh/id_nfs, see
#   variables.tf's nfs_ssh_public_key_file) already seeded via cloud-init.
# - The VM resolves bnei.lan via Pi-hole. terraform/nfs.tf declares this
#   (initialization.dns.servers), but on an ALREADY-RUNNING VM that only
#   regenerates the cloud-init drive — reboot it after the terraform apply.
#   The "Assert every export client resolves" task below is what catches it
#   if that didn't take; fix by hand with `resolvectl dns <iface> 192.168.1.55`
#   if needed.
# - No device-name assumptions to check: disks are addressed by
#   /dev/disk/by-id/...drive-scsiN, which matches terraform/nfs.tf's
#   `interface` regardless of how the kernel ordered /dev/sdX.
# - Run with BOTH inventories so the second play below (PVE storage
#   registration) can resolve the `proxmox` host alias:
#     ansible-playbook -i ansible/inventories/nfs/hosts.yml \
#       -i ansible/inventories/proxmox/hosts.yml \
#       ansible/playbooks/nfs-configure.yml
#
# Registers the export as a PVE storage pool (`pvesm add nfs ...`) itself
# — storage.cfg is cluster-shared (ADR-0020), so this only ever needs to
# run against one cluster member (`proxmox`/.165, same alias
# pve-postinstall.yml uses), regardless of how many PVE nodes exist.
- name: Configure NFS export on nfs-storage
  hosts: nfs-storage
  gather_facts: false
  vars:
    # Devices are addressed by /dev/disk/by-id/...drive-scsiN, NOT /dev/sdX.
    # Kernel enumeration order is not the SCSI interface order: confirmed
    # live 2026-08-14 that scsi1 (the older template disk) was /dev/sdc while
    # the freshly hot-plugged scsi2 came up as /dev/sdb. Hardcoding sdb/sdc
    # would have mkfs'd the wrong disk's label. The by-id name matches
    # terraform/nfs.tf's `interface` exactly, and survives reboots/hotplug.
    #
    # Two independent exports on two separate disks. Keep them separate:
    # /export/templates is PVE's (docs/adr/0026) and is sized for a transient
    # VM clone; /export/k8s is the `nfs` StorageClass's (docs/adr/0036) and
    # grows with real PV usage. Sharing one disk would let a runaway PVC
    # break cross-host VM cloning.
    nfs_exports:
      # PVE hosts allowed to mount this — docs/adr/0020's corosync cluster
      # members, never opened wider than that. Left as literal IPs on
      # purpose: this export is live and working, and ADR-0036's move to
      # hostnames deliberately doesn't touch it.
      - path: /export/templates
        device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
        label: nfsexport
        clients:
          - 192.168.1.165
          - 192.168.1.200
          - 192.168.1.161
      # K8s nodes only, by `bnei.lan` name rather than IP (ADR-0036) — same
      # reasoning as registry.bnei.lan in every node's containerd config
      # (ADR-0034): the name is the contract, the address can move. Requires
      # this VM to resolve bnei.lan via Pi-hole (terraform/nfs.tf's
      # initialization.dns.servers) — asserted below, not assumed.
      - path: /export/k8s
        device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi2
        label: nfsk8s
        clients:
          - k8s-cp-01.bnei.lan
          - k8s-cp-02.bnei.lan
          - k8s-cp-03.bnei.lan
          - k8s-worker-01.bnei.lan
          - k8s-worker-02.bnei.lan

  handlers:
    - name: Reload exports
      ansible.builtin.command: exportfs -ra
      changed_when: true

  tasks:
    # -------------------------------------------------------------------
    # 1. Format + mount the raw export disk
    # -------------------------------------------------------------------
    # Same idempotency idiom as cloud-init.tf's Longhorn-disk bootcmd
    # (blkid-guarded mkfs) rather than pulling in community.general's
    # filesystem module for one call — ansible.posix (already a required
    # collection, ansible/requirements.yml) has no mkfs module of its own.
    - name: Format export disks if not already formatted
      # The mkfs echoes a marker rather than the old `'TYPE=' not in stdout`
      # test: `grep -q` writes nothing to stdout, so that condition was true
      # on every run and the task reported "changed" even when it correctly
      # skipped a formatted disk. Harmless in itself, but it made a re-run
      # look like it had just reformatted a live export — exactly the alarm
      # you don't want to teach people to ignore (confirmed 2026-08-14).
      ansible.builtin.shell: |
        blkid {{ item.device }} | grep -q TYPE= || { mkfs.ext4 -L {{ item.label }} {{ item.device }} && echo FORMATTED; }
      register: nfs_mkfs
      changed_when: "'FORMATTED' in nfs_mkfs.stdout"
      loop: "{{ nfs_exports }}"
      loop_control:
        label: "{{ item.device }}"

    # No `mode:` on purpose. These paths are mountpoints — once the disk is
    # mounted, the mode you see belongs to the filesystem's own root inode,
    # not to anything this playbook created. csi-driver-nfs chmods
    # /export/k8s to 0777 to match its `mountPermissions`, so pinning 0755
    # here just means the two fight and every re-run reports a spurious
    # `changed` (confirmed 2026-08-14). Creation-time default is 0755 anyway.
    - name: Create export directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
      loop: "{{ nfs_exports }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Mount export disks
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "LABEL={{ item.label }}"
        fstype: ext4
        state: mounted
      loop: "{{ nfs_exports }}"
      loop_control:
        label: "{{ item.path }}"

    # qemu-guest-agent is installed via terraform/nfs.tf's dedicated
    # nfs_vm_vendor_data cloud-init snippet at first boot, not here —
    # Terraform's agent.enabled = true would otherwise hang waiting for a
    # handshake with an agent nothing installs until this playbook runs.

    # -------------------------------------------------------------------
    # 2. Install and configure nfs-kernel-server
    # -------------------------------------------------------------------
    - name: Install nfs-kernel-server
      ansible.builtin.apt:
        name: nfs-kernel-server
        state: present
        update_cache: true

    # Hostname clients are resolved by exportfs when it loads /etc/exports,
    # so a DNS failure here silently denies every K8s node instead of
    # erroring loudly. Check before writing rather than debugging a
    # "permission denied" mount two layers up in a CSI driver.
    - name: Assert every export client resolves
      ansible.builtin.command: getent hosts {{ item }}
      changed_when: false
      loop: "{{ nfs_exports | map(attribute='clients') | flatten }}"

    - name: Write /etc/exports
      ansible.builtin.copy:
        dest: /etc/exports
        mode: "0644"
        content: |
          {% for export in nfs_exports %}
          {{ export.path }} {% for client in export.clients %}{{ client }}(rw,no_root_squash,sync,no_subtree_check) {% endfor %}

          {% endfor %}
      notify: Reload exports

    - name: Enable and start nfs-kernel-server
      ansible.builtin.systemd:
        name: nfs-kernel-server
        enabled: true
        state: started

    - name: Flush handlers now so the export is live before verification
      ansible.builtin.meta: flush_handlers

    # -------------------------------------------------------------------
    # Done
    # -------------------------------------------------------------------
    - name: NFS exports configured
      ansible.builtin.debug:
        msg: >-
          {% for export in nfs_exports %}{{ export.path }} → {{ export.clients | join(', ') }}. {% endfor %}
          Verify: ssh -i ~/.ssh/id_nfs core@{{ ansible_host }} sudo exportfs -v

# -------------------------------------------------------------------
# Register the export as PVE storage — cluster-wide via storage.cfg
# (ADR-0020), so this runs once against any single member.
# -------------------------------------------------------------------
- name: Register shared-templates PVE storage
  hosts: proxmox
  gather_facts: false
  vars:
    nfs_server: "192.168.1.198" # matches terraform.tfvars' nfs_ip
    nfs_storage_name: shared-templates
    nfs_export_path: /export/templates
    nfs_storage_path: /mnt/pve/shared-templates
    nfs_storage_content: images,snippets

  tasks:
    - name: Check existing PVE storage pools
      ansible.builtin.command: pvesm status
      register: pvesm_status
      changed_when: false

    - name: Add shared-templates NFS storage
      ansible.builtin.command: >
        pvesm add nfs {{ nfs_storage_name }}
        --server {{ nfs_server }} --export {{ nfs_export_path }}
        --content {{ nfs_storage_content }} --path {{ nfs_storage_path }}
      when: nfs_storage_name not in pvesm_status.stdout

    - name: Shared-templates PVE storage ready
      ansible.builtin.debug:
        msg: "{{ nfs_storage_name }} registered cluster-wide — verify with `pvesm status` on any PVE node."
