# Session pods for the agent-fleet run only on the two worker nodes.
#
# Why a label and not a hand-run `kubectl label`: the label was applied live on
# 2026-08-15 to get the fleet moving, and a `kubectl label` does not survive a
# node rebuild. If it is lost, sessions do not fail loudly — they sit Pending
# with no error anyone sees, because a nodeSelector matching nothing is not an
# error condition. This file is what makes the label a property of the node.
#
# Why only the workers: agent-fleet's per-session working volumes are on the
# `local-path` StorageClass (agent-fleet/k8s/provisioner/deployment.yaml,
# SESSION_STORAGE_CLASS), which is a hostPath on the node's OS disk. The
# control-plane nodes have ~33 GiB allocatable; filling one is a cluster
# incident rather than a session failure. The workers have ~85 (this node) and
# ~50 GiB.
#
# hosts.yaml itself is terraform-generated and must not be hand-edited, which
# is why this lives in host_vars — see its header.
node_labels:
  agent-fleet.dev/session-node: "true"
  # Satisfies the nvidia-device-plugin chart's OWN default nodeAffinity, which
  # requires one of three NFD-style labels
  # (feature.node.kubernetes.io/pci-10de.present,
  # feature.node.kubernetes.io/cpu-model.vendor_id, or this one). We do not run
  # NFD, so none of them existed and the DaemonSet computed DESIRED=0 — it would
  # never have scheduled and `nvidia.com/gpu` would never have been advertised,
  # even though values.yaml pins the pod to this node by hostname. The
  # nodeSelector was added; the chart's affinity was left at its default.
  #
  # The chart documents this label as the deliberate escape hatch ("We allow a
  # GPU deployment to be forced by setting the following label to true"), and
  # ADR-0043 Decision 4 already named it as the mechanism to use if a second GPU
  # node ever appears. Setting it here rather than overriding the chart keeps
  # that guard intact for a future node.
  #
  # NOTE `affinity: {}` in values.yaml does NOT work as an override — Helm
  # merges maps, so an empty map leaves the chart default in place. Only
  # `affinity: null` clears it. Verified by rendering chart 0.17.1, 2026-08-31.
  nvidia.com/gpu.present: "true"

# NVIDIA container runtime, registered as an ADDITIONAL runtime — never the
# node default. ADR-0043 Decision 2 and 3.
#
# Why declared here rather than by `nvidia-ctk runtime configure`: that
# command edits /etc/containerd/config.toml, which kubespray owns and
# rewrites on the next cluster.yml run. The GPU would stop working at the
# next unrelated cluster operation, months later, with nobody having
# touched it.
#
# Why NOT `containerd_default_runtime: nvidia`: nvidia/cuda:* base images
# ship ENV NVIDIA_VISIBLE_DEVICES=all, and nvidia-container-toolkit
# defaults accept-nvidia-visible-devices-envvar-when-unprivileged to true.
# As the node default, ANY pod landing here on an NVIDIA base image would
# get the whole GPU injected without requesting nvidia.com/gpu — invisible
# to scheduler accounting, i.e. the GPU multi-tenancy ADR-0011 rejected.
# Pods select this runtime explicitly via the `nvidia` RuntimeClass.
#
# SystemdCgroup is explicit because config.toml.j2 renders runtime.options
# verbatim and injects nothing; kubespray's own containerd_runc_runtime
# sets it from containerd_use_systemd_cgroup. Omitting it gives this
# runtime cgroupfs while kubelet uses systemd.
#
# It is the STRING "true", not the YAML boolean true, and that is not a
# style choice. config.toml.j2:59-65 decides whether to quote a value with
# `{% if value | string != "true" and value | string != "false" %}`. Jinja
# renders a Python bool as "True" — capital T — which matches neither
# literal, so a YAML `true` takes the quoting branch and emits
# `SystemdCgroup = "True"`: a TOML string into a field containerd declares
# as a Go bool. Best case the option is dropped and this runtime silently
# gets cgroupfs — exactly the mismatch the paragraph above exists to
# prevent. Worst case containerd rejects the config and does not start.
# This is why kubespray's own default writes
# `ternary('true', 'false')` rather than a bool. Verified 2026-08-31 by
# rendering the real template. Any future entry here has the same trap.
#
# NOTE the variable is `containerd_default_runtime`, not
# `containerd_default_runtime_name` — the latter is silently ignored. We
# set neither; this is a deliberate non-default.
containerd_additional_runtimes:
  - name: nvidia
    type: "io.containerd.runc.v2"
    options:
      BinaryName: /usr/bin/nvidia-container-runtime
      SystemdCgroup: "true"
