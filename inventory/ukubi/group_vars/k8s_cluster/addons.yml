---
helm_enabled: true

# Disabled: GitOps (platform ApplicationSet) is the single source of truth
# for metrics-server. Having kubespray also install it caused both to fight
# over the metrics.k8s.io APIService and crash-loop.
metrics_server_enabled: false

gateway_api_enabled: true

# ArgoCD installed via helm + kubectl apply -f bootstrap/ — NOT via kubespray (MISSION §7)
argocd_enabled: false

# Traefik ACME (HTTP-01) is the cert engine — cert-manager is forbidden (MISSION §5, §13)
cert_manager_enabled: false
cert_manager_namespace: "cert-manager"

# MetalLB L2 mode — 192.168.1.233-250 reserved (MISSION §6). .232 is
# Pigsty's HA floating VIP (vip-manager); .230/.231 excluded too to keep
# clear of that block.
metallb_enabled: true
metallb_speaker_enabled: "{{ metallb_enabled }}"
metallb_namespace: "metallb-system"
metallb_protocol: "layer2"
metallb_config:
  speaker:
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Equal"
        effect: "NoSchedule"
  controller:
    replicas: 2
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Equal"
        effect: "NoSchedule"
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - metallb
                - key: component
                  operator: In
                  values:
                    - controller
            topologyKey: kubernetes.io/hostname
  address_pools:
    primary:
      ip_range:
        - 192.168.1.233-192.168.1.250
      auto_assign: true
  layer2:
    - primary

krew_enabled: true
krew_root_dir: "/usr/local/krew"

# Floating VIP across all 3 control-plane nodes so external kubectl/CI
# access survives k8s-cp-01 (.165) being down for its gaming reboots —
# internal (kubelet/ArgoCD) traffic already fails over via kubespray's own
# per-node apiserver proxy, this covers the external-facing gap. ARP/L2
# mode to match MetalLB's constraint (Freebox blocks BGP). .180 is the
# API VIP already reserved for `k8s.bnei.lan` — see ADR-0016, now resolved
# in favor of that name over the old test-build `k8s-proxmox-gpu.bnei.lan`.
# kube_proxy_strict_arp is already true (locked decision), which kube-vip's
# ARP mode requires.
kube_vip_enabled: true
kube_vip_arp_enabled: true
kube_vip_controlplane_enabled: true
kube_vip_address: 192.168.1.180

# `kube_vip_address` is already auto-included in the apiserver cert's SANs
# (kubespray's kubeadm-setup.yml aggregates it directly into
# apiserver_sans) — the only gap is the DNS name itself, since that's not
# derived from the IP. Deliberately NOT setting `loadbalancer_apiserver`
# here: that would repoint kubeadm's controlPlaneEndpoint (and every
# node's internal apiserver traffic) at the VIP instead of kubespray's own
# per-node local proxy, a bigger behavioral change than "make external
# kubectl/CI TLS work" actually needs.
apiserver_loadbalancer_domain_name: "k8s.bnei.lan"
