name: Lint

# Static syntax/format/schema checks for ansible/ and gitops/ — separate from
# reusable-oneoff-job.yml (that one is deploy-time job-triggering glue on the
# self-hosted `ukubi` runner; this is plain lint, so it runs on GitHub-hosted
# runners with no cluster access needed).

on:
  push:
    branches: [main]
    paths: ["ansible/**", "gitops/**", "inventory/**", ".github/workflows/lint.yml"]
  pull_request:
    paths: ["ansible/**", "gitops/**", "inventory/**", ".github/workflows/lint.yml"]

jobs:
  ansible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - run: pip install "yamllint==1.38.0" "ansible-core==2.21.2"

      - run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: yamllint
        run: yamllint -c ansible/.yamllint ansible/

      - name: ansible-playbook --syntax-check
        run: |
          set -euo pipefail
          for f in ansible/playbooks/*.yml; do
            ansible-playbook -i localhost, --syntax-check "$f"
          done

      - name: containerd runtime options are quoted strings
        run: python3 ansible/scripts/check-containerd-runtime-options.py

      - uses: ansible/ansible-lint@v26.6.0
        with:
          working_directory: ansible
          requirements_file: requirements.yml
          args: playbooks/

  gitops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - run: pip install "yamllint==1.38.0"

      - name: yamllint
        run: yamllint -c gitops/.yamllint gitops/

      # PyYAML comes with yamllint. The second run proves the gate still fails
      # on a fixture app with no valid binding, the third on a binding of
      # `visitors` outside `ukubi-world`. The live half (--live) needs
      # the cluster, so it is run by hand: see the script's header.
      - name: every authentik application carries a policy binding
        run: |
          set -euo pipefail
          python3 gitops/scripts/check-authentik-bindings.py
          # exactly 1 (a crash is not a pass) and both fixture apps named
          rc=0
          out=$(python3 gitops/scripts/check-authentik-bindings.py gitops/scripts/testdata/authentik-blueprint-unbound-app.yaml) || rc=$?
          echo "$out"
          if [ "$rc" -ne 1 ] || ! grep -q "'fixture-unbound'" <<<"$out" || ! grep -q "'fixture-null-group'" <<<"$out"; then
            echo "::error::binding gate did not flag its unbound fixture (exit $rc)"; exit 1
          fi
          # the visitors group bound outside ukubi-world
          rc=0
          out=$(python3 gitops/scripts/check-authentik-bindings.py gitops/scripts/testdata/authentik-blueprint-visitors-leak.yaml) || rc=$?
          echo "$out"
          if [ "$rc" -ne 1 ] || ! grep -q "group 'visitors' is bound to fixture-leak" <<<"$out"; then
            echo "::error::binding gate did not flag its visitors fixture (exit $rc)"; exit 1
          fi

      - uses: azure/setup-helm@v5.0.1
        with:
          version: "v4.2.3"

      - name: Install yq
        run: |
          set -euo pipefail
          curl -sSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      # A required blueprint Secret whose Infisical key is missing never
      # renders and leaves the authentik worker in ContainerCreating; optional,
      # only that blueprint is absent (values.yaml `blueprints:` comment).
      - name: authentik blueprint Secrets are optional mounts
        run: |
          set -euo pipefail
          v=gitops/platform/values/authentik/values.yaml
          test "$(yq '.blueprints.secrets // [] | length' "$v")" = 0
          test "$(yq '[.worker.volumes[] | select(.secret and .secret.optional != true)] | length' "$v")" = 0
          # Optional makes a slip silent, so: every volume has its mount, and
          # every blueprint file is registered (a ConfigMap or a Secret volume).
          diff <(yq '.worker.volumes[].name' "$v" | sort) \
               <(yq '.worker.volumeMounts[].name' "$v" | sort)
          diff <(yq -N 'select(.kind == "ConfigMap" or .kind == "InfisicalSecret")
                        | (.spec.managedSecretReference.secretName // .metadata.name)' \
                   gitops/bootstrap/authentik-blueprint-*.yaml | sort) \
               <({ yq '.blueprints.configMaps[]' "$v"
                   yq '.worker.volumes[].secret.secretName | select(. != null)' "$v"; } | sort)

      - name: helm lint / template common-app-chart
        run: |
          set -euo pipefail
          helm lint gitops/platform/common-app-chart -f gitops/platform/common-app-chart/ci-values.yaml
          helm template ci-check gitops/platform/common-app-chart -f gitops/platform/common-app-chart/ci-values.yaml > "$RUNNER_TEMP/rendered.yaml"

      # Standard A3: auth.trustsHeaders: true renders only with
      # networkPolicy.ingressFrom exactly [traefik] on a ClusterIP Service,
      # and a *-forwardauth middleware when the IngressRoute renders.
      # ci-values.yaml takes the valid path; its policy must admit traefik on
      # service.port (80) and nothing else.
      - name: common-app-chart A3 refusal (auth.trustsHeaders)
        run: |
          set -euo pipefail
          C=gitops/platform/common-app-chart
          must_fail() {
            local label=$1; shift
            if err=$(helm template t "$C" --set auth.trustsHeaders=true "$@" 2>&1 >/dev/null); then
              echo "::error::$label rendered; the chart must refuse it"; exit 1
            fi
            grep -q 'standard A3' <<<"$err" || { echo "::error::$label failed without the A3 message: $err"; exit 1; }
            echo "$label: refused"
          }
          must_fail no-ingressFrom
          must_fail traefik-and-monitoring --set 'networkPolicy.ingressFrom={traefik,monitoring}'
          must_fail loadbalancer --set 'networkPolicy.ingressFrom={traefik}' --set service.type=LoadBalancer
          must_fail nodeport --set 'networkPolicy.ingressFrom={traefik}' --set service.type=NodePort
          must_fail no-forwardauth --set 'networkPolicy.ingressFrom={traefik}' --set ingress.hostname=x.example.com
          if helm template t "$C" --set networkPolicy.ingressFrom=traefik >/dev/null 2>&1; then
            echo "::error::scalar ingressFrom rendered; the chart must refuse it"; exit 1
          fi
          r="$RUNNER_TEMP/rendered.yaml"
          np='select(.kind=="NetworkPolicy")'
          test "$(yq ea "[$np] | length" "$r")" = 1
          test "$(yq ea "$np | .spec.ingress | length" "$r")" = 1
          test "$(yq ea "$np | .spec.ingress[0].from | length" "$r")" = 1
          test "$(yq ea "$np | .spec.ingress[0].from[0].namespaceSelector.matchLabels[\"kubernetes.io/metadata.name\"]" "$r")" = traefik
          test "$(yq ea "$np | .spec.ingress[0].ports[0].port" "$r")" = 80
          test "$(yq ea "$np | .spec.ingress[0].ports | length" "$r")" = 1
          test "$(yq ea "$np | .spec.policyTypes | join(\",\")" "$r")" = Ingress
          test "$(yq ea "$np | .spec.podSelector.matchLabels[\"app.kubernetes.io/name\"]" "$r")" = ci-check
          echo "ci-values NetworkPolicy: traefik only, port 80"

      # ingress.extraRoutes (templates/extra-ingressroutes.yaml): every extra
      # route gets the main route's baseline chain first, under every baseline
      # toggle, and each refusal fires with its OWN message, so one refusal
      # cannot stand in for another. Cases run on ci-values.yaml.
      - name: common-app-chart extraRoutes (baseline prepended, refusals)
        run: |
          set -euo pipefail
          C=gitops/platform/common-app-chart
          V=$C/ci-values.yaml
          r="$RUNNER_TEMP/rendered.yaml"
          main='select(.kind=="IngressRoute" and .metadata.name=="ci-check")'
          xr='select(.kind=="IngressRoute" and .metadata.name=="ci-check-adminapi")'
          mw() { yq ea "$1 | [.spec.routes[0].middlewares[].name] | join(\",\")" "$2"; }
          test "$(yq ea '[select(.kind=="IngressRoute")] | length' "$r")" = 2
          test "$(yq ea "$xr | .metadata.namespace" "$r")" = default
          test "$(yq ea "$xr | .metadata.labels[\"app.kubernetes.io/name\"]" "$r")" = ci-check
          test "$(yq ea "$xr | .spec.entryPoints | join(\",\")" "$r")" = websecure
          test "$(yq ea "$xr | .spec.routes[0].match" "$r")" = 'Host(`ci-check.example.com`) && PathPrefix(`/admin`)'
          test "$(yq ea "$xr | .spec.routes[0].priority" "$r")" = 1000000
          test "$(yq ea "$xr | .spec.routes[0].services[0].name" "$r")" = ci-check-admin
          test "$(yq ea "$xr | .spec.routes[0].services[0].port" "$r")" = 8080
          test "$(yq ea "$xr | .spec.tls.certResolver" "$r")" = le
          b=ci-check-baseline-originlock,ci-check-baseline-ratelimit,ci-check-baseline-headers
          test "$(mw "$xr" "$r")" = "$b,authentik-forwardauth,ci-check-admin-strip"
          test "$(mw "$main" "$r")" = "$b,authentik-forwardauth"
          # each baseline toggle: main and extra route drop the same refs
          t="$RUNNER_TEMP/toggle.yaml"
          for c in "ingress.baseline.enabled=false|" \
                   "ingress.baseline.originLock.enabled=false|ci-check-baseline-ratelimit,ci-check-baseline-headers," \
                   "ingress.baseline.rateLimit.enabled=false|ci-check-baseline-originlock,ci-check-baseline-headers," \
                   "ingress.baseline.headers.enabled=false|ci-check-baseline-originlock,ci-check-baseline-ratelimit,"; do
            helm template ci-check "$C" -f "$V" --set "${c%%|*}" > "$t"
            test "$(mw "$main" "$t")" = "${c#*|}authentik-forwardauth" || { echo "::error::main route wrong under ${c%%|*}"; exit 1; }
            test "$(mw "$xr" "$t")" = "${c#*|}authentik-forwardauth,ci-check-admin-strip" || { echo "::error::extra route wrong under ${c%%|*}"; exit 1; }
          done
          # default (no extraRoutes): only the main route
          test "$(helm template t "$C" --set ingress.hostname=x.example.com | yq ea '[select(.kind=="IngressRoute")] | length')" = 1
          refuse() {
            local label=$1 want=$2; shift 2
            if err=$(helm template ci-check "$C" -f "$V" "$@" 2>&1 >/dev/null); then
              echo "::error::$label rendered; the chart must refuse it"; exit 1
            fi
            grep -qF -- "$want" <<<"$err" || { echo "::error::$label failed without '$want': $err"; exit 1; }
            echo "$label: refused"
          }
          renders() {
            local label=$1; shift
            helm template ci-check "$C" -f "$V" "$@" > "$t" || { echo "::error::$label must render"; exit 1; }
            echo "$label: renders"
          }
          refuse list 'ingress.extraRoutes must be a map' --set-json 'ingress.extraRoutes=[{"match":"Host(`a`)","priority":1}]'
          refuse no-hostname 'ingress.extraRoutes needs ingress.enabled and ingress.hostname' --set ingress.hostname=
          refuse ingress-disabled 'ingress.extraRoutes needs ingress.enabled and ingress.hostname' --set ingress.enabled=false
          refuse bad-key 'ingress.extraRoutes.my_route: the key must be a DNS-1123 label' \
            --set-json 'ingress.extraRoutes.my_route={"match":"Host(`a`)","priority":1,"middlewares":[{"name":"authentik-forwardauth"}]}'
          refuse no-host 'ingress.extraRoutes.adminApi.match must contain Host(' --set 'ingress.extraRoutes.adminApi.match=PathPrefix(`/x`)'
          refuse empty-match 'ingress.extraRoutes.adminApi.match must contain Host(' --set ingress.extraRoutes.adminApi.match=
          refuse no-priority 'ingress.extraRoutes.adminApi.priority is required' --set ingress.extraRoutes.adminApi.priority=null
          refuse bad-priority 'ingress.extraRoutes.adminApi.priority must be an integer of 1 or more' --set ingress.extraRoutes.adminApi.priority=abc
          refuse float-priority 'ingress.extraRoutes.adminApi.priority must be an integer of 1 or more' --set-json ingress.extraRoutes.adminApi.priority=1.9
          refuse nameless-middleware 'ingress.extraRoutes.adminApi.middlewares[0] needs a name' \
            --set-json 'ingress.extraRoutes.adminApi.middlewares=[{"namespace":"x"}]'
          refuse bad-port 'ingress.extraRoutes.adminApi.port must be an integer from 1 to 65535' --set ingress.extraRoutes.adminApi.port=http
          refuse zero-port 'ingress.extraRoutes.adminApi.port must be an integer from 1 to 65535' --set ingress.extraRoutes.adminApi.port=0
          refuse big-port 'ingress.extraRoutes.adminApi.port must be an integer from 1 to 65535' --set ingress.extraRoutes.adminApi.port=65536
          refuse null-entry 'ingress.extraRoutes.other must be a map with match and priority' -f <(printf 'ingress:\n  extraRoutes:\n    other: null\n')
          refuse scalar-entry 'ingress.extraRoutes.other must be a map with match and priority' --set-json 'ingress.extraRoutes.other="x"'
          refuse zero-priority 'ingress.extraRoutes.adminApi.priority must be an integer of 1 or more' --set ingress.extraRoutes.adminApi.priority=0
          refuse case-collision 'keys must differ once lowercased' \
            --set-json 'ingress.extraRoutes.AdminApi={"match":"Host(`a`)","priority":2,"middlewares":[{"name":"authentik-forwardauth"}]}'
          refuse trusts-no-forwardauth 'ingress.extraRoutes.adminApi needs a *-forwardauth Middleware because auth.trustsHeaders' \
            --set-json 'ingress.extraRoutes.adminApi.middlewares=[]'
          refuse trusts-public-ignored 'ingress.extraRoutes.adminApi needs a *-forwardauth Middleware because auth.trustsHeaders' \
            --set-json 'ingress.extraRoutes.adminApi.middlewares=[]' --set ingress.extraRoutes.adminApi.public=true
          refuse main-gated-no-forwardauth 'ingress.extraRoutes.adminApi has no *-forwardauth Middleware but the main route has one' \
            --set auth.trustsHeaders=false --set-json 'ingress.extraRoutes.adminApi.middlewares=[]'
          renders main-gated-public --set auth.trustsHeaders=false --set-json 'ingress.extraRoutes.adminApi.middlewares=[]' \
            --set ingress.extraRoutes.adminApi.public=true
          test "$(mw "$xr" "$t")" = "$b"
          renders ungated-no-forwardauth --set auth.trustsHeaders=false --set-json 'ingress.middlewares=[]' \
            --set-json 'ingress.extraRoutes.adminApi.middlewares=[]'
          # A3: a header-trusting app may not hand-write an IngressRoute
          im='apiVersion: traefik.io/v1alpha1\nkind: IngressRoute\nmetadata: {name: x}\n'
          refuse trusts-extramanifests-route 'auth.trustsHeaders: true refuses an IngressRoute in extraManifests' --set-json "extraManifests=[\"$im\"]"
          refuse trusts-extramanifests-quoted 'auth.trustsHeaders: true refuses an IngressRoute in extraManifests' \
            --set-json 'extraManifests=["apiVersion: traefik.io/v1alpha1\nkind: \"IngressRoute\"\nmetadata: {name: x}\n"]'
          refuse trusts-extramanifests-flow 'auth.trustsHeaders: true refuses an IngressRoute in extraManifests' \
            --set-json 'extraManifests=["{apiVersion: traefik.io/v1alpha1, kind: IngressRoute, metadata: {name: x}}"]'
          refuse trusts-extramanifests-tpl 'auth.trustsHeaders: true refuses an IngressRoute in extraManifests' \
            --set-json 'extraManifests=["apiVersion: traefik.io/v1alpha1\nkind: {{ \"Ingress\" }}Route\nmetadata: {name: x}\n"]'
          renders trusts-extramanifests-configmap --set-json 'extraManifests=["apiVersion: v1\nkind: ConfigMap\nmetadata: {name: x}\n"]'
          renders untrusted-extramanifests-route --set auth.trustsHeaders=false --set-json "extraManifests=[\"$im\"]"

      # metrics.serviceMonitor (templates/servicemonitor.yaml): off renders
      # nothing; ci-values.yaml turns it on for an extraPorts port; a port
      # name that is not a Service port is refused with its message.
      - name: common-app-chart metrics.serviceMonitor
        run: |
          set -euo pipefail
          C=gitops/platform/common-app-chart
          r="$RUNNER_TEMP/rendered.yaml"
          sm='select(.kind=="ServiceMonitor")'
          test "$(helm template t "$C" | yq ea "[$sm] | length")" = 0
          test "$(yq ea "[$sm] | length" "$r")" = 1
          test "$(yq ea "$sm | .metadata.name" "$r")" = ci-check
          test "$(yq ea "$sm | .metadata.namespace" "$r")" = default
          test "$(yq ea "$sm | .metadata.labels[\"app.kubernetes.io/name\"]" "$r")" = ci-check
          test "$(yq ea "$sm | .spec.selector.matchLabels | to_entries | map(.key + \"=\" + .value) | join(\",\")" "$r")" \
            = app.kubernetes.io/name=ci-check,app.kubernetes.io/instance=ci-check
          test "$(yq ea "$sm | .spec.endpoints | length" "$r")" = 1
          test "$(yq ea "$sm | .spec.endpoints[0].port" "$r")" = metrics
          test "$(yq ea "$sm | .spec.endpoints[0].path" "$r")" = /metrics
          test "$(yq ea "$sm | .spec.endpoints[0].interval" "$r")" = 15s
          # positive control: the default port http renders without extraPorts
          test "$(helm template t "$C" --set metrics.serviceMonitor.enabled=true | yq ea "$sm | .spec.endpoints[0].port")" = http
          refuse() {
            local label=$1; shift
            if err=$(helm template t "$C" --set metrics.serviceMonitor.enabled=true "$@" 2>&1 >/dev/null); then
              echo "::error::$label rendered; the chart must refuse it"; exit 1
            fi
            grep -qF 'must name a Service port' <<<"$err" || { echo "::error::$label failed without the port message: $err"; exit 1; }
            echo "$label: refused"
          }
          refuse unknown-port --set metrics.serviceMonitor.port=metricz
          refuse numeric-port --set metrics.serviceMonitor.port=9090
          refuse extraports-typo --set metrics.serviceMonitor.port=metrics \
            --set 'service.extraPorts[0].name=metric' --set 'service.extraPorts[0].port=9090'
          # A3: a header-trusting app may not be scraped on its app port
          if err=$(helm template t "$C" -f "$C/ci-values.yaml" --set metrics.serviceMonitor.port=http 2>&1 >/dev/null); then
            echo "::error::trustsHeaders + port http rendered; the chart must refuse it"; exit 1
          fi
          grep -qF 'port http with auth.trustsHeaders: true is refused' <<<"$err" || { echo "::error::trustsHeaders + port http failed without the A3 message: $err"; exit 1; }
          echo "trustsheaders-http-port: refused"

      # dataLifecycle (templates/deployment.yaml): ci-values.yaml opts in, so
      # the Deployment carries the pii label and the set annotations and
      # nothing else; the default render has no data.bnei.dev/ key on any
      # object; non-strings, unknown keys and a pii outside the enum are
      # refused with their messages.
      - name: common-app-chart dataLifecycle
        run: |
          set -euo pipefail
          C=gitops/platform/common-app-chart
          r="$RUNNER_TEMP/rendered.yaml"
          dep='select(.kind=="Deployment")'
          kv='to_entries | map(select(.key | test("^data\\.bnei\\.dev/")) | .key + "=" + .value) | join(",")'
          test "$(yq ea "$dep | .metadata.labels | $kv" "$r")" = data.bnei.dev/pii=personal
          test "$(yq ea "$dep | .metadata.annotations | $kv" "$r")" \
            = "data.bnei.dev/backup=pgBackRest to Garage via Pigsty,data.bnei.dev/retention=90d"
          # the pod template and selector stay untouched (no roll, no selector change)
          test "$(yq ea -o=json "$dep | [.spec.template.metadata, .spec.selector]" "$r" | grep -c 'data\.bnei\.dev' || true)" = 0
          test "$(helm template t "$C" | grep -c 'data\.bnei\.dev/' || true)" = 0
          # positive control for the line above: grep sees the key when it is set
          test "$(helm template t "$C" --set dataLifecycle.pii=none | grep -c 'data\.bnei\.dev/')" = 1
          refuse() {
            local label=$1 msg=$2; shift 2
            if err=$(helm template t "$C" "$@" 2>&1 >/dev/null); then
              echo "::error::$label rendered; the chart must refuse it"; exit 1
            fi
            grep -qF "$msg" <<<"$err" || { echo "::error::$label failed without its message: $err"; exit 1; }
            echo "$label: refused"
          }
          refuse bogus-pii 'dataLifecycle.pii must be none, personal or sensitive' --set dataLifecycle.pii=bogus
          refuse int-retention 'dataLifecycle.retention must be a string; quote it' --set dataLifecycle.retention=90
          printf 'dataLifecycle:\n  backup: no\n' > "$RUNNER_TEMP/backup-no.yaml"
          refuse yaml11-bool-backup 'dataLifecycle.backup must be a string; quote it' -f "$RUNNER_TEMP/backup-no.yaml"
          refuse unknown-key 'dataLifecycle.bakup is not a known key' --set dataLifecycle.bakup=x

      # Pod identity and args (templates/deployment.yaml): ci-values.yaml sets
      # all three; the default render has none; a non-bool automount is
      # refused, so a quoted "false" cannot pass as a mounted token.
      - name: common-app-chart serviceAccountName, automountServiceAccountToken, args
        run: |
          set -euo pipefail
          C=gitops/platform/common-app-chart
          r="$RUNNER_TEMP/rendered.yaml"
          pod='select(.kind=="Deployment") | .spec.template.spec'
          test "$(yq ea "$pod | .serviceAccountName" "$r")" = ci-check
          test "$(yq ea "$pod | .automountServiceAccountToken" "$r")" = false
          test "$(yq ea "$pod | .containers[0].args | join(\",\")" "$r")" = --world,real
          test "$(helm template t "$C" | grep -cE 'serviceAccountName|automountServiceAccountToken|args:' || true)" = 0
          test "$(helm template t "$C" --set automountServiceAccountToken=true | yq ea "$pod | .automountServiceAccountToken")" = true
          if err=$(helm template t "$C" --set-string automountServiceAccountToken=false 2>&1 >/dev/null); then
            echo "::error::a string automountServiceAccountToken rendered; the chart must refuse it"; exit 1
          fi
          grep -qF 'automountServiceAccountToken must be true, false or unset' <<<"$err" || { echo "::error::refused without its message: $err"; exit 1; }
          echo "string-automount: refused"

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: kubeconform (K8s/ArgoCD/Traefik/Infisical schema validation)
        run: |
          set -euo pipefail
          kubeconform -strict -summary -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            gitops/platform/actions-runner/*.yaml \
            gitops/redirectors/*.yaml \
            gitops/platform/ukubi-game/*.yaml \
            gitops/bootstrap/*.yaml \
            "$RUNNER_TEMP/rendered.yaml"

      # ADR-0069: the game's grant is an allowlist. Every rule tuple (group,
      # resource, verb), aggregationRule, nonResourceURLs and binding in any
      # file of gitops/platform/ukubi-game/ is listed and must equal this list
      # exactly, so nothing can be added (a verb, an exec-equivalent like
      # nodes/proxy or serviceaccounts/token, a binding to cluster-admin, an
      # aggregated role, a second file) without editing it. Widening the grant
      # is an ADR-0069 amendment, which edits this list too.
      # pods/log is never cluster-wide: it is a RoleBinding per namespace in
      # log_ns, and pods/log in a no_log_ns namespace fails even if someone
      # also adds that namespace to log_ns.
      - name: the game's RBAC is exactly ADR-0069 part 1
        run: |
          set -euo pipefail
          log_ns="dream-analyst drop editable-blog ente has-journal hq
            local-path-storage monitoring mountain pgweb pi-lab searxng
            silverbullet traefik ukubi-bridge ukubi-game ukubi-stt vos vos-dev
            wedding-2026 wird zot"
          no_log_ns="kube-system cilium longhorn-system argocd infisical authentik agent-fleet agent-vault
            thot netbird actions-runner"
          allowed=$(cat <<'ALLOW'
          ClusterRole -/ukubi-game-read |pods|get
          ClusterRole -/ukubi-game-read |pods|list
          ClusterRole -/ukubi-game-read |pods|watch
          ClusterRole -/ukubi-game-read |nodes|get
          ClusterRole -/ukubi-game-read |nodes|list
          ClusterRole -/ukubi-game-read |nodes|watch
          ClusterRole -/ukubi-game-read |services|get
          ClusterRole -/ukubi-game-read |services|list
          ClusterRole -/ukubi-game-read |services|watch
          ClusterRole -/ukubi-game-read |persistentvolumeclaims|get
          ClusterRole -/ukubi-game-read |persistentvolumeclaims|list
          ClusterRole -/ukubi-game-read |persistentvolumeclaims|watch
          ClusterRole -/ukubi-game-read apps|deployments|get
          ClusterRole -/ukubi-game-read apps|deployments|list
          ClusterRole -/ukubi-game-read apps|deployments|watch
          ClusterRole -/ukubi-game-read apps|statefulsets|get
          ClusterRole -/ukubi-game-read apps|statefulsets|list
          ClusterRole -/ukubi-game-read apps|statefulsets|watch
          ClusterRole -/ukubi-game-read apps|daemonsets|get
          ClusterRole -/ukubi-game-read apps|daemonsets|list
          ClusterRole -/ukubi-game-read apps|daemonsets|watch
          ClusterRole -/ukubi-game-read apps|replicasets|get
          ClusterRole -/ukubi-game-read apps|replicasets|list
          ClusterRole -/ukubi-game-read apps|replicasets|watch
          ClusterRole -/ukubi-game-read discovery.k8s.io|endpointslices|get
          ClusterRole -/ukubi-game-read discovery.k8s.io|endpointslices|list
          ClusterRole -/ukubi-game-read discovery.k8s.io|endpointslices|watch
          ClusterRole -/ukubi-game-read events.k8s.io|events|get
          ClusterRole -/ukubi-game-read events.k8s.io|events|list
          ClusterRole -/ukubi-game-read events.k8s.io|events|watch
          ClusterRoleBinding -/ukubi-game-read -> ClusterRole/ukubi-game-read for ServiceAccount ukubi-game/ukubi-game
          Role argocd/ukubi-game argoproj.io|applications|get
          Role argocd/ukubi-game argoproj.io|applications|list
          Role argocd/ukubi-game argoproj.io|applications|watch
          RoleBinding argocd/ukubi-game -> Role/ukubi-game for ServiceAccount ukubi-game/ukubi-game
          ClusterRole -/ukubi-game-logs |pods/log|get
          ALLOW
          )
          for ns in $log_ns; do
            allowed+=$'\n'"RoleBinding $ns/ukubi-game-logs -> ClusterRole/ukubi-game-logs for ServiceAccount ukubi-game/ukubi-game"
          done
          actual=$(yq -o=json -I=0 '.' gitops/platform/ukubi-game/*.yaml | jq -r '
            select(.kind | IN("ClusterRole", "Role", "ClusterRoleBinding", "RoleBinding")) |
            "\(.kind) \(.metadata.namespace // "-")/\(.metadata.name)" as $id |
            (select(.aggregationRule) | "\($id) aggregationRule"),
            (.rules // [] | .[] |
              if .nonResourceURLs then "\($id) nonResourceURLs"
              else .apiGroups[] as $g | .resources[] as $r | .verbs[] as $v | "\($id) \($g)|\($r)|\($v)" end),
            (select(.roleRef) | .roleRef as $ref | .subjects // [] | .[] |
              "\($id) -> \($ref.kind)/\($ref.name) for \(.kind) \(.namespace // "-")/\(.name)")')
          for ns in $no_log_ns; do
            if grep -Eq "^[A-Za-z]+ $ns/.*(pods/log|ukubi-game-logs)" <<<"$actual"; then
              echo "::error::gitops/platform/ukubi-game grants pods/log in $ns, which ADR-0069 excludes"; exit 1
            fi
          done
          if ! d=$(diff <(sed 's/^ *//' <<<"$allowed" | sort) <(sort <<<"$actual")); then
            echo "::error::gitops/platform/ukubi-game grants differ from ADR-0069 part 1 (> added, < removed):"
            echo "$d"; exit 1
          fi

      - name: registry.yaml <-> apps.applicationset.yaml sync check
        run: bash gitops/scripts/check-app-registry-sync.sh

      # Warn-only: lists apps without a dataLifecycle pii/backup declaration.
      # github.token reads public app repos only; private ones are skipped.
      # It still fails when the lint itself breaks (non-404 gh error). The
      # fixture run is offline and checks the exact lines and exit codes.
      - name: data lifecycle declarations (warn-only) and fixture self-test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash gitops/scripts/check-data-lifecycle.sh
          F=gitops/scripts/testdata/data-lifecycle
          rc=0
          out=$(VALUES_DIR=$F/values bash gitops/scripts/check-data-lifecycle.sh \
            $F/apps.applicationset.yaml $F/platform.applicationset.yaml $F/platform-values) || rc=$?
          want='fx-layered: declared
          fx-bogus: invalid pii, missing backup
          fx-absent: skipped (values unreadable)
          fx-numeric: invalid backup
          fx-list: invalid pii,backup
          fx-blank: invalid pii
          platform/plat-declared: declared
          platform/plat-missing: missing pii,backup
          declared: 2, undeclared: 5, skipped: 1
          ::warning::5 apps missing a valid dataLifecycle pii/backup declaration (warn-only; see gitops/scripts/check-data-lifecycle.sh)'
          if [ "$rc" -ne 0 ] || [ "$out" != "$want" ]; then
            # fixture output is printed only on failure, with :: defused, so its
            # ::warning:: line never becomes a real PR annotation
            printf '%s\n' "$out" | sed 's/^::/  ::/'
            echo "::error::check-data-lifecycle.sh fixture output differs (exit $rc)"; exit 1
          fi
          # a broken lint (here: a platform app with no values file) exits 1
          printf 'spec: {generators: [{list: {elements: [{name: nope}]}}]}\n' > "$RUNNER_TEMP/nope-as.yaml"
          rc=0
          VALUES_DIR=$F/values bash gitops/scripts/check-data-lifecycle.sh \
            $F/apps.applicationset.yaml "$RUNNER_TEMP/nope-as.yaml" $F/platform-values >/dev/null || rc=$?
          test "$rc" = 1 || { echo "::error::a missing platform values file exited $rc, want 1"; exit 1; }

      - name: agent-vault-bootstrap.sh fails closed (stubbed, offline)
        run: sh gitops/scripts/test-agent-vault-bootstrap.sh
