# kube-prometheus-stack Helm values for ukubi-cluster
# Chart: https://prometheus-community.github.io/helm-charts  name: kube-prometheus-stack
#
# Migrated from k8s-cluster/prometheus/values.yml — trim to what's actually needed.

# Alertmanager posts to a Discord channel webhook via its /slack
# compatibility suffix (baked into the secret's templated value in
# gitops/bootstrap/alertmanager-discord-secret.yaml) — native
# slack_configs receiver, no adapter container needed.
alertmanager:
  enabled: true
  alertmanagerSpec:
    externalUrl: https://alertmanager.bnei.dev
    secrets:
      - alertmanager-discord-webhook
      - alertmanager-thot-token
  config:
    route:
      receiver: discord
      group_by: ["alertname"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Redeclared, NOT decoration: the chart's own Watchdog->null route
        # only survived here because this file had no `routes:` key at all
        # and Helm map-merged it in. Declaring routes: as a list replaces
        # it wholesale (same trap the receivers: comment below describes),
        # so omitting this sends the Watchdog heartbeat to Discord every
        # repeat_interval, forever. Verified against the live generated
        # config before this route was added. Must stay first — a
        # non-continue match stops evaluation.
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        # A critical or warning alert additionally wakes thot, which
        # investigates it as a normal fleet task (agent-fleet
        # docs/adr/0037).
        #
        # Widened from `severity = "critical"` on 2026-08-12: everything
        # that actually fires in this cluster is warning-level
        # (KubeJobFailed, the Loki error-rate rule), so the critical-only
        # scope meant thot had never once been woken by an alert. This
        # lands back on ADR-0032's original "fan out, narrow later once
        # there's data" position — the data being that critical-only
        # routes nothing at all.
        #
        # Still a matcher rather than no filter: each match spawns a pod
        # running an agent with cluster read access, so an info-level
        # rule stays a Discord ping. agent-fleet dedups repeat deliveries
        # of the same alert fingerprint, which bounds the other side.
        - receiver: thot
          matchers:
            - severity =~ "critical|warning"
          continue: true
        # The catch-all that makes the route above a fan-out instead of a
        # diversion. A matching child route does NOT fall through to the
        # parent's receiver — without this sibling, `route.receiver:
        # discord` above is dead for anything a child matched, and every
        # critical alert would reach thot while silently vanishing from
        # Discord. Confirmed with `amtool config routes test`, which
        # returned `thot` alone before this was added.
        - receiver: discord
    receivers:
      # Chart default route.routes silences the Watchdog heartbeat alert by
      # sending it to a receiver literally named "null" — replacing
      # receivers: as a list (Helm doesn't merge lists) drops the chart's
      # own "null" receiver definition while that default route survives
      # via map-merge, so it must be redeclared here or Alertmanager
      # refuses to start ("undefined receiver \"null\" used in route").
      - name: "null"
      - name: discord
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-discord-webhook/webhook-url
            send_resolved: true
            # Same body shape as the Grafana-managed alerts (see
            # gitops/platform/values/grafana/values.yaml `templates.yaml`) so
            # both alert sources read the same in the shared Discord channel.
            # Written unescaped on purpose: this chart only runs
            # alertmanager.config through Helm `tpl` when `tplConfig: true`,
            # and it defaults to false. Flip that and every {{ }} here has to
            # be backtick-escaped or manifest generation breaks.
            title: '{{ template "discord.title" . }}'
            text: '{{ template "discord.message" . }}'
      - name: thot
        webhook_configs:
          # core refuses this endpoint outright when it has no token
          # configured, so a missing/mismatched secret fails loudly as a
          # 401/503 in Alertmanager's notification logs rather than
          # silently letting anything in-cluster spawn privileged work.
          # agent-fleet-core, NOT core: common-app-chart prefixes every
          # Service with its release name, so the bare name never resolved
          # and every delivery died at DNS. Verified from a pod in this
          # namespace — the bare name gives no connection at all, this one
          # answers 200 on /healthz.
          - url: http://agent-fleet-core.agent-fleet.svc.cluster.local:8080/webhook/alertmanager
            # Resolved alerts need no investigation; core ignores them
            # anyway, so don't spend a delivery on them.
            send_resolved: false
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/alertmanager-thot-token/token
  # Rendered into the same Secret as alertmanager.yaml and mounted at
  # /etc/alertmanager/config/, which the chart's default
  # `config.templates: ['/etc/alertmanager/config/*.tmpl']` already globs — that
  # default is a list, but it survives because `config:` above never declares a
  # `templates:` key, so Helm map-merges instead of replacing. Adding one here
  # would be the same list-replacement trap the receivers:/routes: comments
  # above describe, in reverse.
  #
  # Unescaped, unlike the Grafana side: templateFiles are never passed through
  # Helm `tpl` (kube-prometheus-stack/templates/alertmanager/secret.yaml just
  # b64encs the raw value).
  #
  # Alertmanager's data model is not Grafana's — no .Values, no .SilenceURL,
  # so the value and per-alert silence link from the Grafana template have no
  # equivalent here.
  #
  # NOT .GeneratorURL, which was the first thing tried and shipped a dead link
  # (confirmed live 2026-08-12): it resolves to the in-cluster
  # http://platform-prometheus-kube-p-prometheus.monitoring:9090/graph?... —
  # Prometheus has no IngressRoute (only Grafana and Alertmanager do), so it is
  # unreachable from Discord by construction, not by misconfiguration. One
  # .ExternalURL for the whole batch instead; it's https://alertmanager.bnei.dev
  # via alertmanagerSpec.externalUrl above, which is where you'd go to silence.
  #
  # The Remove list is scrape-target metadata that kube-state-metrics and
  # node-exporter stamp on every alert (which exporter pod observed it), NOT
  # the subject of the alert — `pod: platform-prometheus-kube-state-metrics-...`
  # on a longhorn job failure actively misleads. namespace/pod/container of the
  # actual subject survive, since rules carry those as their own labels.
  templateFiles:
    discord.tmpl: |-
      {{ define "discord.title" }}{{ if eq .Status "firing" }}🔥 FIRING{{ else }}✅ RESOLVED{{ end }} · {{ .CommonLabels.alertname }}{{ end }}

      {{ define "discord.message" }}{{ range .Alerts }}**{{ .Annotations.summary }}**
      {{ if .Annotations.description }}{{ .Annotations.description }}
      {{ end }}{{ range (.Labels.Remove (stringSlice "alertname" "endpoint" "instance" "job" "prometheus" "service" "condition")).SortedPairs }}{{ .Name }}: {{ .Value }}
      {{ end }}{{ if .Annotations.runbook_url }}runbook: {{ .Annotations.runbook_url }}
      {{ end }}{{ end }}{{ .ExternalURL }}{{ end }}

# Grafana is deployed as a separate platform app
grafana:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    # Chart default only watches ServiceMonitors carrying this release's own
    # label, so externally-created ones (e.g. argo-cd's own chart, enabled in
    # argocd-application.yaml) are invisible otherwise. Single-tenant homelab
    # cluster — no need to scope this narrower.
    serviceMonitorSelectorNilUsesHelmValues: false
    # Same trap on the rule side, and a quieter one: an unadopted PrometheusRule
    # is a CR that exists, syncs green in ArgoCD, and evaluates nothing. Traefik's
    # chart authors the cert-expiry rule (ADR-0040 Decision 9) with its own labels,
    # so without this it would be created and ignored.
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

# node-exporter on every node
nodeExporter:
  enabled: true

# kube-state-metrics
kubeStateMetrics:
  enabled: true
