# prometheus-blackbox-exporter — probes the three PVE hosts themselves, NetBird's public
# path, (ADR-0064) the infra guests mountain's atlas reads as `guest-<role>`, and
# three external dependencies atlas reads as `ext-<name>`.
#
# Why this exists: until 2026-08-25 nothing in this cluster watched the
# hypervisors. Only their guests were monitored, so when server1 (.200) lost
# its uplink on 2026-08-24 the cluster saw "two nodes went away" and had no
# way to say "the host under them died". See docs/bootstrap-test-notes.md's
# 2026-08-25 incident entry.
#
# Read the companion caveat before trusting this: a probe is only as alive as
# the Prometheus that evaluates it, and Prometheus is a StatefulSet that does
# NOT reschedule off an unreachable node. If Prometheus happens to sit on the
# host that dies, this rule stays silent — that case is covered instead by the
# `monitoring-blind` Grafana rule in values/grafana/values.yaml, which is
# evaluated by Grafana (a Deployment, so it does move).

# tcp_connect against pveproxy rather than ICMP. An ICMP prober needs NET_RAW
# on the pod (the chart ships securityContext dropping it); a TCP dial needs
# no capability at all. `modules` is a map, so this merges with the chart's
# stock http_2xx rather than replacing it.
config:
  modules:
    pve_tcp:
      prober: tcp
      timeout: 5s
      tcp:
        preferred_ip_protocol: ip4
    # ADR-0064: Patroni's REST API answers HTTP/1.0 (Python BaseHTTP), which the
    # stock http_2xx refuses. /health is 200 on primary and replica alike, so the
    # public town cannot tell them apart; never probe /primary or /leader.
    patroni_health:
      prober: http
      timeout: 5s
      http:
        method: GET
        valid_http_versions: ["HTTP/1.0", "HTTP/1.1"]
        valid_status_codes: [200]
        preferred_ip_protocol: ip4
    # ADR-0064: etcd's client port is TLS-only; a plain TCP dial makes etcd log
    # a TLS EOF every 30 s. The handshake alone proves the listener (no client
    # certificate is configured on the witness; verify before merging).
    etcd_tls:
      prober: tcp
      timeout: 5s
      tcp:
        preferred_ip_protocol: ip4
        tls: true
        tls_config:
          insecure_skip_verify: true
    # External services: any 2xx-4xx answer means the host is reachable (the
    # bare API roots return 401/403/404 without credentials). 5xx and
    # connection/TLS failures count as down.
    http_reachable:
      prober: http
      timeout: 5s
      http:
        method: GET
        valid_status_codes: [200, 201, 202, 203, 204, 205, 206, 301, 302, 303, 304, 307, 308, 400, 401, 403, 404, 405, 429]
        preferred_ip_protocol: ip4

# One ServiceMonitor per target, generated by the chart. Deliberately NOT the
# Probe CRD: values/prometheus/values.yaml sets serviceMonitorSelectorNil-
# UsesHelmValues and ruleSelectorNilUsesHelmValues to false but says nothing
# about probeSelector, so a Probe would be created and then silently never
# scraped.
serviceMonitor:
  enabled: true
  defaults:
    interval: 30s
    scrapeTimeout: 10s
    module: pve_tcp
    labels:
      release: platform-prometheus
  targets:
    # pveproxy's port. Probing :8006 rather than plain reachability means a
    # wedged pveproxy on a pingable host also alerts — that host is just as
    # unmanageable, so that is wanted, not a false positive.
    - name: pve-server1
      url: 192.168.1.200:8006
      module: pve_tcp
    - name: pve-bnei
      url: 192.168.1.165:8006
      module: pve_tcp
    - name: pve-ex-laptop
      url: 192.168.1.161:8006
      module: pve_tcp
    # NetBird's public name, from inside the cluster: Pi-hole answers with the
    # public IP, so this goes out and back through the Freebox (NAT hairpin)
    # and Traefik. It proves the hairpin path ADR-0055's LAN peers depend on,
    # not the outside path. http_2xx is the chart's stock module.
    #
    # Dex's discovery document, NOT `/`: `/` is the netbird-dashboard
    # release's catch-all route and stays 200 while netbird-server's own
    # IngressRoute (/api, /oauth2, gRPC, relay) is broken. /oauth2 is served
    # by netbird-server itself.
    #
    # If ADR-0054's hairpin fallback is ever applied (a Pi-hole override of
    # netbird.bnei.dev to .233), this stops testing the hairpin and only
    # tests Traefik — update the comment and the alert text then.
    - name: netbird
      url: https://netbird.bnei.dev/oauth2/.well-known/openid-configuration
      module: http_2xx
    # ADR-0064: the infra guests outside Kubernetes. Named by the town's role
    # keys (ADR-0064); since ADR-0067 mountain's atlas reads
    # max by (target)(probe_success{target=~"guest-.*|pve-.*"}) and maps each
    # target to the machine it probes in mountain `internal/realms/realms.yaml`
    # (probes:). A guest-* target not listed there is ignored by atlas: add it
    # there too. No alert rule: the rules below are scoped to pve-* and
    # netbird. k9s-dashboard is never probed.
    # The ext-* targets (last in this list) are not guests or hosts: atlas maps
    # `ext-<name>` to its moon `ext:<name>` (mountain PR #82).
    - name: guest-archive-h1          # pg02, Patroni
      url: http://192.168.1.207:8008/health
      module: patroni_health
    - name: guest-archive-h2          # pg01, Patroni
      url: http://192.168.1.205:8008/health
      module: patroni_health
    - name: guest-witness             # pg-etcd-witness, etcd client port
      url: 192.168.1.197:2379
      module: etcd_tls
    - name: guest-granary             # garage-storage, S3
      url: 192.168.1.199:3900
      module: pve_tcp
    - name: guest-cellar              # nfs-storage, NFS
      url: 192.168.1.198:2049
      module: pve_tcp
    - name: guest-forge               # build-runner, sshd (no PerSourcePenalty exemption)
      url: 192.168.1.111:22
      module: pve_tcp
    - name: guest-mill                # hermesagent dashboard; .72 has no DHCP reservation (ADR-0051)
      url: 192.168.1.72:9119
      module: pve_tcp
    # External dependencies the game's moons stand for. Names are `ext-<name>`
    # so atlas maps them to the moon `ext:<name>`; atlas reads only
    # probe_success. http_reachable counts 2xx-4xx as up. No alert rule.
    - name: ext-github
      url: https://api.github.com
      module: http_reachable
    - name: ext-anthropic
      url: https://api.anthropic.com
      module: http_reachable
    - name: ext-cloudflare
      url: https://cloudflare.com/cdn-cgi/trace
      module: http_reachable

prometheusRule:
  enabled: true
  additionalLabels:
    release: platform-prometheus
  rules:
    - alert: PVEHostUnreachable
      # `instance` carries the probed host:port — the chart's generated
      # ServiceMonitor relabels __param_target onto it. severity: critical
      # also fans this out to thot via the Alertmanager route in
      # values/prometheus/values.yaml.
      # Scoped to the pve-* targets: unscoped, every other probe here (netbird)
      # would page as a dead hypervisor.
      expr: probe_success{job=~".*blackbox.*", target=~"pve-.*"} == 0
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "PVE host {{ $labels.target }} ({{ $labels.instance }}) unreachable for 3m"
        description: >-
          blackbox-exporter cannot open a TCP connection to pveproxy on
          {{ $labels.instance }}. Either the hypervisor is down or it has lost
          its network. Every guest on that host is gone with it. On server1
          this was a USB uplink dropping off the bus without rejoining vmbr0
          (2026-08-24, 23h40m outage) — check `bridge link show` on the host.
    - alert: PVEHostProbeStale
      # probe_success == 0 cannot fire if the series stops existing, which is
      # what happens when blackbox-exporter itself is unschedulable. Without
      # this, losing the prober looks identical to everything being healthy.
      expr: absent(probe_success{job=~".*blackbox.*", target=~"pve-.*"})
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "PVE host probes have stopped reporting"
        description: >-
          No PVE probe_success series for 10m — blackbox-exporter is likely
          down, so PVEHostUnreachable and NetBirdUnreachable are both blind.
    - alert: NetBirdUnreachable
      # `or absent()`: a dropped or renamed target removes the series, and
      # `== 0` cannot fire on a series that does not exist.
      expr: probe_success{job=~".*blackbox.*", target="netbird"} == 0 or absent(probe_success{job=~".*blackbox.*", target="netbird"})
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "netbird.bnei.dev/oauth2 unreachable from inside the cluster for 5m"
        description: >-
          HTTPS to netbird-server's /oauth2 discovery document fails through
          the Freebox hairpin and Traefik (or the probe series is missing).
          If NetBirdServerDown is not also firing, the server pod answers its
          metrics and the path is at fault: netbird-server's IngressRoute,
          Traefik, the certificate, or the Freebox's NAT loopback. LAN peers
          (ADR-0055) use this path.
