# Longhorn Helm values for ukubi-cluster
# Chart: https://charts.longhorn.io  name: longhorn
#
# Replaces local-path-provisioner as the cluster's default StorageClass —
# ADR-0002, docs/adr/0002-storage-longhorn-over-ceph-nfs.md (decided
# 2026-07-12, supersedes the earlier NFS-server plan).
# local-path-provisioner is left installed but non-default for now;
# whether to remove it outright is still open (ADR-0019).
#
# Each k8s VM's second disk (scsi1, provisioned in terraform/k8s-vms.tf)
# ships raw/unformatted — terraform/cloud-init.tf's vendor-data formats and
# mounts it at defaultSettings.defaultDataPath below on first boot, so no
# separate ansible/manual step is needed before this syncs.
#
# Replica count 3 assumes 3 schedulable nodes. Both k8s VMs currently run
# on the single active PVE host (.165) — this protects against VM/node
# failure only, not physical-host failure, until .200/.161 join. With only
# 2 nodes in Stage 1, volumes run degraded (2/3 replicas) until Stage 2
# adds a 3rd schedulable node — expected, not an incident (ADR-0019).
# k8s-cp-01 IS schedulable for replicas: inventory/ukubi/hosts.yaml puts
# it in both kube_control_plane and kube_node, so kubespray doesn't apply
# the control-plane-only NoSchedule taint (ADR-0019).
#
# Backup target: Garage S3 (ARCHITECTURE.md §7), bucket created by
# ansible/playbooks/garage-configure.yml (terraform/garage.tf creates the
# bare LXC, that playbook installs Garage and provisions the bucket/keys —
# no manual step). Daily snapshot RecurringJob:
# gitops/bootstrap/longhorn-daily-snapshot-recurringjob.yaml.
# Credentials: gitops/bootstrap/longhorn-backup-secret.yaml (InfisicalSecret,
# LONGHORN_S3_ACCESS_KEY/_SECRET in docs/secrets.md). Configured either way —
# backups just won't succeed until the Garage LXC bring-up phase is done.

persistence:
  defaultClass: true
  defaultClassReplicaCount: 3
  defaultFsType: ext4

longhornManager:
  log:
    format: json

defaultSettings:
  defaultDataPath: /var/lib/longhorn
  defaultReplicaCount: 3
  # 2026-10-16, ahead of the 1.7 -> 1.13 hop-by-hop upgrade: let Longhorn live-upgrade
  # each volume engine to the new default engine image, one volume per node at a
  # time. At 0 (the old value) every hop leaves the volumes on the previous
  # engine image until each one is upgraded by hand.
  concurrentAutomaticEngineUpgradePerNodeLimit: 1

# Moved out of defaultSettings at chart 1.8 (2026-10-16): 1.8 replaced the
# backup-target global settings with the default BackupTarget CR, which this
# block now declares. The 1.8 upgrade had already migrated the live value.
defaultBackupStore:
  backupTarget: s3://k8s-longhorn-backup@garage/
  backupTargetCredentialSecret: longhorn-backup-secret

# The chart's own docs: "Disable this setting when installing Longhorn
# using Argo CD or other GitOps solutions." The pre-upgrade check Job is a
# PreSync hook that references longhorn-service-account — a normal
# (non-hook) chart resource that only syncs in the main phase, which runs
# *after* PreSync hooks. On a fresh install (not an upgrade) there's
# nothing to check anyway, and leaving this enabled deadlocks the sync:
# `FailedCreate ... serviceaccount "longhorn-service-account" not found`.
preUpgradeChecker:
  jobEnabled: false

# Chart 1.12.1 turns on ingress NetworkPolicies for Longhorn's own internal
# endpoints (instance-manager gRPC included) by default, and Cilium enforces
# them. Longhorn's notes warn that on an enforcing CNI they can leave volume
# operations or recovery stuck, and this cluster's Cilium-in-chaining-mode setup
# is not on its validated list. Off for the 1.12/1.13 hops (charts before 1.12
# ignore this key); turning it on is a separate, tested change.
networkPolicies:
  restrictInternalTraffic: false
