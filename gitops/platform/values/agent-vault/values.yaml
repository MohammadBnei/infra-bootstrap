# Infisical Agent Vault (ADR-0061): agent-fleet's credential broker. A MITM
# proxy that swaps a definition pod's placeholder credentials for real ones per
# host/path. ClusterIP only: no IngressRoute, never exposed (the ApplicationSet
# element's hostname is empty for zot's reason). Callers: agent-fleet's
# provisioner (API :14321), definition pods and repo pods (proxy :14322;
# repo pods per ADR-0062 Decision 4), fenced by the NetworkPolicy below.
#
# Platform-common app (public image, no per-app repo), not a
# gitops/apps/registry.yaml user app — same reasoning as searxng/pgweb/zot.
#
# After the first sync, run gitops/scripts/agent-vault-bootstrap.sh once: it
# creates the owner and the provisioner's agent token (ADR-0061 Decision 5).

image:
  repository: docker.io/infisical/agent-vault
  # 0.40.0 (git 872578e4, 2026-10-01), multi-arch index digest. Research-preview
  # upstream: bump deliberately, never float.
  tag: "0.40.0@sha256:4d490e2586c553ea121fa404b66812ad40c246cc841b0cc746682d0a360bdf1e"

replicaCount: 1
# SQLite on an RWO volume: never two writers, so never two pods.
strategy:
  type: Recreate

service:
  port: 14321              # API (container port name "http")
  extraPorts:
    # MITM proxy. No declared containerPort needed: numeric targetPort.
    - name: mitm
      port: 14322

# No IngressRoute — see header. The ApplicationSet passes ingress.hostname
# unconditionally, so this must be explicit rather than merely absent.
ingress:
  enabled: false

env:
  # Its own address, echoed as av_addr in mint responses.
  - name: AGENT_VAULT_ADDR
    value: "http://agent-vault.agent-vault.svc.cluster.local:14321"
  # Defaults to ON and sends the owner's email upstream. Mandatory.
  - name: AGENT_VAULT_TELEMETRY
    value: "false"
  # Upstream's default, pinned: the proxy dials no RFC-1918/loopback/link-local/
  # CGN address (checked per resolved IP at connect time), so a definition pod
  # cannot use it to reach cluster Services, pods, nodes or the LAN directly.
  # Public addresses stay open, including this homelab's own: the WAN IP's
  # port-forwards and Cloudflare-proxied *.bnei.dev lead back to Traefik and
  # the :49222 break-glass SSH. Narrowed per vault only once the provisioner
  # sets deny (agent-fleet 0065). The vault's only egress fence — no egress
  # NetworkPolicy (ADR-0061 Consequences).
  - name: AGENT_VAULT_ALLOW_PRIVATE_RANGES
    value: "false"
  # ADR-0062 Decision 4: repo pods route ALL their HTTPS through the proxy
  # (passthrough), and the per-token default (20 rps, burst 200, 64 in flight)
  # is shared by every repo pod of one owner. `loose` is 40/s, burst 400, 128
  # in flight (v0.40.0 internal/ratelimit/config.go). One 401-package bun
  # install got no 429 under the default only thanks to refill; several pods
  # of one owner installing at once would (PR4a spike, 2026-10-21).
  # Repo pods also inherit ALLOW_PRIVATE_RANGES=false above: any private
  # destination through the proxy is refused, including split-horizon
  # *.bnei.dev names that resolve to 192.168.1.233 on the LAN (ADR-0063), so
  # agent-fleet's repo-pod NO_PROXY must list .bnei.lan, .bnei.dev and the
  # cluster suffixes to reach them directly.
  - name: AGENT_VAULT_RATELIMIT_PROFILE
    value: "loose"

# The folder also holds the owner password (read by the bootstrap script only).
# `keys` keeps it out of the Secret and so out of this process's env: only the
# master password (the only headless first-boot path) is synced. The project
# `agent-vault` is read by its own identity, `agent-vault-operator` (viewer on
# this project only), not the shared universal-auth one (ADR-0061 Decision 6).
infisical:
  enabled: true
  projectSlug: "agent-vault"
  envSlug: dev
  secretsPath: "/agent-vault-server"
  keys: [AGENT_VAULT_MASTER_PASSWORD]
  autoReload: false        # the master password does not rotate in place
  credentialsRef:
    secretName: agent-vault-universal-auth
    secretNamespace: infisical

persistence:
  enabled: true
  size: 1Gi
  # HOME=/data in the image: the SQLite db and the MITM CA live here.
  # longhorn (default class): replicated + backed up. SQLite, not Pigsty
  # (upstream supports DATABASE_URL): no DB, user or pigsty run for a store
  # that is mostly a cache (ADR-0061 Decision 2; `migrate-db` if that changes).
  mountPath: /data

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532           # the PVC root is created root-owned
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# CPU: the proxy TLS-terminates every repo-pod request (it re-signs
# passthrough hosts too). 3 concurrent cold installs peaked at 389m and were
# throttled in 82% of periods under the old 500m limit (PR4a spike,
# 2026-10-21); memory peaked at 105Mi.
resources:
  requests:
    cpu: 250m
    memory: 128Mi    # spike peak 105Mi: never run above the request
  limits:
    cpu: "2"
    memory: 512Mi

# Monitoring = these probes + the cluster-wide KubePodNotReady /
# KubeDeploymentReplicasMismatch / KubePodCrashLooping rules
# (kube-prometheus-stack, all namespaces). No metrics port upstream.
readinessProbe:
  enabled: true
  type: http
  path: /health
livenessProbe:
  enabled: true
  type: http
  path: /health
  initialDelaySeconds: 20

extraManifests:
  - |
    # ADR-0061 Decision 4: :14321 only from agent-fleet's provisioner, :14322
    # only from definition pods and (ADR-0062 Decision 4) repo pods. Plain NetworkPolicy ingress holds through the
    # ClusterIP under Cilium chaining (verified 2026-10-18: source identity
    # survives ClusterIP + vxlan, same label from another namespace refused).
    # Residuals (ADR-0061 Consequences): host identity on THIS pod's node
    # (kubelet probes, hostNetwork pods) is always admitted — Cilium's default
    # host allow; and any Application (all are project: default) can add an
    # allow policy here or run a pod with these labels in agent-fleet — the
    # repo-pod label included, whose value the policy does not check.
    apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: agent-vault-ingress
      namespace: {{ .Release.Namespace }}
    spec:
      podSelector:
        matchLabels:
          app.kubernetes.io/name: {{ .Release.Name }}
          app.kubernetes.io/instance: {{ .Release.Name }}
      policyTypes: [Ingress]
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: agent-fleet
              podSelector:
                matchLabels:
                  app: provisioner
          ports:
            - port: 14321
              protocol: TCP
        # :14322 proxy callers, one `from` entry per caller kind (OR'd):
        # definition pods, and repo pods routed through their owner's vault
        # (ADR-0062 Decision 4, agent-fleet 0075 §7). By convention only the
        # provisioner sets the repo-pod label; nothing enforces that (see the
        # residuals above).
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: agent-fleet
              podSelector:
                matchExpressions:
                  - key: fleet.bnei.dev/definition
                    operator: Exists
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: agent-fleet
              podSelector:
                matchExpressions:
                  - key: fleet.bnei.dev/vault-owner
                    operator: Exists
          ports:
            - port: 14322
              protocol: TCP
