# zot — in-cluster OCI registry, blobs on Garage S3 (ADR-0034).
#
# Platform-common app (public image, no per-app repo), not a
# gitops/apps/registry.yaml user app — same reasoning as searxng/pgweb.
#
# Reached at registry.bnei.lan:5000 over plain HTTP from a MetalLB address.
# There is deliberately NO IngressRoute: `.lan` is a name Let's Encrypt
# cannot issue for, so certResolver: le would fail forever. containerd is
# told to trust it in inventory/ukubi/group_vars/all/settings.yml.

image:
  # The FULL image, not zot-minimal — extensions (the metrics endpoint
  # below) are excluded from the minimal build, so this config would be
  # rejected there.
  repository: ghcr.io/project-zot/zot-linux-amd64
  tag: "v2.1.20"

service:
  type: LoadBalancer
  port: 5000
  annotations:
    # Pinned, not pool-assigned. This address is hardcoded into Pi-hole's
    # registry.bnei.lan record AND into every node's containerd config, and
    # selfHeal/prune make Service recreation routine — an unpinned address
    # would silently move and break every image pull in the cluster.
    metallb.universe.tf/loadBalancerIPs: 192.168.1.234

# No IngressRoute — see header. The ApplicationSet passes ingress.hostname
# unconditionally, so this must be explicit rather than merely absent.
ingress:
  enabled: false

# Zot buffers multipart S3 uploads, and the chart's LimitRange would
# otherwise default this to 512Mi — enough to OOMKill mid-push on a large
# layer, which presents as an intermittent registry fault rather than an
# obvious limit.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

# TCP rather than HTTP on purpose: an HTTP probe against /v2/ would couple
# pod health to the access-control policy below, so an ACL mistake would
# present as a crashlooping registry instead of a 401.
livenessProbe:
  enabled: true
  type: tcp
readinessProbe:
  enabled: true
  type: tcp

# S3 credentials. These MUST arrive named AWS_ACCESS_KEY_ID/
# AWS_SECRET_ACCESS_KEY — zot's storage driver reads those exact names, and
# the infisical: block below wires its managed secret in via envFrom, which
# injects keys verbatim and cannot rename them. Hence explicit secretKeyRef
# against the same secret. Getting this wrong yields silent 403s from
# Garage, or a hang while the AWS SDK falls through to IMDS.
env:
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: zot-infisical
        key: ZOT_S3_ACCESS_KEY
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: zot-infisical
        key: ZOT_S3_SECRET

# ponytail: the chart appends `envFrom: secretRef` for the managed secret
# whenever infisical.enabled is true, and there's no way to keep the
# InfisicalSecret CR without it. Since garage-configure.yml writes to this
# project's root path, that means EVERY secret at "/" — including
# GARAGE_ROOT_TOKEN and the other buckets' S3 credentials — lands as an env
# var in this pod, not just ZOT_S3_*. Accepted for now: it is how every
# platform-common app here already works, and zot runs a pinned upstream
# image rather than anything built from an app repo. Upgrade path if that
# stops being comfortable: move the ZOT_* secrets into an Infisical folder
# (`infisical secrets set --path=/zot` from garage-configure.yml) and point
# secretsPath below at it — the explicit secretKeyRef env vars above already
# work either way, so only this block changes.
infisical:
  enabled: true
  projectSlug: "infra-bootstrap-1-ge1"
  envSlug: dev
  # autoReload was true, on the reasoning "restart when the S3 credential
  # rotates". Turned off after it caused real restarts: the operator
  # computes one ETag over the WHOLE managed secret, which here is all 54
  # keys at this project's root — so it cannot tell ZOT_S3_* from the other
  # 52, and any unrelated secret change bounces the registry.
  #
  # That is not hypothetical. garage-configure.yml's two Infisical writes
  # are `changed_when: true` unconditionally and rewrite GARAGE_ROOT_TOKEN
  # plus every bucket's key pair, so *every run of that playbook* restarted
  # zot. Onboarding an unrelated bucket would too.
  #
  # The cost lands badly: this is on the critical path of every pod start,
  # and MetalLB is L2 — a reschedule moves the announcing node, adding ARP
  # convergence to the pod cycle.
  #
  # Trade accepted knowingly: after a real S3 credential rotation zot serves
  # errors until someone restarts it. That is detectable (the Alertmanager
  # rule) and rare, whereas the restarts were frequent and silent. A manual
  # restart is already this app's operating model anyway — its config.json
  # is mounted with subPath, which never picks up ConfigMap updates.
  #
  # The fuller fix, which would let this be true again AND close the
  # envFrom exposure noted above: move the ZOT_* secrets into an Infisical
  # folder and point secretsPath at it, so the managed secret holds only
  # zot's own keys.
  autoReload: false

extraVolumes:
  - name: config
    configMap:
      name: zot-config
  - name: htpasswd
    secret:
      # Same Infisical-managed secret as the env vars above, mounted as a
      # file because zot wants an htpasswd path, not an env var. One line,
      # "user:bcrypt-hash", written to Infisical as ZOT_HTPASSWD.
      secretName: zot-infisical
      items:
        - key: ZOT_HTPASSWD
          path: htpasswd
  # rootDirectory. With storageDriver s3 this is a local staging area, and
  # with dedupe disabled (see the config below) nothing in it needs to
  # survive a restart — so emptyDir, not a PVC. Two things follow, and both
  # were the point: the pod is genuinely stateless, keeping real state out
  # of the cluster per the standing rule; and there's no ReadWriteOnce
  # volume to deadlock a rollout against, which is the failure this homelab
  # has already hit on agent-fleet workers.
  #
  # If verification V4 (push -> delete pod -> pull) shows zot needs durable
  # local metadata after all, swap this for persistence: + strategy:
  # {type: Recreate} — never a PVC on the default rolling strategy.
  - name: registry-cache
    emptyDir: {}

extraVolumeMounts:
  - name: config
    mountPath: /etc/zot/config.json
    subPath: config.json
    readOnly: true
  - name: htpasswd
    mountPath: /etc/zot/htpasswd
    subPath: htpasswd
    readOnly: true
  - name: registry-cache
    mountPath: /var/lib/registry

# -----------------------------------------------------------------------
# Retention / GC (the storage.gc + storage.retention block below)
#
# ADR-0034 deferred a retention *policy* while keeping the bucket bound.
# agent-fleet's cutover is what makes the policy necessary: six images per
# release, one of them multi-GB (worker carries Claude Code, Playwright deps
# and a Go toolchain), against a 40GB zot-registry quota on a 200GB Garage
# LXC that also holds k8s-longhorn-backup, pg-backup, agent-fleet-files and
# ente-photos. Left unbounded it does not just fill its own space, it
# starves the backup system.
#
# `mostRecentlyPushedCount: 3`, and deliberately NOT
# mostRecentlyPulledCount / pulledWithin. Those are the obvious knobs and
# two of the three are traps *here specifically*: retention's pull/push
# statistics live in zot's metaDB, a boltdb under storage.rootDirectory —
# which is the emptyDir above. Push order survives that, because a metaDB
# rebuild recovers it from the manifests in S3. Pull counts cannot; they
# exist nowhere else. So after any restart (an ArgoCD sync, a node drain,
# a `.165` reboot) every tag looks "never pulled", and a policy keyed on
# pull recency would delete precisely the tags that are in service.
#
# The `patterns: ["latest"]` entry is load-bearing, not belt-and-braces.
# keepTags entries are OR'd, so this pins `latest` unconditionally.
# gitops/platform/thot/deployment.yaml and agent-fleet's
# provisioner/internal/catalog/catalog.go both float on
# agent-fleet-executor:latest on purpose — losing that tag breaks
# platform-thot and every cluster-access session, with no version bump to
# blame it on.
#
# gcDelay 2h (up from the 1h default) is the window protecting blobs of an
# in-flight push, and agent-fleet's worker is the largest thing this
# registry takes. deleteUntagged is where most of the space actually comes
# back — dangling manifests left by overwritten `latest` pushes.
#
# ukubi-stt keeps 2, not 3, and its policy is FIRST on purpose. zot applies
# "the first policy it matches" — a repo-specific rule placed after the `**`
# catch-all would never be reached, and the failure would be silent (the repo
# would just quietly keep 3). Verified against zot's retention docs before
# committing rather than assumed from the ordering looking natural.
#
# Why this repo: a GPU image is ~5GB against ~2.5GB for the largest existing
# one — a CUDA runtime base plus 2.4GB of ONNX weights baked in.
#
# Be honest about the saving though: successive tags of an unchanged Dockerfile
# SHARE the base and model blobs, so dropping one tag usually reclaims only the
# ~30MB binary layer, not 5GB. It pays off when the base or the weights change,
# which during Gate 0's iteration happened repeatedly (ubuntu22.04 -> 24.04,
# pip -> curl) and left several multi-GB layer sets alive at once. That is the
# case this guards, not steady-state.
#
# ARMED 2026-08-18 (`dryRun: false`). It shipped as a dry run because a GC'd
# blob is gone and the image has to be rebuilt — the one genuinely one-way
# door in this setup. Both preconditions were checked against a real dry-run
# pass before flipping, rather than reasoned about:
#
#   1. Nothing pinned was on the would-delete list. The pass decided
#      editable-blog 0.41.0 keep / 0.39.0, 0.38.0, 0.37.9 delete, and the live
#      blog runs 0.41.0 — every deletion older than what is deployed.
#      agent-fleet had exactly 3 version tags, so it lost nothing.
#   2. Baseline recorded so reclamation is falsifiable rather than assumed:
#      `garage bucket info zot-registry` read 3.3 GB / 144 objects against the
#      40 GB quota immediately before arming.
#
# CONFIRMED on the first armed pass: zot DOES reclaim S3 blobs on a remote
# storage backend. editable-blog's 0.37.9/0.38.0/0.39.0 were deleted and the
# Garage bucket went 144 -> 120 objects (3.1 -> 3.0 GiB). The size moved less
# than the object count because those images share most of their layers with
# the three kept tags, so only the unique blobs came back — which is the
# expected shape, not a partial failure.
#
# That was the open question this staging existed to answer, and it is the one
# that could not be answered without arming. If a future pass ever deletes
# manifests while the bucket holds steady, that is the silent failure this
# guarded against and `dryRun` goes back to `true`.
#
# `repositories: ["**"]` also applies this to editable-blog and anything
# added later. That is intended — one policy beats a per-repo list to keep
# in sync.
#
# Changing the JSON below is NOT self-applying: config.json is mounted with
# subPath (see extraVolumeMounts), which never picks up ConfigMap updates,
# and nothing here notifies the Deployment. An ArgoCD sync updates the
# ConfigMap and leaves the running pod on the old config. It takes a
# deliberate `kubectl -n zot rollout restart deploy/zot`, which also wipes
# the emptyDir metaDB and forces a one-time rebuild-from-storage on boot.
# -----------------------------------------------------------------------
extraManifests:
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: zot-config
      namespace: {{ .Release.Namespace }}
    data:
      config.json: |
        {
          "distSpecVersion": "1.1.1",
          "storage": {
            "rootDirectory": "/var/lib/registry",
            "dedupe": false,
            "gc": true,
            "gcDelay": "2h",
            "gcInterval": "24h",
            "retention": {
              "dryRun": false,
              "delay": "24h",
              "policies": [
                {
                  "repositories": ["ukubi-stt"],
                  "deleteUntagged": true,
                  "deleteReferrers": true,
                  "keepTags": [
                    { "patterns": ["latest"] },
                    { "mostRecentlyPushedCount": 2 }
                  ]
                },
                {
                  "repositories": ["**"],
                  "deleteUntagged": true,
                  "deleteReferrers": true,
                  "keepTags": [
                    { "patterns": ["latest"] },
                    { "mostRecentlyPushedCount": 3 }
                  ]
                }
              ]
            },
            "storageDriver": {
              "name": "s3",
              "bucket": "zot-registry",
              "region": "garage",
              "regionendpoint": "http://garage.bnei.lan:3900",
              "secure": false,
              "skipverify": false,
              "forcepathstyle": true
            }
          },
          "http": {
            "address": "0.0.0.0",
            "port": "5000",
            "auth": {
              "htpasswd": {
                "path": "/etc/zot/htpasswd"
              }
            },
            "accessControl": {
              "repositories": {
                "**": {
                  "anonymousPolicy": ["read"],
                  "defaultPolicy": ["read", "create", "update", "delete"]
                }
              },
              "metrics": {
                "anonymousPolicy": ["read"]
              }
            }
          },
          "log": {
            "level": "info"
          },
          "extensions": {
            "metrics": {
              "enable": true,
              "prometheus": {
                "path": "/metrics"
              }
            }
          }
        }
  # common-app-chart has no ServiceMonitor template, and every other
  # scraped component brings its own from an upstream chart. Prometheus'
  # serviceMonitorSelectorNilUsesHelmValues is false, so a hand-written one
  # is picked up.
  #
  # Confirmed live: /metrics returned 401 until `accessControl.metrics`
  # above was added — repository policies do not cover it, and enabling
  # htpasswd locks it down by default.
  #
  # Do NOT "fix" a future 401 here by adding a basicAuth stanza to this
  # ServiceMonitor. zot's isAnonymousMetricsRequest (pkg/api/authn.go)
  # requires the Authorization header to be **absent** — sending
  # credentials makes the request non-anonymous and it fails the check that
  # would otherwise let it through. Adding auth to be safe would break the
  # scrape rather than harden it.
  - |
    apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: zot
      namespace: {{ .Release.Namespace }}
      labels:
        {{- include "common-app-chart.labels" . | nindent 8 }}
    spec:
      selector:
        matchLabels:
          {{- include "common-app-chart.selectorLabels" . | nindent 10 }}
      endpoints:
        - port: http
          path: /metrics
          interval: 30s
