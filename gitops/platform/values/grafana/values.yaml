# Grafana Helm values for ukubi-cluster
# Chart: https://grafana.github.io/helm-charts  name: grafana
#
# Migrated from k8s-cluster/grafana/values.yml — trim to essentials.

persistence:
  enabled: true
  size: 5Gi

# Single RWO Longhorn PVC, single replica: the chart's default RollingUpdate
# strategy tries to bring the new pod up before killing the old one, and only
# one pod can attach the volume at a time — Multi-Attach error every time this
# ConfigMap changes (e.g. adding a dashboard) and forces a rollout. Recreate
# kills the old pod first.
# rollingUpdate: null is required, not just omitted — the live Deployment
# still carries a server-defaulted {maxSurge: 25%, maxUnavailable: 25%}
# from when this was RollingUpdate. A patch that sets only `type` merges
# into the existing strategy object instead of replacing it, leaving
# rollingUpdate populated alongside type: Recreate, which the API rejects
# ("may not be specified when strategy type is 'Recreate'"). Explicit null
# forces the patch to clear that leftover field.
deploymentStrategy:
  type: Recreate
  rollingUpdate: null

# Admin credentials from K8s Secret (created via InfisicalSecret CR, see
# gitops/bootstrap/grafana-admin-secret.yaml)
admin:
  existingSecret: grafana-admin
  userKey: username
  passwordKey: password

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      # kube-prometheus-stack's chart fullname truncates to
      # "platform-prometheus-kube-p-*" for this release name — not the
      # "prometheus-kube-prometheus-prometheus" you'd guess from the chart
      # name. Confirmed live: `kubectl get svc -n monitoring`. Same class
      # of naming mismatch as grafana-ingressroute.yaml/infisical-
      # ingressroute.yaml — always check the real Service name.
      url: http://platform-prometheus-kube-p-prometheus.monitoring.svc.cluster.local:9090
      isDefault: true

    # Pigsty's own metrics backend (pg01, postgres-1.bnei.lan) — actually
    # VictoriaMetrics (v2.24.0), not classic Prometheus, but it implements
    # the same HTTP API so Grafana's "prometheus" datasource type works
    # against it unchanged. Reached via Pigsty's nginx portal on :80
    # (confirmed live: no vhost/Host-header routing is actually configured
    # beyond the "home" catch-all, so any Host header lands on the same
    # backend — /vmetrics is the only path that matters). Resolved via
    # Pi-hole (ansible/playbooks/pihole-configure.yml), not a static IP —
    # follows the host if pg01 ever moves.
    - name: Pigsty (VictoriaMetrics)
      type: prometheus
      url: http://postgres-1.bnei.lan/vmetrics
      isDefault: false
      # Fixed uid, not left to auto-generate: Pigsty's own vendored
      # dashboard JSON (pigsty/files/grafana/pgsql/*.json) hardcodes
      # every panel's datasource to {"type":"prometheus","uid":"ds-prometheus"}
      # — matching it here means those dashboards work verbatim, no
      # per-panel datasource rewriting needed. Confirmed via
      # pigsty/roles/infra/templates/grafana/datasource.yml.j2:26, which
      # sets the same uid on Pigsty's own bundled Grafana instance.
      uid: ds-prometheus

    # Loki (gitops/platform/values/loki/values.yaml), SingleBinary mode.
    # Chart fullname not confirmed until first sync — likely "platform-loki"
    # since the chart name equals the release name (unlike kube-prometheus-
    # stack's truncated "platform-prometheus-kube-p-*" above). Confirmed
    # live: `kubectl get svc -n monitoring`.
    - name: Loki
      type: loki
      url: http://platform-loki.monitoring.svc.cluster.local:3100
      isDefault: false
      uid: ds-loki # fixed, not auto-generated — referenced by the alert rule below

# IngressRoute: gitops/bootstrap/grafana-ingressroute.yaml (Traefik
# IngressRoute, ADR-0001 — not Gateway API/HTTPRoute).
# OIDC client credentials arrive as env vars rather than being written into
# grafana.ini, so the secret never lands in a ConfigMap. Grafana maps
# GF_<SECTION>_<KEY> onto its ini config, so these two override
# auth.generic_oauth's client_id/client_secret.
envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
    secretKeyRef:
      name: grafana-oidc
      key: client_id
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: grafana-oidc
      key: client_secret

grafana.ini:
  server:
    root_url: https://grafana.bnei.dev

  # authentik OIDC federation (ADR-0039). The local admin from `admin:` above
  # is DELIBERATELY kept — ADR-0039 Decision 6: a Traefik ClientIP() route can
  # bypass a middleware but cannot bypass Grafana's own OIDC redirect, and
  # ArgoCD is what deploys authentik. Dropping the local admin would make an
  # authentik outage unrecoverable through anything but kubectl.
  auth.generic_oauth:
    enabled: true
    name: authentik
    # Discovery is not used: Grafana wants the three endpoints explicitly, and
    # naming them makes a wrong one a startup error rather than a silent
    # fallback.
    auth_url: https://authentik.bnei.dev/application/o/authorize/
    token_url: https://authentik.bnei.dev/application/o/token/
    api_url: https://authentik.bnei.dev/application/o/userinfo/
    scopes: openid email profile
    # Matches the provider's sub_mode: user_email in the blueprint. If these
    # two disagree, logins succeed and then map to the wrong Grafana user.
    login_attribute_path: preferred_username
    email_attribute_path: email
    name_attribute_path: name
    # No auto_login: it would remove the local-admin escape hatch from the UI
    # entirely, which is the opposite of Decision 6.
    auto_login: false
    # Admin for members of the `platform-admins` authentik group, Viewer for
    # everyone else. The group is declared in
    # gitops/bootstrap/authentik-blueprint-groups.yaml and ArgoCD reads the
    # SAME group name for its own `role:admin` — one membership list, honoured
    # by both apps, rather than a per-app allowlist that drifts.
    #
    # JMESPath, evaluated against the claims Grafana has after calling
    # `api_url` (userinfo) above. authentik's `profile` scope mapping is what
    # puts `groups` there. If the claim is missing the expression yields
    # Viewer, so a broken group lookup demotes rather than escalates.
    role_attribute_path: contains(groups[*], 'platform-admins') && 'Admin' || 'Viewer'
    # Org Admin, not Grafana *server* admin. Server admin manages users, orgs
    # and the instance itself; nothing about operating this cluster needs it,
    # and the local admin already has it.
    allow_assign_grafana_admin: false
  log.console:
    format: json

# Mounts the K8s Secret produced by the sibling Alertmanager branch
# (feat/alertmanager-discord-resource-governance)'s
# gitops/bootstrap/alertmanager-discord-secret.yaml — NOT owned by this
# branch, do not duplicate that InfisicalSecret CR here.
#
# KNOWN CROSS-BRANCH DEPENDENCY: this branch's Grafana pod will get stuck
# in ContainerCreating if the `alertmanager-discord-webhook` Secret doesn't
# exist in ns monitoring yet (missing secret mount fails pod scheduling,
# it does not degrade gracefully). Deploy this branch together with, or
# after, the Alertmanager branch — never alone first.
extraSecretMounts:
  - name: discord-webhook-secret-mount
    secretName: alertmanager-discord-webhook
    defaultMode: 0440
    mountPath: /etc/secrets/discord
    readOnly: true
  # The same bearer token Alertmanager presents to agent-fleet's core
  # (gitops/bootstrap/alertmanager-thot-secret.yaml materialises it into
  # ns monitoring, which is this pod's namespace too). Grafana-managed
  # alerts never pass through Alertmanager, so reaching thot needs its
  # own contact point here — see the `thot` receiver under `alerting:`.
  #
  # Same hard dependency as the mount above: a missing
  # `alertmanager-thot-token` Secret leaves this pod stuck in
  # ContainerCreating, it does not degrade gracefully.
  - name: thot-token-secret-mount
    secretName: alertmanager-thot-token
    defaultMode: 0440
    mountPath: /etc/secrets/thot
    readOnly: true

# Dynamic per-app alert rules and dashboards: watches every namespace
# (user apps each live in their own, not just `monitoring`) for ConfigMaps
# labeled grafana_alert: "1" / grafana_dashboard: "1" and loads them
# alongside the static ones below. Rendered by common-app-chart's
# logAlerts/dashboards values blocks (gitops/platform/common-app-chart/
# values.yaml + templates/grafana-alertrules.yaml,
# templates/grafana-dashboards.yaml) — an app declares its own rules/
# dashboards from its own repo without touching this file. Read-only
# ConfigMap list/watch across all namespaces (not Secrets) — standard for
# this chart's sidecar family, low blast radius, but confirm the
# resulting ClusterRole after first sync (`kubectl get clusterrole -l
# app.kubernetes.io/instance=platform-grafana`) rather than assuming the
# chart wires it up exactly as expected.
sidecar:
  alerts:
    enabled: true
    label: grafana_alert
    labelValue: "1"
    searchNamespace: ALL
    resource: configmap
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
    resource: configmap
    # Deliberately no `defaultFolderName`. Confirmed live (2026-08-01
    # incident): setting one makes the chart point Grafana's file
    # provider at a *subdirectory* of the sidecar's mounted emptyDir
    # (folder + "/" + defaultFolderName) — that subdirectory only gets
    # created by the sidecar when it actually writes a matching file
    # into it. With zero apps using dashboards.enabled yet, the
    # directory never existed, so Grafana's own provisioning walk
    # failed at startup ("failed to walk provisioned dashboards: stat
    # ...: no such file or directory") — a real error, not cosmetic,
    # every reload cycle. Leaving `folder` at its chart default
    # (`/tmp/dashboards`, the emptyDir's actual mount point) sidesteps
    # this: that path always exists once mounted, empty or not. Synced
    # dashboards land in Grafana's default ("General") folder for now;
    # revisit a named folder only alongside a way to guarantee it
    # exists first (e.g. an initContainer mkdir), not before.

# Alerting-as-code: contact point, notification policy, and one platform-
# wide starter rule stay static (same file-provisioning pattern as
# datasources/dashboards above) — these are platform-owned, authored once,
# here. Per-app rule *groups* arrive dynamically via the sidecar above;
# both feed the same alerting engine, no conflict between the two.
#
# Contact point uses Grafana's native "slack" type (NOT "discord") against
# the reused webhook's /slack-suffixed URL: that suffix is baked into the
# secret specifically for Alertmanager's slack_configs receiver, which is
# how it talks to Discord with no adapter container (see
# alertmanager-discord-secret.yaml's header comment). Grafana's own
# "discord" contact-point type sends Discord's native JSON shape, which
# would be the wrong payload format against that same /slack endpoint — so
# this uses the same Slack-compatibility trick from Grafana's side.
# CONFIRMED LIVE (2026-07-29, incident): `url` under secureSettings makes
# this chart's Grafana version (11.4.0) reject the contact point outright
# at startup — "token must be specified when using the Slack chat API" —
# CrashLoopBackOff, real outage, not a cosmetic warning. Reproduced and
# fixed against a real local Grafana 11.4.0 container before reapplying
# here: `url` has to live under plain `settings`, not `secureSettings`,
# for the "slack" integration type in this version. Grafana still treats
# it as sensitive internally (redacted in API responses) despite the
# placement. $__file{} interpolation there is confirmed working too — a
# local test rule dispatched a real Slack-formatted POST to the exact
# URL resolved from the mounted secret file, verified via a network
# capture, not just a lack-of-crash inference.
alerting:
  contactpoints.yaml:
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: discord
        receivers:
          - uid: discord-webhook
            type: slack
            settings:
              recipient: "#alerts" # arbitrary, ignored by Discord's Slack-compat endpoint, required by the receiver's settings schema
              url: $__file{/etc/secrets/discord/webhook-url}
              # Override the stock Slack body (raw label dump + "Value: [no
              # value]") with the templates provisioned below.
              title: '{{ `{{ template "discord.title" . }}` }}'
              text: '{{ `{{ template "discord.message" . }}` }}'

      # Grafana-managed alerts never pass through Alertmanager, so the
      # `thot` receiver in values/prometheus/values.yaml does nothing for
      # them — every rule in this file (and every per-app rule the
      # sidecar loads) needs this second contact point to reach
      # agent-fleet's core, which turns a firing alert into a thot task
      # (agent-fleet docs/adr/0037). Same URL, same bearer token, same
      # handler as the Alertmanager receiver.
      #
      # Grafana's `webhook` type sends the Alertmanager webhook body
      # shape, including the per-alert `fingerprint` core uses as its
      # dedup key — VERIFIED 2026-08-12 by capturing a real delivery from
      # a local Grafana 12.3.1 (this chart's version) into a listener:
      # keys were status/labels/annotations/fingerprint/..., exactly what
      # core/internal/alertwebhook decodes. Without a fingerprint core
      # skips the alert with a warning, so a future Grafana dropping it
      # fails visibly rather than silently.
      #
      # authorization_credentials sits under plain `settings`, NOT
      # `secureSettings` — same placement trap the slack `url` comment
      # above describes, confirmed in the same capture: with it under
      # secureSettings the provisioned contact point came back with no
      # secure field at all and the request arrived with NO Authorization
      # header (core would answer 401 forever). Under `settings` the
      # $__file{} resolved and the header arrived as `Bearer <token>`;
      # Grafana still redacts it in API responses.
      - orgId: 1
        name: thot
        receivers:
          - uid: thot-webhook
            type: webhook
            settings:
              # agent-fleet-core, NOT core — common-app-chart prefixes
              # every Service with its release name (see the identical
              # note on the Alertmanager receiver).
              url: http://agent-fleet-core.agent-fleet.svc.cluster.local:8080/webhook/alertmanager
              httpMethod: POST
              authorization_scheme: Bearer
              authorization_credentials: $__file{/etc/secrets/thot/token}

  # Notification templates. Same Helm `tpl` problem as the rule annotations
  # below, but a 15-line Go template escaped brace-pair-by-brace-pair is
  # unreadable — so the WHOLE body sits inside one Helm raw string literal
  # ({{ `...` }}), which tpl emits verbatim. Cost of the trick: no backtick may
  # appear anywhere inside it (it would close the literal), hence **bold**
  # rather than Discord code fences.
  #
  # `.Values.B` on purpose, not `range .Values`: every rule here (this file's
  # gitops-log-alerts and everything common-app-chart's logAlerts renders) is
  # A -> B reduce -> C threshold, and ranging prints C's 0/1 threshold verdict
  # next to the real number. `.GeneratorURL` (short link to the rule) rather
  # than `.SilenceURL`, which is a 300-char matcher-encoded monster.
  templates.yaml:
    apiVersion: 1
    templates:
      - orgId: 1
        name: discord.message
        template: |
          {{ `{{ define "discord.title" }}{{ if eq .Status "firing" }}🔥 FIRING{{ else }}✅ RESOLVED{{ end }} · {{ .CommonLabels.alertname }}{{ end }}

          {{ define "discord.message" }}{{ range .Alerts }}**{{ .Annotations.summary }}**
          {{ if .Annotations.description }}{{ .Annotations.description }}
          {{ end }}{{ if .Values }}value: {{ .Values.B }}
          {{ end }}{{ range (.Labels.Remove (stringSlice "alertname" "grafana_folder" "datasource_uid" "ref_id")).SortedPairs }}{{ .Name }}: {{ .Value }}
          {{ end }}{{ if .Annotations.Error }}rule error: {{ .Annotations.Error }}
          {{ end }}{{ .GeneratorURL }}
          {{ end }}{{ end }}` }}

  # Fan-out, mirroring the Alertmanager route tree in
  # values/prometheus/values.yaml: critical/warning goes to both Discord
  # and thot, everything else to Discord alone.
  #
  # The trailing `- receiver: discord` child is load-bearing, exactly as
  # it is on the Alertmanager side: a matched child route does NOT fall
  # through to the parent's receiver, so without that sibling every
  # warning alert would reach thot and silently vanish from Discord.
  # VERIFIED 2026-08-12 against a local Grafana 12.3.1 with this exact
  # tree — one firing warning-level rule delivered to both receivers.
  #
  # Deliberately not `severity =~ .*`: a thot task spawns a pod running
  # an agent with cluster read access, so info-level rules stay a Discord
  # ping. Repeat deliveries of the same alert dedup on fingerprint in
  # core.
  policies.yaml:
    apiVersion: 1
    policies:
      - orgId: 1
        receiver: discord
        group_by: ["alertname"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - receiver: thot
            object_matchers:
              - ["severity", "=~", "critical|warning"]
            continue: true
          - receiver: discord

  rules.yaml:
    apiVersion: 1
    groups:
      - orgId: 1
        name: gitops-log-alerts
        folder: GitOps Alerts
        interval: 1m
        rules:
          - uid: log-error-rate-spike
            title: Log error-rate spike
            condition: C
            for: 5m
            noDataState: OK
            execErrState: Alerting
            labels:
              severity: warning
            annotations:
              # The chart's grafana.configData template runs the whole
              # `alerting:` values block through Helm's `tpl` (see
              # grafana/templates/_config.tpl) — confirmed live: it broke
              # ArgoCD's manifest generation with "undefined variable
              # $labels". Grafana's own alert-annotation templating
              # ({{ $labels.x }}, evaluated by Grafana at alert-fire time,
              # not by Helm at chart-render time) has to be escaped so
              # Helm's tpl pass emits it as literal text instead of trying
              # to resolve it as a Helm variable.
              summary: "Elevated error-level log rate: {{`{{`}} $labels.namespace {{`}}`}}/{{`{{`}} $labels.pod {{`}}`}}"
            data:
              - refId: A
                datasourceUid: ds-loki
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  queryType: range
                  # PR #144 (2026-08-16) switched this from a substring match
                  # to `| json | level >= 40`, assuming every app logs a
                  # numeric Pino-style level. It doesn't hold cluster-wide:
                  # zap/controller-runtime/Grafana's own json logs all emit a
                  # STRING level ("info"/"error"/...), so `| json` extracts a
                  # `level` field that `>= 40` then tries to strconv.ParseFloat
                  # and fails — Loki returns LabelFilterErr on nearly every
                  # series, every evaluation, cluster-wide (confirmed live in
                  # platform-grafana's own ngalert scheduler log:
                  # "Failed to evaluate rule" / rule_uid=log-error-rate-spike).
                  # With execErrState: Alerting, the errored-out rule fires
                  # anyway but with no labels to fill $labels.namespace/pod —
                  # that's the literal "[no value]/[no value]" in the summary,
                  # not a real error-rate spike.
                  #
                  # `detected_level` is Loki's own query-time heuristic
                  # (computed per line, not an indexed label — see
                  # docs/bootstrap-test-notes.md's "Follow-up (PR #57)" note)
                  # and is already proven against this cluster's actual mix of
                  # JSON, logfmt, and plain-text logs (Gin access logs, zerolog
                  # console output, custom HTTP loggers, plain Node output) —
                  # exactly the unstructured-logs case PR #144 explicitly
                  # skipped. No `| json` parse means no parse-time errors on
                  # non-JSON or string-level lines.
                  expr: 'sum by (namespace, pod) (rate({namespace=~".+"} | detected_level=~"error|critical" [5m]))'
                  intervalMs: 60000
                  maxDataPoints: 43200
              # A Threshold expression fed directly by a range query (A has
              # multiple points over the 5m window) errored at evaluation
              # time: "frame cannot uniquely be identified by its labels:
              # has duplicate results with labels {}" — Threshold needs one
              # value per series, not a time series. Reduce collapses each
              # series down to its last point first, which is what actually
              # carries the namespace/pod labels into C.
              - refId: B
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        # ~1 error/critical line (detected_level) every 2s
                        # sustained over the 5m window — starting point, not
                        # tuned per-app; refine once real log volume is visible.
                        params: [0.5]

# Dashboards as code: the chart's own file-provisioning (no sidecar
# container, no extra RBAC needed) — for a platform-wide dashboard, add a
# JSON blob under the `gitops` key below and it's live on the next values
# sync, no manual import. `editable: false` keeps them locked from UI
# edits so this stays the source of truth. For a per-app dashboard, use
# common-app-chart's `dashboards:` values block instead (renders a
# ConfigMap picked up by `sidecar.dashboards` above) — see
# gitops/README.md's dashboards note for which mechanism to use.
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: gitops
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: false
      options:
        path: /var/lib/grafana/dashboards/gitops

dashboards:
  gitops:
    cluster-health:
      json: |
        {
          "title": "Cluster Health (GitOps Example)",
          "uid": "gitops-cluster-health",
          "tags": ["gitops"],
          "timezone": "browser",
          "schemaVersion": 39,
          "version": 1,
          "refresh": "30s",
          "time": { "from": "now-6h", "to": "now" },
          "panels": [
            {
              "id": 1,
              "type": "stat",
              "title": "Targets Up",
              "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
              "targets": [
                { "expr": "count(up == 1)", "refId": "A" }
              ]
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "Scrape Targets Up",
              "gridPos": { "h": 10, "w": 18, "x": 6, "y": 0 },
              "targets": [
                { "expr": "up", "legendFormat": "{{job}}/{{instance}}", "refId": "A" }
              ]
            }
          ]
        }

    pgsql-overview:
      json: |
        {
          "annotations":{"list":[{"builtIn":1,"datasource":{"type":"grafana","uid":"grafana"},"enable":true,"hide":true,"iconColor":"rgba(0, 211, 255, 1)","name":"Annotations & Alerts","target":{"limit":100,"matchAny":false,"tags":[],"type":"dashboard"},"type":"dashboard"}]},
          "description":"PostgreSQL Monitoring HQ",
          "editable":true,
          "fiscalYearStartMonth":0,
          "graphTooltip":0,
          "id":null,
          "links":[
            { "asDropdown":true,"icon":"external link","includeVars":true,"keepTime":true,"tags":["Pigsty","PGSQL","Overview"],"targetBlank":false,"title":"Overview","tooltip":"","type":"dashboards","url":"" },{ "asDropdown":true,"icon":"external link","includeVars":true,"keepTime":true,"tags":["Pigsty","PGSQL","Cluster"] ,"targetBlank":false,"title":"Cluster" ,"tooltip":"","type":"dashboards","url":"" },
            { "asDropdown":true,"icon":"external link","includeVars":true,"keepTime":true,"tags":["Pigsty","PGSQL","Instance"],"targetBlank":false,"title":"Instance","tooltip":"","type":"dashboards","url":"" },{ "asDropdown":true,"icon":"external link","includeVars":true,"keepTime":true,"tags":["Pigsty","PGSQL","Database"],"targetBlank":false,"title":"Database","tooltip":"","type":"dashboards","url":"" }
          ],
          "liveNow":false,
          "panels":[
            {"collapsed":false,"gridPos":{"h":1,"w":24,"x":0,"y":0},"id":147,"title":"Overview","type":"row"},
            {
              "datasource":{"type":"prometheus","uid":"ds-prometheus"},
              "fieldConfig":{"defaults":{"color":{"mode":"thresholds"},"links":[{"title":"Node Overview","url":"http://postgres-1.bnei.lan/ui/d/node-overview?${__url_time_range}"}],"thresholds":{"mode":"absolute","steps":[{"color":"#3e668f","value":0}]}}},
              "gridPos":{"h":3,"w":8,"x":0,"y":1},
              "id":99,
              "options":{"colorMode":"background","graphMode":"none","justifyMode":"center","orientation":"auto","percentChangeColorMode":"standard","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"showPercentChange":false,"text":{},"textMode":"name","wideLayout":true},
              "pluginVersion":"13.0.0",
              "targets":[{"datasource":{"type":"prometheus","uid":"ds-prometheus"},"exemplar":false,"expr":"1","format":"table","instant":true,"interval":"","legendFormat":"","queryType":"measurements","refId":"A"}],
              "title":"",
              "transformations":[{"id":"organize","options":{"excludeByName":{"Time":true},"indexByName":{},"renameByName":{"Time":"","Value":"${job}"}}}],
              "type":"stat"
            },
            {
              "datasource":{"type":"prometheus","uid":"ds-prometheus"},
              "fieldConfig":{
                "defaults":{"color":{"mode":"thresholds"},"max":2.5,"min":0,"thresholds":{"mode":"absolute","steps":[{"color":"#3e668f","value":0}]}},
