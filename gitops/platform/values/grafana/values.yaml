# Grafana Helm values for ukubi-cluster
# Chart: https://grafana.github.io/helm-charts  name: grafana
#
# Migrated from k8s-cluster/grafana/values.yml — trim to essentials.

persistence:
  enabled: true
  size: 5Gi

# Admin credentials from K8s Secret (created via InfisicalSecret CR, see
# gitops/bootstrap/grafana-admin-secret.yaml)
admin:
  existingSecret: grafana-admin
  userKey: username
  passwordKey: password

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      # kube-prometheus-stack's chart fullname truncates to
      # "platform-prometheus-kube-p-*" for this release name — not the
      # "prometheus-kube-prometheus-prometheus" you'd guess from the chart
      # name. Confirmed live: `kubectl get svc -n monitoring`. Same class
      # of naming mismatch as grafana-ingressroute.yaml/infisical-
      # ingressroute.yaml — always check the real Service name.
      url: http://platform-prometheus-kube-p-prometheus.monitoring.svc.cluster.local:9090
      isDefault: true

    # Pigsty's own metrics backend (pg01, 192.168.1.205) — actually
    # VictoriaMetrics (v2.24.0), not classic Prometheus, but it implements
    # the same HTTP API so Grafana's "prometheus" datasource type works
    # against it unchanged. Reached via Pigsty's nginx portal on :80
    # (confirmed live: no vhost/Host-header routing is actually configured
    # beyond the "home" catch-all, so any Host header lands on the same
    # backend — /vmetrics is the only path that matters). Direct LAN
    # IP:port, same pattern as longhorn-backup-secret.yaml's S3 endpoint —
    # no ingress/DNS exists for this yet.
    - name: Pigsty (VictoriaMetrics)
      type: prometheus
      url: http://192.168.1.205/vmetrics
      isDefault: false

# IngressRoute: gitops/bootstrap/grafana-ingressroute.yaml (Traefik
# IngressRoute, ADR-0001 — not Gateway API/HTTPRoute).
grafana.ini:
  server:
    root_url: https://grafana.bnei.dev

# Dashboards as code: the chart's own file-provisioning (no sidecar
# container, no extra RBAC needed) — add a JSON dashboard under the
# `gitops` key below and it's live on the next values sync, no manual
# import. `editable: false` keeps them locked from UI edits so this
# stays the source of truth (see gitops/README.md's dashboards note).
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
    - name: gitops
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      editable: false
      options:
        path: /var/lib/grafana/dashboards/gitops

dashboards:
  gitops:
    cluster-health:
      json: |
        {
          "title": "Cluster Health (GitOps Example)",
          "uid": "gitops-cluster-health",
          "tags": ["gitops"],
          "timezone": "browser",
          "schemaVersion": 39,
          "version": 1,
          "refresh": "30s",
          "time": { "from": "now-6h", "to": "now" },
          "panels": [
            {
              "id": 1,
              "type": "stat",
              "title": "Targets Up",
              "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
              "targets": [
                { "expr": "count(up == 1)", "refId": "A" }
              ]
            },
            {
              "id": 2,
              "type": "timeseries",
              "title": "Scrape Targets Up",
              "gridPos": { "h": 10, "w": 18, "x": 6, "y": 0 },
              "targets": [
                { "expr": "up", "legendFormat": "{{job}}/{{instance}}", "refId": "A" }
              ]
            }
          ]
        }
