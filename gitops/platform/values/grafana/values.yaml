    # Hand-rolled, deliberately small — kube-state-metrics/node-exporter/
    # cAdvisor are already scraped by kube-prometheus-stack, no extra
    # exporters needed. Panels use no "datasource" field so they fall back
    # to the default datasource (Prometheus, see datasources.yaml above).
    k8s-cluster-overview:
      json: |
        {
          "title": "Kubernetes Cluster Overview",
          "uid": "k8s-cluster-overview",
          "tags": ["gitops", "kubernetes"],
          "timezone": "browser",
          "schemaVersion": 39,
          "version": 1,
          "refresh": "30s",
          "time": { "from": "now-6h", "to": "now" },
          "panels": [
            { "id": 1, "type": "stat", "title": "Nodes Ready", "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
              "targets": [{ "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "refId": "A" }] },
            { "id": 2, "type": "stat", "title": "Nodes Total", "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
              "targets": [{ "expr": "count(kube_node_info)", "refId": "A" }] },
            { "id": 3, "type": "stat", "title": "Pods Running", "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
              "targets": [{ "expr": "sum(kube_pod_status_phase{phase=\"Running\"})", "refId": "A" }] },
            { "id": 4, "type": "stat", "title": "Pods Not Ready", "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
              "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 1 }] } } },
              "targets": [{ "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"})", "refId": "A" }] },
            { "id": 5, "type": "stat", "title": "Pod Restarts (1h)", "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
              "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "orange", "value": 1 }, { "color": "red", "value": 10 }] } } },
              "targets": [{ "expr": "sum(increase(kube_pod_container_status_restarts_total[1h]))", "refId": "A" }] },
            { "id": 6, "type": "stat", "title": "Deployments Degraded", "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
              "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 1 }] } } },
              "targets": [{ "expr": "count(kube_deployment_status_replicas_available < kube_deployment_spec_replicas) or on() vector(0)", "refId": "A" }] },
            { "id": 7, "type": "timeseries", "title": "CPU Usage by Node", "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
              "targets": [{ "expr": "sum by (instance) (rate(node_cpu_seconds_total{mode!=\"idle\"}[5m]))", "legendFormat": "{{instance}}", "refId": "A" }] },
            { "id": 8, "type": "timeseries", "title": "Memory Used by Node", "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
              "fieldConfig": { "defaults": { "unit": "bytes" } },
              "targets": [{ "expr": "node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes", "legendFormat": "{{instance}}", "refId": "A" }] },
            { "id": 9, "type": "timeseries", "title": "Filesystem Usage (root)", "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
              "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "min": 0 } },
              "targets": [{ "expr": "1 - (node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"})", "legendFormat": "{{instance}}", "refId": "A" }] },
            { "id": 10, "type": "timeseries", "title": "Pod Restarts by Namespace", "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
              "targets": [{ "expr": "sum by (namespace) (increase(kube_pod_container_status_restarts_total[1h]))", "legendFormat": "{{namespace}}", "refId": "A" }] }
          ]
        }

    # Needs argocd-application.yaml's controller/server metrics+serviceMonitor
    # enabled and prometheus/values.yaml's cluster-wide ServiceMonitor
    # discovery — both added alongside this dashboard.
    argocd-overview:
      json: |
        {
          "title": "ArgoCD Overview",
          "uid": "argocd-overview",
          "tags": ["gitops", "argocd"],
          "timezone": "browser",
          "schemaVersion": 39,
          "version": 1,
          "refresh": "30s",
          "time": { "from": "now-6h", "to": "now" },
          "panels": [
            { "id": 1, "type": "stat", "title": "Applications", "gridPos": { "h": 4, "w": 4, "x": 0, "y": 0 },
              "targets": [{ "expr": "count(argocd_app_info)", "refId": "A" }] },
            { "id": 2, "type": "stat", "title": "Healthy", "gridPos": { "h": 4, "w": 4, "x": 4, "y": 0 },
              "targets": [{ "expr": "sum(argocd_app_info{health_status=\"Healthy\"}) or on() vector(0)", "refId": "A" }] },
            { "id": 3, "type": "stat", "title": "Degraded", "gridPos": { "h": 4, "w": 4, "x": 8, "y": 0 },
              "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 1 }] } } },
              "targets": [{ "expr": "sum(argocd_app_info{health_status=\"Degraded\"}) or on() vector(0)", "refId": "A" }] },
            { "id": 4, "type": "stat", "title": "Synced", "gridPos": { "h": 4, "w": 4, "x": 12, "y": 0 },
              "targets": [{ "expr": "sum(argocd_app_info{sync_status=\"Synced\"}) or on() vector(0)", "refId": "A" }] },
            { "id": 5, "type": "stat", "title": "OutOfSync", "gridPos": { "h": 4, "w": 4, "x": 16, "y": 0 },
              "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "orange", "value": 1 }] } } },
              "targets": [{ "expr": "sum(argocd_app_info{sync_status=\"OutOfSync\"}) or on() vector(0)", "refId": "A" }] },
            { "id": 6, "type": "stat", "title": "Cluster Connections Down", "gridPos": { "h": 4, "w": 4, "x": 20, "y": 0 },
              "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 1 }] } } },
              "targets": [{ "expr": "count(argocd_cluster_connection_status == 0) or on() vector(0)", "refId": "A" }] },
            { "id": 7, "type": "timeseries", "title": "Sync Operations by Phase", "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
              "targets": [{ "expr": "sum by (phase) (rate(argocd_app_sync_total[5m]))", "legendFormat": "{{phase}}", "refId": "A" }] },
            { "id": 8, "type": "table", "title": "Apps Not Healthy or Not Synced", "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
              "targets": [{ "expr": "argocd_app_info{health_status!=\"Healthy\"} or argocd_app_info{sync_status!=\"Synced\"}", "format": "table", "instant": true, "refId": "A" }],
              "transformations": [{ "id": "organize", "options": { "excludeByName": { "Time": true, "Value": true } } }] }
          ]
        }

    app-logs:
      json: |
        {
          "title": "App Logs",
          "uid": "gitops-app-logs",
          "tags": ["gitops", "logs"],
          "timezone": "browser",
          "schemaVersion": 39,
          "version": 1,
          "refresh": "30s",
          "time": { "from": "now-1h", "to": "now" },
          "templating": {
            "list": [
              {
                "name": "namespace",
                "label": "Namespace",
                "type": "query",
                "datasource": { "type": "loki", "uid": "ds-loki" },
                "query": "label_values(namespace)",
                "refresh": 2,
                "multi": true,
                "includeAll": true,
                "allValue": ".+",
                "current": { "text": "All", "value": "$__all" }
              },
              {
                "name": "level",
                "label": "Level",
                "type": "custom",
                "query": "critical,error,warn,info,debug,trace,unknown",
                "multi": true,
                "includeAll": true,
                "allValue": ".+",
                "current": { "text": "All", "value": "$__all" }
              },
              {
                "name": "search",
                "label": "Search (regex)",
                "type": "textbox",
                "query": ".*",
                "current": { "text": ".*", "value": ".*" }
              }
            ]
          },
          "panels": [
            {
              "id": 1,
              "type": "timeseries",
              "title": "Log Volume by Level",
              "gridPos": { "h": 7, "w": 24, "x": 0, "y": 0 },
              "datasource": { "type": "loki", "uid": "ds-loki" },
              "fieldConfig": {
                "defaults": {
                  "custom": { "drawStyle": "bars", "fillOpacity": 60, "stacking": { "mode": "normal" } }
                },
                "overrides": []
              },
              "targets": [
                {
                  "datasource": { "type": "loki", "uid": "ds-loki" },
                  "expr": "sum by (detected_level) (count_over_time({namespace=~\"$namespace\"} | detected_level=~\"$level\" [$__auto]))",
                  "legendFormat": "{{detected_level}}",
                  "refId": "A"
                }
              ]
            },
            {
              "id": 2,
              "type": "logs",
              "title": "App Logs",
              "gridPos": { "h": 18, "w": 24, "x": 0, "y": 7 },
              "datasource": { "type": "loki", "uid": "ds-loki" },
              "options": {
                "showTime": true,
                "showLabels": true,
                "wrapLogMessage": true,
                "prettifyLogMessage": true,
                "enableLogDetails": true,
                "sortOrder": "Descending",
                "showControls": true,
                "controlsStorageKey": "app-logs-panel-controls",
                "displayedFields": ["app", "___LOG_LINE_BODY___"]
              },
              "targets": [
                {
                  "datasource": { "type": "loki", "uid": "ds-loki" },
                  "expr": "{namespace=~\"$namespace\"} | detected_level=~\"$level\" |~ `(?i)$search`",
                  "refId": "A"
                }
              ]
            }
          ]
        }
