# Traefik Helm values for ukubi-cluster
# Chart: https://traefik.github.io/charts  name: traefik
#
# Key requirements (ADR-0001, docs/adr/0001-ingress-traefik-ingressroute-over-gateway-api.md):
#   - Listeners on port 80 (web) and 443 (websecure)
#   - ACME cert resolver (TLS-ALPN-01, port 443 only — see below),
#     acme.json on PVC (never emptyDir)
#   - Second resolver `le-dns` (DNS-01 via Cloudflare, ADR-0033) for the
#     *.e2e.bnei.dev wildcard only — every other host stays on `le`
#   - Per-app routing via Traefik IngressRoute, not Gateway API — Traefik's
#     ACME resolver can't issue certs for Gateway API listeners without
#     cert-manager as a Secret bridge (banned), so IngressRoute is the lock.
#   - MetalLB VIP: 192.168.1.233 (annotation, pinned) — pool is
#     192.168.1.233-250; .230-.232 excluded (.232 is Pigsty's HA VIP)
#   - kube-proxy retained (cilium chaining mode — do NOT enable kube-proxy replacement)

service:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.1.233
  # ADR-0038. Without this the Service takes Kubernetes' default `Cluster`
  # policy, kube-proxy SNATs every inbound request to a node IP, and Traefik
  # sees 192.168.1.20x as the client for ALL external traffic. That silently
  # breaks anything IP-based: the Cloudflare origin allowlist, rate-limit
  # bucketing, the LAN `ClientIP()` break-glass route in ADR-0039, and any
  # forensic value the access logs below would otherwise have.
  #
  # COST, stated plainly because it is real: MetalLB's L2 speaker only
  # announces the VIP from a node that holds a READY LOCAL endpoint. Traefik
  # runs replicas:1 with updateStrategy Recreate (mandatory — the acme.json
  # PVC is RWO and ADR-0001 forbids concurrent ACME writers), so during any
  # rollout there are zero endpoints and NOTHING answers ARP for .233. That
  # is a blackhole, not a drain: clients get SYN timeouts rather than a
  # refused connection, and the window is bounded by Longhorn detach/attach,
  # not by pod start. Consequences:
  #   - Traefik values changes are deliberate maintenance, not routine.
  #   - Draining the node running Traefik (i.e. every kubespray run) is an
  #     ingress outage of the same shape.
  # Adding replicas is NOT the fix — two pods would both mount acme.json.
  spec:
    externalTrafficPolicy: Local

logs:
  general:
    format: json
  # ADR-0038. There was no record whatsoever of who reached what from the
  # internet before this — no forensics after the fact, and nothing for a
  # detection rule to read. Alloy already tails /var/log/pods on every node,
  # so these land in Loki under {namespace="traefik"} with no collector
  # change; ADR-0040's 401/403-spike rule reads them from there.
  #
  # Only useful once externalTrafficPolicy above is Local — otherwise every
  # line records a node IP as the client.
  access:
    enabled: true
    format: json

# Chart's default podSecurityContext (runAsUser/runAsGroup: 65532) has no
# fsGroup, so the acme.json PVC mounts root:root/0755 — Traefik can't
# create the file at all ("permission denied"), which permanently disables
# the ACME resolver for that pod's lifetime (confirmed via logs: "The ACME
# resolve is skipped from the resolvers list"). fsGroup makes the CSI
# driver chown the volume to this GID on mount.
#
# fsGroupChangePolicy: OnRootMismatch avoids a second bug this uncovered —
# Kubernetes' default "Always" policy recursively resets every file's mode
# to add group read/write on EVERY pod (re)start, which stomps acme.json
# back to 660. lego (Traefik's ACME lib) requires exactly 600 and disables
# the resolver if it isn't ("permissions 660 ... too open, please use
# 600"). OnRootMismatch skips the recursive reset once the directory's
# group ownership already matches, so Traefik's own 0600 file creation
# isn't overwritten on subsequent restarts.
podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch

ports:
  # Don't override `port:` here — that's the container's own listen port,
  # and the chart's default securityContext runs as non-root (UID 65532,
  # capabilities dropped, no NET_BIND_SERVICE) so binding <1024 fails with
  # "permission denied". Chart defaults already give us what we want: web
  # listens on 8000 internally, exposed externally as 80 (exposedPort);
  # websecure listens on 8443 internally, exposed externally as 443.
  web:
    # The Freebox forwards :80 but no router matches it, so plain-HTTP
    # requests currently 404 instead of redirecting. ADR-0038.
    #
    # Note this entrypoint stays OUTSIDE the origin allowlist, which attaches
    # to websecure only — :80 remains world-reachable. It serves nothing but
    # this redirect, so that is acceptable, but it is not filtered.
    redirections:
      entryPoint:
        to: websecure
        scheme: https
        permanent: true
  websecure:
    # Entrypoint-level ACME wiring — every IngressRoute router using this
    # entrypoint gets the "le" cert resolver automatically.
    tls:
      enabled: true
      certResolver: le

providers:
  kubernetesGateway:
    enabled: false
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
    # Off by default in Traefik itself (SSRF guardrail — an ExternalName
    # Service is attacker-redirectable DNS-based routing). Needed for
    # gitops/redirectors/*.yaml's ExternalName-based out-of-cluster
    # backends (see gitops/README.md); every ExternalName Service still
    # only comes from a PR-reviewed manifest in this repo, not user input.
    allowExternalNameServices: true
  kubernetesIngress:
    enabled: false

# acme.json must be on a PVC, never emptyDir (ADR-0001)
persistence:
  enabled: true
  name: data
  accessMode: ReadWriteOnce
  size: 128Mi
  path: /data

# Recreate, NOT the chart's default RollingUpdate — mandatory with the RWO
# PVC above. Found live: any values change here rolled a new pod that sat in
# ContainerCreating forever with "Multi-Attach error for volume ... Volume is
# already used by pod(s) ...", because maxSurge:1 starts the replacement
# before retiring the old pod and the two landed on different nodes. A
# ReadWriteOnce volume attaches to one node only, so the rollout deadlocks
# permanently. The old pod keeps serving throughout, so this presents as "my
# config change silently did nothing", not as an outage — which is exactly
# why it went unnoticed until the le-dns resolver failed to appear.
#
# ADR-0001's "PVC must be RWX, or replicas: 1" is necessary but NOT
# sufficient: replicas:1 still deadlocks under RollingUpdate, because surge
# creates a transient second pod. Switching the PVC to RWX would be worse —
# both pods would briefly mount acme.json, giving ACME two concurrent
# writers, the exact corruption ADR-0001's PVC rule exists to prevent.
# Recreate trades a few seconds of ingress downtime per Traefik rollout for
# cert-store integrity.
#
# rollingUpdate must be explicitly nulled: Helm merges the chart's default
# sub-keys otherwise, and the API rejects a Deployment carrying
# rollingUpdate alongside type: Recreate.
updateStrategy:
  type: Recreate
  rollingUpdate: null

# chart >=33.0.0 renamed this key from certResolvers and nested config under .acme
#
# `le` is DNS-01 via Cloudflare as of ADR-0038. It was TLS-ALPN-01 until then,
# for the reason kept below; that reason is now moot, because the blocker is no
# longer port 80 but port 443.
#
# WHY IT CHANGED: Cloudflare's proxy terminates TLS at its edge, so an
# ACME TLS-ALPN-01 challenge on 443 is answered by Cloudflare, never by Traefik.
# Any proxied host stops renewing — silently, and only visibly ~90 days later
# when the cert actually expires. DNS-01 validates over a TXT record instead and
# is indifferent to who terminates 443, so it is the prerequisite for proxying
# anything (ADR-0038 Decision 2).
#
# WHAT DELIBERATELY DID NOT CHANGE: the resolver is still named `le` and still
# stores at /data/acme.json. acme.json is keyed by resolver name and records no
# challenge type, so the existing ACME account and every issued cert are reused
# as-is — nothing re-issues on startup, no IngressRoute anywhere needs editing,
# and renewal at T-30d simply uses the new challenge. Renaming the resolver
# would orphan every cert in that file.
#
# The 1.1.1.1/8.8.8.8 resolvers are NOT optional: lego's propagation check must
# not go through the pod resolver, which forwards to Pi-hole first, and Pi-hole
# is authoritative for bnei.lan with no business answering for bnei.dev.
#
# The token behind CF_DNS_API_TOKEN must carry Zone→Zone→Read AND Zone→DNS→Edit
# on BOTH bnei.dev and voconsteroid.com — the latter also renews through `le`.
# Read-only is not enough: lego creates and then deletes the _acme-challenge
# record, and a read-only token fails at renewal, which is invisible until
# expiry. Verified working on both zones 2026-08-18.
#
# HISTORICAL, kept because it explains why HTTP-01 is not the fallback:
# tlsChallenge was chosen over httpChallenge after the Freebox cutover, when
# Let's Encrypt's external HTTP-01 requests on port 80 got a 404 that never
# reached Traefik's own ACME handler (confirmed via logs — an equivalent
# internal test against the same handler logged "Cannot retrieve the ACME
# challenge", but nothing equivalent ever appeared for the real external
# attempts), while 443 was already proven end-to-end. Root cause on the port-80
# path was never pinned down (suspected transparent ISP proxy mangling port 80).
# So if DNS-01 ever needs backing out, TLS-ALPN-01 is the fallback, not HTTP-01
# — and backing out means un-proxying every record first.
#
# Still Traefik's own built-in ACME (lego, Cloudflare is a native provider, no
# plugin to install or maintain). cert-manager remains banned — ADR-0001.
certificatesResolvers:
  le:
    acme:
      email: account@bnei.dev
      storage: /data/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
        - "1.1.1.1:53"
        - "8.8.8.8:53"
  # Second resolver, DNS-01 via Cloudflare — ADR-0033. Exists solely to issue
  # the *.e2e.bnei.dev wildcard that agent-fleet's per-task preview subdomains
  # ride on. TLS-ALPN-01 (and HTTP-01) physically cannot issue a wildcard; only
  # DNS-01 can, which is why ADR-0001's DNS-01 rejection got a narrow carve-out
  # once bnei.dev moved to Cloudflare. This is still Traefik's own built-in ACME
  # (lego, Cloudflare is a native provider — there is no plugin to install or
  # maintain, contrary to ADR-0001's premise); cert-manager remains banned.
  #
  # NOTE (ADR-0038, 2026-08-18): `le` above is no longer TLS-ALPN-01 — it is
  # DNS-01 too, so both resolvers now share a provider and a token and are one
  # failure domain. ADR-0033 split them precisely so a DNS-01 failure could not
  # take down the resolver serving every other host; that separation now buys
  # two files and nothing else. Kept rather than collapsed because merging them
  # is a second cert migration, not because the rationale still holds. A revoked
  # or expired CF_DNS_API_TOKEN now stops renewal for every host in both zones,
  # which is why ADR-0040 adds an expiry alert on traefik_tls_certs_not_after.
  #
  # `le` still took three chained bugs to get working originally
  # (docs/bootstrap-test-notes.md, 2026-07-28); changing the challenge type does
  # not re-issue anything, since acme.json is keyed by resolver name.
  le-dns:
    acme:
      email: account@bnei.dev
      # Separate storage file on purpose — a corrupt or lock-contended
      # acme-dns.json can then never take down the resolver serving every
      # other host. Same PVC, so the fsGroup/fsGroupChangePolicy handling
      # above already covers it; Traefik creates the file itself at 0600.
      storage: /data/acme-dns.json
      dnsChallenge:
        provider: cloudflare
        # lego's propagation check must NOT go through the pod resolver:
        # CoreDNS/nodelocaldns forwards to Pi-hole first (policy: sequential,
        # ARCHITECTURE.md §3), which is authoritative for bnei.lan and has no
        # business answering for bnei.dev. Ask public resolvers instead.
        resolvers:
        - "1.1.1.1:53"
        - "8.8.8.8:53"

# CF_DNS_API_TOKEN is what lego's cloudflare provider reads. Sourced from
# Infisical via gitops/bootstrap/traefik-cloudflare-secret.yaml, which
# materialises the `traefik-cloudflare-dns` Secret into this namespace.
env:
- name: CF_DNS_API_TOKEN
  valueFrom:
    secretKeyRef:
      name: traefik-cloudflare-dns
      key: token

# Dashboard via IngressRoute is disabled — expose via IngressRoute if needed
ingressRoute:
  dashboard:
    enabled: false
