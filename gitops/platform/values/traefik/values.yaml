# Traefik Helm values for ukubi-cluster
# Chart: https://traefik.github.io/charts  name: traefik
#
# Key requirements (ADR-0001, docs/adr/0001-ingress-traefik-ingressroute-over-gateway-api.md):
#   - Listeners on port 80 (web) and 443 (websecure)
#   - ACME cert resolver (TLS-ALPN-01, port 443 only — see below),
#     acme.json on PVC (never emptyDir)
#   - Second resolver `le-dns` (DNS-01 via Cloudflare, ADR-0033) for the
#     *.e2e.bnei.dev wildcard only — every other host stays on `le`
#   - Per-app routing via Traefik IngressRoute, not Gateway API — Traefik's
#     ACME resolver can't issue certs for Gateway API listeners without
#     cert-manager as a Secret bridge (banned), so IngressRoute is the lock.
#   - MetalLB VIP: 192.168.1.233 (annotation, pinned) — pool is
#     192.168.1.233-250; .230-.232 excluded (.232 is Pigsty's HA VIP)
#   - kube-proxy retained (cilium chaining mode — do NOT enable kube-proxy replacement)

service:
  type: LoadBalancer
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.1.233

logs:
  general:
    format: json

# Chart's default podSecurityContext (runAsUser/runAsGroup: 65532) has no
# fsGroup, so the acme.json PVC mounts root:root/0755 — Traefik can't
# create the file at all ("permission denied"), which permanently disables
# the ACME resolver for that pod's lifetime (confirmed via logs: "The ACME
# resolve is skipped from the resolvers list"). fsGroup makes the CSI
# driver chown the volume to this GID on mount.
#
# fsGroupChangePolicy: OnRootMismatch avoids a second bug this uncovered —
# Kubernetes' default "Always" policy recursively resets every file's mode
# to add group read/write on EVERY pod (re)start, which stomps acme.json
# back to 660. lego (Traefik's ACME lib) requires exactly 600 and disables
# the resolver if it isn't ("permissions 660 ... too open, please use
# 600"). OnRootMismatch skips the recursive reset once the directory's
# group ownership already matches, so Traefik's own 0600 file creation
# isn't overwritten on subsequent restarts.
podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch

ports:
  # Don't override `port:` here — that's the container's own listen port,
  # and the chart's default securityContext runs as non-root (UID 65532,
  # capabilities dropped, no NET_BIND_SERVICE) so binding <1024 fails with
  # "permission denied". Chart defaults already give us what we want: web
  # listens on 8000 internally, exposed externally as 80 (exposedPort);
  # websecure listens on 8443 internally, exposed externally as 443.
  websecure:
    # Entrypoint-level ACME wiring — every IngressRoute router using this
    # entrypoint gets the "le" cert resolver automatically.
    tls:
      enabled: true
      certResolver: le

providers:
  kubernetesGateway:
    enabled: false
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
    # Off by default in Traefik itself (SSRF guardrail — an ExternalName
    # Service is attacker-redirectable DNS-based routing). Needed for
    # gitops/redirectors/*.yaml's ExternalName-based out-of-cluster
    # backends (see gitops/README.md); every ExternalName Service still
    # only comes from a PR-reviewed manifest in this repo, not user input.
    allowExternalNameServices: true
  kubernetesIngress:
    enabled: false

# acme.json must be on a PVC, never emptyDir (ADR-0001)
persistence:
  enabled: true
  name: data
  accessMode: ReadWriteOnce
  size: 128Mi
  path: /data

# Recreate, NOT the chart's default RollingUpdate — mandatory with the RWO
# PVC above. Found live: any values change here rolled a new pod that sat in
# ContainerCreating forever with "Multi-Attach error for volume ... Volume is
# already used by pod(s) ...", because maxSurge:1 starts the replacement
# before retiring the old pod and the two landed on different nodes. A
# ReadWriteOnce volume attaches to one node only, so the rollout deadlocks
# permanently. The old pod keeps serving throughout, so this presents as "my
# config change silently did nothing", not as an outage — which is exactly
# why it went unnoticed until the le-dns resolver failed to appear.
#
# ADR-0001's "PVC must be RWX, or replicas: 1" is necessary but NOT
# sufficient: replicas:1 still deadlocks under RollingUpdate, because surge
# creates a transient second pod. Switching the PVC to RWX would be worse —
# both pods would briefly mount acme.json, giving ACME two concurrent
# writers, the exact corruption ADR-0001's PVC rule exists to prevent.
# Recreate trades a few seconds of ingress downtime per Traefik rollout for
# cert-store integrity.
#
# rollingUpdate must be explicitly nulled: Helm merges the chart's default
# sub-keys otherwise, and the API rejects a Deployment carrying
# rollingUpdate alongside type: Recreate.
updateStrategy:
  type: Recreate
  rollingUpdate: null

# chart >=33.0.0 renamed this key from certResolvers and nested config under .acme
#
# Using tlsChallenge (TLS-ALPN-01, validated over port 443 only) instead of
# httpChallenge (HTTP-01, port 80). Real-world debugging after the Freebox
# cutover found that Let's Encrypt's external HTTP-01 validation requests
# on port 80 got a 404 that never reached Traefik's own ACME handler code
# path (confirmed via logs — an equivalent internal test against the same
# handler logged "Cannot retrieve the ACME challenge", but nothing
# equivalent ever appeared for the real external attempts), while port 443
# was already confirmed working end-to-end externally. Root cause on the
# port-80 path was never pinned down (suspected transparent ISP proxy/cache
# mangling port 80) — tlsChallenge sidesteps it entirely. Still Traefik's
# built-in ACME, no change to the cert-manager/DNS-01 rejection in ADR-0001.
certificatesResolvers:
  le:
    acme:
      email: account@bnei.dev
      storage: /data/acme.json
      tlsChallenge: true
  # Second resolver, DNS-01 via Cloudflare — ADR-0033. Exists solely to issue
  # the *.e2e.bnei.dev wildcard that agent-fleet's per-task preview subdomains
  # ride on. TLS-ALPN-01 (and HTTP-01) physically cannot issue a wildcard; only
  # DNS-01 can, which is why ADR-0001's DNS-01 rejection got a narrow carve-out
  # once bnei.dev moved to Cloudflare. This is still Traefik's own built-in ACME
  # (lego, Cloudflare is a native provider — there is no plugin to install or
  # maintain, contrary to ADR-0001's premise); cert-manager remains banned.
  #
  # `le` above is deliberately untouched: it took three chained bugs to get
  # working (docs/bootstrap-test-notes.md, 2026-07-28) and every existing
  # *.bnei.dev host still renews through it. Nothing here re-issues those.
  le-dns:
    acme:
      email: account@bnei.dev
      # Separate storage file on purpose — a corrupt or lock-contended
      # acme-dns.json can then never take down the resolver serving every
      # other host. Same PVC, so the fsGroup/fsGroupChangePolicy handling
      # above already covers it; Traefik creates the file itself at 0600.
      storage: /data/acme-dns.json
      dnsChallenge:
        provider: cloudflare
        # lego's propagation check must NOT go through the pod resolver:
        # CoreDNS/nodelocaldns forwards to Pi-hole first (policy: sequential,
        # ARCHITECTURE.md §3), which is authoritative for bnei.lan and has no
        # business answering for bnei.dev. Ask public resolvers instead.
        resolvers:
        - "1.1.1.1:53"
        - "8.8.8.8:53"

# CF_DNS_API_TOKEN is what lego's cloudflare provider reads. Sourced from
# Infisical via gitops/bootstrap/traefik-cloudflare-secret.yaml, which
# materialises the `traefik-cloudflare-dns` Secret into this namespace.
env:
- name: CF_DNS_API_TOKEN
  valueFrom:
    secretKeyRef:
      name: traefik-cloudflare-dns
      key: token

# Dashboard via IngressRoute is disabled — expose via IngressRoute if needed
ingressRoute:
  dashboard:
    enabled: false
