# ente-web — Ente's Photos web app (public image, no app-specific code).
# Auth/Cast apps in the same image are still deferred. The public Albums
# app IS wired up (below) — needed for public album sharing/collaboration
# without an account — reusing these same pods rather than a second
# release: the image's nginx config already listens on a fixed port per
# sub-app (3000 photos, 3002 albums, ...), so a second Service+IngressRoute
# pointed at port 3002 on the same pods is all that's needed, no new
# Deployment. Stateless — no persistence, but does pull ENTE_API_ORIGIN
# from the ente-uovi Infisical project (envFrom) — ENTE_API_ORIGIN there
# is the single source of truth for museum's public origin, shared with
# ente-museum. Note: envFrom pulls every secret in the project (DB/JWT/SMTP
# creds included, unused here) — same project as museum's since
# Infisical's secretsPath is flat ("/") with no per-app scoping, not this
# app being scoped down.

image:
  # NOT ghcr.io/ente-io/web — see ente-museum/values.yaml's comment, same
  # ghcr.io/ente/* namespace correction.
  repository: ghcr.io/ente/web
  tag: "latest"

service:
  port: 3000

# Inert for platform-common-apps releases — see ente-museum/values.yaml's
# comment, same ApplicationSet-parameter-overrides-this-value gotcha.
ingress:
  hostname: ente.bnei.dev

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# NOT NEXT_PUBLIC_ENTE_ENDPOINT — that only matters at *build* time for
# this image (web/Dockerfile bakes it in as the literal string
# "ENTE_API_ORIGIN_PLACEHOLDER"). What actually matters at container
# startup is ENTE_API_ORIGIN: an nginx docker-entrypoint.d script
# (90-replace-ente-env.sh) sed-replaces that placeholder in every built JS
# file with this env var's value — now sourced from Infisical (below)
# rather than hardcoded here. Left unset, it defaults to the image's own
# ENV ENTE_API_ORIGIN=http://localhost:8080 — confirmed live: a fresh
# browser with no locally-stored "custom server" override got stuck
# pointed at localhost.
env:
  - name: NODE_ENV
    value: "production"

infisical:
  enabled: true
  projectSlug: "ente-uovi"
  envSlug: dev
  secretsPath: "/"
  autoReload: true

livenessProbe:
  enabled: true
  type: http
  path: /
  port: 3000
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# Second Service+IngressRoute for the same pods' albums sub-app (port
# 3002) — common-app-chart's own Service only exposes one port
# (service.port, 3000), so this is a raw second Service reusing the
# chart's exact selector labels (app.kubernetes.io/name/instance:
# ente-web) rather than a second release/Deployment.
extraManifests:
  - |
    apiVersion: v1
    kind: Service
    metadata:
      name: ente-web-albums
      namespace: {{ .Release.Namespace }}
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/name: {{ .Release.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - port: 3002
          targetPort: 3002
          protocol: TCP
          name: albums
  - |
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: ente-web-albums
      namespace: {{ .Release.Namespace }}
    spec:
      entryPoints:
        - websecure
      routes:
        - kind: Rule
          match: Host(`album.ente.bnei.dev`)
          services:
            - name: ente-web-albums
              port: 3002
          # An extraManifests IngressRoute does NOT inherit the chart's
          # baseline chain — that is only prepended to the route
          # templates/ingressroute.yaml renders. Referenced explicitly here,
          # or this host is the one public route with no rate limit and no
          # security headers. The Middlewares themselves are rendered into
          # this namespace by the chart, so no cross-namespace ref is needed.
          middlewares:
            - name: {{ .Release.Name }}-baseline-ratelimit
              namespace: {{ .Release.Namespace }}
            - name: {{ .Release.Name }}-baseline-headers
              namespace: {{ .Release.Namespace }}
      tls:
        certResolver: le
