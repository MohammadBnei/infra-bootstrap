# ente-museum — Ente's API backend (public image, no app-specific code,
# same platform-common-apps category as searxng/pgweb). S3-native by
# design: photos/videos never touch a K8s volume, so no `persistence:`
# here — Garage (via s3.bnei.dev, ADR-0030) is the only store.
#
# Config is a mounted museum.yaml (not ENTE_*-prefixed env vars) — Ente's
# own docs only document the YAML schema; the env-var override mechanism
# exists but its exact key-mapping isn't documented, so a rendered file is
# the reliable choice. Same idiom as searxng's settings.yml
# (gitops/platform/values/searxng/values.yaml) — an InfisicalSecret with a
# `template:` block, sourced from the ente-uovi project.

# Same mechanism as infisical.autoReload (see common-app-chart's
# values.yaml) — set by hand since ente-museum uses a custom extraManifests
# InfisicalSecret (needs a `template:` to render museum.yaml) instead of
# the chart's built-in infisical: block, so the chart's own autoReload
# wiring, which is conditional on infisical.enabled, doesn't apply here.
# Without this, updating a secret in ente-uovi never reaches the running
# pod — subPath mounts don't live-update either, so this is the only
# thing that makes a secret change actually take effect.
annotations:
  secrets.infisical.com/auto-reload: "true"

image:
  # NOT ghcr.io/ente-io/server — that path 403s (private/nonexistent). The
  # actual published image lives under the shorter ghcr.io/ente/* namespace,
  # confirmed against server/quickstart.sh's generated compose.yaml.
  repository: ghcr.io/ente/server
  tag: "latest"

service:
  port: 8080

# Inert for platform-common-apps releases — the ApplicationSet's own
# helm.parameters (ingress.hostname, from each element's `hostname:` in
# platform-common-apps.applicationset.yaml) always overrides this value.
# Kept in sync for documentation, but the ApplicationSet entry is the
# real source of truth — confirmed live: editing only this field left
# the actual IngressRoute on the old hostname.
ingress:
  hostname: api.ente.bnei.dev
  # This host stays GREY (direct to origin, not proxied through Cloudflare):
  # *.ente.bnei.dev is two labels deep, and free Universal SSL covers only the
  # apex plus ONE wildcard level, so a proxied record here serves no
  # certificate at all. Confirmed live 2026-08-18 — the identical setup on
  # *.api.voconsteroid.com returned no cert and failed the handshake.
  #
  # Consequence for the baseline rate limiter: CF-Connecting-IP never appears
  # on this path, so the chart default would bucket every request under one
  # empty key. Empty restores per-client bucketing off the real peer address,
  # which is correct here because Traefik runs externalTrafficPolicy: Local.
  baseline:
    rateLimit:
      sourceHeader: ""

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

env:
  - name: ENTE_CREDENTIALS_FILE
    value: /credentials.yaml

# Same ente-uovi secrets as the mounted museum.yaml below, but flat as env
# vars too (envFrom) — the chart's built-in mechanism, a second
# InfisicalSecret alongside the hand-authored one that renders the file.
infisical:
  enabled: true
  projectSlug: "ente-uovi"
  envSlug: dev
  secretsPath: "/"

livenessProbe:
  enabled: true
  type: http
  path: /ping
  port: 8080
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

extraVolumes:
  - name: museum-config
    secret:
      secretName: ente-museum-config
  - name: museum-data
    emptyDir: {}

extraVolumeMounts:
  - name: museum-config
    mountPath: /credentials.yaml
    subPath: museum.yaml
  - name: museum-data
    mountPath: /data

# Required secrets in the ente-uovi Infisical project (id
# c018d40d-dfe0-4cc2-bbc8-857cac934af0): DB_HOST/DB_PORT/DB_NAME/DB_USER/
# DB_PASSWORD (dbuser_ente/entedb on pg-proxmox, see pigsty/pigsty.yml),
# ENTE_S3_ACCESS_KEY/ENTE_S3_SECRET (duplicated from the root Infisical
# project after ansible/playbooks/garage-configure.yml provisions the
# ente-photos bucket), JWT_SECRET, KEY_ENCRYPTION, KEY_HASH (random,
# agent-generated), SMTP_HOST/SMTP_PORT/SMTP_USERNAME/SMTP_PASSWORD/
# SMTP_EMAIL (user-supplied). universal-auth-credentials must be granted
# access to ente-uovi in the Infisical UI first.
extraManifests:
  - |
    apiVersion: secrets.infisical.com/v1alpha1
    kind: InfisicalSecret
    metadata:
      name: ente-museum-config
      namespace: {{ .Release.Namespace }}
    spec:
      hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
      resyncInterval: 60
      authentication:
        universalAuth:
          secretsScope:
            projectSlug: "ente-uovi"
            envSlug: dev
            secretsPath: "/"
          credentialsRef:
            secretName: universal-auth-credentials
            secretNamespace: infisical
      managedSecretReference:
        secretName: ente-museum-config
        secretNamespace: {{ .Release.Namespace }}
        creationPolicy: Orphan
        template:
          data:
            museum.yaml: |
              # /dev/stdout, not a real rotated file: gets JSON formatting
              # (setupLogger switches on log-file being non-empty, doesn't
              # need environment != "local") straight into the same
              # container stdout Alloy already scrapes for every pod — no
              # sidecar, no extra volume, no Alloy-side config. Traded off
              # against a real (if remote at this log volume) risk:
              # lumberjack's own rotation logic (triggers past 100MB) could
              # behave oddly trying to rename/compress a device file if
              # log volume ever gets that high.
              log-file: /dev/stdout

              db:
                host: "{{ "{{" }} .DB_HOST.Value {{ "}}" }}"
                port: {{ "{{" }} .DB_PORT.Value {{ "}}" }}
                name: "{{ "{{" }} .DB_NAME.Value {{ "}}" }}"
                user: "{{ "{{" }} .DB_USER.Value {{ "}}" }}"
                password: "{{ "{{" }} .DB_PASSWORD.Value {{ "}}" }}"
                sslmode: disable

              s3:
                are_local_buckets: false
                use_path_style_urls: true
                b2-eu-cen:
                  endpoint: "https://s3.bnei.dev"
                  region: "garage"
                  bucket: "ente-photos"
                  key: "{{ "{{" }} .ENTE_S3_ACCESS_KEY.Value {{ "}}" }}"
                  secret: "{{ "{{" }} .ENTE_S3_SECRET.Value {{ "}}" }}"

              jwt:
                secret: "{{ "{{" }} .JWT_SECRET.Value {{ "}}" }}"

              key:
                encryption: "{{ "{{" }} .KEY_ENCRYPTION.Value {{ "}}" }}"
                hash: "{{ "{{" }} .KEY_HASH.Value {{ "}}" }}"

              smtp:
                host: "{{ "{{" }} .SMTP_HOST.Value {{ "}}" }}"
                port: {{ "{{" }} .SMTP_PORT.Value {{ "}}" }}
                username: "{{ "{{" }} .SMTP_USERNAME.Value {{ "}}" }}"
                password: "{{ "{{" }} .SMTP_PASSWORD.Value {{ "}}" }}"
                email: "{{ "{{" }} .SMTP_EMAIL.Value {{ "}}" }}"

              internal:
                # account@bnei.dev — user_id confirmed from live request
                # logs (user_id=1580559962386438 across /users/details/v2,
                # /users/session-validity/v2, etc.). Explicit rather than
                # relying on the "first user is admin" fallback (empty
                # admins: []), which gets ambiguous once a second user
                # signs up.
                admins: [1580559962386438]

              # Base URL museum uses when constructing public share-link
              # responses (server-side — the web client just displays
              # whatever URL comes back from the API, no client-side env
              # var involved). Default is Ente's own hosted
              # https://albums.ente.com; pointed at our own album app
              # instead so share links actually work without an account.
              apps:
                public-albums: https://album.ente.bnei.dev
