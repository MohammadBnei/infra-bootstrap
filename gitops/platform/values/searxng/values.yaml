# searxng — driven directly from infra-bootstrap via common-app-chart
# (public image, no app-specific code — not a gitops/apps/registry.yaml
# "user app"). Migrated from the k8s-cluster submodule's kustomize config,
# reusing its real settings rather than inventing new ones.

image:
  repository: docker.io/searxng/searxng
  tag: "2026.7.12-c19d86faa"

service:
  port: 8080

ingress:
  hostname: searxng.bnei.dev

resources:
  requests:
    cpu: 128m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  - name: SEARXNG_PORT
    value: "8080"
  - name: SEARXNG_BASE_URL
    value: "https://searxng.bnei.dev/"
  - name: FORCE_OWNERSHIP
    value: "true"

livenessProbe:
  enabled: true
  type: http
  path: /healthz
  port: 8080
  initialDelaySeconds: 15
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

# ponytail: securityContext (capabilities drop ALL / add CHOWN,SETGID,SETUID
# in the old manifest) isn't reproduced — common-app-chart has no
# securityContext field yet. Not a regression vs. container defaults, just
# skipped hardening. Add a generic `securityContext` passthrough to the
# chart if this needs to come back.
extraVolumes:
  # settings.yml comes from a Secret, not a ConfigMap: it embeds
  # secret_key, which searxng's own docker entrypoint only auto-patches
  # for its *own* template-copy flow, not for a file we bind-mount
  # directly — so the real value has to already be in the rendered file,
  # sourced from Infisical rather than committed here.
  - name: searxng-settings
    secret:
      secretName: searxng-settings
  - name: searxng-limiter
    configMap:
      name: searxng-limiter
  - name: searxng-cache
    emptyDir: {}

extraVolumeMounts:
  - name: searxng-settings
    mountPath: /etc/searxng/settings.yml
    subPath: settings.yml
  - name: searxng-limiter
    mountPath: /etc/searxng/limiter.toml
    subPath: limiter.toml
  - name: searxng-cache
    mountPath: /var/cache/searxng

# Required secret in the dedicated searxng Infisical project (searxng-l-dwt,
# see docs/secrets.md): SEARXNG_SECRET_KEY — reusing the real value already
# live in k8s-cluster/searxng/ rather than rotating it during migration.
# universal-auth-credentials must be granted access to searxng-l-dwt in the
# Infisical UI (separate grant from the main infra-bootstrap project).
extraManifests:
  - |
    apiVersion: secrets.infisical.com/v1alpha1
    kind: InfisicalSecret
    metadata:
      name: searxng-settings
      namespace: {{ .Release.Namespace }}
    spec:
      hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
      resyncInterval: 60
      authentication:
        universalAuth:
          secretsScope:
            projectSlug: "searxng-l-dwt"
            envSlug: dev
            secretsPath: "/"
          credentialsRef:
            secretName: universal-auth-credentials
            secretNamespace: infisical
      managedSecretReference:
        secretName: searxng-settings
        secretNamespace: {{ .Release.Namespace }}
        creationPolicy: Orphan
        template:
          data:
            settings.yml: |
              use_default_settings: true

              server:
                base_url: "https://searxng.bnei.dev/"
                secret_key: "{{ "{{" }} .SEARXNG_SECRET_KEY.Value {{ "}}" }}"
                limiter: false
                image_proxy: true

              ui:
                default_theme: simple
                default_locale: ""

              search:
                safe_search: 0
                default_lang: ""
                autocomplete: "google"
                formats:
                    - html
                    - json
  - |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: searxng-limiter
      namespace: {{ .Release.Namespace }}
    data:
      limiter.toml: |
        [botdetection.ip_limit]
        link_token = true
  # ADR-0040 Decision 5, pilot scope. NOT the per-namespace default-deny that
  # decision describes — this is egress-only and it blocks exactly one thing:
  # the LAN management plane (Pigsty .232, Proxmox .200/.165/.161, Zot .234,
  # Garage .199, NFS .198, Pi-hole .55). searxng goes first because it needs
  # zero LAN hosts (`limiter: false` above means no Redis, and its settings
  # arrive via a mounted Secret the *operator* fetches, not the pod) while
  # being the likeliest thing here to get popped — `image_proxy: true` fetches
  # attacker-influenced URLs by design.
  #
  # A CiliumNetworkPolicy rather than a plain NetworkPolicy, and that is not a
  # style choice. nodelocaldns lives at the link-local 169.254.25.10 in host
  # networking; since Cilium 1.17 (this cluster runs 1.19.3) link-local
  # addresses carry the `host` identity, and Cilium's docs are explicit that
  # "CIDR rules do not apply to traffic where both sides of the connection are
  # either managed by Cilium or use an IP belonging to a node in the cluster
  # (including host networking pods)". So an `ipBlock: 169.254.25.10/32` rule
  # matches nothing, egress is default-deny the moment any rule exists, and DNS
  # dies for the whole namespace — with no fallback, since
  # enable_nodelocaldns_secondary is false. `toEntities: [host]` is the only
  # way to express it, and plain NetworkPolicy has no equivalent.
  #
  # Two things this does NOT do, stated plainly so the next reader doesn't
  # over-trust it:
  #   - The `except:` is not what blocks the node IPs (.201-.206). CIDR rules
  #     don't select node identities at all (policy-cidr-match-mode is unset,
  #     its default). Nodes are blocked because nothing here grants
  #     `remote-node` — same outcome, different mechanism.
  #   - It is not a seal. proxmox.bnei.dev and s3.bnei.dev are publicly
  #     reachable, and this pod keeps unrestricted internet egress, so it can
  #     still reach .200 and .199 by going out and back through the front door.
  #     Their own auth is the control there. This is defence in depth.
  #
  # Verify with Hubble, and re-check after a cilium-agent restart —
  # cilium#18644 records that link-local address flip-flopping between `host`
  # and a CIDR identity depending on whether nodelocaldns or the agent started
  # first, so "it resolves right now" is not evidence:
  #   hubble observe --namespace searxng --verdict DROPPED
  - |
    apiVersion: cilium.io/v2
    kind: CiliumNetworkPolicy
    metadata:
      name: searxng-lan-egress-lock
      namespace: {{ .Release.Namespace }}
    spec:
      endpointSelector: {}
      # Egress only — ingress stays unenforced, so Traefik reaching :8080 and
      # the kubelet's liveness probe are both untouched.
      egress:
        - toEntities:
            - host
          toPorts:
            - ports:
                - port: "53"
                  protocol: UDP
                - port: "53"
                  protocol: TCP
        # Everything else searxng does is the public internet: it is a
        # metasearch engine. No in-cluster egress rule because it makes none —
        # a namespace that does needs a toEndpoints rule added here, since
        # toCIDRSet does not reach Cilium-managed endpoints.
        - toCIDRSet:
            - cidr: 0.0.0.0/0
              except:
                - 192.168.1.0/24
