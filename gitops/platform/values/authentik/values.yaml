# authentik — the cluster's identity provider (ADR-0039).
#
# Chart schema checked with `helm show values authentik/authentik --version
# 2026.5.6` before writing this, per the k8s-ops skill's hardest-won lesson:
# Helm silently accepts unknown top-level keys, so a file nested under a key
# the chart does not have is a no-op for an entire session (the Infisical and
# Loki incidents).
#
# NO REDIS. ADR-0039 said Redis would be an in-cluster subchart; that was
# wrong for this version. authentik 2026.5.6 declares exactly two chart
# dependencies — postgresql (condition: postgresql.enabled) and
# authentik-remote-cluster — and its values expose no redis/cache/broker keys
# at all. Upstream moved session and task state onto Postgres. One fewer
# component to run, patch and back up.

authentik:
  # Every configuration value, including the non-secret ones, comes from this
  # Secret — see gitops/bootstrap/authentik-secret.yaml for why it is
  # all-or-nothing and how the AUTHENTIK_POSTGRESQL__* key names are derived.
  existingSecret:
    secretName: authentik-config

  # Not a secret, and deliberately NOT in the Secret above: this is an
  # operational knob someone will want to raise while debugging a login flow,
  # and it should be editable in git without touching Infisical.
  log_level: info

# Postgres is Pigsty's, reached at the HA floating VIP via postgres.bnei.lan.
# ADR-0010 rejected EXTERNAL MANAGED Postgres; Pigsty is self-hosted on this
# LAN and already carries HA failover, pgBackRest backups and monitoring that a
# second in-cluster instance would not.
#
# The database and dbuser_authentik are declared in pigsty/pigsty.yml. That
# user's password is stored there as a SCRAM-SHA-256 VERIFIER rather than
# plaintext — pigsty passes the value verbatim into ALTER USER ... PASSWORD and
# Postgres keeps a well-formed verifier as-is, so it authenticates identically
# while committing something non-reversible.
postgresql:
  enabled: false

server:
  replicas: 1
  # No ingress here. ADR-0001 makes Traefik IngressRoute the only routing API
  # in this cluster, so the route lives in gitops/bootstrap/ alongside every
  # other platform IngressRoute rather than being generated by the chart.
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

worker:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

# GeoIP enrichment of login events needs a MaxMind account and license key.
# Off until someone decides those are worth storing — it is an events-context
# nicety, not part of the authentication path.
geoip:
  enabled: false
