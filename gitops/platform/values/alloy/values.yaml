# Alloy Helm values for ukubi-cluster
# Chart: https://grafana.github.io/helm-charts  name: alloy
#
# This chart has NOT migrated to grafana-community (unlike Loki) — confirm
# the current chart revision with `helm search repo` before first apply.
#
# DaemonSet, logs-only today. Chosen over Promtail specifically because
# Alloy is Grafana's OTel-Collector-based unified agent — when there's an
# app to instrument with OTLP traces/metrics later, add
# otelcol.receiver.otlp components + a Service (4317/4318) to this same
# config. Not wired up yet (YAGNI — nothing sends OTLP today).

controller:
  type: daemonset

alloy:
  # hostPath /var/log (incl. /var/log/pods, where kubelet/containerd write
  # actual container log files) mounted into the container — required by
  # local.file_match + loki.source.file below.
  mounts:
    varlog: true

  configMap:
    content: |
      logging {
        level  = "info"
        format = "json"
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          // Restrict to pods scheduled on this node — this Alloy instance
          // can only read log files that actually exist on its own host.
          // K8S_NODE_NAME is injected by the chart itself, not a value we set.
          source_labels = ["__meta_kubernetes_pod_node_name"]
          regex         = sys.env("K8S_NODE_NAME")
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          // Every chart here sets this (Helm's standard fullname-template
          // label); it matches the ArgoCD Application name closely
          // ("platform-loki" pod label == "platform-loki" Application, see
          // gitops/bootstrap/platform.applicationset.yaml's `platform-{{.name}}`)
          // so log lines are identifiable the same way Applications are.
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
          target_label  = "app"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
          separator     = "/"
          target_label  = "job"
        }
        rule {
          // agent-fleet stamps agent-fleet.dev/task-id on every worker and
          // e2e-preview pod it creates. Promoting it to a stream label is what
          // makes "show me this task's logs" a selector rather than a parse:
          // {namespace="agent-fleet", task_id="..."}.
          //
          // A line-content filter can't do this job. e2e-preview pods emit the
          // target app's own output — vite, code-server, headless Chromium —
          // which is not the fleet's JSON, so `| json | taskId=...` drops all
          // of it. The pod label is the only handle that works for both the
          // fleet's own services and whatever a preview happens to run.
          //
          // Non-agent-fleet pods have no such label, so this resolves empty
          // and Loki stores nothing — no effect outside that namespace. It
          // also adds no cardinality beyond the `pod` label already set above:
          // one task maps to one worker pod.
          source_labels = ["__meta_kubernetes_pod_label_agent_fleet_dev_task_id"]
          target_label  = "task_id"
        }
        rule {
          // kubelet's fixed on-disk layout for containerd:
          // /var/log/pods/<namespace>_<pod-name>_<pod-uid>/<container>/*.log
          // — the leading "*" globs the "<namespace>_<pod-name>_" prefix so
          // we only need the UID here.
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/*$1/*.log"
        }
      }

      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      loki.source.file "pod_logs" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.pod_logs.receiver]
      }

      // containerd log files are CRI-formatted ("<time> <stream> <flag>
      // <content>", e.g. "2026-07-29T11:02:04Z stdout F {...}") — this
      // strips that framing back down to the raw log line + stream label,
      // same as loki.source.kubernetes did implicitly via the kubelet API.
      loki.process "pod_logs" {
        forward_to = [loki.write.default.receiver]

        stage.cri {}
      }

      // ADR-0040: the kube-apiserver audit log.
      //
      // It does NOT arrive via the pod_logs path above, and the path here is
      // the HOST path, which is NOT the same as the apiserver's --audit-log-path.
      //
      //   container: /var/log/audit/kube-apiserver-audit.log   <- --audit-log-path
      //   host:      /var/log/kubernetes/audit/                <- the hostPath
      //
      // kubespray derives audit_log_mountpath from audit_log_path | dirname, so
      // the flag describes where the file sits INSIDE the static pod, while the
      // volume mounts host /var/log/kubernetes/audit at that container path.
      // Targeting the container path from a DaemonSet silently matches nothing —
      // no error, no log line, just an empty stream. Confirmed live 2026-08-18:
      // the file is 4-14 MB per control-plane node at the host path below.
      //
      // Without this block the audit log is produced, rotated and never read —
      // a disk cost with no security value, and every downstream detection rule
      // silently has no data.
      //
      // Reachable because mounts.varlog already puts the whole of /var/log in
      // this container; no extra mount and no extra RBAC (file tailing needs
      // none). The file is mode 0600 root:root and Alloy runs as root here, so
      // it is readable — verified by exec'ing into the DaemonSet. It only
      // exists on control-plane nodes, so on workers this target never matches.
      //
      // Forwarded straight to loki.write, NOT through loki.process.pod_logs:
      // that stage strips CRI framing ("<time> <stream> <flag> <content>"),
      // which audit events do not have. They are already one JSON object per
      // line, and stage.cri would mangle them.
      //
      // Query as {job="kube-apiserver-audit"}. Note Loki retention is 14d, so
      // this is recent-forensics only, not an archive — and audit events carry
      // usernames and resource names, which is exactly why they are useful and
      // also why the retention window matters.
      local.file_match "audit_logs" {
        path_targets = [{
          __path__ = "/var/log/kubernetes/audit/kube-apiserver-audit.log",
          job      = "kube-apiserver-audit",
          node     = sys.env("K8S_NODE_NAME"),
        }]
      }

      loki.source.file "audit_logs" {
        targets    = local.file_match.audit_logs.targets
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          // Loki SingleBinary chart's fullname convention not yet
          // confirmed — likely "platform-loki" since the chart name
          // equals the release name (unlike kube-prometheus-stack's
          // truncated "platform-prometheus-kube-p-*"). Confirmed live:
          // `kubectl get svc -n monitoring` after first sync — same
          // caveat as every other in-cluster Service URL in this repo.
          url = "http://platform-loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

# File tailing needs no pods/log RBAC (that was loki.source.kubernetes's
# requirement) — discovery.kubernetes still needs get/list/watch on pods
# for metadata, which the chart's default rbac.create: true already
# grants.
rbac:
  create: true
