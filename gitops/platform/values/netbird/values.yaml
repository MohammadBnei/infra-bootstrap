# NetBird control plane — netbird-server (management + signal + relay + STUN
# in one binary since v0.65). ADR-0054: the cluster HOSTS the control plane for
# an external mesh (two laptops, one Raspberry Pi at a partner's home); no
# node, pod or PVE host joins the mesh. The dashboard is its own release,
# values/netbird-dashboard.
#
# Platform-common app (public image, no per-app repo), same reasoning as zot.

image:
  repository: netbirdio/netbird-server
  # No `v`: Docker Hub tags this image `0.80.0`, unlike the dashboard's
  # `v2.94.0`. Digest for 0.80.0 was sha256:05b3d8d6…a261 on 2026-10-11.
  tag: "0.80.0"

# Recreate, single replica. Management and signal HA is NetBird's commercial
# tier, and two pods would split the relay and STUN anyway. A rollout is a
# short outage, which established P2P tunnels ride through (ADR-0054).
replicaCount: 1
strategy:
  type: Recreate

service:
  port: 80
  # config.yaml's metricsPort (gitops/bootstrap/netbird-config-secret.yaml):
  # one /metrics for management, signal and relay. Unauthenticated, so it is
  # only ever a ClusterIP port — never added to the IngressRoute below.
  extraPorts:
    - name: metrics
      port: 9090

# No chart IngressRoute: this release serves five path prefixes, two of them
# gRPC needing h2c to the backend, which the chart's one-route template cannot
# express. The route is hand-written in extraManifests below. hostname is
# empty-but-present for zot's reason (see platform-common-apps).
ingress:
  enabled: false

# Restarts the pod when gitops/bootstrap/netbird-config-secret.yaml's Secret
# changes. Set as a raw annotation, not `infisical.autoReload`, because that
# flag also turns on the chart's own InfisicalSecret, which would mount every
# root secret here (zot's ponytail note).
annotations:
  secrets.infisical.com/auto-reload: "true"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Both gorm pools (management, activity) default to runtime.NumCPU() open
# connections — the HOST's CPUs, not the container's limit (v0.80.0
# management/server/store/sql_store.go:83, activity/store/sql_store.go:286).
# Capping them at 5 matters less than it looks: the Postgres store also opens
# a pgxpool hardcoded to 30 that no setting reaches, which is why
# dbuser_netbird's connlimit is 50 (pigsty/pigsty.yml). Recreate means no
# second pod ever doubles it.
env:
  - name: NB_SQL_MAX_OPEN_CONNS
    value: "5"

# TCP on the main port, NOT /health. Measured on first deploy (2026-10-11):
# /health includes the relay's self-check, which dials
# rels://netbird.bnei.dev:443/relay — through Traefik, back to this pod. Traefik
# only routes to Ready endpoints, so it answers 503, /health fails, the pod
# never becomes Ready: a deadlock. On liveness it was a restart loop too.
# A process accepting on :80 is the honest liveness signal; whether the public
# path works is the blackbox probe's job, not the kubelet's.
#
# Liveness is generous because a first boot migrates three empty databases;
# the chart's ~40s to a kill could land mid-migration and loop.
livenessProbe:
  enabled: true
  type: tcp
  initialDelaySeconds: 30
  failureThreshold: 6
readinessProbe:
  enabled: true
  type: tcp

# dataDir on a PVC, not an emptyDir. All three stores are in Pigsty, but the
# GeoLite databases are not: management downloads them into dataDir at boot,
# and a failed load is FATAL (v0.80.0 management/internals/server/modules.go:50).
# On an emptyDir every restart re-downloaded them, and the first deploy crashed
# once on `failed to load MaxMind databases: checksum mismatch` (2026-10-11).
# disableGeoliteUpdate is no way out: with no local file it errors the same.
# Longhorn, so it is replicated, though nothing here needs a backup — it is a
# cache. Recreate (above) keeps the RWO volume from deadlocking a rollout.
persistence:
  enabled: true
  size: 1Gi
  mountPath: /var/lib/netbird

extraVolumes:
  - name: config
    secret:
      secretName: netbird-config

extraVolumeMounts:
  - name: config
    mountPath: /etc/netbird
    readOnly: true

extraManifests:
  # Scrape for the metrics port above, zot's pattern (common-app-chart has no
  # ServiceMonitor template). ADR-0055 makes NetBird the daily SSH path to
  # every host, so it is alerted on like one.
  - |
    apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: netbird
      namespace: {{ .Release.Namespace }}
      labels:
        {{- include "common-app-chart.labels" . | nindent 8 }}
    spec:
      selector:
        matchLabels:
          {{- include "common-app-chart.selectorLabels" . | nindent 10 }}
      endpoints:
        - port: metrics
          path: /metrics
          interval: 30s
  # Rendered through tpl like every extraManifest, so the annotations carry no
  # {{ $labels }} — Helm would try to evaluate them. The outside path is the
  # blackbox NetBirdUnreachable rule's job (values/blackbox-exporter).
  # ponytail: down/absent only; add degraded rules (relay share, login errors)
  # once real metric names are visible in Prometheus.
  - |
    apiVersion: monitoring.coreos.com/v1
    kind: PrometheusRule
    metadata:
      name: netbird
      namespace: {{ .Release.Namespace }}
      labels:
        {{- include "common-app-chart.labels" . | nindent 8 }}
    spec:
      groups:
        - name: netbird
          rules:
            - alert: NetBirdServerDown
              expr: up{namespace="{{ .Release.Namespace }}", endpoint="metrics"} == 0 or absent(up{namespace="{{ .Release.Namespace }}", endpoint="metrics"})
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "netbird-server metrics unreachable for 5m"
                description: >-
                  The NetBird control plane is down or not scraped. Established
                  P2P tunnels keep working; new SSH sessions to every host
                  (ADR-0055) and relayed sessions do not. Recovery from off-LAN
                  is the :49222 break-glass path.
  # The one route for netbird.bnei.dev's server paths. The dashboard's
  # catch-all Host() route comes from its own release; Traefik ranks rules
  # by length, so these longer Host()&&PathPrefix() rules always win.
  #
  # The rate limit and headers on the HTTP routes are the dashboard release's
  # baseline middlewares, borrowed by name (both releases share the `netbird`
  # namespace). ente-web's album route set the precedent. On a fresh install
  # this route can sync before those Middlewares exist and error until they
  # do. That is one sync interval, not a broken state.
  #
  # The gRPC and relay routes deliberately get no middlewares: every peer
  # behind one home NAT would share a limiter bucket, and a stream is one
  # long request that a limiter buys nothing against.
  #
  # These streams also need Traefik's websecure readTimeout at 0. That is a
  # separate Traefik change (ADR-0054), not something a route can set.
  - |
    apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: netbird
      namespace: {{ .Release.Namespace }}
    spec:
      entryPoints:
        - websecure
      routes:
        - kind: Rule
          match: Host(`netbird.bnei.dev`) && (PathPrefix(`/signalexchange.SignalExchange/`) || PathPrefix(`/management.ManagementService/`))
          services:
            - name: {{ .Release.Name }}
              port: 80
              scheme: h2c
        - kind: Rule
          match: Host(`netbird.bnei.dev`) && (PathPrefix(`/relay`) || PathPrefix(`/ws-proxy/`))
          services:
            - name: {{ .Release.Name }}
              port: 80
        - kind: Rule
          match: Host(`netbird.bnei.dev`) && (PathPrefix(`/api`) || PathPrefix(`/oauth2`))
          services:
            - name: {{ .Release.Name }}
              port: 80
          middlewares:
            - name: netbird-dashboard-baseline-ratelimit
              namespace: {{ .Release.Namespace }}
            - name: netbird-dashboard-baseline-headers
              namespace: {{ .Release.Namespace }}
      tls:
        certResolver: le
  # STUN, UDP 3478. It cannot go through Traefik or Cloudflare, so it gets
  # its own MetalLB address, which the Freebox forwards UDP 3478 to.
  #
  # externalTrafficPolicy: Local is load-bearing. STUN's whole job is to tell
  # a peer its public address as seen from here; under Cluster, kube-proxy
  # SNATs the packet to a node IP and STUN answers with that instead. Local
  # keeps the source, and with one replica MetalLB announces the address from
  # the pod's node. The address stops answering ARP during each Recreate
  # rollout; peers fall back to the relay meanwhile.
  #
  # Pinned for zot's reason: the Freebox forward names this address.
  - |
    apiVersion: v1
    kind: Service
    metadata:
      name: {{ .Release.Name }}-stun
      namespace: {{ .Release.Namespace }}
      annotations:
        metallb.universe.tf/loadBalancerIPs: 192.168.1.235
    spec:
      type: LoadBalancer
      externalTrafficPolicy: Local
      selector:
        {{- include "common-app-chart.selectorLabels" . | nindent 8 }}
      ports:
        - name: stun
          port: 3478
          targetPort: 3478
          protocol: UDP
