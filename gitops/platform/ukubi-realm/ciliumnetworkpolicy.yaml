# The realm's fence (mountain plan/21 phase 0b), ingress AND egress: once it
# exists every pod in ukubi-realm is default-deny both ways.
#
# The realm reads the public town layout only (the owner pod's snapshot
# listener) and writes only its own database: it never reaches infra, the town
# or visitors, so this policy names exactly those two and DNS.
#
# Shapes are the game's (gitops/platform/ukubi-game/ciliumnetworkpolicy.yaml),
# for its reasons: DNS is the host entity on :53 plus nodelocaldns; in-cluster
# Services are toEndpoints WITH toPorts (Cilium DNATs the ClusterIP before
# policy, so the port is the backend pod's); Pigsty by address, since its
# nodes are LAN hosts outside the cluster. No toFQDNs, so the DNS rules carry
# no rules.dns.
#
# 7420 is the realm's websocket listener (helm/realm.yaml service.port).
# TODO(realm): confirm the port once cmd/realm has shipped.
#
# UNVERIFIED (the cluster was down when this was written). After the first
# sync: hubble observe --namespace ukubi-realm --verdict DROPPED; a websocket
# from wss://realm.bnei.dev connects; the realm's log shows the snapshot read
# and the database open.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ukubi-realm-fence
  namespace: ukubi-realm
spec:
  endpointSelector: {}
  ingress:
    # Players' websockets, through Traefik only.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "7420"
              protocol: TCP
    # The kubelet's TCP probes come from the host identity. Named here rather
    # than trusted to Cilium's allow-localhost default.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "7420"
              protocol: TCP
  egress:
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Belt and braces, searxng's reason: cilium#18644.
    - toCIDR:
        - 169.254.25.10/32
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The public snapshot (the owner pod's :7411, ukubi-game helm/values.yaml
    # service.extraPorts), never :7410 or :7412.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ukubi-game
            app.kubernetes.io/name: ukubi-game
      toPorts:
        - ports:
            - port: "7411"
              protocol: TCP
    # realmdb as dbuser_realm on Pigsty, direct :5432 (pgbouncer: false). The
    # pg nodes and the VIP: keep in step with pigsty/pigsty.yml's pg-meta
    # hosts and pg_vip_address (the game's list).
    - toCIDR:
        - 192.168.1.205/32
        - 192.168.1.207/32
        - 192.168.1.232/32
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
