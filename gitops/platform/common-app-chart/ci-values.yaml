# CI-only overlay for `helm lint`/`helm template` in .github/workflows/lint.yml.
# No real Application uses this file — real apps pass their own values via
# registry.yaml's valuesPath. This turns on every optional template path
# with dummy-but-schema-valid data so CI actually renders
# ingressroute/pvc/infisicalsecret/hooks/oneoff-cronjobs too, not just the
# always-on Deployment+Service.
image:
  repository: ghcr.io/example/ci-check

ingress:
  hostname: ci-check.example.com
  # Renders the `&& PathPrefix(...)` branch of the match (ADR-0060).
  pathPrefix: /webhook/github
  # auth.trustsHeaders below needs a *-forwardauth ref (standard A3).
  middlewares:
  - name: authentik-forwardauth
    namespace: default
  # ingress.extraRoutes: tpl'd match, explicit priority (1000000 checks the
  # `| int`), service/port override, and a camelCase key (checks `| lower`).
  # Carries a forwardauth ref: auth.trustsHeaders below requires one.
  extraRoutes:
    adminApi:
      match: Host(`{{ .Values.ingress.hostname }}`) && PathPrefix(`/admin`)
      priority: 1000000
      service: ci-check-admin
      port: 8080
      middlewares:
      - name: authentik-forwardauth
        namespace: default
      - name: ci-check-admin-strip
        namespace: default

persistence:
  enabled: true

infisical:
  enabled: true
  projectSlug: ci-check
  # Renders the template.data key filter (ADR-0061).
  keys: [CI_KEY]

hooks:
  migrate:
    type: PreSync
    image:
      repository: ghcr.io/example/ci-check-migrate

oneOffJobs:
  dbCheck:
    image:
      repository: ghcr.io/example/ci-check-job

podDisruptionBudget:
  enabled: true

# ADR-0040 securityContext passthrough. Both default to {} (= today's
# behaviour, nothing rendered), so without these two blocks CI would never
# render that path and kubeconform would never schema-check it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL

# ADR-0043 runtimeClassName passthrough. Defaults to "" (= nothing
# rendered), so without this CI would never render that path and
# kubeconform would never schema-check it — same reasoning as the
# securityContext blocks above.
runtimeClassName: nvidia

# Standard A3 path: renders templates/networkpolicy.yaml so kubeconform
# schema-checks it, and lint.yml asserts its peer and port.
networkPolicy:
  ingressFrom: [traefik]
auth:
  trustsHeaders: true

# metrics.serviceMonitor on a service.extraPorts port: renders
# templates/servicemonitor.yaml so kubeconform schema-checks it and lint.yml
# asserts its fields. The extra port leaves the NetworkPolicy asserts alone
# (the policy only admits service.port).
service:
  extraPorts:
  - name: metrics
    port: 9090
metrics:
  serviceMonitor:
    enabled: true
    port: metrics
    interval: 15s

# dataLifecycle: renders the pii label and two of the three annotations on
# the Deployment (decommission left unset, so lint.yml can check an unset
# field renders nothing) for kubeconform and the lint.yml asserts.
dataLifecycle:
  pii: personal
  backup: pgBackRest to Garage via Pigsty
  retention: "90d"

# Pod identity and args: renders serviceAccountName, automountServiceAccountToken
# and the container args for kubeconform and the lint.yml asserts. The default
# render has none of the three.
serviceAccountName: ci-check
automountServiceAccountToken: false
args: ["--world", "real"]
