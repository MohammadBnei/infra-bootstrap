replicaCount: 1

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

# Deployment metadata annotations. For pod-template annotations use
# podAnnotations below.
annotations: {}

service:
  port: 80
  annotations: {}

ingress:
  enabled: true
  hostname: ""
  # Traefik IngressRoute + native ACME (per ADR-0001,
  # docs/adr/0001-ingress-traefik-ingressroute-over-gateway-api.md) — Gateway API
  # can't get certs from Traefik's ACME resolver without cert-manager.
  certResolver: le
  annotations: {}
  # Traefik Middleware refs: [{name, namespace}]. Define the Middleware
  # itself via extraManifests below (e.g. BasicAuth for an admin-only app).
  middlewares: []

resources: {}
# requests:
#   cpu: 100m
#   memory: 128Mi
# limits:
#   memory: 256Mi

# Namespace-wide fallback bound so an app that skips resources: above
# doesn't end up fully unbounded — real risk on k8s-worker-02 (4vCPU/8GB,
# shared with pg02 + nfs-storage). default/defaultRequest only fill the gap
# for containers that don't set resources: themselves; max caps everyone,
# including apps that do, as a backstop against a typo'd limit. On by
# default — disable per-app only for a specific reason (e.g. the
# GPU-passthrough worker's actual GPU workload).
limitRange:
  enabled: true
  default:
    cpu: 500m
    memory: 512Mi
  defaultRequest:
    cpu: 100m
    memory: 128Mi
  max:
    cpu: "2"
    memory: 4Gi

# PodDisruptionBudget — opt-in, NOT on by default. A PDB with
# minAvailable >= replicaCount on the default single-replica app blocks
# `kubectl drain`/node upgrades forever — only enable for apps actually
# running replicaCount > 1.
podDisruptionBudget:
  enabled: false
  minAvailable: null
  maxUnavailable: 1

# Raw env vars: [{name, value}] or [{name, valueFrom: {secretKeyRef: {name, key}}}]
env: []

# Inject whole Secrets or ConfigMaps: [{secretRef: {name}}, {configMapRef: {name}}]
# When infisical.enabled is true, the chart appends a secretRef for the
# InfisicalSecret-managed Secret automatically — no need to list it here.
# Use this for anything *in addition* to that.
envFrom: []

# Infisical-backed secrets: renders an InfisicalSecret CR that syncs a
# project's secrets into a K8s Secret, auto-wired into envFrom above.
# Reuses the cluster's shared machine identity (universal-auth-credentials/
# infisical) — grant that identity access to your project in the Infisical
# UI, don't mint new K8s credentials per app.
infisical:
  enabled: false
  projectSlug: ""
  envSlug: dev
  secretsPath: "/"
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  secretName: ""   # defaults to "<release-name>-infisical"
  # Sets secrets.infisical.com/auto-reload: "true" on the Deployment so the
  # Infisical operator restarts it when the managed secret's content changes.
  autoReload: false
  credentialsRef:
    secretName: universal-auth-credentials
    secretNamespace: infisical

persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
  mountPath: /data
  accessMode: ReadWriteOnce

livenessProbe:
  enabled: false
  type: http   # http | tcp
  path: /healthz
  port: ""     # defaults to service.port
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: false
  type: http
  path: /healthz
  port: ""
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

podAnnotations: {}
# Extra labels on the pod template only (not the Deployment object) — this is
# what log-shipping label discovery (Alloy/Promtail k8s_sd) actually reads,
# so use this rather than `annotations` when the goal is grouping/querying
# (e.g. Loki label filters), not just metadata.
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Raw volume/volumeMount specs, toYaml'd as-is into the pod spec and the
# app container — escape hatch for anything the schema above doesn't cover
# (e.g. mounting a ConfigMap as files). Define the backing object itself
# via extraManifests below.
extraVolumes: []
extraVolumeMounts: []

# Raw extra K8s objects (ConfigMaps, a Middleware, a Secret, ...), each a
# YAML string rendered as its own document. `tpl`'d, so release/values
# templating works inside. Same idiom as Bitnami's `extraDeploy` — keeps
# common-app-chart generic instead of growing per-app special cases.
extraManifests: []

# Recurring, idempotent, every-sync ArgoCD hook Jobs (schema migrations,
# etc.) — map-keyed so a layered env-override file (see registry.yaml's
# valuesPath) can touch one field (e.g. just image.tag) via Helm's map
# deep-merge, without repeating the whole entry (Helm replaces *lists*
# wholesale on merge, but deep-merges maps).
#
# The chart always sets the ArgoCD hook annotation, backoffLimit: 0, and
# restartPolicy: Never — not user-configurable — so a hook can't silently
# degrade into a stuck normal resource (missing hook annotation leaves an
# immutable Job stuck on a stale image forever) or mask failures behind
# retries.
hooks: {}
# hooks:
#   migrate:
#     type: PreSync            # PreSync | PostSync | SyncFail
#     enabled: true             # default true; explicit `false` skips
#                                # rendering entirely (safe decommission)
#     hookDeletePolicy: BeforeHookCreation   # optional override
#     image:
#       repository: ""
#       tag: "latest"
#     command: []
#     args: []
#     env: []
#     envFrom: []                # auto-appends the InfisicalSecret secretRef
#                                 # when infisical.enabled, same as the Deployment
#     resources: {}

# Per-app Grafana log alert rules. Renders a ConfigMap labeled
# grafana_alert: "1", picked up dynamically by Grafana's alerts sidecar
# (sidecar.alerts, see gitops/platform/values/grafana/values.yaml) — apps
# declare *when* to alert, routing stays owned by the platform (shared
# Discord contact point + notification policy, defined once in Grafana's
# own values, not repeated per app). `uid` only needs to be unique within
# this app — the chart prefixes it with the release name so cluster-wide
# collisions across apps aren't a footgun app authors have to think about.
logAlerts:
  enabled: false
  # Loki datasource uid is fixed cluster-wide — see the `Loki` entry in
  # gitops/platform/values/grafana/values.yaml's datasources list.
  datasourceUid: ds-loki
  rules: []
  # rules:
  #   - uid: high-5xx-rate               # unique within this app
  #     title: High 5xx rate
  #     expr: 'sum(rate({namespace="myapp"} |~ "(?i) 5\\d\\d " [5m]))'
  #     threshold: 0.2
  #     for: 5m                          # optional, defaults to 5m
  #     severity: warning                # optional, defaults to warning

# Per-app Grafana dashboards. Renders a ConfigMap labeled
# grafana_dashboard: "1", picked up dynamically by Grafana's dashboards
# sidecar (sidecar.dashboards, see
# gitops/platform/values/grafana/values.yaml) — apps ship their own
# dashboard JSON from their own repo without touching platform files. All
# synced dashboards land in one shared "GitOps Dashboards" folder — no
# per-app folder structure until someone actually needs it.
dashboards:
  enabled: false
  items: {}
  # items:
  #   overview: |
  #     { "title": "My App Overview", "panels": [...], ... }

# Irregular / one-time scripts. Rendered as suspended CronJobs (suspend:
# true — a schedule is syntactically required but never fires on its own);
# triggered on demand via `kubectl create job --from=cronjob/<release>-<name>
# <run-id>`. `lastRunTag` is a ledger field the chart never reads — CI
# writes it back once a run against that tag has succeeded.
oneOffJobs: {}
# oneOffJobs:
#   dbCheck:
#     image:
#       repository: ""
#       tag: "latest"
#     command: []
#     args: []
#     env: []
#     envFrom: []
#     resources: {}
#     lastRunTag: null
