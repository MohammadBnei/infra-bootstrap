replicaCount: 1

image:
  repository: ""
  tag: "latest"
  pullPolicy: IfNotPresent

# Deployment metadata annotations. For pod-template annotations use
# podAnnotations below.
annotations: {}

service:
  port: 80
  # ClusterIP for anything reached through Traefik — i.e. everything with an
  # IngressRoute, which is almost every app here. LoadBalancer is for the
  # rare service consumed from *outside* the cluster by something that can't
  # go through Traefik: a name Let's Encrypt can't issue for (`.lan`), or a
  # non-HTTP protocol. Pin the address with a
  # `metallb.universe.tf/loadBalancerIPs` annotation below whenever you set
  # this — MetalLB otherwise reassigns from the pool on Service recreation,
  # which selfHeal/prune make routine, and anything holding the old address
  # (a DNS record, a containerd mirror) silently breaks.
  type: ClusterIP
  annotations: {}
  # Additional Service ports beyond the primary http one above — e.g. a
  # second listening port (gRPC, metrics) the same Deployment's container
  # already binds. targetPort defaults to the raw port number, so no
  # matching named containerPort is required. Each entry: {name, port,
  # targetPort (optional), protocol (optional, default TCP)}.
  extraPorts: []

ingress:
  enabled: true
  hostname: ""
  # Traefik IngressRoute + native ACME (per ADR-0001,
  # docs/adr/0001-ingress-traefik-ingressroute-over-gateway-api.md) — Gateway API
  # can't get certs from Traefik's ACME resolver without cert-manager.
  certResolver: le
  annotations: {}
  # Traefik Middleware refs: [{name, namespace}]. Define the Middleware
  # itself via extraManifests below (e.g. BasicAuth for an admin-only app).
  # These are APPENDED after the baseline chain below, not instead of it.
  middlewares: []

  # Baseline protection applied to every exposed app (ADR-0038). On by
  # default and deliberately so: `middlewares` above is opt-in, which meant
  # an app was unprotected unless someone remembered to protect it. The
  # Middleware objects render into the app's own namespace via
  # templates/middleware.yaml, so there is no shared object to race against.
  #
  # To opt out for one app, set `ingress.baseline.enabled: false` in that
  # app's own values file. That works for the external-repo apps (blog,
  # dreamer, vos-monolith, vos-monolith-dev, agent-fleet-core) too — their
  # values.yaml is a real Helm source, even though the chart comes from this
  # repo, which is also why they pick this up with no ApplicationSet change.
  #
  # LIMITATION, worth knowing before assuming coverage: the baseline is
  # prepended only to the IngressRoute templates/ingressroute.yaml renders.
  # Two escape hatches bypass it and must wire the refs themselves —
  #   1. any IngressRoute declared through `extraManifests` (ente-web's
  #      album.ente route does this; it references the Middlewares by name)
  #   2. agent-fleet's e2e preview routes, which are built in Go by the
  #      provisioner and never touch this chart at all
  baseline:
    enabled: true
    rateLimit:
      enabled: true
      # Per source IP, per `period`. Abuse protection, not app policy — an
      # app needing a real quota should define its own middleware.
      average: 100
      burst: 200
      period: 1s
      # Set at the 2026-08-18 Cloudflare cutover. *.bnei.dev is now proxied,
      # so the TCP peer is a Cloudflare edge IP — bucketing on it would put
      # the entire internet into one 100/s bucket. CF-Connecting-IP is chosen
      # over an X-Forwarded-For ipStrategy because Cloudflare guarantees it
      # holds exactly the real client and overwrites any value a client
      # supplies, whereas XFF is a list whose shape depends on what the
      # client sent.
      #
      # Set this back to "" for any host left GREY (direct to origin) — the
      # header is absent there, so every request would share one empty-key
      # bucket. Currently: ente-museum, ente-web. Also agent-fleet-core
      # (fleet.bnei.dev), whose values live in its own repo and therefore
      # needs a PR there — until then its limiter is global rather than
      # per-IP, which is wrong but not harmful at this traffic level.
      #
      # A client hitting the origin IP directly could forge this header to
      # dodge the limiter. The real fix for that is the origin allowlist
      # (ADR-0038 Decision 5), not this field.
      sourceHeader: "CF-Connecting-IP"
    headers:
      enabled: true
      contentTypeNosniff: true
      referrerPolicy: strict-origin-when-cross-origin
      # 1 year. No includeSubDomains, no preload — see templates/middleware.yaml
      # for why those two are excluded rather than merely unset.
      stsSeconds: 31536000
      customResponseHeaders: {}

resources: {}

# Pod- and container-level security context. The chart had neither until
# ADR-0040, which is why gitops/platform/values/searxng/values.yaml carries a
# `ponytail:` note saying hardening was skipped for lack of a field to put it
# in. Both default to {} — empty means "whatever the image does", i.e. exactly
# today's behaviour, so this is a no-op until an app opts in.
#
# ADR-0040 adds PodSecurityAdmission labels; an app that fails to schedule
# under `restricted` needs something like:
#   podSecurityContext: {runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000,
#                        seccompProfile: {type: RuntimeDefault}}
#   securityContext: {allowPrivilegeEscalation: false,
#                     readOnlyRootFilesystem: true,
#                     capabilities: {drop: [ALL]}}
podSecurityContext: {}
securityContext: {}
# requests:
#   cpu: 100m
#   memory: 128Mi
# limits:
#   memory: 256Mi

# Namespace-wide fallback bound so an app that skips resources: above
# doesn't end up fully unbounded — real risk on k8s-worker-02 (4vCPU/8GB,
# shared with pg02 + nfs-storage). default/defaultRequest only fill the gap
# for containers that don't set resources: themselves; max caps everyone,
# including apps that do, as a backstop against a typo'd limit. On by
# default — disable per-app only for a specific reason (e.g. the
# GPU-passthrough worker's actual GPU workload).
limitRange:
  enabled: true
  default:
    cpu: 500m
    memory: 512Mi
  defaultRequest:
    cpu: 100m
    memory: 128Mi
  max:
    cpu: "2"
    memory: 4Gi

# PodDisruptionBudget — opt-in, NOT on by default. A PDB with
# minAvailable >= replicaCount on the default single-replica app blocks
# `kubectl drain`/node upgrades forever — only enable for apps actually
# running replicaCount > 1.
podDisruptionBudget:
  enabled: false
  minAvailable: null
  maxUnavailable: 1

# Raw env vars: [{name, value}] or [{name, valueFrom: {secretKeyRef: {name, key}}}]
env: []

# Inject whole Secrets or ConfigMaps: [{secretRef: {name}}, {configMapRef: {name}}]
# When infisical.enabled is true, the chart appends a secretRef for the
# InfisicalSecret-managed Secret automatically — no need to list it here.
# Use this for anything *in addition* to that.
envFrom: []

# Infisical-backed secrets: renders an InfisicalSecret CR that syncs a
# project's secrets into a K8s Secret, auto-wired into envFrom above.
# Reuses the cluster's shared machine identity (universal-auth-credentials/
# infisical) — grant that identity access to your project in the Infisical
# UI, don't mint new K8s credentials per app.
infisical:
  enabled: false
  projectSlug: ""
  envSlug: dev
  secretsPath: "/"
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  secretName: ""   # defaults to "<release-name>-infisical"
  # Sets secrets.infisical.com/auto-reload: "true" on the Deployment so the
  # Infisical operator restarts it when the managed secret's content changes.
  autoReload: false
  credentialsRef:
    secretName: universal-auth-credentials
    secretNamespace: infisical

persistence:
  enabled: false
  size: 1Gi
  storageClass: ""
  mountPath: /data
  accessMode: ReadWriteOnce

livenessProbe:
  enabled: false
  type: http   # http | tcp
  path: /healthz
  port: ""     # defaults to service.port
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: false
  type: http
  path: /healthz
  port: ""
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

podAnnotations: {}
# Extra labels on the pod template only (not the Deployment object) — this is
# what log-shipping label discovery (Alloy/Promtail k8s_sd) actually reads,
# so use this rather than `annotations` when the goal is grouping/querying
# (e.g. Loki label filters), not just metadata.
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Raw volume/volumeMount specs, toYaml'd as-is into the pod spec and the
# app container — escape hatch for anything the schema above doesn't cover
# (e.g. mounting a ConfigMap as files). Define the backing object itself
# via extraManifests below.
extraVolumes: []
extraVolumeMounts: []

# Raw extra K8s objects (ConfigMaps, a Middleware, a Secret, ...), each a
# YAML string rendered as its own document. `tpl`'d, so release/values
# templating works inside. Same idiom as Bitnami's `extraDeploy` — keeps
# common-app-chart generic instead of growing per-app special cases.
extraManifests: []

# Recurring, idempotent, every-sync ArgoCD hook Jobs (schema migrations,
# etc.) — map-keyed so a layered env-override file (see registry.yaml's
# valuesPath) can touch one field (e.g. just image.tag) via Helm's map
# deep-merge, without repeating the whole entry (Helm replaces *lists*
# wholesale on merge, but deep-merges maps).
#
# The chart always sets the ArgoCD hook annotation, backoffLimit: 0, and
# restartPolicy: Never — not user-configurable — so a hook can't silently
# degrade into a stuck normal resource (missing hook annotation leaves an
# immutable Job stuck on a stale image forever) or mask failures behind
# retries.
hooks: {}
# hooks:
#   migrate:
#     type: PreSync            # PreSync | PostSync | SyncFail
#     enabled: true             # default true; explicit `false` skips
#                                # rendering entirely (safe decommission)
#     hookDeletePolicy: BeforeHookCreation   # optional override
#     image:
#       repository: ""
#       tag: "latest"
#     command: []
#     args: []
#     env: []
#     envFrom: []                # auto-appends the InfisicalSecret secretRef
#                                 # when infisical.enabled, same as the Deployment
#     resources: {}

# Per-app Grafana log alert rules. Renders a ConfigMap labeled
# grafana_alert: "1", picked up dynamically by Grafana's alerts sidecar
# (sidecar.alerts, see gitops/platform/values/grafana/values.yaml) — apps
# declare *when* to alert, routing stays owned by the platform (shared
# Discord contact point + notification policy, defined once in Grafana's
# own values, not repeated per app). `uid` only needs to be unique within
# this app — the chart prefixes it with the release name so cluster-wide
# collisions across apps aren't a footgun app authors have to think about.
logAlerts:
  enabled: false
  # Loki datasource uid is fixed cluster-wide — see the `Loki` entry in
  # gitops/platform/values/grafana/values.yaml's datasources list.
  datasourceUid: ds-loki
  rules: []
  # rules:
  #   - uid: high-5xx-rate               # unique within this app
  #     title: High 5xx rate
  #     # LogQL aggregations (sum/count/rate) work with instant queryType.
  #     # Use `by (label)` to group and include labels in notifications.
  #     expr: 'sum by (pod) (rate({namespace="myapp"} |~ "(?i) 5\\d\\d " [5m]))'
  #     threshold: 0.2
  #     for: 5m                          # optional, defaults to 5m
  #     severity: warning                # optional, defaults to warning

# Per-app Grafana dashboards. Renders a ConfigMap labeled
# grafana_dashboard: "1", picked up dynamically by Grafana's dashboards
# sidecar (sidecar.dashboards, see
# gitops/platform/values/grafana/values.yaml) — apps ship their own
# dashboard JSON from their own repo without touching platform files. All
# synced dashboards land in Grafana's default ("General") folder — no
# per-app or dedicated folder until someone sets one up with a way to
# guarantee it exists first (see the sidecar.dashboards comment).
dashboards:
  enabled: false
  items: {}
  # items:
  #   overview: |
  #     { "title": "My App Overview", "panels": [...], ... }

# Irregular / one-time scripts. Rendered as suspended CronJobs (suspend:
# true — a schedule is syntactically required but never fires on its own);
# triggered on demand via `kubectl create job --from=cronjob/<release>-<name>
# <run-id>`. `lastRunTag` is a ledger field the chart never reads — CI
# writes it back once a run against that tag has succeeded.
oneOffJobs: {}
# oneOffJobs:
#   dbCheck:
#     image:
#       repository: ""
#       tag: "latest"
#     command: []
#     args: []
#     env: []
#     envFrom: []
#     resources: {}
#     lastRunTag: null
