{{- if .Values.logAlerts.enabled }}
{{- if not .Values.logAlerts.rules }}
{{- fail "logAlerts.enabled is true but logAlerts.rules is empty" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common-app-chart.labels" . | nindent 4 }}
    grafana_alert: "1"
data:
  {{ .Release.Name }}-rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: {{ .Release.Name }}-log-alerts
        folder: GitOps Alerts
        interval: 1m
        rules:
          {{- range .Values.logAlerts.rules }}
          - uid: {{ printf "%s-%s" $.Release.Name (required "logAlerts rule: uid is required" .uid) }}
            title: {{ required "logAlerts rule: title is required" .title | quote }}
            condition: C
            for: {{ .for | default "5m" }}
            noDataState: OK
            # Alerting here means a Loki query failure — datasource down/
            # unreachable, nothing to do with the app — fires this rule as if
            # the app itself failed. Confirmed live 2026-08-24: k8s-worker-02
            # went NotReady (network partition), platform-loki-0 got stuck
            # Terminating on it with nowhere to reschedule, and every
            # logAlerts rule querying ds-loki (wedding-2026's "provider
            # failing" among them) fired on the query error alone — zero
            # matching log lines, zero evidence of a real app problem. OK
            # means a Loki outage goes quiet here instead of masquerading as
            # an app failure; the node/datasource outage itself has its own
            # signal (KubeNodeNotReady et al), so nothing goes unmonitored.
            execErrState: OK
            labels:
              severity: {{ .severity | default "warning" }}
              app: {{ $.Release.Name }}
            annotations:
              summary: {{ printf "%s (%s)" .title $.Release.Name | quote }}
            data:
              - refId: A
                datasourceUid: {{ $.Values.logAlerts.datasourceUid }}
                relativeTimeRange:
                  from: 300
                  to: 0
                model:
                  queryType: instant
                  expr: {{ required "logAlerts rule: expr is required" .expr | quote }}
                  intervalMs: 60000
                  maxDataPoints: 43200
              # Instant queryType: LogQL aggregations (sum/count/rate) return
              # instant vectors, not time series. queryType: range + aggregated
              # expr caused eval errors ("invalid format...looks like time
              # series data"), execErrState: Alerting converted to fake FIRING.
              # Instant query return single value per series at eval time;
              # reduce step extract that value, carry labels (pod, msg) to C
              # for threshold eval and notification.
              - refId: B
                datasourceUid: __expr__
                model:
                  type: reduce
                  expression: A
                  reducer: last
              - refId: C
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: B
                  conditions:
                    - evaluator:
                        type: gt
                        params: [{{ required "logAlerts rule: threshold is required" .threshold }}]
          {{- end }}
{{- end }}
