{{- if .Values.dashboards.enabled }}
{{- if not .Values.dashboards.items }}
{{- fail "dashboards.enabled is true but dashboards.items is empty" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana-dashboards
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common-app-chart.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  {{- range $name, $json := .Values.dashboards.items }}
  {{ printf "%s-%s.json" $.Release.Name $name }}: |
    {{- $json | nindent 4 }}
  {{- end }}
{{- end }}
