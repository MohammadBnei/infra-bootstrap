{{- if and .Values.ingress.enabled .Values.ingress.hostname }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common-app-chart.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`{{ .Values.ingress.hostname }}`)
    services:
    - name: {{ .Release.Name }}
      port: {{ .Values.service.port }}
    {{- /*
      Baseline middlewares are PREPENDED to whatever the app declares, never
      replace it. Traefik applies middlewares left to right, and the order is
      cheapest-rejection-first: origin lock (drop anything that did not come
      through Cloudflare), then rate limiting, then response headers, then the
      app's own chain (auth, stripPrefix, ...). Putting the origin lock last
      would mean rate-limiting and header work on traffic about to be 403'd.

      Rendered by templates/middleware.yaml in this same release, so there is
      no cross-Application ordering race. Opt out per app with
      ingress.baseline.enabled: false in that app's values file — which works
      for the external-repo apps too, since their values.yaml is a real source.
    */}}
    {{- $mw := list }}
    {{- if .Values.ingress.baseline.enabled }}
    {{- if .Values.ingress.baseline.originLock.enabled }}
    {{- $mw = append $mw (dict "name" (printf "%s-baseline-originlock" .Release.Name) "namespace" .Release.Namespace) }}
    {{- end }}
    {{- if .Values.ingress.baseline.rateLimit.enabled }}
    {{- $mw = append $mw (dict "name" (printf "%s-baseline-ratelimit" .Release.Name) "namespace" .Release.Namespace) }}
    {{- end }}
    {{- if .Values.ingress.baseline.headers.enabled }}
    {{- $mw = append $mw (dict "name" (printf "%s-baseline-headers" .Release.Name) "namespace" .Release.Namespace) }}
    {{- end }}
    {{- end }}
    {{- $mw = concat $mw (.Values.ingress.middlewares | default list) }}
    {{- with $mw }}
    middlewares:
      {{- toYaml . | nindent 4 }}
    {{- end }}
  tls:
    certResolver: {{ .Values.ingress.certResolver }}
{{- end }}
