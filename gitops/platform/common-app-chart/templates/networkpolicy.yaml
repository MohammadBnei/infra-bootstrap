{{- /*
Standard A3: an app that trusts a raw X-authentik-* header must only be
reachable from Traefik, and only on a ClusterIP Service (NodePort/LB traffic
arrives as the node's host identity, which the policy admits). A necessary
condition, not a sufficient one: see networkPolicy in values.yaml.
*/ -}}
{{- $from := (.Values.networkPolicy | default dict).ingressFrom | default list }}
{{- if not (kindIs "slice" $from) }}
{{- fail "networkPolicy.ingressFrom must be a list of namespaces, e.g. [traefik]" }}
{{- end }}
{{- if (.Values.auth | default dict).trustsHeaders }}
{{- if not (and (eq (len $from) 1) (eq (index $from 0) "traefik")) }}
{{- fail "auth.trustsHeaders: true needs networkPolicy.ingressFrom: [traefik] exactly (standard A3: any other admitted namespace can forge X-authentik-* headers)" }}
{{- end }}
{{- if ne (.Values.service.type | default "ClusterIP") "ClusterIP" }}
{{- fail "auth.trustsHeaders: true needs service.type: ClusterIP (standard A3: NodePort/LoadBalancer traffic arrives as the host identity, which the NetworkPolicy admits)" }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.hostname }}
{{- if not (include "common-app-chart.hasForwardAuth" (.Values.ingress.middlewares | default list)) }}
{{- fail "auth.trustsHeaders: true with an IngressRoute needs a *-forwardauth Middleware in ingress.middlewares (standard A3: without forwardAuth, Traefik passes a client's X-authentik-* headers through)" }}
{{- end }}
{{- end }}
{{- /* extraRoutes (extra-ingressroutes.yaml) is the guarded way to add a
route; a hand-written one in extraManifests is not checked, so refuse it.
Matches IngressRouteTCP/UDP too: they bypass forwardAuth as well. */ -}}
{{- range .Values.extraManifests }}
{{- if regexMatch "(?m)^\\s*kind:\\s*IngressRoute" (toString .) }}
{{- fail "auth.trustsHeaders: true refuses an IngressRoute in extraManifests (standard A3: the chart cannot check its forwardAuth); declare it in ingress.extraRoutes instead" }}
{{- end }}
{{- end }}
{{- end }}
{{- if $from }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common-app-chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "common-app-chart.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    {{- range $from }}
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ . | quote }}
    {{- end }}
    ports:
    - port: {{ .Values.service.port }}
      protocol: TCP
{{- end }}
