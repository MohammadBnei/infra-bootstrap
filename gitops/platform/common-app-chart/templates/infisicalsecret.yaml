{{- if .Values.infisical.enabled }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ .Release.Name }}-infisical
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common-app-chart.labels" . | nindent 4 }}
  annotations:
    # A PreSync hook Job (see hooks.yaml) that auto-inherits this CR's
    # managed secret via envFrom would otherwise deadlock: PreSync always
    # runs before the normal Sync phase, and this CR — the thing that
    # actually creates the secret — is itself a normal Sync-phase
    # resource. Making it a PreSync hook (no delete-policy, so it's never
    # cleaned up — it persists like any other resource) with an earlier
    # weight than hook Jobs default to breaks that deadlock: it applies
    # first within PreSync, giving the Infisical operator a head start
    # before any hook Job's pod is created. Same class of ordering bug as
    # the Longhorn preUpgradeChecker incident (gitops/platform/values/
    # longhorn/values.yaml) — a hook depending on a resource that only
    # exists in a later phase.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
spec:
  hostAPI: {{ .Values.infisical.hostAPI }}
  resyncInterval: {{ .Values.infisical.resyncInterval }}
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: {{ required "infisical.projectSlug is required when infisical.enabled is true" .Values.infisical.projectSlug | quote }}
        envSlug: {{ .Values.infisical.envSlug }}
        secretsPath: {{ .Values.infisical.secretsPath | quote }}
      credentialsRef:
        secretName: {{ .Values.infisical.credentialsRef.secretName }}
        secretNamespace: {{ .Values.infisical.credentialsRef.secretNamespace }}
  managedSecretReference:
    secretName: {{ include "common-app-chart.infisicalSecretName" . }}
    secretNamespace: {{ .Release.Namespace }}
    creationPolicy: Orphan
{{- end }}
