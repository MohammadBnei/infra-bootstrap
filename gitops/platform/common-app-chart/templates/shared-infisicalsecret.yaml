{{- if .Values.sharedSecrets.keys }}
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: {{ .Release.Name }}-commons
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common-app-chart.labels" . | nindent 4 }}
  annotations:
    # Deliberately NOT a PreSync hook, unlike infisicalsecret.yaml. ArgoCD
    # never prunes hook resources, so a hook here would keep syncing
    # platform-commons into this namespace forever after `sharedSecrets.keys`
    # is cleared — revocation through git would be impossible, and git is the
    # only control surface this repo has. The cost of being a normal
    # Sync-phase resource is that PreSync hook Jobs cannot see these keys
    # (PreSync completes before Sync begins); that is why jobContainer in
    # _helpers.tpl does not inherit this secret. Hooks keep using the app's
    # own Infisical project.
    argocd.argoproj.io/sync-wave: "-10"
spec:
  hostAPI: {{ .Values.infisical.hostAPI }}
  resyncInterval: {{ .Values.infisical.resyncInterval }}
  authentication:
    universalAuth:
      secretsScope:
        # projectSlug/envSlug are literals on purpose — NOT .Values. App
        # values.yaml files live in seven repos this one does not review, and
        # ArgoCD auto-syncs them. A values-driven project would let any of
        # those repos point this CR at infra-bootstrap-1-ge1 and read PVE
        # tokens or CA_PIGSTY_KEY into a pod with no PR here. Containment is
        # "platform-commons holds only app-safe keys", not the key list below.
        projectSlug: "platform-commons"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: {{ .Values.infisical.credentialsRef.secretName }}
        secretNamespace: {{ .Values.infisical.credentialsRef.secretNamespace }}
  managedSecretReference:
    secretName: {{ .Release.Name }}-commons
    secretNamespace: {{ .Release.Namespace }}
    # Owner, not Orphan: clearing sharedSecrets.keys must actually remove the
    # secret, not leave the last-synced values behind. See the annotation above.
    creationPolicy: Owner
    template:
      data:
        {{- range .Values.sharedSecrets.keys }}
        {{ . }}: "{{ printf "{{ .%s.Value }}" . }}"
        {{- end }}
{{- end }}
