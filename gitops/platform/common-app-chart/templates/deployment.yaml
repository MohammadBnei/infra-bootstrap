apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  {{- /* dataLifecycle (values.yaml): pii becomes a label, the free-text
  fields annotations. Deployment metadata only, so opting in rolls no pod.
  Every set field must be a string: an int or a YAML 1.1 bool (`no`) would
  render a non-string annotation the API server rejects, or vanish. */}}
  {{- $pii := "" }}
  {{- $dl := dict }}
  {{- with .Values.dataLifecycle }}
  {{- if not (kindIs "map" .) }}{{ fail "dataLifecycle must be a map of pii, backup, retention, decommission" }}{{ end }}
  {{- range $k, $v := . }}
  {{- if not (has $k (list "pii" "backup" "retention" "decommission")) }}{{ fail (printf "dataLifecycle.%s is not a known key (pii, backup, retention, decommission)" $k) }}{{ end }}
  {{- if not (kindIs "invalid" $v) }}
  {{- if not (kindIs "string" $v) }}{{ fail (printf "dataLifecycle.%s must be a string; quote it" $k) }}{{ end }}
  {{- if eq $k "pii" }}
  {{- if not (has $v (list "none" "personal" "sensitive")) }}{{ fail (printf "dataLifecycle.pii must be none, personal or sensitive, not %q" $v) }}{{ end }}
  {{- $pii = $v }}
  {{- else if $v }}
  {{- $_ := set $dl (printf "data.bnei.dev/%s" $k) $v }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  labels:
    {{- include "common-app-chart.labels" . | nindent 4 }}
    {{- with $pii }}
    data.bnei.dev/pii: {{ . | quote }}
    {{- end }}
  {{- $annotations := .Values.annotations | default dict }}
  {{- if .Values.infisical.autoReload }}
  {{- $annotations = merge (dict "secrets.infisical.com/auto-reload" "true") $annotations }}
  {{- end }}
  {{- /* $dl is a fresh dict and the merge destination, so .Values.annotations
  is never mutated, and dataLifecycle wins over a hand-set
  annotations["data.bnei.dev/..."] key. */}}
  {{- if $dl }}
  {{- $annotations = merge $dl $annotations }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "common-app-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common-app-chart.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- $automount := .Values.automountServiceAccountToken }}
      {{- if not (kindIs "invalid" $automount) }}
      {{- if not (kindIs "bool" $automount) }}
      {{- fail "automountServiceAccountToken must be true, false or unset (a bool, not a string)" }}
      {{- end }}
      automountServiceAccountToken: {{ $automount }}
      {{- end }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /*
        `tpl` rather than a bare `toYaml`, so an init container can reference
        .Values.image.tag instead of hardcoding a tag that then drifts on every
        image bump — which is the whole point when the init container IS the
        app image (ADR-0045's model fetch). A Go-template comment, not a YAML
        one, so it does not land in every rendered manifest and ArgoCD diff.
      */}}
      {{- with .Values.initContainers }}
      initContainers:
        {{- tpl (toYaml .) $ | nindent 6 }}
      {{- end }}
      containers:
      - name: {{ .Release.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        {{- with .Values.args }}
        args:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.securityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.service.port }}
          name: http
        {{- with .Values.env }}
        env:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if or .Values.envFrom .Values.infisical.enabled .Values.sharedSecrets.keys }}
        envFrom:
          {{- /* Commons is listed FIRST on purpose: envFrom is last-wins on
                 duplicate keys, so the shared layer is the weakest and anything
                 app-specific — envFrom, the app's own Infisical secret, or an
                 explicit env: entry — shadows it. */}}
          {{- if .Values.sharedSecrets.keys }}
          - secretRef:
              name: {{ .Release.Name }}-commons
          {{- end }}
          {{- with .Values.envFrom }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- if .Values.infisical.enabled }}
          - secretRef:
              name: {{ include "common-app-chart.infisicalSecretName" . }}
          {{- end }}
        {{- end }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .Values.livenessProbe.enabled }}
        livenessProbe:
          {{- if eq .Values.livenessProbe.type "http" }}
          httpGet:
            path: {{ .Values.livenessProbe.path }}
            port: {{ default .Values.service.port .Values.livenessProbe.port | int }}
          {{- else if eq .Values.livenessProbe.type "tcp" }}
          tcpSocket:
            port: {{ default .Values.service.port .Values.livenessProbe.port | int }}
          {{- end }}
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
        {{- end }}
        {{- if .Values.readinessProbe.enabled }}
        readinessProbe:
          {{- if eq .Values.readinessProbe.type "http" }}
          httpGet:
            path: {{ .Values.readinessProbe.path }}
            port: {{ default .Values.service.port .Values.readinessProbe.port | int }}
          {{- else if eq .Values.readinessProbe.type "tcp" }}
          tcpSocket:
            port: {{ default .Values.service.port .Values.readinessProbe.port | int }}
          {{- end }}
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
        {{- end }}
        {{- if or .Values.persistence.enabled .Values.extraVolumeMounts }}
        volumeMounts:
        {{- if .Values.persistence.enabled }}
        - name: data
          mountPath: {{ .Values.persistence.mountPath }}
        {{- end }}
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- if or .Values.persistence.enabled .Values.extraVolumes }}
      volumes:
      {{- if .Values.persistence.enabled }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}
      {{- end }}
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
