# Grants the actions-runner ServiceAccount (namespace: actions-runner)
# just enough access in `vos` to trigger and observe oneOffJobs runs.
# Extend with a new rbac-<namespace>.yaml file per namespace that wires up
# oneOffJobs — do not widen this to a ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oneoff-job-runner
  namespace: vos
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oneoff-job-runner
  namespace: vos
subjects:
- kind: ServiceAccount
  name: actions-runner
  namespace: actions-runner
roleRef:
  kind: Role
  name: oneoff-job-runner
  apiGroup: rbac.authorization.k8s.io
