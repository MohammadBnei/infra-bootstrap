# Sources the runner's GitHub PAT (see README.md's one-time human setup)
# from Infisical, same shape/credentialsRef as common-app-chart's own
# infisicalsecret.yaml template. Project `actions-runner` (slug
# actions-runner-x-qbo, id b9043dd5-2956-43e4-9f1b-e9bf7a8e1edc) — see
# docs/secrets.md's "Per-app Infisical projects" table.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: actions-runner-infisical
  namespace: actions-runner
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "actions-runner-x-qbo"
        envSlug: prod
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: actions-runner-infisical
    secretNamespace: actions-runner
    creationPolicy: Orphan
