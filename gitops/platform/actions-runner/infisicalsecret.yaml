# Sources the runner's GitHub PAT (see README.md's one-time human setup)
# from Infisical, same shape/credentialsRef as common-app-chart's own
# infisicalsecret.yaml template — projectSlug/secretsPath are placeholders,
# fill in once the "actions-runner" Infisical project exists (or reuse an
# existing one and point secretsPath at a subdirectory).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: actions-runner-infisical
  namespace: actions-runner
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "TODO-actions-runner-project-slug"
        envSlug: prod
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: actions-runner-infisical
    secretNamespace: actions-runner
    creationPolicy: Orphan
