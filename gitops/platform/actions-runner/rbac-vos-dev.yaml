# Same grant as rbac-vos.yaml, for the vos-dev namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: oneoff-job-runner
  namespace: vos-dev
rules:
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oneoff-job-runner
  namespace: vos-dev
subjects:
- kind: ServiceAccount
  name: actions-runner
  namespace: actions-runner
roleRef:
  kind: Role
  name: oneoff-job-runner
  apiGroup: rbac.authorization.k8s.io
