# Sources the runner's GitHub PAT from Infisical — same project, shape and
# credentialsRef as gitops/platform/actions-runner/infisicalsecret.yaml.
# Deliberately the same project (`actions-runner`, slug actions-runner-x-qbo,
# id b9043dd5-2956-43e4-9f1b-e9bf7a8e1edc — see docs/secrets.md): the runner
# registration token is derived from a user-scoped PAT, so one PAT registers
# a runner against any repo this account owns. Splitting the *identity* was
# the point of ADR-0034's second runner (see deployment.yaml); splitting the
# PAT would buy nothing, since GitHub can't scope a PAT to "register runners
# on one repo" anyway.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: build-runner-infisical
  namespace: build-runner
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "actions-runner-x-qbo"
        envSlug: prod
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: build-runner-infisical
    secretNamespace: build-runner
    creationPolicy: Orphan
