# Sources the runner's GitHub PAT from Infisical — same project, shape and
# credentialsRef as gitops/platform/actions-runner/infisicalsecret.yaml.
#
# The key consumed is UKUBI_BOT_GH_PAT (the argocd-ukubi-bot account), not
# actions-runner's ACCESS_TOKEN. It is *duplicated* into this small project
# from infra-bootstrap-1-ge1, deliberately: pointing an InfisicalSecret at
# the main project would sync PVE_API_TOKEN, K8S_BREAK_GLASS_TOKEN and
# GARAGE_ROOT_TOKEN into a Secret sitting in the namespace whose pod runs
# untrusted build content. docs/secrets.md's per-app-project section already
# names that as the reason small projects exist. The cost is a rotation
# trap — the two copies must move together, and docs/secrets.md says so.
#
# Deliberately the `actions-runner` project (slug actions-runner-x-qbo, id
# b9043dd5-2956-43e4-9f1b-e9bf7a8e1edc — see docs/secrets.md) rather than a
# third project: it is already the "runner registration credentials" blast
# radius, and both runners belong in it. Splitting the *pod identity* was
# ADR-0034's point (see deployment.yaml's missing serviceAccountName), not
# splitting the secret store.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: build-runner-infisical
  namespace: build-runner
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "actions-runner-x-qbo"
        envSlug: prod
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: build-runner-infisical
    secretNamespace: build-runner
    creationPolicy: Orphan
