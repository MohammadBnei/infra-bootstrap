# Sources the runner's GitHub PAT from Infisical — same project, shape and
# credentialsRef as gitops/platform/actions-runner/infisicalsecret.yaml.
#
# Deliberately the `actions-runner` project (slug actions-runner-x-qbo, id
# b9043dd5-2956-43e4-9f1b-e9bf7a8e1edc — see docs/secrets.md), sharing
# ACCESS_TOKEN with the other runner rather than getting its own project or
# reading the main one. Two reasons:
#   - That project is already the "runner registration credentials" blast
#     radius, and both runners belong in it. An InfisicalSecret pointed at
#     infra-bootstrap-1-ge1 would sync PVE_API_TOKEN, K8S_BREAK_GLASS_TOKEN
#     and GARAGE_ROOT_TOKEN into a Secret sitting in the namespace whose pod
#     runs untrusted build content — docs/secrets.md's per-app-project
#     section names exactly that as why small projects exist.
#   - GitHub can't scope a PAT to "register runners on one repo" *and* have
#     the holder be anyone but the repo owner (personal-account repos have
#     no admin-collaborator role at all), so a separate token here would
#     have the same reach anyway. One token, widened to two repos.
#
# Splitting the *pod identity* was ADR-0034's point (see deployment.yaml's
# missing serviceAccountName), not splitting the secret store.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: build-runner-infisical
  namespace: build-runner
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "actions-runner-x-qbo"
        envSlug: prod
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: build-runner-infisical
    secretNamespace: build-runner
    creationPolicy: Orphan
