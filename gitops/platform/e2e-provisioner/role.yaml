# Namespaced Role only — never a ClusterRole (same constraint
# actions-runner's rbac-vos.yaml documents). Scoped to exactly what
# e2e-provisioner needs to create/tear down one task's e2e pod: the Pod
# itself, its Service, and its Traefik IngressRoute/Middleware (StripPrefix
# for path-based routing under the one static e2e host — see docs/adr/0012
# in agent-fleet). No Secret access: preview auth reuses the existing
# basic-admin-auth Middleware, no per-session secret is ever minted.
#
# The worker pods themselves never get any of this — this Role is the ONLY
# RBAC surface in the whole fleet that can create/delete cluster resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2e-provisioner
  namespace: agent-fleet
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: ["traefik.io"]
  resources: ["ingressroutes", "middlewares"]
  verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-provisioner
  namespace: agent-fleet
subjects:
- kind: ServiceAccount
  name: e2e-provisioner
  namespace: agent-fleet
roleRef:
  kind: Role
  name: e2e-provisioner
  apiGroup: rbac.authorization.k8s.io
