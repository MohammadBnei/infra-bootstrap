# e2e-runner's image tag is a floating :latest for v1, same accepted
# trade-off as actions-runner's myoung34/github-runner:latest — its
# Deployment lives here in infra-bootstrap, outside agent-fleet's own CI
# auto-bump (see docs/adr/0012 in agent-fleet).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e2e-provisioner
  namespace: agent-fleet
  labels:
    app.kubernetes.io/part-of: agent-fleet
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: e2e-provisioner
  template:
    metadata:
      labels:
        app: e2e-provisioner
        app.kubernetes.io/part-of: agent-fleet
    spec:
      serviceAccountName: e2e-provisioner
      containers:
      - name: e2e-provisioner
        image: mohammaddocker/agent-fleet-e2e-provisioner:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: NAMESPACE
          value: agent-fleet
        - name: E2E_RUNNER_IMAGE
          value: mohammaddocker/agent-fleet-e2e-runner:latest
        - name: E2E_HOST
          value: e2e.bnei.dev
        - name: PORT
          value: "8080"
        # @kubernetes/client-node hands fetch() a Node-style https.Agent
        # carrying the in-cluster CA — Bun's fetch doesn't honor a custom
        # Agent passed that way, so it falls back to the default trust
        # store and every K8s API call fails with "unable to verify the
        # first certificate" (confirmed live, and matches oven-sh/bun#7332).
        # Pointing Bun's own CA trust at the same CA file already projected
        # into every pod fixes it without touching client-node. Both vars
        # set together — some Bun versions only honor NODE_EXTRA_CA_CERTS
        # when NODE_USE_SYSTEM_CA is also set.
        - name: NODE_EXTRA_CA_CERTS
          value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        - name: NODE_USE_SYSTEM_CA
          value: "1"
        envFrom:
        - secretRef:
            name: e2e-provisioner-infisical
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
