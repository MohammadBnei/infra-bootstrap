# Reuses agent-fleet's existing Infisical project (same one worker/bot pull
# AGENTFLEET_DB_* from via common-app-chart's own infisicalsecret.yaml
# template) — same shape, applied as a plain manifest since e2e-provisioner
# isn't a common-app-chart app.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: e2e-provisioner-infisical
  namespace: agent-fleet
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: agent-fleet-nygh
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: e2e-provisioner-infisical
    secretNamespace: agent-fleet
    creationPolicy: Orphan
