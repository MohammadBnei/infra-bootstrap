# The game's identity in the cluster (ADR-0069 part 1). Its token is the
# projected, auto-rotated one the kubelet mounts; no long-lived token Secret
# and no kubeconfig exist for it anywhere. The game's Deployment runs as this
# account (serviceAccountName: ukubi-game), set by the change that deploys it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ukubi-game
  namespace: ukubi-game
