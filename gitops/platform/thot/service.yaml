# ClusterIP only — reached directly by worker sidecars' gRPC client (Phase
# 4) and, once wired, Alertmanager's webhook (Phase 6). Never exposed
# outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: thot
  namespace: thot
spec:
  selector:
    app: thot
  ports:
  - name: grpc
    port: 9090
    targetPort: 9090
  - name: http
    port: 8080
    targetPort: 8080
