# ClusterIP only — reached by thot session pods (ordinary worker pods in
# the agent-fleet namespace) running kubectl through the executor. Never
# exposed outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: thot-executor
  namespace: thot
spec:
  selector:
    app: thot-executor
  ports:
  - name: grpc
    port: 9090
    targetPort: 9090
  - name: http
    port: 8080
    targetPort: 8080
