# Sources thot's own credentials from Infisical — its own narrowly-scoped
# project (per docs/secrets.md's "Per-app Infisical projects" pattern),
# not the shared agent-fleet-nygh project, so a compromised thot grant
# can't reach agent-fleet's own secrets or vice versa. Project slug is a
# placeholder pending one-time human setup — see README.md.
#
# Phase 2 only needs a Claude Code credential (CLAUDE_CODE_OAUTH_TOKEN,
# subscription OAuth, same "not a metered API key" rule worker/ follows —
# see docs/DECISIONS.md). Discord/git-identity secrets are added to this
# same project in later phases, not a new project each time.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: thot-executor-infisical
  namespace: thot
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "thot-smmx"
        # dev, not prod: every other agent-fleet component (core,
        # provisioner, agent-fleet-nygh) reads from `dev`, and this file
        # originally copied actions-runner's `prod` by mistake. The result
        # was a pod with THOT_AUTH_TOKEN but no CLAUDE_CODE_OAUTH_TOKEN,
        # so the agent booted and answered "Not logged in · Please run
        # /login" (confirmed live 2026-08-11).
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: thot-executor-infisical
    secretNamespace: thot
    creationPolicy: Orphan
