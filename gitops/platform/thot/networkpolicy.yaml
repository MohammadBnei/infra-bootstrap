# Ingress scoped to the agent-fleet namespace, where thot session pods now
# live as ordinary worker pods (ADR-0037). This is the boundary that
# matters most in the fleet: anything that can reach this port runs
# kubectl with the executor's ClusterRole, so it stays as narrow as the
# design allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: thot-executor
  namespace: thot
spec:
  podSelector:
    matchLabels:
      app: thot-executor
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: agent-fleet
    ports:
    - protocol: TCP
      port: 9090
