# Image built by agent-fleet's own CI (executor/Dockerfile) but deployed from
# this repo's manifests — same cross-repo image-tag-drift trade-off
# ADR-0012 already accepted for e2e-provisioner/e2e-runner (floating tag,
# not auto-bumped by agent-fleet's docker.yml deploy job, since that job
# only ever touches agent-fleet's own k8s/*.yaml). Bump the tag here by
# hand until/unless that's automated.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thot-executor
  namespace: thot
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: thot-executor
  template:
    metadata:
      labels:
        app: thot-executor
    spec:
      serviceAccountName: thot
      containers:
      - name: executor
        image: mohammaddocker/agent-fleet-executor:latest
        ports:
        - name: grpc
          containerPort: 9090
        - name: http
          containerPort: 8080
        env:
        - name: GRPC_PORT
          value: "9090"
        - name: HTTP_PORT
          value: "8080"
        envFrom:
        - secretRef:
            name: thot-executor-infisical
        # No startupProbe needed anymore: the executor is a plain Go
        # process with nothing slow to initialise, unlike the Agent SDK
        # session this Deployment used to run.
        # /healthz is unconditional now — there is no session to wait on.
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        # /livez stays separate from /healthz on principle — the lesson
        # from thot's crashloop (2026-08-11): a liveness probe that waits
        # on a slow dependency kills the pod before it can ever finish.
        livenessProbe:
          httpGet:
            path: /livez
            port: 8080
          periodSeconds: 20
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
