# ArgoCD's CreateNamespace=true sync option only auto-creates the
# Application's own destination.namespace (which redirectors-application.yaml
# deliberately leaves as "default", since each redirect owns its own
# namespace) - so each redirect must declare its namespace explicitly.
apiVersion: v1
kind: Namespace
metadata:
  name: proxmox
---
apiVersion: v1
kind: Service
metadata:
  name: proxmox
  namespace: proxmox
spec:
  type: ClusterIP
  ports:
  - port: 8006
    targetPort: 8006
    protocol: TCP
    name: https
  # No selector - backend is a bare LAN IP, not a pod
---
apiVersion: v1
kind: Endpoints
metadata:
  name: proxmox
  namespace: proxmox
subsets:
- addresses:
  - ip: "192.168.1.165"
  ports:
  - port: 8006
    name: https
    protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: proxmox
  namespace: proxmox
  labels:
    kubernetes.io/service-name: proxmox
addressType: IPv4
ports:
- name: https
  protocol: TCP
  port: 8006
endpoints:
- addresses:
  - "192.168.1.165"
  conditions:
    ready: true
    serving: true
---
# Proxmox's pveproxy serves a self-signed cert - skip verifying it on the
# upstream hop (the client-facing hop still gets a real cert via Traefik's
# "le" ACME resolver, wired below).
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: proxmox-insecure
  namespace: proxmox
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: proxmox
  namespace: proxmox
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`proxmox.bnei.dev`)
    services:
    - name: proxmox
      port: 8006
      scheme: https
      serversTransport: proxmox-insecure
    # middlewares: []   # add Traefik Middleware refs here, e.g.
    #   - name: basic-admin-auth
    #     namespace: default
  tls:
    certResolver: le
