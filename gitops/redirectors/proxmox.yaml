# ArgoCD's CreateNamespace=true sync option only auto-creates the
# Application's own destination.namespace (which redirectors-application.yaml
# deliberately leaves as "default", since each redirect owns its own
# namespace) - so each redirect must declare its namespace explicitly.
apiVersion: v1
kind: Namespace
metadata:
  name: proxmox
---
# ExternalName, not ClusterIP+Endpoints/EndpointSlice: ArgoCD's argocd-cm
# excludes both Endpoints and EndpointSlice cluster-wide (standard
# resource.exclusions tuning, to cut watch/UI churn from the
# control-plane-managed ones) - so a hand-authored Endpoints/EndpointSlice
# pair is silently dropped on every sync, leaving Traefik with no backend
# ("no available server"). ExternalName needs neither - Traefik's
# kubernetesCRD provider resolves spec.externalName directly.
apiVersion: v1
kind: Service
metadata:
  name: proxmox
  namespace: proxmox
spec:
  type: ExternalName
  # pve.bnei.lan round-robins across all 3 corosync members (Pi-hole DNS,
  # not a health-aware VIP) - see ansible/playbooks/pihole-configure.yml.
  externalName: "192.168.1.200"
  ports:
  - port: 8006
    protocol: TCP
    name: https
---
# Proxmox's pveproxy serves a self-signed cert - skip verifying it on the
# upstream hop (the client-facing hop still gets a real cert via Traefik's
# "le" ACME resolver, wired below).
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: proxmox-insecure
  namespace: proxmox
spec:
  insecureSkipVerify: true
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: proxmox
  namespace: proxmox
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`proxmox.bnei.dev`)
    services:
    - name: proxmox
      port: 8006
      scheme: https
      serversTransport: proxmox-insecure
    # ADR-0038: proxmox.bnei.dev is a HYPERVISOR ROOT LOGIN reachable from the
    # internet. The origin lock is not optional here — without it, anyone who
    # knows 82.65.231.50 reaches this login form directly, skipping the WAF,
    # geo rules and bot checks entirely.
    #
    # It is NOT authentication. ADR-0039 puts authentik forwardAuth in front of
    # this host and requires a WebAuthn passkey; until that lands, PVE's own
    # login is still the only credential check.
    middlewares:
    - name: cloudflare-origin-lock
      namespace: default
    #   - name: basic-admin-auth
    #     namespace: default
  tls:
    certResolver: le
