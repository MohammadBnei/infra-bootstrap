# User app registry — single source of truth for apps.applicationset.yaml
#
# IMPORTANT: when you add or remove an entry here, mirror the change in
# bootstrap/apps.applicationset.yaml (spec.generators[0].list.elements).
#
# Schema:
#   name        ArgoCD Application name (lowercase, dashes only)
#   namespace   Target namespace (created automatically)
#   syncWave    All user apps at wave 10 (after platform is ready)
#   repoURL     Per-app private git repo with values.yaml (HTTPS + PAT auth via
#               repo-creds-github-bnei, manually injected by
#               register-repos.yml — SSH deploy keys are deliberately not
#               used here, see gitops/README.md's credential-chain section)
#   valuesPath  List of 1 or 2 values file paths inside repoURL, layered in
#               order (the override wins — Helm deep-merges maps, replaces
#               lists wholesale). The shared ApplicationSet template has a
#               fixed 2-slot valueFiles (ArgoCD Go-templates string fields,
#               not a variable-length YAML list) — give it one path for a
#               single values file, or [base, override] for a multi-env app
#               (e.g. vos-monolith-dev). One registry entry is still always
#               one Application/one env.
#   targetRevision  Literal branch name in repoURL to read valuesPath from —
#               always a real branch (e.g. `main`), never the symbolic
#               `HEAD`. Found live: HEAD silently tracks whatever GitHub
#               calls the "default branch", which is NOT necessarily where
#               an app's prod CI actually pushes (vos-monolith's default
#               branch is `dev`; prod tag bumps go to `main`). Being
#               explicit here means the registry always states, in one
#               place, exactly which branch is live — no guessing.
#   hostname    Public hostname — passed as ingress.hostname to common-app-chart
#
# Per-app repo must have at minimum:
#   image.repository, image.tag, service.port

# n8n, openweb-ui(+pipelines), whodb, api, ukubi-ai are deferred — no
# working per-app repo yet (see docs/bootstrap-test-notes.md). Re-add once
# each has a real values.yaml; don't list a repo that doesn't exist, ArgoCD
# will just fail to clone it.

# editable-blog: test subject for validating the common-app-chart pipeline
# before the Freebox cutover (Stage 1 plan). values.yaml lives at
# helm/values.yaml in editable-blog itself.
- name: editable-blog
  namespace: editable-blog
  syncWave: "10"
  repoURL: https://github.com/MohammadBnei/editable-blog.git
  valuesPath: [helm/values.yaml]
  targetRevision: main
  hostname: blog.bnei.dev

# dream-analyst: second real per-app repo, following editable-blog's
# now-proven pipeline.
- name: dream-analyst
  namespace: dream-analyst
  syncWave: "10"
  repoURL: https://github.com/MohammadBnei/dream-analyst.git
  valuesPath: [helm/values.yaml]
  targetRevision: main
  hostname: dreamer.bnei.dev

# vos-monolith: onboarded onto Pattern C off its previous kustomize +
# imperative-Application setup — see docs/adr/ for the hooks/oneOffJobs
# chart pattern this replaced it with. targetRevision is explicitly `main`
# — vos-monolith's GitHub default branch is actually `dev`, and
# back_ci.yml's prod tag-bump pushes go to `main`, not whatever HEAD
# resolves to. (Found live: HEAD silently pointed this Application at
# `dev` branch content instead of `main`.)
- name: vos-monolith
  namespace: vos
  syncWave: "10"
  repoURL: https://github.com/MohammadBnei/vos-monolith.git
  valuesPath: [back/helm/values.yaml]
  targetRevision: main
  hostname: api.voconsteroid.com

# vos-monolith-dev: dev deployment of the same app, base values.yaml +
# dev-specific values-dev.yaml override, both from the dev branch (see
# apps.applicationset.yaml's fixed 2-slot valueFiles comment).
- name: vos-monolith-dev
  namespace: vos-dev
  syncWave: "10"
  repoURL: https://github.com/MohammadBnei/vos-monolith.git
  valuesPath: [back/helm/values.yaml, back/helm/values-dev.yaml]
  targetRevision: dev
  hostname: dev.api.voconsteroid.com

# agent-fleet: Go core (Discord ingress + planning-transcript coordination +
# Loki queries + the web dashboard's ConnectRPC API/static SPA + core's own
# gRPC server + the task dispatch loop — see agent-fleet's docs/adr/0013,
# 0014, 0015). Per agent-fleet's docs/adr/0019/0020/0021, this is now the
# ONLY agent-fleet Application driven from this registry — worker pods are
# spawned dynamically by the standalone `provisioner` Application
# (gitops/bootstrap/provisioner-application.yaml, now sourced from
# agent-fleet's own k8s/provisioner/ instead of a directory in this repo)
# rather than deployed as their own persistent per-repo Applications; the
# old dream-analyst-worker/vos-monolith-worker entries and the shared
# agent-fleet-shared-pvc they mounted are gone, replaced by the
# provisioner-owned agent-fleet-workspace PVC. Moved here from
# platform-common-apps 2026-07-31 — unlike searxng/pgweb, this repo's own
# CI needs to bump the pinned image tag on every release (k8s/*.yaml), so
# it needs a real per-app repo source, not the platform pattern's
# infra-bootstrap-only single source.
#
# Application NAME renamed agent-fleet-bot -> agent-fleet-core to match
# the workload. Previously kept as agent-fleet-bot specifically because a
# rename would cascade-delete agent-fleet-shared-pvc (the ApplicationSet's
# list generator treats a name change as delete-old/create-new, and every
# generated Application carries a cascade-delete finalizer + prune:true)
# before a "new" Application could recreate it. That PVC is gone as of
# docs/adr/0019 above — nothing stateful is attached to this Application
# anymore, so the rename is just a one-time Deployment/Service/Ingress
# recreate, not a data-loss risk.
- name: agent-fleet-core
  namespace: agent-fleet
  syncWave: "10"
  repoURL: https://github.com/MohammadBnei/agent-fleet.git
  valuesPath: [k8s/core.yaml]
  targetRevision: main
  # core also serves the agent-fleet web dashboard (ConnectRPC + static
  # SPA) — see agent-fleet's docs/adr/0014/0015. Auth is inside core itself
  # (native OIDC against authentik, ADR-0041) — not a Traefik middleware,
  # because a middleware cannot gate a worker pod calling core on the pod
  # network. The basic-admin-auth middleware this comment used to describe
  # was removed by ADR-0041's amendment. Note the ApplicationSet template's
  # Helm `parameters` override for ingress.hostname always wins over a
  # values-file setting of the same key.
  hostname: fleet.bnei.dev

- name: wedding-2026
  namespace: wedding-2026
  syncWave: "10"
  repoURL: https://github.com/MohammadBnei/wedding-2026.git
  valuesPath: [helm/values.yaml]
  targetRevision: main
  # One label deep on purpose: the proxied *.bnei.dev record and the le-dns
  # wildcard default cert cover it, so no Cloudflare change is needed. The
  # weding.bnei.dev typo host is handled by an extraManifests IngressRoute in
  # the app's own helm/values.yaml, not here.
  hostname: wedding.bnei.dev

- name: ukubi-stt
  namespace: ukubi-stt
  syncWave: "10"
  repoURL: https://github.com/MohammadBnei/ukubi-stt.git
  valuesPath: [helm/values.yaml]
  targetRevision: main
  # INERT for this app, and recorded so it is not mistaken for the live
  # source of truth: the app sets `ingress.enabled: false`, so the chart's
  # own IngressRoute never renders and this parameter goes nowhere. The real
  # route is hand-written in the app's extraManifests, because only a
  # hand-written one can carry `scheme: h2c` for a gRPC backend (ADR-0044
  # Decision 6). The value is kept accurate anyway — the ApplicationSet
  # template passes it unconditionally, and a blank here would read as "no
  # hostname" rather than "hostname lives elsewhere".
  #
  # stt.bnei.dev is GREY (DNS-only), overriding the proxied *.bnei.dev
  # wildcard — same mechanism as fleet/s3/*.ente. See docs/dns/bnei.dev.zone.
  hostname: stt.bnei.dev

# searxng and pgweb are NOT here: they're public-image tools with no
# app-specific code, so they're driven as platform apps instead — see
# gitops/bootstrap/platform-common-apps.applicationset.yaml and
# gitops/platform/values/{searxng,pgweb}/values.yaml. This registry is
# only for apps that genuinely need their own repo.
