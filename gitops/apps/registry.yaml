# User app registry — single source of truth for apps.applicationset.yaml
#
# IMPORTANT: when you add or remove an entry here, mirror the change in
# bootstrap/apps.applicationset.yaml (spec.generators[0].list.elements).
#
# Schema:
#   name        ArgoCD Application name (lowercase, dashes only)
#   namespace   Target namespace (created automatically)
#   syncWave    All user apps at wave 10 (after platform is ready)
#   repoURL     Per-app private git repo with values.yaml (HTTPS + PAT auth —
#               see argocd-github-apps-creds.yaml; SSH deploy keys are
#               deliberately not used here, see that file's comment)
#   valuesPath  List of values file paths inside repoURL, layered in order
#               (later files win — Helm deep-merges maps, replaces lists
#               wholesale). The shared ApplicationSet template only supports
#               one-element lists (ArgoCD Go-templates string fields, not a
#               variable-length YAML list); a multi-env app needing a base +
#               override file (e.g. vos-monolith-dev) must be a standalone
#               Application instead — see gitops/bootstrap/vos-monolith-dev-application.yaml.
#               One registry entry is still always one Application/one env.
#   targetRevision  Branch/tag in repoURL to read valuesPath from. Defaults
#               to `HEAD` (the repo's default branch) for single-branch
#               apps — set explicitly (e.g. `main`) for apps whose CI
#               pushes tag bumps to a branch that ISN'T the GitHub default
#               branch. Don't assume HEAD == "the production branch".
#   hostname    Public hostname — passed as ingress.hostname to common-app-chart
#
# Per-app repo must have at minimum:
#   image.repository, image.tag, service.port

# n8n, openweb-ui(+pipelines), whodb, api, ukubi-ai are deferred — no
# working per-app repo yet (see docs/bootstrap-test-notes.md). Re-add once
# each has a real values.yaml; don't list a repo that doesn't exist, ArgoCD
# will just fail to clone it.

# editable-blog: test subject for validating the common-app-chart pipeline
# before the Freebox cutover (Stage 1 plan). values.yaml lives at
# helm/values.yaml in editable-blog itself.
- name: editable-blog
  namespace: editable-blog
  syncWave: "10"
  repoURL: https://github.com/MohammadBnei/editable-blog.git
  valuesPath: [helm/values.yaml]
  targetRevision: HEAD
  hostname: blog.bnei.dev

# dream-analyst: second real per-app repo, following editable-blog's
# now-proven pipeline.
- name: dream-analyst
  namespace: dream-analyst
  syncWave: "10"
  repoURL: https://github.com/MohammadBnei/dream-analyst.git
  valuesPath: [helm/values.yaml]
  targetRevision: HEAD
  hostname: dreamer.bnei.dev

# vos-monolith: onboarded onto Pattern C off its previous kustomize +
# imperative-Application setup — see docs/adr/ for the hooks/oneOffJobs
# chart pattern this replaced it with. targetRevision is explicitly `main`
# — vos-monolith's GitHub default branch is actually `dev`, and
# back_ci.yml's prod tag-bump pushes go to `main`, not whatever HEAD
# resolves to. (Found live: HEAD silently pointed this Application at
# `dev` branch content instead of `main`.)
- name: vos-monolith
  namespace: vos
  syncWave: "10"
  repoURL: https://github.com/MohammadBnei/vos-monolith.git
  valuesPath: [back/helm/values.yaml]
  targetRevision: main
  hostname: api.voconsteroid.com

# vos-monolith-dev is NOT a list-generator entry here: it needs 2 value
# files (base + dev override), which the shared ApplicationSet template
# can't express (Go-templates individual string fields only, not a
# variable-length YAML list — see apps.applicationset.yaml's comment). It's
# deployed as a standalone Application instead:
# gitops/bootstrap/vos-monolith-dev-application.yaml (same pattern as
# platform-traefik for the same reason).
#
# searxng and pgweb are NOT here: they're public-image tools with no
# app-specific code, so they're driven as platform apps instead — see
# gitops/bootstrap/platform-common-apps.applicationset.yaml and
# gitops/platform/values/{searxng,pgweb}/values.yaml. This registry is
# only for apps that genuinely need their own repo.
