# wird-api's database credential, assembled here rather than stored assembled.
#
# WHY THIS FILE IS IN THIS REPO and not in Wird's own helm/values.yaml.
# common-app-chart has an `infisical.projectSlug` field an app can set, and
# pointing it at `infra-bootstrap-1-ge1` would work — it would also mount the
# ENTIRE root project into the wird namespace as environment variables: the PVE
# API token, CA_PIGSTY_KEY, the break-glass cluster-admin token, every other
# database password. templates/shared-infisicalsecret.yaml names that exact
# move as the thing an app repo must never be able to do. So the narrowing
# happens here, in the repo that reviews its own changes, and Wird's values.yaml
# only ever names the resulting Secret.
#
# WHY A TEMPLATE AND NOT A `WIRD_DATABASE_URL` ROW. Wird reads one variable,
# DATABASE_URL, and a DSN row would mean the password lived in two Infisical
# entries — the drift that docs/secrets.md already records for WEDDING_WALL_S3
# ("must then be copied by hand", and skipping the copy fails silently at
# runtime). Building the DSN from DBUSER_WIRD_PASSWORD keeps one copy, so
# rotation is one edit. Same shape as authentik-secret.yaml above.
#
# The password is generated "random 32B urlsafe" (docs/secrets.md), which is
# why it can go into a URL's userinfo with no escaping. If it is ever rotated
# to something with `@`, `:` or `/` in it, this DSN silently becomes a
# different, wrong DSN — percent-encode it there or keep it urlsafe here.
#
# postgres.bnei.lan rather than 192.168.1.232, and port 5432 rather than 6432,
# for the two reasons authentik-secret.yaml already gives: CoreDNS forwards to
# Pi-hole precisely so pods can resolve the Pigsty VIP by name, and pgbouncer's
# transaction pooling breaks server-side prepared statements. Wird's own
# pigsty.yml entry sets `pgbouncer: false` on both the user and the database,
# so 6432 would not even accept it.
#
# NAMESPACE ORDERING. managedSecretReference targets the `wird` namespace,
# which is created by the apps ApplicationSet at sync wave 10. Until that
# Application exists the operator simply retries on its 60s resync; nothing
# here has to be applied in a particular order.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: wird-secret
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: wird-config
    secretNamespace: wird
    creationPolicy: Orphan
    template:
      data:
        DATABASE_URL: "postgres://dbuser_wird:{{ .DBUSER_WIRD_PASSWORD.Value }}@postgres.bnei.lan:5432/wirddb"
