# Who may sign in to the `mountain` application (mountain detail mode,
# ADR-0056; visitors, ADR-0057). Reaching mountain.bnei.dev at all is the
# separate `mountain-gate` decision (authentik-blueprint-mountain-gate-policy.yaml,
# ADR-0065); this gates only detail frames (platform-admins) and marks
# (mountain-visitors). The application keeps the default policy_engine_mode
# `any`, so either group admits; the relay maps the `groups` claim to a role.
#
# SEPARATE FROM authentik-blueprint-mountain.yaml, the hermes convention
# (authentik-blueprint-hermes-policy.yaml): a blueprint applies as one
# transaction and PolicyBinding.target is a required FK, so a !Find miss on a
# not-yet-registered `mountain` rolls back this file only. With
# core_default_app_access false, a missing binding denies everyone, which is
# the visible failure direction.
#
# APPLY ORDER. The first apply of this file (2026-10-15) errored because it ran
# before mountain-oidc had created the application; it healed on the next
# hourly discovery (a failed apply keeps no last_applied_hash, so it is
# retried). The two metaapplyblueprint entries below remove the race: each
# applies the named blueprint instance inline first (the shape upstream's
# blueprints/default/default-brand.yaml uses), and `required: true` fails this
# file, retried the same way, when that instance has not been discovered yet.
# So the `!Find`s below never run against a missing application (NULL target:
# an error) or a missing platform-admins (NULL group: silent, the runbook's
# `core_default_app_access` trap). mountain-visitors is declared locally
# (`!KeyOf`), the wird-users rule in authentik-blueprint-wird-policy.yaml.
#
# Verify in the database, selecting the FKs explicitly:
#   psql -d authentik -tAc 'SELECT target_id, group_id, enabled
#                           FROM authentik_policies_policybinding'
#
# A plain ConfigMap: no credential to interpolate.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-mountain-policy
  namespace: authentik
data:
  mountain-policy.yaml: |
    version: 1
    metadata:
      name: mountain-policy
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: platform-groups
          required: true
      - model: authentik_blueprints.metaapplyblueprint
        attrs:
          identifiers:
            name: mountain-oidc
          required: true
      # Same declaration as in authentik-blueprint-mountain-enrollment.yaml, on
      # purpose. No `users:`: membership is written by enrollment, and a list
      # here would be REPLACED on every apply, wiping every visitor.
      - model: authentik_core.group
        id: mountain-visitors
        identifiers:
          name: mountain-visitors
        attrs:
          name: mountain-visitors
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, mountain]]
          group: !Find [authentik_core.group, [name, platform-admins]]
          order: 0
        attrs:
          enabled: true
      - model: authentik_policies.policybinding
        identifiers:
          target: !Find [authentik_core.application, [slug, mountain]]
          group: !KeyOf mountain-visitors
          order: 1
        attrs:
          enabled: true
