apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`grafana.bnei.dev`)
    middlewares:
    - name: cloudflare-origin-lock
      namespace: default
    services:
    - name: platform-grafana
      port: 80
  tls:
    certResolver: le
