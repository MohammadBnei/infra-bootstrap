# authentik blueprint declaring mountain's OIDC provider + application
# (ADR-0056; mountain plan 08 "W3 detail mode"). The fleet/grafana shape.
#
# mountain.bnei.dev sits behind its own forwardAuth gate (ADR-0065:
# platform-admins and invited mountain-visitors); this OIDC app is the relay's
# own sign-in, which the page does automatically once mountain references the
# gate. It adds roles: the
# relay maps the ID token's `groups` claim to a role (platform-admins = detail
# frames; mountain-visitors = marks, W4; anyone else = view) and keeps a signed
# 1 h session cookie of its own. It stores no token and nothing against `sub`.
#
# A SECRET, not a ConfigMap: the relay is server-side, so this is a
# confidential client and the blueprint embeds its client secret. The relay
# also sends PKCE (S256), state and nonce on every login; no PKCE policy here,
# same as grafana and fleet (confidential), since the code is useless without
# the secret.
#
# Bindings live in authentik-blueprint-mountain-policy.yaml (the hermes
# convention): with core_default_app_access false, this file alone admits
# nobody.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authentik-blueprint-mountain
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: authentik-blueprint-mountain
    secretNamespace: authentik
    creationPolicy: Orphan
    template:
      data:
        mountain-oidc.yaml: |
          version: 1
          metadata:
            name: mountain-oidc
            labels:
              blueprints.goauthentik.io/instantiate: "true"
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              id: mountain-provider
              identifiers:
                name: mountain
              attrs:
                name: mountain
                client_type: confidential
                client_id: "{{ .MOUNTAIN_OIDC_CLIENT_ID.Value }}"
                client_secret: "{{ .MOUNTAIN_OIDC_CLIENT_SECRET.Value }}"
                # Object form is required in 2026.x. A bare string list parses
                # fine and then rejects every callback. relay/oidc.go builds the
                # same URL (origin + /auth/callback).
                redirect_uris:
                  - matching_mode: strict
                    url: https://mountain.bnei.dev/auth/callback
                # WITHOUT THIS THE PROVIDER REJECTS EVERY LOGIN (empty permits
                # no grant). authorization_code only: the relay verifies the ID
                # token once and drops every token, so a refresh grant would
                # only widen what a leaked code buys.
                grant_types:
                  - authorization_code
                # Default hashed_user_id, not user_email: W4 marks key on `sub`,
                # and User.email is mutable and not unique (authentik-oidc skill).
                # Implicit consent: one click to detail mode for the operator.
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
                # `profile` carries `groups` in the ID token; the relay reads it
                # there (never userinfo). The signing key is shared across apps,
                # so the relay checks iss + aud, not only the signature.
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
            - model: authentik_core.application
              identifiers:
                slug: mountain
              attrs:
                name: Mountain
                slug: mountain
                provider: !KeyOf mountain-provider
                meta_launch_url: https://mountain.bnei.dev
                meta_description: The cluster as a living mountain (detail mode)
