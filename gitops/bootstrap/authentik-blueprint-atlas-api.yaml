# atlas's machine principal (ADR-0068): the game's server reads two of atlas's
# routes, GET /api/graph and GET /ws, as the service account `atlas-game`.
#
# The ADR-0066 shape, a second time: an OAuth2 provider that only issues
# `client_credentials` tokens (RS256, 10 minutes, the public per-provider
# issuer), and one service account with an app password and its own binding.
# atlas checks the token offline against the pinned certificate, iss, aud/azp
# (`atlas-api`) and sub (`atlas-game`) - mountain cmd/atlas/machine.go.
#
# ONE blueprint, one transaction, on purpose: the provider, its application,
# the account, its app password and the binding land or roll back together, so
# the application never exists without the binding that limits it to this one
# account (the netbird file splits them; here nothing is gained by it). A
# !Find miss still writes a NULL binding that denies, since
# core_default_app_access is false (authentik-flags-job.yaml).
#
# No client secret is rendered: authentik generates one on create and nothing
# ever reads it. A grant with it would mint an `ak-…-client_credentials`
# account of its own, which atlas refuses (sub) - and `ak-` is reserved below.
#
# BEFORE THE FIRST APPLY (ADR-0068 rollout): ATLAS_GAME_APP_PASSWORD exists in
# Infisical (a missing key leaves this Secret unrendered), and no user named
# `atlas-game` exists yet - the user entry matches on username and would take
# an enrolled account over.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authentik-blueprint-atlas-api
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: authentik-blueprint-atlas-api
    secretNamespace: authentik
    creationPolicy: Orphan
    template:
      data:
        atlas-api.yaml: |
          version: 1
          metadata:
            name: atlas-api
            labels:
              blueprints.goauthentik.io/instantiate: "true"
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              id: atlas-api-provider
              identifiers:
                name: atlas-api
              attrs:
                name: atlas-api
                client_type: confidential
                # Not secret: it is the token's aud and azp, pinned in atlas
                # as MOUNTAIN_MACHINE_CLIENT_ID.
                client_id: atlas-api
                grant_types:
                  - client_credentials
                # Required on every OAuth2 provider, even with no browser.
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                # RS256 on the shared key; without it authentik signs HS256
                # with the client secret. Its certificate is atlas's pin.
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
                access_token_validity: minutes=10
                sub_mode: user_username
                issuer_mode: per_provider
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
            - model: authentik_core.application
              id: atlas-api-app
              identifiers:
                slug: atlas-api
              attrs:
                name: atlas API (machine)
                slug: atlas-api
                provider: !KeyOf atlas-api-provider
                meta_description: The game's read of atlas's town routes (ADR-0068). No browser login.
            - model: authentik_core.user
              id: atlas-game
              identifiers:
                username: atlas-game
              attrs:
                username: atlas-game
                name: atlas game reader
                type: service_account
                path: goauthentik.io/service-accounts
                is_active: true
            - model: authentik_core.token
              identifiers:
                identifier: atlas-game-app-password
              attrs:
                identifier: atlas-game-app-password
                user: !KeyOf atlas-game
                intent: app_password
                expiring: false
                description: The game's read of atlas (ADR-0068). Rotate in Infisical, ATLAS_GAME_APP_PASSWORD.
                key: "{{ .ATLAS_GAME_APP_PASSWORD.Value }}"
            - model: authentik_policies.policybinding
              identifiers:
                target: !KeyOf atlas-api-app
                user: !KeyOf atlas-game
                order: 0
              attrs:
                enabled: true
