# Standalone Application for thot (ADR-0032, agent-fleet's ADR-0035) —
# plain manifests, not common-app-chart (cluster-wide ClusterRole binding
# isn't something that chart supports). Same pattern as
# actions-runner-application.yaml/provisioner-application.yaml for things
# that don't fit the registry/common-app-chart mold.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-thot
  namespace: argocd
  labels:
    gitops.bnei.dev/tier: platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:MohammadBnei/infra-bootstrap.git
    targetRevision: main
    path: gitops/platform/thot
  destination:
    server: https://kubernetes.default.svc
    namespace: thot
  ignoreDifferences:
  - group: secrets.infisical.com
    kind: InfisicalSecret
    jsonPointers:
    - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
