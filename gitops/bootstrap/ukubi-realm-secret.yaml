# The realm's env (mountain plan/21 phase 0b): its database and the two ticket
# PUBLIC keys it verifies with. The realm accepts role `owner` only under the
# owner pod's key and `friend` only under the public pod's, so the
# internet-facing pod can never mint an owner (plan/21 Auth).
#
# Root project, ukubi-game-secret.yaml's reasons: DBUSER_REALM_PASSWORD has to
# live there for Pigsty's verifier, and each public key sits beside its
# private half (gitops/bootstrap/ukubi-game-ticket-secret.yaml), so a key
# pair is rotated in one place. The public keys are not secret; they come
# through here so a rotation reaches the realm with no commit.
#
# Missing any key, the Secret does not render and the realm waits on it
# (helm/realm.yaml loads it without `optional`). Env is bound at start:
# restart the realm after a rotation, and after either game pod's key rotates.
#
# DSN: postgres.bnei.lan:5432, not 6432 (dbuser_realm and realmdb set
# pgbouncer: false). The password is "random 32B urlsafe" (docs/secrets.md),
# so it needs no escaping in the URL's userinfo.
#
# TODO(realm): confirm the three variable names and the key encoding (base64
# of the raw 32-byte Ed25519 public key assumed) against cmd/realm.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: ukubi-realm-secret
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: ukubi-realm-config
    secretNamespace: ukubi-realm
    creationPolicy: Orphan
    template:
      data:
        UKUBI_REALM_DATABASE_URL: "postgres://dbuser_realm:{{ .DBUSER_REALM_PASSWORD.Value }}@postgres.bnei.lan:5432/realmdb"
        UKUBI_REALM_OWNER_TICKET_PUBKEY: "{{ .UKUBI_REALM_OWNER_TICKET_PUBKEY.Value }}"
        UKUBI_REALM_FRIEND_TICKET_PUBKEY: "{{ .UKUBI_REALM_FRIEND_TICKET_PUBKEY.Value }}"
