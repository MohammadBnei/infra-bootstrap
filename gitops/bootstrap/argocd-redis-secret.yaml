# InfisicalSecret that materialises the shared Pigsty Redis password for
# ArgoCD's externalRedis config (see argocd-application.yaml). Applied at
# bootstrap time but only becomes active once Infisical + infisical-operator
# (wave 1) are up.
#
# Required secret in the infra-bootstrap Infisical project (see docs/secrets.md):
#   REDIS_MAIN_PASSWORD — mirrors pigsty.yml's redis-main cluster
#   `redis_password: 'Redis.Main'`, reused rather than rotated (same
#   reasoning as BASIC_AUTH_HTPASSWD).
#
# Key name `redis-password` is required by the argo-cd chart's
# `externalRedis.existingSecret` contract. No username: this redis-main
# instance doesn't use ACL, just requirepass.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: argocd-redis-secret
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: argocd-redis
    secretNamespace: argocd
    creationPolicy: Orphan
    template:
      data:
        redis-password: "{{ .REDIS_MAIN_PASSWORD.Value }}"
