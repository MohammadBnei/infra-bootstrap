# Shared Cloudflare origin lock for the HAND-WRITTEN platform IngressRoutes
# (ADR-0038 Decision 5).
#
# common-app-chart renders its own per-release copy of this for the apps it
# deploys. The platform routes in this directory — argocd, grafana, infisical,
# alertmanager, proxmox, authentik — are hand-written and inherit nothing, so
# until now they had NO origin lock at all. They are also the highest-value
# hosts in the cluster: ArgoCD deploys everything, Infisical holds every
# secret, Proxmox is a hypervisor root login.
#
# Without this, proxying is decoration for those hosts: 82.65.231.50 has been
# in public DNS and Certificate Transparency logs for months, so anyone can
# connect to the origin directly with any Host header and skip the WAF, the
# geo rules and the bot checks entirely.
#
# A SHARED object is safe here, unlike in common-app-chart. The concern there
# was an ordering race — a chart-rendered route referencing a Middleware from a
# different ArgoCD Application that had not synced yet. Everything in
# gitops/bootstrap/ belongs to the SAME self-syncing `bootstrap` Application
# (ADR-0021), so this Middleware and its consumers always apply together.
#
# Evaluated against the TCP peer, not X-Forwarded-For — verified on a throwaway
# host: via Cloudflare 301, direct to origin with a spoofed Host 403. Trusting
# forwarded headers does not change ipAllowList's default ipStrategy.
#
# DO NOT attach this to a GREY host. s3.bnei.dev and fleet.bnei.dev are
# deliberately DNS-only, so their peer is the real client and this would 403
# every legitimate request.
#
# ponytail: CIDRs hardcoded from cloudflare.com/ips-v4 + ips-v6 (2026-08-19).
# Third copy in this repo, after traefik's forwardedHeaders.trustedIPs and
# common-app-chart's baseline. Helm cannot share a list across a chart and
# plain manifests, and a generator for 22 near-static ranges is not worth it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cloudflare-origin-lock
  namespace: default
spec:
  ipAllowList:
    sourceRange:
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
    - 2400:cb00::/32
    - 2606:4700::/32
    - 2803:f800::/32
    - 2405:b500::/32
    - 2405:8100::/32
    - 2a06:98c0::/29
    - 2c0f:f248::/32
    # LAN — keeps the ADR-0039 break-glass reachable and lets LAN tooling hit
    # public hostnames directly. Any device on the flat 192.168.1.0/24 can
    # therefore bypass the WAF; accepted homelab trade, recorded not assumed.
    - 192.168.1.0/24
    # Pod CIDR — in-cluster workloads resolving a public hostname arrive with a
    # pod address, not a Cloudflare one.
    - 10.233.64.0/18
