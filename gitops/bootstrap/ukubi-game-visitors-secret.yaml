# The game's visitor store token (mountain plan/19, turned on by plan/21 phase
# 0b): the public pod sends it on every write and read to the owner's :7412.
# One value, the same Secret name, `ukubi-game-visitors`, in both pods'
# namespaces.
#
# A Secret of its own, apart from ukubi-game-config and ukubi-game-public-oidc:
# nothing reads it until ukubi-game#157 adds it to both pods' envFrom, so this
# file alone is inert (the owner refuses the token without --visitors-listen,
# and the flag and the envFrom arrive together). #157 can merge any time after
# both copies render. Env is bound at start: restart both pods after a
# rotation.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: ukubi-game-visitors
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: ukubi-game-visitors
    secretNamespace: ukubi-game
    creationPolicy: Orphan
    template:
      data:
        UKUBI_GAME_VISITORS_TOKEN: "{{ .UKUBI_GAME_VISITORS_TOKEN.Value }}"
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: ukubi-game-public-visitors
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: ukubi-game-visitors
    secretNamespace: ukubi-game-public
    creationPolicy: Orphan
    template:
      data:
        UKUBI_GAME_VISITORS_TOKEN: "{{ .UKUBI_GAME_VISITORS_TOKEN.Value }}"
