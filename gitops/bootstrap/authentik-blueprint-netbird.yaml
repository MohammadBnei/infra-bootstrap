# NetBird's OAuth2 provider and application in authentik (ADR-0054).
#
# authentik is not NetBird's IdP directly: netbird-server's embedded Dex is,
# and authentik is a Generic OIDC *upstream* of Dex. So the client here is
# Dex, a server-side process holding a secret — confidential, the grafana
# shape. The same NETBIRD_OIDC_CLIENT_ID/_SECRET pair is entered once in
# NetBird's dashboard (Settings → Identity Providers), where NetBird stores it
# in netbirddb. That is ADR-0054's one recorded click: config.yaml cannot
# declare an upstream.
#
# Both redirect URIs were read off NetBird's own "add provider" dialog
# (2026-10-11), not derived: Dex's callback, and its post-logout callback,
# which authentik 2026.x types as `redirect_uri_type: logout` (checked against
# the live instance's /blueprints/schema.json).
#
# sub_mode left at the default hashed_user_id: Dex keys its federated identity
# on the upstream `sub`, and a mutable email there would re-identify users.
#
# Who may log in is NOT here: the policy binding to `netbird-users` lives in
# authentik-blueprint-netbird-policy.yaml, the hq/hermes convention, so a
# !Find miss there denies everyone rather than rolling back this provider.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authentik-blueprint-netbird
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: authentik-blueprint-netbird
    secretNamespace: authentik
    creationPolicy: Orphan
    template:
      data:
        netbird-oidc.yaml: |
          version: 1
          metadata:
            name: netbird-oidc
            labels:
              blueprints.goauthentik.io/instantiate: "true"
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              id: netbird-provider
              identifiers:
                name: netbird
              attrs:
                name: netbird
                client_type: confidential
                client_id: "{{ .NETBIRD_OIDC_CLIENT_ID.Value }}"
                client_secret: "{{ .NETBIRD_OIDC_CLIENT_SECRET.Value }}"
                # Object form is required in 2026.x; see grafana's note.
                redirect_uris:
                  - matching_mode: strict
                    url: https://netbird.bnei.dev/oauth2/callback
                  - matching_mode: strict
                    url: https://netbird.bnei.dev/oauth2/logout/callback
                    redirect_uri_type: logout
                # Required — empty permits no grant (see grafana's note).
                # client_credentials is the agent's: username + app password
                # of the netbird-agent service account (netbird-agent.yaml
                # below), no client secret. Dex then exchanges that id_token
                # for a NetBird SSH JWT (ADR-0055, agentic SSH).
                grant_types:
                  - authorization_code
                  - refresh_token
                  - client_credentials
                # Implicit consent: the user already chose NetBird's login
                # button, and Dex is the only caller.
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
                # `profile` is what emits `groups`, which ADR-0054 wants for a
                # later test of Dex group sync. Claims stay in the id_token
                # (the provider default).
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
            - model: authentik_core.application
              identifiers:
                slug: netbird
              attrs:
                name: NetBird
                slug: netbird
                provider: !KeyOf netbird-provider
                meta_launch_url: https://netbird.bnei.dev
                meta_description: Mesh for the off-site Pi (ADR-0054)
        # The agent identity for NetBird SSH (ADR-0055 amendment, 2026-10-12).
        # A second file in this Secret, so a second blueprint and transaction:
        # a miss here cannot roll back the provider above.
        #
        # NetBird's SSH server only accepts a JWT from its embedded Dex. An
        # agent gets one without a browser:
        #   1. client_credentials on the `netbird` provider with this user's
        #      username + app password -> an authentik id_token;
        #   2. RFC 8693 token exchange at https://netbird.bnei.dev/oauth2/token
        #      (public client netbird-cli, the authentik connector) -> a Dex JWT
        #      whose sub is this user's NetBird user id;
        #   3. that JWT as the SSH password, within 600s of minting.
        # ansible/scripts/node.sh does all three.
        #
        # name and email are not decoration: Dex's OIDC connector requires a
        # `name` claim and requests `email`.
        netbird-agent.yaml: |
          version: 1
          metadata:
            name: netbird-agent
            labels:
              blueprints.goauthentik.io/instantiate: "true"
          entries:
            - model: authentik_core.user
              id: netbird-agent
              identifiers:
                username: netbird-agent
              attrs:
                username: netbird-agent
                name: NetBird agent
                email: netbird-agent@bnei.dev
                type: service_account
                path: goauthentik.io/service-accounts
                is_active: true
            - model: authentik_core.token
              identifiers:
                identifier: netbird-agent-app-password
              attrs:
                identifier: netbird-agent-app-password
                user: !KeyOf netbird-agent
                intent: app_password
                expiring: false
                description: NetBird SSH for agents (ADR-0055). Rotate in Infisical, NETBIRD_AGENT_APP_PASSWORD.
                key: "{{ .NETBIRD_AGENT_APP_PASSWORD.Value }}"
            # The application is gated by netbird-users
            # (authentik-blueprint-netbird-policy.yaml); this user gets its
            # own binding rather than a line in that group, so this file owns
            # the agent end to end.
            - model: authentik_policies.policybinding
              identifiers:
                target: !Find [authentik_core.application, [slug, netbird]]
                user: !KeyOf netbird-agent
                order: 10
              attrs:
                enabled: true
