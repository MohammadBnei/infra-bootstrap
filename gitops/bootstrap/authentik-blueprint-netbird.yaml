# NetBird's OAuth2 provider and application in authentik (ADR-0054).
#
# authentik is not NetBird's IdP directly: netbird-server's embedded Dex is,
# and authentik is a Generic OIDC *upstream* of Dex. So the client here is
# Dex, a server-side process holding a secret — confidential, the grafana
# shape. The same NETBIRD_OIDC_CLIENT_ID/_SECRET pair is entered once in
# NetBird's dashboard (Settings → Identity Providers), where NetBird stores it
# in netbirddb. That is ADR-0054's one recorded click: config.yaml cannot
# declare an upstream.
#
# Both redirect URIs were read off NetBird's own "add provider" dialog
# (2026-10-11), not derived: Dex's callback, and its post-logout callback,
# which authentik 2026.x types as `redirect_uri_type: logout` (checked against
# the live instance's /blueprints/schema.json).
#
# sub_mode left at the default hashed_user_id: Dex keys its federated identity
# on the upstream `sub`, and a mutable email there would re-identify users.
#
# Who may log in is NOT here: the policy binding to `netbird-users` lives in
# authentik-blueprint-netbird-policy.yaml, the hq/hermes convention, so a
# !Find miss there denies everyone rather than rolling back this provider.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authentik-blueprint-netbird
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: authentik-blueprint-netbird
    secretNamespace: authentik
    creationPolicy: Orphan
    template:
      data:
        netbird-oidc.yaml: |
          version: 1
          metadata:
            name: netbird-oidc
            labels:
              blueprints.goauthentik.io/instantiate: "true"
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              id: netbird-provider
              identifiers:
                name: netbird
              attrs:
                name: netbird
                client_type: confidential
                client_id: "{{ .NETBIRD_OIDC_CLIENT_ID.Value }}"
                client_secret: "{{ .NETBIRD_OIDC_CLIENT_SECRET.Value }}"
                # Object form is required in 2026.x; see grafana's note.
                redirect_uris:
                  - matching_mode: strict
                    url: https://netbird.bnei.dev/oauth2/callback
                  - matching_mode: strict
                    url: https://netbird.bnei.dev/oauth2/logout/callback
                    redirect_uri_type: logout
                # Required — empty permits no grant (see grafana's note).
                grant_types:
                  - authorization_code
                  - refresh_token
                # Implicit consent: the user already chose NetBird's login
                # button, and Dex is the only caller.
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
                # `profile` is what emits `groups`, which ADR-0054 wants for a
                # later test of Dex group sync. Claims stay in the id_token
                # (the provider default).
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
            - model: authentik_core.application
              identifiers:
                slug: netbird
              attrs:
                name: NetBird
                slug: netbird
                provider: !KeyOf netbird-provider
                meta_launch_url: https://netbird.bnei.dev
                meta_description: Mesh for the off-site Pi (ADR-0054)
