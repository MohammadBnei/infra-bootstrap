# Standalone Application for agent-fleet's provisioner (renamed from
# e2e-provisioner, docs/adr/0012/0019/0020/0021 in that repo) — plain
# manifests, not common-app-chart (RBAC/ServiceAccount binding isn't
# something that chart supports). Same pattern as
# actions-runner-application.yaml/traefik-application.yaml for things that
# don't fit the registry/common-app-chart mold.
#
# Manifests moved OUT of this repo and into agent-fleet's own k8s/provisioner/
# as of docs/adr/0019/0020/0021 — that project's deploy surface grew complex
# enough (new shared PVC, worker-pod spawning, sidecar image) to warrant
# owning it directly rather than splitting across two repos. Only
# source.repoURL/path changed here; this Application object's shape and the
# reasoning for keeping it a standalone plain-manifest Application (RBAC)
# are unchanged — see agent-fleet's k8s/provisioner/README.md for what's in
# that directory now.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-provisioner
  namespace: argocd
  labels:
    gitops.bnei.dev/tier: platform
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/MohammadBnei/agent-fleet.git
    targetRevision: main
    path: k8s/provisioner
  destination:
    server: https://kubernetes.default.svc
    namespace: agent-fleet
  ignoreDifferences:
  - group: secrets.infisical.com
    kind: InfisicalSecret
    jsonPointers:
    - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
