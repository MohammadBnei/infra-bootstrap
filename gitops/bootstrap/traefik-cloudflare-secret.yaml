# InfisicalSecret that materialises the Cloudflare DNS API token Traefik's
# `le-dns` resolver uses for ACME DNS-01 (ADR-0033). Applied at bootstrap time
# but only becomes active once Infisical (wave 1) and infisical-operator
# (wave 1) are running.
#
# Required secret in the infra-bootstrap Infisical project (see docs/secrets.md):
#   CF_ACCOUNT_TOKEN — a Cloudflare API token that must carry
#   `Zone → Zone → Read` + `Zone → DNS → Edit` on BOTH the bnei.dev and
#   voconsteroid.com zones (ADR-0038 — `le` moves to DNS-01, and
#   api/dev.api.voconsteroid.com renew through it too). lego only ever does
#   one thing with it: create and delete the `_acme-challenge` TXT record.
#   Read-only is not sufficient — lego must create AND delete that record,
#   and a read-only token fails at renewal time, which is invisible until
#   the existing cert expires.
#
# Consumed by gitops/platform/values/traefik/values.yaml's `env:` block as
# CF_DNS_API_TOKEN — that env var name is fixed by lego's cloudflare provider,
# so the rename happens here rather than in Infisical.
#
# CF_ACCOUNT_ID also exists in the project but is deliberately NOT wired up:
# lego's DNS-01 provider resolves the zone from the challenge FQDN and never
# takes an account ID. Nothing would read it.
#
# ROTATING THIS TOKEN — handled automatically, but know why.
#
# The token reaches Traefik as the env var CF_DNS_API_TOKEN via secretKeyRef.
# Environment variables are bound when the container starts and are NEVER
# re-read, so "rotate in Cloudflare -> infisical secrets set -> operator
# updates the K8s Secret" would leave the running pod holding the OLD, revoked
# token while every object involved looks perfectly correct.
#
# That failure is silent by construction: certificates already in acme.json
# keep serving, and only new issuance and RENEWALS fail. Traefik logs
# "Invalid access token (9109)" and carries on, so nothing surfaces until a
# certificate actually expires — up to 90 days later. Hit for real on
# 2026-08-18; see docs/bootstrap-test-notes.md.
#
# Fixed structurally rather than by a checklist item: Traefik's Deployment
# carries secrets.infisical.com/auto-reload: "true" (set in
# gitops/platform/values/traefik/values.yaml), so the Infisical operator rolls
# the Deployment whenever this Secret's content changes. Rotation is now just
# `infisical secrets set`.
#
# Manual fallback if the operator is down:
#   ssh k9s kubectl rollout restart deploy/platform-traefik -n traefik
#
# Note either path is an ingress outage now — externalTrafficPolicy is Local
# with a single replica, so MetalLB stops announcing .233 for the duration
# (ADR-0038). A brief, attributable outage beats a silent 90-day fuse.
#
# Blast radius, stated plainly (ADR-0033 §Consequences): Cloudflare API tokens
# cannot be scoped to a subset of records within a zone, so this token can edit
# every bnei.dev record — grafana, argocd, fleet, s3 included — and, since
# ADR-0038 widened it to a second zone, every voconsteroid.com record as well.
# That is strictly worse than the delegated-subzone alternative and is the
# accepted cost of keeping one token across two zones. Rotate it here + in Infisical if the cluster is ever
# compromised; nothing else in the fleet reads it.
#
# This CR lives in ns infisical (not traefik), matching the convention the other
# bootstrap InfisicalSecrets use: the managedSecretReference below targets
# traefik directly and the operator retries (resyncInterval) until that
# namespace exists.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: traefik-cloudflare-secret
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: traefik-cloudflare-dns
    secretNamespace: traefik
    creationPolicy: Orphan
    template:
      data:
        token: "{{ .CF_ACCOUNT_TOKEN.Value }}"
