apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
  - list:
      # Keep in sync with gitops/apps/registry.yaml (human source of truth).
      # Add an app: update registry.yaml first, then mirror the entry here.
      elements:

      # n8n, openweb-ui(+pipelines), whodb, api, ukubi-ai are deferred —
      # no working per-app repo yet (see docs/bootstrap-test-notes.md).
      # Re-add once each has a real values.yaml.
      #
      # searxng/pgweb are NOT here — public-image, no app-specific code,
      # driven as platform apps instead (see platform-common-apps.applicationset.yaml).

      - name: editable-blog
        namespace: editable-blog
        syncWave: "10"
        repoURL: https://github.com/MohammadBnei/editable-blog.git
        valuesPath: [helm/values.yaml]
        targetRevision: main
        hostname: blog.bnei.dev

      - name: dream-analyst
        namespace: dream-analyst
        syncWave: "10"
        repoURL: https://github.com/MohammadBnei/dream-analyst.git
        valuesPath: [helm/values.yaml]
        targetRevision: main
        hostname: dreamer.bnei.dev

      - name: vos-monolith
        namespace: vos
        syncWave: "10"
        repoURL: https://github.com/MohammadBnei/vos-monolith.git
        valuesPath: [back/helm/values.yaml]
        targetRevision: main
        hostname: api.voconsteroid.com

      - name: vos-monolith-dev
        namespace: vos-dev
        syncWave: "10"
        repoURL: https://github.com/MohammadBnei/vos-monolith.git
        valuesPath: [back/helm/values.yaml, back/helm/values-dev.yaml]
        targetRevision: dev
        hostname: dev.api.voconsteroid.com

      # agent-fleet: moved here from platform-common-apps 2026-07-31 — see
      # gitops/apps/registry.yaml's comment for why (self-contained CI tag
      # bump needs a real per-app repo source). Workload is fleet-core now
      # (replaces the old agent-fleet-bot Node app — see agent-fleet's
      # docs/adr/0013) but the Application NAME is deliberately kept as
      # agent-fleet-bot — see registry.yaml's comment on why a rename here
      # would risk cascade-deleting agent-fleet-shared-pvc.
      - name: agent-fleet-bot
        namespace: agent-fleet
        syncWave: "10"
        repoURL: https://github.com/MohammadBnei/agent-fleet.git
        valuesPath: [k8s/fleet-core.yaml]
        targetRevision: main
        hostname: ""

      - name: dream-analyst-worker
        namespace: agent-fleet
        syncWave: "10"
        repoURL: https://github.com/MohammadBnei/agent-fleet.git
        valuesPath: [k8s/dream-analyst-worker.yaml]
        targetRevision: main
        hostname: ""

      - name: vos-monolith-worker
        namespace: agent-fleet
        syncWave: "10"
        repoURL: https://github.com/MohammadBnei/agent-fleet.git
        valuesPath: [k8s/vos-monolith-worker.yaml]
        targetRevision: main
        hostname: ""

  template:
    metadata:
      name: '{{.name}}'
      labels:
        gitops.bnei.dev/tier: user-app
      annotations:
        argocd.argoproj.io/sync-wave: '{{.syncWave}}'
      finalizers:
      - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
      # Source 1: shared Helm chart from infra-bootstrap
      - repoURL: git@github.com:MohammadBnei/infra-bootstrap.git
        path: gitops/platform/common-app-chart
        targetRevision: main
        helm:
          # Fixed 2-slot valueFiles, not a variable-length range: ArgoCD
          # Go-templates individual string fields only (the ApplicationSet
          # manifest itself must already be valid plain YAML before any
          # templating runs, since the self-managing `bootstrap` Application
          # applies it as a literal directory source) — a `{{- range }}`
          # here breaks YAML parsing before templating ever gets a chance to
          # run. Keeping the list length fixed at 2 and only substituting
          # each item's string content is the same safe idiom as
          # `{{.name}}`/`{{.hostname}}` elsewhere in this file. Single-file
          # apps get their one file listed twice (Helm merging a file with
          # itself is a no-op); apps needing a base + override (e.g.
          # vos-monolith-dev) set valuesPath to both.
          valueFiles:
          - $values/{{ index .valuesPath 0 }}
          - $values/{{ if gt (len .valuesPath) 1 }}{{ index .valuesPath 1 }}{{ else }}{{ index .valuesPath 0 }}{{ end }}
          parameters:
          - name: ingress.hostname
            value: '{{.hostname}}'
      # Source 2: per-app values repo (private, HTTPS + PAT — see
      # gitops/README.md's "Bootstrap credential chain" for how
      # repo-creds-github-bnei is injected)
      - repoURL: '{{.repoURL}}'
        targetRevision: '{{.targetRevision}}'
        ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      # Infisical operator writes to InfisicalSecret's .status on every
      # resync (spec.infisical.resyncInterval in common-app-chart) — without
      # this, ArgoCD flags the resource (and the whole Application) as
      # perpetually OutOfSync even when nothing changed. Static rule, safe
      # for apps that don't set infisical.enabled (the CR just won't exist).
      ignoreDifferences:
      - group: secrets.infisical.com
        kind: InfisicalSecret
        jsonPointers:
        - /status
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
