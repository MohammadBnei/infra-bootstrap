# InfisicalSecret that materialises the Garage S3 credentials Longhorn
# uses as its snapshot backup target (ADR-0019,
# docs/adr/0019-longhorn-rollout-specifics.md).
#
# Required secrets in the infra-bootstrap Infisical project (see
# docs/secrets.md): LONGHORN_S3_ACCESS_KEY, LONGHORN_S3_SECRET — created
# by ansible/playbooks/garage-configure.yml once the Garage LXC is up.
#
# Consumed by gitops/platform/values/longhorn/values.yaml's
# defaultSettings.backupTargetCredentialSecret: longhorn-backup-secret.
# Longhorn expects this exact key naming (AWS_ACCESS_KEY_ID/
# AWS_SECRET_ACCESS_KEY/AWS_ENDPOINTS) in the target secret.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: longhorn-backup-secret
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: longhorn-backup-secret
    secretNamespace: longhorn-system
    creationPolicy: Orphan
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .LONGHORN_S3_ACCESS_KEY.Value }}"
        AWS_SECRET_ACCESS_KEY: "{{ .LONGHORN_S3_SECRET.Value }}"
        # garage.bnei.lan (Pi-hole DNS), the LAN endpoint. s3.bnei.dev has a
        # route now (gitops/redirectors/garage-s3.yaml, ADR-0030); switching
        # to it would change Longhorn's backup path, so it is not done here.
        AWS_ENDPOINTS: "http://garage.bnei.lan:3900"
