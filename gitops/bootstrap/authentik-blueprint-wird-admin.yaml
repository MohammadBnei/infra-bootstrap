# The forwardAuth provider for wird-adminweb (`wird-admin.bnei.dev`), the Wird
# operations view. ADR-0052; wird-side decision is wird's ADR-0026.
#
# An InfisicalSecret and not a ConfigMap, unlike the other two forwardAuth-tier
# objects, and the reason is not symmetry — it is that this provider's
# client_secret is **load-bearing twice**:
#
#   1. authentik signs the forwarded JWT with it. A proxy provider has NO
#      signing key: providers/proxy/models.py's set_oauth_defaults() forces
#      `signing_key = None` on every save, and providers/oauth2/models.py's
#      jwt_key() then returns `(self.client_secret, HS256)` — "No Certificate at
#      all, assume HS256". So the token in X-authentik-jwt is HMAC-signed with
#      this value, not RS256-signed against a JWKS.
#   2. adminweb verifies it with the same value, delivered to the app namespace
#      by gitops/bootstrap/wird-admin-secret.yaml.
#
# That is also why this file cannot be a plain ConfigMap even though every other
# proxy provider here is one: the e2e-previews provider's secret is generated by
# authentik and read by the embedded outpost over the API, so nothing outside
# authentik ever needs it. Here an application outside authentik verifies with
# it, so both sides must be given the same declared value.
#
# WHAT THIS FILE DELIBERATELY DOES NOT DECLARE, because set_oauth_defaults()
# overwrites it on every create/update through the API — which is the path the
# blueprint importer takes (providers/proxy/api.py:71,77):
#   - grant_types          -> forced to [authorization_code, client_credentials, password]
#   - client_type          -> forced to confidential
#   - signing_key          -> forced to None (see above)
#   - property_mappings    -> forced to openid + profile + email + entitlements + ak_proxy
#   - redirect_uris        -> rebuilt from external_host
# Declaring any of them would read as configuration while changing nothing.
#
# TWO CONSEQUENCES OF THOSE DEFAULTS, both recorded in ADR-0052:
#   - `profile` is bound automatically, and the stock profile mapping returns
#     `"groups": [group.name for group in request.user.groups.all()]`. That is
#     where adminweb's platform-admins claim comes from; no custom scope mapping
#     exists or is needed.
#   - the `password` grant is force-enabled and cannot be turned off, so any
#     directory user's username+password can mint a token for this audience.
#     adminweb's own platform-admins check is what contains that, which is why
#     it must never be relaxed to "any valid token for my audience".
#
# mode: forward_single, NOT forward_domain, and that is the one real design
# choice here. The existing tier's provider (e2e-previews,
# authentik-blueprint-forwardauth.yaml) is forward_domain over cookie_domain
# bnei.dev; a second forward_domain provider on the same domain gives the outpost
# two providers claiming one host mapping. forward_single scopes this provider to
# exactly one external_host instead — at the cost of the callback leg needing its
# own route, because set_oauth_defaults() builds the redirect URI from
# external_host: https://wird-admin.bnei.dev/outpost.goauthentik.io/callback.
# That route is gitops/bootstrap/wird-admin-outpost-route.yaml.
#
# The provider must also be listed on the embedded outpost in
# authentik-blueprint-forwardauth.yaml — that list is REPLACED, not merged, so
# both providers appear there and it references this one by !Find.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authentik-blueprint-wird-admin
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: authentik-blueprint-wird-admin
    secretNamespace: authentik
    creationPolicy: Orphan
    template:
      data:
        wird-admin.yaml: |
          version: 1
          metadata:
            name: wird-admin
            labels:
              blueprints.goauthentik.io/instantiate: "true"
          entries:
            - model: authentik_providers_proxy.proxyprovider
              id: wird-admin-provider
              identifiers:
                name: wird-admin
              attrs:
                name: wird-admin
                mode: forward_single
                external_host: https://wird-admin.bnei.dev
                # Must equal OIDC_AUDIENCE in wird's helm/adminweb-values.yaml.
                # Not a secret (it travels in every /authorize URL), so it is
                # committed, same as the wird public client's id under ADR-0050.
                client_id: "5gOqSotRlzaM2moPIvlRiS6UQNqBJHnysQ0wKqhR"
                # The HMAC key for the forwarded JWT. See this file's header.
                client_secret: "{{ .WIRD_ADMIN_OIDC_CLIENT_SECRET.Value }}"
                # Lets a request that already carries `Authorization: Bearer`
                # through without a login redirect, which is how the Wird agent
                # calls /reports.json with a service-account token. The existing
                # e2e-previews provider already runs with this on.
                intercept_header_auth: true
                basic_auth_enabled: false
                # An hour, so the agent's client-credentials token is not minted
                # per request; the browser hop re-authenticates through the
                # outpost's own cookie long before this matters.
                access_token_validity: "hours=1"
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
            - model: authentik_core.application
              identifiers:
                slug: wird-admin
              attrs:
                name: Wird Admin
                slug: wird-admin
                provider: !KeyOf wird-admin-provider
                # One binding (platform-admins, in the companion policy file), so
                # MODE_ANY and MODE_ALL are equivalent and this is left at the
                # default — unlike wird and hermes, which bind two and must set
                # `all` or their PKCE enforcement is decorative.
                meta_launch_url: https://wird-admin.bnei.dev
                meta_description: Wird operations view — reports triage, sync outcomes, corpus version
