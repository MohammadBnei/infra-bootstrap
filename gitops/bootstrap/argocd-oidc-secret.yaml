# ArgoCD's OIDC client credentials (ADR-0039, "Native OIDC" tier).
#
# THE LABEL ON THIS CR IS LOAD-BEARING, and it is the whole reason this file
# looks different from grafana-oidc-secret.yaml.
#
# ArgoCD's `oidc.config` lives in the argocd-cm ConfigMap, which the argo-cd
# chart rewrites on every selfHeal — so the client secret cannot be written
# there, and it cannot go in argocd-secret either, for the same reason spelled
# out at length in argocd-application.yaml's `githubSecret` comment. ArgoCD's
# escape hatch is a `$<secret-name>:<key>` reference, which resolves against
# ANY Secret in the argocd namespace — provided that Secret carries the label
# `app.kubernetes.io/part-of: argocd`. Without the label the reference does not
# resolve and ArgoCD serves the literal string `$argocd-oidc:clientSecret` as
# the client secret, which fails at the token endpoint, not at startup.
#
# The Infisical operator copies the CR's labels AND annotations onto the
# managed Secret it creates. That is the only reason this works declaratively:
# `managedSecretReference` itself has no labels field (confirmed against the
# installed CRD), so labelling the CR is the only lever available.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: argocd-oidc-secret
  namespace: infisical
  labels:
    app.kubernetes.io/part-of: argocd
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: argocd-oidc
    secretNamespace: argocd
    creationPolicy: Orphan
    template:
      data:
        # Key names are referenced verbatim from argocd-cm's oidc.config as
        # `$argocd-oidc:clientID` / `$argocd-oidc:clientSecret`. Renaming a key
        # here silently breaks login.
        #
        # The client id is not really a secret, but keeping the pair together
        # means rotation is one Infisical change touching one place, and it
        # keeps the id out of git alongside the secret rather than half in and
        # half out.
        clientID: "{{ .ARGOCD_OIDC_CLIENT_ID.Value }}"
        clientSecret: "{{ .ARGOCD_OIDC_CLIENT_SECRET.Value }}"
