# The game PUBLIC pod's visitor sign-in (mountain plan/18, world.bnei.dev): the
# `ukubi-world` client pair (authentik-blueprint-game-visitors.yaml holds
# authentik's copy) and the key of the pod's session cookies.
#
# A Secret of its own, `ukubi-game-public-oidc`, apart from
# `ukubi-game-public-config` (ukubi-game-public-secret.yaml): a missing key here
# leaves only this Secret unrendered, never the voice key the pod already runs
# on. The game's helm/public.yaml loads it by envFrom once the game signs
# visitors in; until then nothing reads it.
#
# Root project; the keys carry a WORLD or PUBLIC infix there and are renamed to
# the game's variable names below, so the public namespace never holds an owner
# key (the owner pod's pair is UKUBI_GAME_OIDC_*). Env is bound at start:
# restart the pod after a rotation.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: ukubi-game-public-oidc
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: ukubi-game-public-oidc
    secretNamespace: ukubi-game-public
    creationPolicy: Orphan
    template:
      data:
        UKUBI_GAME_OIDC_ISSUER: "https://authentik.bnei.dev/application/o/ukubi-world/"
        UKUBI_GAME_OIDC_CLIENT_ID: "{{ .UKUBI_WORLD_OIDC_CLIENT_ID.Value }}"
        UKUBI_GAME_OIDC_CLIENT_SECRET: "{{ .UKUBI_WORLD_OIDC_CLIENT_SECRET.Value }}"
        UKUBI_GAME_SESSION_KEY: "{{ .UKUBI_GAME_PUBLIC_SESSION_KEY.Value }}"
