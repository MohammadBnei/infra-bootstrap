# authentik blueprint declaring SilverBullet's OIDC provider + application
# (ADR-0039 "Native OIDC" tier; ADR-0058). grafana's shape, for grafana's
# reasons — read authentik-blueprint-grafana.yaml's header. Three differences:
#
# 1. A custom email scope mapping. authentik's managed `scope-email` returns
#    `email_verified: False`, always, and SilverBullet refuses the login
#    outright without a verified email (server/src/auth/oidc/client.rs: "The
#    identity provider must supply a verified email address"). The managed
#    mapping is left alone; this one is attached to this provider only, in
#    its place. Claiming "verified" is honest here: every account that can
#    pass the policy binding is declared by name in
#    authentik-blueprint-silverbullet-policy.yaml, and SilverBullet only
#    admits users an admin pre-created by that same email.
#
# 2. No `sub_mode`, so the default hashed_user_id (ADR-0050 Decision 9).
#    SilverBullet binds an account to issuer + subject on first sign-in; with
#    user_email, changing an authentik email would change `sub` and lock the
#    account out.
#
# 3. Who may log in is not here: the binding to `shared-notes` lives in
#    authentik-blueprint-silverbullet-policy.yaml (hq/hermes convention).
#
# The same client id/secret are pasted by hand into SilverBullet's Admin →
# Authentication, which stores them on its PVC — ADR-0058's accepted
# deviation. Rotating means re-pasting there too.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authentik-blueprint-silverbullet
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: authentik-blueprint-silverbullet
    secretNamespace: authentik
    creationPolicy: Orphan
    template:
      data:
        silverbullet-oidc.yaml: |
          version: 1
          metadata:
            name: silverbullet-oidc
            labels:
              blueprints.goauthentik.io/instantiate: "true"
          entries:
            # Fields read from the running 2026.8.4 schema:
            # name, scope_name, expression, description, managed.
            - model: authentik_providers_oauth2.scopemapping
              id: silverbullet-scope-email
              identifiers:
                name: "silverbullet: email (verified)"
              attrs:
                name: "silverbullet: email (verified)"
                scope_name: email
                description: Email address, marked verified (ADR-0058)
                expression: |
                  return {"email": request.user.email, "email_verified": True}
            - model: authentik_providers_oauth2.oauth2provider
              id: silverbullet-provider
              identifiers:
                name: silverbullet
              attrs:
                name: silverbullet
                client_type: confidential
                client_id: "{{ .SILVERBULLET_OIDC_CLIENT_ID.Value }}"
                client_secret: "{{ .SILVERBULLET_OIDC_CLIENT_SECRET.Value }}"
                # One central callback for every space (SilverBullet's
                # Single Sign-On doc). Object form, as grafana's.
                redirect_uris:
                  - matching_mode: strict
                    url: https://notes.bnei.dev/.auth/central/oidc/callback
                grant_types:
                  - authorization_code
                  - refresh_token
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
                  - !KeyOf silverbullet-scope-email
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
            - model: authentik_core.application
              identifiers:
                slug: silverbullet
              attrs:
                name: Notes
                slug: silverbullet
                provider: !KeyOf silverbullet-provider
                meta_launch_url: https://notes.bnei.dev
                meta_description: Shared notes of M BN and N MG
