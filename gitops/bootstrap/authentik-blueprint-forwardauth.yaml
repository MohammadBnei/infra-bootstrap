# The whole forwardAuth tier, in ONE file (ADR-0039 Decision 3).
#
# ONE FILE IS NOT A STYLE CHOICE. The embedded outpost's `providers` list is
# REPLACED on every apply, not appended to. One blueprint per app — the way the
# Native OIDC tier does it, correctly, because oauth2providers bind to nothing
# shared — would mean each file silently unbinds the previous one, leaving
# whichever applied last as the only working app and no error anywhere.
#
# So every proxy provider that wants the embedded outpost lives here, and the
# single outpost binding at the bottom lists all of them. Adding Alertmanager,
# pgweb or Proxmox later means editing this file, not adding another.
#
# WHY forwardAuth HERE AND NOT NATIVE OIDC: the e2e preview hosts route to a
# session's own dev-server pod — whatever the agent happened to start and pass
# to expose(). There is no fleet code in that request path to terminate OIDC
# with. `fleet.bnei.dev` itself goes the other way (native OIDC in core, see
# authentik-blueprint-fleet.yaml) precisely because there IS code there, and
# because a middleware cannot gate the pod-network callers that agent-fleet#200
# is about.
#
# A PLAIN ConfigMap, like authentik-blueprint-groups.yaml and
# authentik-blueprint-fleet-policy.yaml. It was an InfisicalSecret until
# 2026-08-21 by copy-paste from the Native OIDC tier, where the wrapper earns
# its keep: an oauth2provider carries a client_id and client_secret that have to
# be agreed with the app, so they are interpolated from Infisical. A PROXY
# provider has no such credential — authentik generates the OAuth pair itself
# and the embedded outpost fetches it over the API with its own token. Every
# byte of this file is static; there was never a `${...}` in it.
#
# The wrapper is not free. It puts the Infisical operator in the propagation
# chain, and that operator reconciles on Infisical VALUE changes, not on CR
# template changes — so editing this file and merging left the managed Secret
# holding its old content indefinitely, with ArgoCD reporting Synced (runbook
# §9.1, step 2). As a ConfigMap the chain is: merge, kubelet volume sync,
# restart the worker. One fewer restart and one fewer way to be silently stale.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-forwardauth
  namespace: authentik
data:
  forwardauth.yaml: |
    version: 1
    metadata:
      name: forwardauth-tier
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_proxy.proxyprovider
        id: previews-proxy-provider
        identifiers:
          name: e2e-previews
        attrs:
          name: e2e-previews
          # forward_domain, NOT forward_single. Preview hostnames are
          # minted at RUNTIME by agent-fleet's provisioner
          # (internal/k8s/expose.go builds <shortid>-e2e.bnei.dev per
          # session), so there is no point at which a per-host provider
          # could be declared — the host does not exist when this file is
          # written, and a blueprint cannot be written when it does.
          mode: forward_domain
          # The cost of forward_domain, stated rather than discovered:
          # the authentik proxy session cookie is scoped to bnei.dev and
          # therefore sent to every host in the zone, including the public
          # ones. It is authentik's own cookie, not a credential to those
          # apps, but it is a real widening.
          #
          # It is also why core's own session cookie is named
          # __Host-fleet_session: that prefix forbids a Domain attribute
          # at the browser level, so an agent-authored dev server on a
          # same-site sibling cannot shadow the console's session cookie.
          cookie_domain: bnei.dev
          # In forward_domain mode this is the AUTH domain — the host that
          # serves the embedded outpost's own `/outpost.goauthentik.io/*`
          # endpoints — NOT the app being protected. authentik builds the
          # OAuth `redirect_uri` from it verbatim.
          #
          # It was https://fleet.bnei.dev until 2026-08-21, and every
          # guarded page broke *after* a successful login: the callback
          # went to https://fleet.bnei.dev/outpost.goauthentik.io/callback,
          # which is agent-fleet core (ADR-0041 — native OIDC, no outpost
          # anywhere in that request path), so the code was never
          # exchanged and the `redirect` carried in the state JWT never
          # fired. The redirect *to* authentik worked throughout, which is
          # why it read as an app crash rather than a provider misconfig.
          #
          # authentik.bnei.dev is the only host here that serves those
          # endpoints; verified with
          # `curl https://authentik.bnei.dev/outpost.goauthentik.io/ping`
          # -> 204. Protected hosts need no `/outpost.goauthentik.io/`
          # route of their own — that is the forward_single recipe, and it
          # is unbuildable for previews anyway, since the provisioner's
          # Role grants no middleware verbs.
          external_host: https://authentik.bnei.dev
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          # Defence in depth only — all three are in-cluster today and
          # have no IngressRoute, so nothing external reaches them. Here
          # so that a future route does not silently put a probe endpoint
          # behind a login, or a webhook behind one.
          skip_path_regex: "^/healthz$|^/metrics$|^/webhook/alertmanager$"
      - model: authentik_core.application
        identifiers:
          slug: e2e-previews
        attrs:
          name: E2E Previews
          slug: e2e-previews
          provider: !KeyOf previews-proxy-provider
          meta_description: Per-session preview hosts, minted at runtime by the fleet provisioner
      # ----------------------------------------------------------------
      # wird-adminweb (ADR-0052). IN THIS FILE, not its own, and that is a
      # correction: it was briefly a separate blueprint referencing this
      # outpost by !Find, which would have taken the WHOLE tier down.
      # OutpostSerializer.providers is a ManyRelatedField of
      # PrimaryKeyRelatedField with allow_null=False (verified live), so a
      # !Find that matches nothing raises does_not_exist and invalidates the
      # entry — previews' provider, its application and the outpost binding
      # included. !KeyOf resolves only within one blueprint, so sharing the
      # file is what makes the reference safe.
      #
      # NO client_id AND NO client_secret HERE, and this is the whole reason
      # the design changed. Verified against the running 2026.8.0:
      #   ProxyProviderSerializer: client_id present, read_only=True
      #                            client_secret NOT A FIELD AT ALL
      #   OAuth2ProviderSerializer: both writable
      # The blueprint importer validates through model().serializer and DRF
      # drops unknown keys without error, so a declared client_id/secret here
      # is silently ignored — the provider keeps its generated pair. That is
      # why authentik-blueprint-wird.yaml and -hermes.yaml CAN commit a
      # client_id (they are oauth2providers) and this cannot.
      #
      # Both values are therefore GENERATED and must be read back out of
      # authentik into Infisical after this applies — see
      # docs/runbook-wird-admin-db-role.md §3. adminweb needs both: the secret
      # is the HS256 key for the forwarded JWT (a proxy provider has no
      # signing key), and the id is the `aud` it pins.
      - model: authentik_providers_proxy.proxyprovider
        id: wird-admin-proxy-provider
        identifiers:
          name: wird-admin
        attrs:
          name: wird-admin
          # forward_single, unlike previews above: wird-admin.bnei.dev is a
          # static hostname, and a second forward_domain provider on
          # cookie_domain bnei.dev would leave the outpost with two providers
          # claiming one host mapping. The cost is the callback leg, which
          # gitops/bootstrap/wird-admin-outpost-route.yaml serves.
          mode: forward_single
          external_host: https://wird-admin.bnei.dev
          # Lets a request that already carries `Authorization: Bearer`
          # through without a login redirect — how the Wird agent calls
          # /reports.json with a client-credentials token. Default is already
          # True; set explicitly because adminweb's agent path depends on it.
          intercept_header_auth: true
          basic_auth_enabled: false
          access_token_validity: "hours=1"
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_core.application
        identifiers:
          slug: wird-admin
        attrs:
          name: Wird Admin
          slug: wird-admin
          provider: !KeyOf wird-admin-proxy-provider
          meta_launch_url: https://wird-admin.bnei.dev
          meta_description: Wird operations view — reports triage, sync outcomes, corpus version
      # ----------------------------------------------------------------
      # THE TRAP. A proxy provider does nothing at all until it is bound
      # to an outpost, and the embedded outpost ships with providers = [].
      # Verified live: `authentik Embedded Outpost :: proxy :: providers= []`.
      #
      # This list is REPLACED, not merged. Everything in the forwardAuth
      # tier must be listed here together — see the header.
      - model: authentik_outposts.outpost
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          providers:
            - !KeyOf previews-proxy-provider
            # wird-admin (ADR-0052), declared above in this same file so this
            # is a !KeyOf and cannot be None. A cross-file !Find here would
            # not "just skip the entry": allow_null=False on this field means
            # an unresolved reference invalidates the whole blueprint and takes
            # previews down with it.
            - !KeyOf wird-admin-proxy-provider
