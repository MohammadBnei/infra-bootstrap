# The fleet's OIDC client credentials, materialised into the `agent-fleet`
# namespace for core to consume as env vars.
#
# The SAME pair as authentik-blueprint-fleet.yaml, consumed from the opposite
# end: authentik registers it on the provider, core presents it at the token
# endpoint. One pair, two namespaces — which is why rotating it means
# restarting BOTH sides, not one.
#
# Grafana's shape, not ArgoCD's: core reads OIDC_CLIENT_ID/OIDC_CLIENT_SECRET
# straight from env, so there is no chart-owned ConfigMap in the way and no
# need for the `$secret:key` indirection (and therefore no need for the
# app.kubernetes.io/part-of label that makes that indirection resolve).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: fleet-oidc
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: fleet-oidc
    secretNamespace: agent-fleet
    creationPolicy: Orphan
    template:
      data:
        client_id: "{{ .FLEET_OIDC_CLIENT_ID.Value }}"
        client_secret: "{{ .FLEET_OIDC_CLIENT_SECRET.Value }}"
        # The signing key for core's own session cookie. Comma-separated:
        # core signs with the FIRST and verifies against ANY, which is the
        # entire key-rotation mechanism — prepend a new key, let the old one
        # ride out live sessions, then drop it.
        #
        # Not an authentik credential at all, but it belongs in the same Secret
        # because it shares a lifecycle: every value here is bound into core's
        # process at container start and needs the same restart to take effect.
        session_keys: "{{ .FLEET_SESSION_KEYS.Value }}"
