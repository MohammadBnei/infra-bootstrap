# The callback leg for mountain's forwardAuth (mountain.bnei.dev). ADR-0065.
#
# mountain's gate provider is forward_single, so authentik sends the browser
# back to https://mountain.bnei.dev/outpost.goauthentik.io/callback; that path
# must reach authentik, not the relay. A copy of drop-outpost-route.yaml, itself
# a copy of wird-admin-outpost-route.yaml, which explains the priority
# (load-bearing) and why no middleware sits on it.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mountain-outpost
  namespace: authentik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`mountain.bnei.dev`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 100
      services:
        - name: platform-authentik-server
          port: 80
  tls:
    certResolver: le
