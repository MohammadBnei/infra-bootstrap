# The game PUBLIC pod's only credential (mountain plan/17, world.bnei.dev): a
# capped Anthropic key for visitors talking to residents, and its daily cap.
# Nothing else: no sign-in, no database, no fleet or GitHub token. The game
# refuses --public with a key and no cap of at least 1 (fail closed).
#
# Its own workspace and spend cap, apart from the owner's
# (ukubi-game-secret.yaml): a visitor flood spends the public workspace only,
# and its cap is the hard stop (the game's budget is in memory and refills on
# every pod restart).
#
# Root project, as every InfisicalSecret here: the keys carry a PUBLIC infix
# there and are renamed to the game's variable names below, so the public
# namespace never holds an owner key. The game's helm/public.yaml loads
# `ukubi-game-public-config` by envFrom. Missing either key, the Secret does
# not render and the pod waits on it. Env is bound at start: restart the pod
# after a rotation.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: ukubi-game-public-secret
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: ukubi-game-public-config
    secretNamespace: ukubi-game-public
    creationPolicy: Orphan
    template:
      data:
        UKUBI_GAME_VOICE_KEY: "{{ .UKUBI_GAME_PUBLIC_VOICE_KEY.Value }}"
        UKUBI_GAME_VOICE_DAILY_CAP: "{{ .UKUBI_GAME_PUBLIC_VOICE_DAILY_CAP.Value }}"
