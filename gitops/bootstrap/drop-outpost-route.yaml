# The callback leg for drop's forwardAuth (files.bnei.dev). ADR-0059.
#
# drop's proxy provider is forward_single, so authentik sends the browser back
# to https://files.bnei.dev/outpost.goauthentik.io/callback; that path must
# reach authentik, not drop. A copy of wird-admin-outpost-route.yaml, which
# explains the priority (load-bearing) and why no middleware sits on it.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: drop-outpost
  namespace: authentik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`files.bnei.dev`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 100
      services:
        - name: platform-authentik-server
          port: 80
  tls:
    certResolver: le
