# mountain's database credential, assembled here. ADR-0056.
#
# hq-secret.yaml's arrangement (itself wird-secret.yaml's), for its reasons:
# pointing mountain's values.yaml `infisical` block at the root project would
# mount EVERY root secret into the mountain namespace, so the narrowing happens
# here; and building the DSN from DBUSER_MOUNTAIN_PASSWORD keeps the password in
# one Infisical entry, so rotation is one edit.
#
# The password is "random 32B urlsafe" (docs/secrets.md), so it needs no
# escaping in the URL's userinfo. Rotate it to anything with `@`, `:` or `/`
# and this silently becomes a different DSN.
#
# postgres.bnei.lan:5432, not 6432: dbuser_mountain and mountaindb set
# pgbouncer: false. connlimit 10: the relay caps its pgxpool at MaxConns 8.
#
# mountain's helm/values.yaml loads the Secret `mountain-config` by envFrom.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: mountain-secret
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: mountain-config
    secretNamespace: mountain
    creationPolicy: Orphan
    template:
      data:
        DATABASE_URL: "postgres://dbuser_mountain:{{ .DBUSER_MOUNTAIN_PASSWORD.Value }}@postgres.bnei.lan:5432/mountaindb"
