apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    # Pin to a specific version; bump here (not UI) for ArgoCD self-upgrades.
    # Helm chart 10.x == ArgoCD app 3.4.x. Bumped from 7.8.1/2.14.2 because
    # that version predates K8s 1.33's Deployment.status.terminatingReplicas
    # field, which broke structured-merge-diff for every app managing a
    # Deployment on this cluster's kube_version (1.35.4).
    targetRevision: "10.1.3"
    helm:
      values: |
        global:
          domain: argocd.bnei.dev

        configs:
          cm:
            # Longhorn's own webhook cert rotation injects
            # spec.conversion.webhook.clientConfig.caBundle into its CRDs at
            # runtime; its chart manifest never sets that field. Without
            # this, ArgoCD sees a permanent diff and selfHeal re-syncs
            # platform-longhorn every reconcile forever, even though
            # nothing is actually wrong. Cluster-wide via argocd-cm
            # (not per-Application ignoreDifferences) because the field
            # only exists on CRDs with a conversion webhook — safe as a
            # global rule, and avoids restructuring longhorn out of
            # platform.applicationset.yaml's shared list (which would risk
            # the ApplicationSet controller deleting-and-cascading the
            # existing Application, including its CRDs, before a
            # differently-shaped replacement could take over).
            resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
              jqPathExpressions:
              - '.spec.conversion.webhook.clientConfig.caBundle'
          params:
            # TLS terminated at Traefik — ArgoCD serves plain HTTP inside the cluster
            "server.insecure": "true"
            # infra-bootstrap has a private k8s-cluster git submodule that repo-server
            # doesn't need (only plain files under gitops/ are referenced as values
            # sources) and has no credentials for. Skip submodule init entirely rather
            # than granting the deploy key access to a repo it doesn't use.
            "reposerver.enable.git.submodule": "false"
          secret:
            # GitHub webhook shared secret, for near-instant sync on push instead of
            # waiting out the ~3min poll interval. Deliberately committed, not
            # Infisical-managed: it only lets GitHub tell ArgoCD "go check git now" —
            # no write access, no RBAC bypass, worst case with a guessed value is an
            # attacker forcing extra refreshes. The chart writes the whole
            # argocd-secret from these values on every self-sync (selfHeal: true
            # above), so an Infisical-sourced value would need a dedicated
            # secret + RBAC-scoped PostSync hook Job just to survive that — not
            # worth it for a low-stakes shared token. Register the same value as
            # the webhook secret on the GitHub repo (Settings → Webhooks).
            githubSecret: "ukubi-cluster-webhook-2026"

        server:
          service:
            type: ClusterIP
          # Disable built-in Ingress — we use a Gateway API HTTPRoute (argocd-httproute.yaml)
          ingress:
            enabled: false
          ingressGrpc:
            enabled: false

        applicationSet:
          enabled: true

        notifications:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
