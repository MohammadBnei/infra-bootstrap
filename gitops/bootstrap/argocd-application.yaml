apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  labels:
    gitops.bnei.dev/tier: core
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    # Pin to a specific version; bump here (not UI) for ArgoCD self-upgrades.
    # Helm chart 10.x == ArgoCD app 3.4.x. Bumped from 7.8.1/2.14.2 because
    # that version predates K8s 1.33's Deployment.status.terminatingReplicas
    # field, which broke structured-merge-diff for every app managing a
    # Deployment on this cluster's kube_version (1.35.4).
    targetRevision: "10.1.3"
    helm:
      values: |
        global:
          domain: argocd.bnei.dev

        configs:
          cm:
            # Longhorn's CRDs have two permanent, expected diffs against
            # their own chart manifest — neither is real drift:
            #   1. spec.conversion.webhook.clientConfig.caBundle: injected
            #      live by Longhorn's own webhook cert rotation; the chart
            #      never sets it.
            #   2. spec.preserveUnknownFields: the chart sets `false`, but
            #      apiextensions.k8s.io/v1's API server silently drops this
            #      legacy field on write (structural schemas replaced it) —
            #      confirmed via `kubectl get crd ... -o
            #      jsonpath='{.spec.preserveUnknownFields}'` returning empty
            #      on every Longhorn CRD despite it being `false` in git.
            # Without both, ArgoCD sees a permanent diff and selfHeal
            # re-syncs platform-longhorn every reconcile forever, even
            # though nothing is actually wrong (confirmed via a byte-level
            # diff of the live vs. chart-rendered CRD with only known-noisy
            # metadata stripped — these two fields were the only remainder).
            # Cluster-wide via argocd-cm (not per-Application
            # ignoreDifferences) because both fields only ever appear on
            # CRDs with a conversion webhook — safe as a global rule, and
            # avoids restructuring longhorn out of
            # platform.applicationset.yaml's shared list (which would risk
            # the ApplicationSet controller deleting-and-cascading the
            # existing Application, including its CRDs, before a
            # differently-shaped replacement could take over).
            resource.customizations.ignoreDifferences.apiextensions.k8s.io_CustomResourceDefinition: |
              jsonPointers:
              - /spec/conversion/webhook/clientConfig/caBundle
              - /spec/preserveUnknownFields

            # authentik OIDC federation (ADR-0039, "Native OIDC" tier).
            #
            # `issuer` MUST carry the trailing slash and MUST match the
            # application slug in gitops/bootstrap/authentik-blueprint-argocd.yaml
            # — ArgoCD compares the issuer in the ID token against this string
            # exactly, so a missing slash fails verification AFTER a successful
            # login, which reads as a broken callback rather than a typo.
            #
            # clientID/clientSecret are `$<secret>:<key>` references, not
            # literals. They resolve against the `argocd-oidc` Secret in this
            # namespace, which exists only because its InfisicalSecret CR
            # carries `app.kubernetes.io/part-of: argocd` — see
            # gitops/bootstrap/argocd-oidc-secret.yaml. This indirection is what
            # keeps the credential out of git despite the chart rewriting both
            # argocd-cm and argocd-secret on every selfHeal.
            #
            # Groups come from the ID TOKEN. There is deliberately no
            # `enableUserInfoGroups` / `userInfoPath` here, and adding them
            # back will break login outright — see below.
            #
            # authentik's `profile` scope mapping emits
            # `groups: [name, ...]`, and this provider has
            # `include_claims_in_id_token = True`, so the token already
            # carries what RBAC needs. Read off the issued token itself:
            #   groups = ['authentik Admins', 'platform-admins']
            #
            # An earlier revision set `enableUserInfoGroups: true` because
            # ArgoCD's own `grpc.request.claims` log field showed every other
            # profile claim and no `groups` key. That log field is not the
            # token. The token had it all along.
            #
            # And the userinfo call cannot work from here anyway:
            # `authentik.bnei.dev` is proxied at Cloudflare (ADR-0038), and a
            # server-side request from this pod is answered with Cloudflare
            # error 1010 — Browser Integrity Check, which blocks non-browser
            # user agents. ArgoCD then fails to parse HTML as JSON and
            # invalidates the whole session:
            #   invalid session: error fetching user info endpoint:
            #   failed to decode response body to struct:
            #   invalid character '<' looking for beginning of value
            # Every logged-in user is signed out, not merely un-grouped. The
            # failure is NOT fail-closed the way the old comment claimed.
            #
            # The local `admin` account stays ENABLED (chart default). ADR-0039
            # Decision 6: a Traefik ClientIP() break-glass route can bypass a
            # middleware but not an app's own OIDC redirect, and ArgoCD is what
            # deploys authentik — dropping local admin makes an authentik
            # outage recoverable only through kubectl.
            oidc.config: |
              name: authentik
              issuer: https://authentik.bnei.dev/application/o/argocd/
              clientID: $argocd-oidc:clientID
              clientSecret: $argocd-oidc:clientSecret
              requestedScopes:
                - openid
                - profile
                - email
          rbac:
            # Read-only for anyone who can authenticate; admin comes from
            # membership of the `platform-admins` authentik group, declared in
            # gitops/bootstrap/authentik-blueprint-groups.yaml.
            #
            # The group is the whole point: it is the one place that says who
            # operates this cluster, and Grafana reads the same group name for
            # its own Admin role. Adding a person is a line in that file, not
            # a per-app RBAC edit here and in Grafana's values and in whatever
            # comes next.
            #
            # `scopes` tells ArgoCD which claims may carry a subject for policy
            # matching. `groups` first so a group rule wins; `email` remains
            # because `sub_mode: user_email` makes the subject an address, and
            # a per-user rule has to stay expressible.
            policy.default: role:readonly
            policy.csv: |
              g, platform-admins, role:admin
            scopes: "[groups, email]"
          params:
            # TLS terminated at Traefik — ArgoCD serves plain HTTP inside the cluster
            "server.insecure": "true"
            # infra-bootstrap has a private k8s-cluster git submodule that repo-server
            # doesn't need (only plain files under gitops/ are referenced as values
            # sources) and has no credentials for. Skip submodule init entirely rather
            # than granting the deploy key access to a repo it doesn't use.
            "reposerver.enable.git.submodule": "false"
            "server.log.format": "json"
            "controller.log.format": "json"
            "reposerver.log.format": "json"
            "applicationsetcontroller.log.format": "json"
          secret:
            # GitHub webhook shared secret, for near-instant sync on push instead of
            # waiting out the ~3min poll interval. Deliberately committed, not
            # Infisical-managed: it only lets GitHub tell ArgoCD "go check git now" —
            # no write access, no RBAC bypass, worst case with a guessed value is an
            # attacker forcing extra refreshes. The chart writes the whole
            # argocd-secret from these values on every self-sync (selfHeal: true
            # above), so an Infisical-sourced value would need a dedicated
            # secret + RBAC-scoped PostSync hook Job just to survive that — not
            # worth it for a low-stakes shared token. Register the same value as
            # the webhook secret on the GitHub repo (Settings → Webhooks).
            githubSecret: "ukubi-cluster-webhook-2026"

        server:
          service:
            type: ClusterIP
          # Disable built-in Ingress — we use a Gateway API HTTPRoute (argocd-httproute.yaml)
          ingress:
            enabled: false
          ingressGrpc:
            enabled: false
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true

        # argocd_app_info/argocd_app_sync_total/argocd_cluster_connection_status
        # (used by the Grafana "ArgoCD Overview" dashboard, gitops/platform/
        # values/grafana/values.yaml) come from the controller, not server.
        controller:
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true

        applicationSet:
          enabled: true

        notifications:
          enabled: false

        # Use the shared Pigsty Redis (redis-main cluster) instead of the
        # chart's bundled single-node Redis — one less thing to run/back up.
        # Password comes from the argocd-redis Secret (argocd-redis-secret.yaml,
        # InfisicalSecret → REDIS_MAIN_PASSWORD; no username, just requirepass).
        # ArgoCD always uses Redis db 0 (no db-index param) and namespaces its
        # own keys, so sharing the instance with other consumers (e.g.
        # Infisical) is safe.
        #
        # host is the DNS name (redis.bnei.lan, via Pi-hole — CoreDNS
        # forwards bnei.lan there, ADR/bootstrap-test-notes 2026-07-30),
        # not a hardcoded IP — deliberately, so the next time this instance
        # relocates (as it just did, off .207/.165, a single point of
        # failure on the gaming-reboot host, onto pg01's VM on server1),
        # only the Pi-hole DNS record needs updating, not this file.
        redis:
          enabled: false
        redisSecretInit:
          enabled: false
        externalRedis:
          host: "redis.bnei.lan"
          port: 6379
          existingSecret: argocd-redis
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
