apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
  - list:
      elements:

      # wave 0 — Storage. Longhorn is the default StorageClass (ADR-0002,
      # docs/adr/0002-storage-longhorn-over-ceph-nfs.md) — Traefik's acme.json PVC and every common-app-chart PVC
      # depend on a default StorageClass existing, none of them set
      # storageClassName explicitly. Needs each k8s VM's scsi1 disk
      # formatted+mounted first (see values file). local-path-provisioner
      # stays installed alongside as a non-default fallback (§15 Q-H).
      - name: longhorn
        namespace: longhorn-system
        syncWave: "0"
        chartRepoURL: https://charts.longhorn.io
        chartRevision: "1.7.2" # confirm against `helm search repo longhorn/longhorn` before first apply
        chartName: longhorn
        valuesPath: gitops/platform/values/longhorn/values.yaml

      - name: local-path-provisioner
        namespace: local-path-storage
        syncWave: "0"
        chartRepoURL: https://charts.containeroo.ch
        chartRevision: "0.0.38" # 2026-10-16: from 0.0.37 (app v0.0.36 -> v0.0.37); render diff adds /health and /ready probes on :8080, which v0.0.37 serves
        chartName: local-path-provisioner
        valuesPath: gitops/platform/values/local-path-provisioner/values.yaml

      # Third StorageClass, `nfs` — non-default, unreplicated, RWX-capable,
      # backed by the nfs-storage VM's /export/k8s (ADR-0036,
      # docs/adr/0036-nfs-storage-class-for-k8s.md). Longhorn stays the
      # default; opting into `nfs` is always explicit. Needs the export to
      # exist first (ansible/playbooks/nfs-configure.yml) — the driver
      # installs fine either way, but PVCs stay Pending until it does.
      - name: csi-driver-nfs
        namespace: kube-system
        syncWave: "0"
        chartRepoURL: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
        chartRevision: "4.13.5" # 2026-10-16: from 4.13.4; render diff is csi-resizer v2.2.0 -> v2.2.1 and three --max-snapshot-*=0 flags. NOTE: this repoURL is a mutable `master` directory, not a release artifact, so the pin is only as durable as that branch keeping the tgz
        chartName: csi-driver-nfs
        valuesPath: gitops/platform/values/csi-driver-nfs/values.yaml

      # wave 0 — Node-level hardware enablement. Advertises `nvidia.com/gpu`
      # on k8s-worker-01, the only node with a GPU (RTX 2070 SUPER passed
      # through from .165). Wave 0 because any GPU workload is a wave-10
      # user app and would sit Pending with no error until this exists —
      # a nodeSelector/resource matching nothing is not an error condition.
      #
      # Chosen over kubespray's `nvidia_accelerator_enabled` deliberately:
      # that variable's only in-repo trace is the GKE-era block in the
      # unused inventory/mycluster/, and the kubespray/ submodule is not
      # checked out here, so the role behind it cannot be read. See ADR-0043
      # Decision 4.
      #
      # Requires ansible/playbooks/gpu-node-configure.yml to have run first
      # (driver + toolkit in the VM) and the `nvidia` RuntimeClass to exist.
      # The plugin installs fine either way — it just reports 0 GPUs.
      - name: nvidia-device-plugin
        namespace: kube-system
        syncWave: "0"
        chartRepoURL: https://nvidia.github.io/k8s-device-plugin
        chartRevision: "0.20.1" # 2026-10-16: from 0.17.1. Render diff: a ServiceAccount + ClusterRole (nodes get/list/watch), a renamed hostPath volume, hostPID on the MPS daemon (0 pods here: no node carries nvidia.com/mps.capable). The default nodeAffinity is unchanged, so the nvidia.com/gpu.present node label (ADR-0043) still satisfies it
        chartName: nvidia-device-plugin
        valuesPath: gitops/platform/values/nvidia-device-plugin/values.yaml

      # wave 1 — Secrets engine (must be first; serves SSH keys to ArgoCD for all other apps)
      - name: infisical
        namespace: infisical
        syncWave: "1"
        chartRepoURL: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
        chartRevision: "0.4.2"
        chartName: infisical
        valuesPath: gitops/platform/values/infisical/values.yaml

      # wave 1 — Provides the InfisicalSecret CRD (secrets.infisical.com/v1alpha1)
      # that grafana-admin-secret.yaml and alertmanager-discord-secret.yaml (both
      # in gitops/bootstrap/) already assume exists. Same wave as the Infisical
      # server above — ArgoCD doesn't strictly order same-wave siblings, but
      # each Application's own retry/selfHeal converges regardless (see
      # gitops/README.md's wave-ordering note).
      - name: infisical-operator
        namespace: infisical
        syncWave: "1"
        chartRepoURL: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
        chartRevision: "0.11.11" # 2026-10-16: from 0.11.3; render diff is OPERATOR_NAMESPACE env and infisicalConnectionRef no longer required in a CRD
        chartName: secrets-operator
        valuesPath: gitops/platform/values/infisical-operator/values.yaml

      # wave 2 — Traefik is NOT in this shared list: it needs helm.skipCrds
      # (its chart bundles Gateway API CRDs a cluster policy rejects — see
      # traefik-application.yaml), which is a bool field the ApplicationSet
      # CRD validates strictly, so it can't be a per-element Go-template
      # conditional in this shared template. Standalone Application instead.

      # wave 5 — observability
      - name: prometheus
        namespace: monitoring
        syncWave: "5"
        chartRepoURL: https://prometheus-community.github.io/helm-charts
        chartRevision: "92.10.0" # 2026-10-16: from 66.3.1 (operator v0.78.2 -> v0.94.1, Prometheus v2.55.1 -> v3.15.0, Alertmanager v0.27.0 -> v0.34.1). No values key we set changed in 67-92; Argo re-applies the CRDs every sync (no skipCrds, ServerSideApply), so no manual CRD step
        chartName: kube-prometheus-stack
        valuesPath: gitops/platform/values/prometheus/values.yaml

      - name: grafana
        namespace: monitoring
        syncWave: "5"
        # 2026-10-16: moved off grafana.github.io, where this chart is deprecated: true
        # and frozen at 10.5.15. Same version, digest c08c8796... identical in both indexes.
        chartRepoURL: https://grafana-community.github.io/helm-charts
        chartRevision: "10.5.15" # Grafana 12.3.1 — bumped from 8.8.4/11.4.0, 2 majors behind
        chartName: grafana
        valuesPath: gitops/platform/values/grafana/values.yaml

      - name: metrics-server
        namespace: kube-system
        syncWave: "5"
        chartRepoURL: https://kubernetes-sigs.github.io/metrics-server/
        chartRevision: "3.14.0" # 2026-10-16: from 3.12.2 (app v0.7.2 -> v0.9.0); render diff is the image and the aggregated-reader ClusterRole gaining the release-name prefix, no flag changes
        chartName: metrics-server
        valuesPath: gitops/platform/values/metrics-server/values.yaml

      # wave 5 — centralized logging. No hard ordering against
      # prometheus/grafana above: Alloy's loki.write component retries/
      # backs off on its own, so it queues log pushes until Loki answers
      # regardless of which pod comes up first (same "retry/selfHeal
      # converges" reasoning gitops/README.md documents for the rest of
      # this wave).
      - name: loki
        namespace: monitoring
        syncWave: "5"
        chartRepoURL: https://grafana-community.github.io/helm-charts
        chartRevision: "6.55.0" # confirm against `helm search repo` before first apply — chart migrated off grafana.github.io/helm-charts ~March 2026
        chartName: loki
        valuesPath: gitops/platform/values/loki/values.yaml

      - name: alloy
        namespace: monitoring
        syncWave: "5"
        chartRepoURL: https://grafana.github.io/helm-charts
        chartRevision: "1.13.1" # 2026-10-16: from 1.11.0 (app v1.18.0 -> v1.20.1). Breaking changes in 1.18-1.20 touch only otelcol.*, discovery.hetzner and prometheus.operator.servicemonitors; this config uses discovery.kubernetes/discovery.relabel/local.file_match/loki.process/loki.source.file/loki.write. Render diff: images and a hardened config-reloader securityContext. Earlier: 2026-07-29 bumped from 0.12.0 (app v1.7.0 -> v1.18.0). This chart has NOT migrated to grafana-community, unlike loki
        chartName: alloy
        valuesPath: gitops/platform/values/alloy/values.yaml

      # wave 5 — the only thing in this cluster that watches the hypervisors
      # rather than their guests. Added 2026-08-25 after server1 (.200) lost
      # its uplink for 23h40m and nothing alerted: the cluster could see two
      # nodes go away but had no signal for "the host under them died". Probes
      # pveproxy:8006 on all three PVE hosts over TCP. See the values file for
      # why it is TCP and not ICMP, and for the blind spot it does NOT cover.
      - name: blackbox-exporter
        namespace: monitoring
        syncWave: "5"
        chartRepoURL: https://prometheus-community.github.io/helm-charts
        chartRevision: "11.20.0" # 2026-10-16: from 11.17.2 (app v0.28.0 -> v0.29.0); render diff is the image only, and the one PrometheusRule is still ours from values, not new chart defaults
        chartName: prometheus-blackbox-exporter
        valuesPath: gitops/platform/values/blackbox-exporter/values.yaml

      # authentik — identity provider (ADR-0039). Wave 5: it needs the
      # infisical-operator (wave 1) to have materialised authentik-config
      # before the pods start, since the chart reads ALL configuration from
      # that Secret via authentik.existingSecret.
      #
      # Its Postgres is Pigsty's, OUTSIDE the cluster — so this Application
      # being Healthy says nothing about whether the database exists. The
      # `authentik` database and dbuser_authentik are declared in
      # pigsty/pigsty.yml and created by a pigsty run, not by ArgoCD.
      - name: authentik
        namespace: authentik
        syncWave: "5"
        chartRepoURL: https://charts.goauthentik.io
        chartRevision: "2026.8.4" # 2026-10-16: from 2026.8.0, patch-only (2026.8.2 carries security backports); render diff vs 2026.8.0 is the version string only
        chartName: authentik
        valuesPath: gitops/platform/values/authentik/values.yaml

  template:
    metadata:
      name: 'platform-{{.name}}'
      labels:
        gitops.bnei.dev/tier: platform
      annotations:
        argocd.argoproj.io/sync-wave: '{{.syncWave}}'
      finalizers:
      - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
      # Source 1: public Helm chart — no credentials needed
      - repoURL: '{{.chartRepoURL}}'
        chart: '{{.chartName}}'
        targetRevision: '{{.chartRevision}}'
        helm:
          valueFiles:
          - $values/{{.valuesPath}}
      # Source 2: values from infra-bootstrap — single SSH key covers all platform apps
      - repoURL: git@github.com:MohammadBnei/infra-bootstrap.git
        targetRevision: main
        ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        # Required for ignoreDifferences below to affect what gets APPLIED, not
        # just what the UI reports. Without it ArgoCD still pushes the ignored
        # field and the pod template churns anyway.
        - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      # The Infisical chart stamps a render timestamp into `updatedAt` on both the
      # Deployment and its pod template. Every render therefore produces a
      # different pod spec, so with automated+selfHeal ANY commit to this repo —
      # including a docs-only one, verified 2026-09-16 with #245 — rolls the
      # Infisical backend. That is the secrets engine every other app's
      # InfisicalSecret depends on, and it had reached deployment revision 301 of
      # pure churn (a fresh ReplicaSet most days, plus one per commit).
      #
      # Scoped to this one Deployment by name rather than a blanket
      # apps/Deployment rule: `updatedAt` is normally a DELIBERATE restart
      # trigger (the checksum-annotation idiom), so ignoring it everywhere would
      # suppress intended rollouts. Verified cluster-wide that nothing else sets
      # it. Harmless on the other elements of this list — the name simply never
      # matches.
      ignoreDifferences:
      - group: apps
        kind: Deployment
        name: platform-infisical-backend
        namespace: infisical
        jsonPointers:
        - /metadata/annotations/updatedAt
        - /spec/template/metadata/annotations/updatedAt
