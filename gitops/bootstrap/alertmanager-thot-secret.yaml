# InfisicalSecret that materialises the bearer token Alertmanager *and*
# Grafana present when handing a firing alert to agent-fleet's core, which
# turns it into a thot task (agent-fleet docs/adr/0037).
#
# Required secret in the infra-bootstrap Infisical project (see docs/secrets.md):
#   ALERT_WEBHOOK_TOKEN — any high-entropy string (`openssl rand -hex 32`)
#
# **This value must match `ALERT_WEBHOOK_TOKEN` in the agent-fleet Infisical
# project (`agent-fleet-nygh`, env dev).** Two projects hold it because the
# sender lives in ns monitoring and the receiver in ns agent-fleet, and a
# machine identity is scoped to one project. That duplication is the one
# fragile seam in this path, so it was made to fail loudly rather than
# quietly: on a mismatch core answers 401 and Alertmanager records a failed
# notification — it does not silently drop the alert, and it never falls
# back to accepting unauthenticated callers.
#
# Consumed by TWO senders, both reading the mounted `token` key:
#   - gitops/platform/values/prometheus/values.yaml's
#     alertmanager.alertmanagerSpec.secrets + the `thot` receiver's
#     webhook_configs[].http_config.authorization.credentials_file
#   - gitops/platform/values/grafana/values.yaml's extraSecretMounts +
#     the `thot` contact point's settings.authorization_credentials
#     ($__file{}). Grafana-managed alerts never pass through
#     Alertmanager, so they need their own path to the same endpoint.
#
# Lives in ns infisical (not monitoring) for the same reason
# alertmanager-discord-secret.yaml does — monitoring doesn't exist yet at
# bootstrap Step 3 time. The operator retries until it does.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: alertmanager-thot-secret
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: alertmanager-thot-token
    secretNamespace: monitoring
    creationPolicy: Orphan
    template:
      data:
        token: "{{ .ALERT_WEBHOOK_TOKEN.Value }}"
