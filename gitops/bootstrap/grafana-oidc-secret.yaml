# Grafana's OIDC client credentials (ADR-0039, "Native OIDC" tier).
#
# The SAME two values are consumed twice, from opposite ends of the exchange:
#   - authentik registers them on its provider, via
#     gitops/bootstrap/authentik-blueprint-grafana.yaml
#   - Grafana presents them at the token endpoint, via this Secret
# They are one credential pair, materialised into two namespaces. Rotating
# means changing Infisical once and restarting both sides — the blueprint is
# reconciled by authentik on resync, Grafana needs its pod replaced because
# these arrive as env vars, which are bound at container start and never
# re-read (the trap that broke ACME renewal on 2026-08-18).
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: grafana-oidc-secret
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: grafana-oidc
    secretNamespace: monitoring
    creationPolicy: Orphan
    template:
      data:
        client_id: "{{ .GRAFANA_OIDC_CLIENT_ID.Value }}"
        client_secret: "{{ .GRAFANA_OIDC_CLIENT_SECRET.Value }}"
