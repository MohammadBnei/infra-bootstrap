# Visitor sign-in for the game's public world (mountain plan/18-villages.md,
# "Owner decisions" 1): GitHub and Google OAuth sources, one click, and since
# the owner asked for sign-up not tied to an OAuth account, a local sign-up
# (username + email + password, email-verified) and a password reset beside
# them. Every path enrolls the person into `visitors` and nothing else;
# `visitors` is bound to the `ukubi-world` application only
# (authentik-blueprint-ukubi-world-policy.yaml), and
# gitops/scripts/check-authentik-bindings.py fails CI if it is ever bound to
# anything else.
#
# What this file declares:
# - the `visitors` group (declared here and taken with `!KeyOf`, never `!Find`:
#   see authentik-blueprint-wird-enrollment.yaml for why a `!Find` miss on
#   create_users_group silently drops every user enrolled in that window);
# - two OAuth sources, `github` and `google`, each with a property mapping
#   that names the user after the source's own id (`gh-<id>`, `google-<id>`).
#   A GitHub login is free text another person can pick, and a blueprint
#   matches service accounts by username (ADR-0066, ADR-0068): an enrolled
#   `atlas-game` would be taken over. An id cannot collide with a person or a
#   service account;
# - `user_matching_mode: identifier` (the default, stated on purpose): a
#   returning visitor is matched by the source's id only. NEVER `email_link`:
#   a Google account carrying an admin's address would sign in AS that admin;
# - the enrollment flow `game-visitor-enrollment`: write the user (external,
#   active, in `visitors`), log in. No prompt: the source supplies everything.
#   Its gate refuses anyone not arriving through one of the two sources (the
#   flow cannot be opened by hand) and anyone without an email, since the game
#   reads a visitor's `email` claim;
# - the local sign-up flow `ukubi-world-enrollment`: username, email,
#   password + repeat (Wird's password policy), then the user is written
#   INACTIVE (external, in `visitors`). The emailed link proves the address
#   (attribute `ukubi_world/email_verified`) but does NOT activate: the flow
#   ends on "the owner approves new accounts", and platform-admins get a
#   notification. No login stage. A taken username is refused by the prompt's `username`
#   type and a case variant, a reserved prefix (service accounts, `gh-`,
#   `google-`) or an already-used email by `ukubi-world-username`;
#   `always_create` never updates an existing user. It is a separate flow on
#   purpose: the source gate on `game-visitor-enrollment` stays source-only;
# - the recovery flow `ukubi-world-recovery`: username or email, a mailed
#   link, a new password. It never re-activates a user, and past the mail
#   link it admits only an active visitor (`ukubi-world-not-visitor`);
# - the authentication flow `ukubi-world-authentication`: an identification
#   stage with username/email + password, the two sources, and "Sign up" /
#   "Forgot password" links to the two flows above, set as the `ukubi-world`
#   provider's authentication_flow. A correct password for a non-visitor
#   (an admin) is denied before login, so this page is never a second login
#   for platform accounts (deny stage for the message, plus a fail-closed
#   `ukubi-world-is-visitor` on the login and recovery-write stages: a policy
#   error drops the login, it never skips the deny). A visitor later added to
#   any other group is refused here too and signs in through authentik
#   directly. Only that application's sign-in page changes; the
#   default login every other app uses is untouched and the brand's
#   enrollment/recovery flows stay unset (wird header: the brand is shared);
# - the `ukubi-world` provider and application, for the public pod at
#   world.bnei.dev. The owner pod (`ukubi-game`, game.bnei.dev) is unchanged
#   and stays platform-admins only.
#
# APPROVING A SIGN-UP (the owner, one action): authentik admin > Directory >
# Users > the user > Activate. Group and type are already right. Only a user
# with `ukubi_world/email_verified` should be activated; one without it never
# proved the address. Rejecting: Delete. Banning later: Deactivate; nothing
# here re-activates (recovery has activate_user_on_success false, sign-in and
# recovery admit active visitors only). GitHub/Google visitors stay
# auto-approved through `game-visitor-enrollment`. Unverified sign-ups are
# deleted after 24h by gitops/bootstrap/ukubi-world-signup-cleanup.yaml.
#
# HARD DEPENDENCY: SMTP (AUTHENTIK_EMAIL__* in authentik-secret.yaml). Without
# it the verification and reset mails are silently dropped: a sign-up stays
# inactive and unverified at "check your email" (the cleanup deletes it).
#
# ponytail: open sign-up, no captcha or invitation (mountain moved to
# invitations, ADR-0065). Each attempt costs one mail from the shared SMTP
# quota; an unverified one is deleted after 24h, a verified one waits for
# the owner (a natural brake: nothing opens without an Activate). Add a captcha or invitation stage at
# order 5 if strangers start using it.
#
# A local visitor's password also works at authentik's default login, like a
# Wird or mountain user's: that session reaches only `ukubi-world`, because
# core_default_app_access is false (authentik-flags-job.yaml) and every app
# carries a binding (check-authentik-bindings.py). Both stay hard gates.
#
# A SECRET, not a ConfigMap: the sources carry their OAuth client secrets and
# the provider its own. Field shapes checked against authentik 2026.8.0's
# source (core/models.py Provider.authentication_flow, Source.user_matching_mode,
# sources/oauth/models.py, stages/identification, stages/user_write); the
# GitHub type itself asks for `read:user user:email` and reads the primary
# address from /user/emails when the profile hides it.
#
# BEFORE THE FIRST APPLY these exist in infra-bootstrap-1-ge1 (docs/secrets.md),
# or the Secret never renders: AUTHENTIK_SOURCE_GITHUB_CLIENT_ID,
# AUTHENTIK_SOURCE_GITHUB_CLIENT_SECRET, AUTHENTIK_SOURCE_GOOGLE_CLIENT_ID,
# AUTHENTIK_SOURCE_GOOGLE_CLIENT_SECRET, UKUBI_WORLD_OIDC_CLIENT_ID,
# UKUBI_WORLD_OIDC_CLIENT_SECRET. The OAuth apps' callback URLs are
#   https://authentik.bnei.dev/source/oauth/callback/github/
#   https://authentik.bnei.dev/source/oauth/callback/google/
#
# Verify after the apply (the DB is the honest answer, never `cat` the mount):
#   psql -d authentik -tAc "SELECT slug, user_matching_mode FROM authentik_core_source"
#   curl -s https://authentik.bnei.dev/application/o/ukubi-world/.well-known/openid-configuration | head -c 300
# then one real sign-in per source and one local sign-up (mail link, the
# approval message, the bell, Activate, then sign-in works), check each new
# user's only group is `visitors`, and run one password reset.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authentik-blueprint-game-visitors
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: authentik-blueprint-game-visitors
    secretNamespace: authentik
    creationPolicy: Orphan
    template:
      data:
        game-visitors.yaml: |
          version: 1
          metadata:
            name: game-visitors
            labels:
              blueprints.goauthentik.io/instantiate: "true"
          entries:
            # No `users:` — membership is runtime state. Never mark this
            # absent: that deletes every visitor's membership with it.
            - model: authentik_core.group
              id: visitors
              identifiers:
                name: visitors
              attrs:
                name: visitors

            # --- enrollment ---------------------------------------------------
            - model: authentik_flows.flow
              id: enrollment-flow
              identifiers:
                slug: game-visitor-enrollment
              attrs:
                name: Game visitor enrollment
                title: Welcome to the world
                designation: enrollment
                authentication: none

            - model: authentik_policies_expression.expressionpolicy
              id: enrollment-gate
              identifiers:
                name: game-visitor-enrollment-gate
              attrs:
                name: game-visitor-enrollment-gate
                expression: |
                  # Only through the two visitor sources, never by hand.
                  if not ak_is_sso_flow:
                      return False
                  source = request.context.get("source")
                  if source is None or source.slug not in ("github", "google"):
                      return False
                  if not request.context.get("prompt_data", {}).get("email"):
                      ak_message("Your account has no email address we can read.")
                      return False
                  return True

            - model: authentik_stages_user_write.userwritestage
              id: enrollment-write
              identifiers:
                name: game-visitor-enrollment-write
              attrs:
                user_creation_mode: always_create
                create_users_as_inactive: false
                create_users_group: !KeyOf visitors
                user_type: external

            - model: authentik_stages_user_login.userloginstage
              id: enrollment-login
              identifiers:
                name: game-visitor-enrollment-login

            - model: authentik_policies.policybinding
              identifiers:
                target: !KeyOf enrollment-flow
                policy: !KeyOf enrollment-gate
                order: 0
            - model: authentik_flows.flowstagebinding
              identifiers:
                target: !KeyOf enrollment-flow
                stage: !KeyOf enrollment-write
                order: 10
            - model: authentik_flows.flowstagebinding
              identifiers:
                target: !KeyOf enrollment-flow
                stage: !KeyOf enrollment-login
                order: 20

            # --- sources ------------------------------------------------------
            # The username is the source's id, never the login or the name
            # (header). Merged over the type's own properties, so email and
            # name still come from the source.
            - model: authentik_sources_oauth.oauthsourcepropertymapping
              id: github-username
              identifiers:
                name: game-visitor-github-username
              attrs:
                name: game-visitor-github-username
                expression: |
                  return {"username": "gh-" + str(info["id"])}
            - model: authentik_sources_oauth.oauthsourcepropertymapping
              id: google-username
              identifiers:
                name: game-visitor-google-username
              attrs:
                name: game-visitor-google-username
                expression: |
                  # authentik's Google type reads the v1 userinfo endpoint,
                  # which names the account `id`, not `sub`.
                  return {"username": "google-" + str(info["id"])}

            - model: authentik_sources_oauth.oauthsource
              id: github
              identifiers:
                slug: github
              attrs:
                name: GitHub
                slug: github
                provider_type: github
                consumer_key: "{{ .AUTHENTIK_SOURCE_GITHUB_CLIENT_ID.Value }}"
                consumer_secret: "{{ .AUTHENTIK_SOURCE_GITHUB_CLIENT_SECRET.Value }}"
                # The type already asks for these; stated so the email claim's
                # dependency is visible here.
                additional_scopes: "user:email"
                user_matching_mode: identifier
                enrollment_flow: !KeyOf enrollment-flow
                authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
                user_property_mappings:
                  - !KeyOf github-username
            - model: authentik_sources_oauth.oauthsource
              id: google
              identifiers:
                slug: google
              attrs:
                name: Google
                slug: google
                provider_type: google
                consumer_key: "{{ .AUTHENTIK_SOURCE_GOOGLE_CLIENT_ID.Value }}"
                consumer_secret: "{{ .AUTHENTIK_SOURCE_GOOGLE_CLIENT_SECRET.Value }}"
                user_matching_mode: identifier
                enrollment_flow: !KeyOf enrollment-flow
                authentication_flow: !Find [authentik_flows.flow, [slug, default-source-authentication]]
                user_property_mappings:
                  - !KeyOf google-username

            # --- visitors-only gate (sign-in and recovery) ---------------------
            # True = "this is NOT a visitor account", and a deny stage runs.
            # Bound with evaluate_on_plan false, re_evaluate_policies true, so
            # it is read when the stage comes up, against the pending user
            # (flows/markers.py ReevaluateMarker). An unsaved user (no pk) is
            # the identification stage's stand-in for an unknown identifier.
            # Inactive covers both a deactivated (banned) visitor and one who
            # never clicked the verification mail.
            - model: authentik_policies_expression.expressionpolicy
              id: not-visitor
              identifiers:
                name: ukubi-world-not-visitor
              attrs:
                name: ukubi-world-not-visitor
                expression: |
                  # Re-read from the DB: the pending user in a mail-restored
                  # plan is a snapshot from when the mail was sent, and an
                  # owner's Deactivate since then must win.
                  from authentik.core.models import User
                  user = User.objects.filter(pk=request.user.pk, is_active=True).first()
                  if user is None:
                      return True
                  groups = set(user.all_groups().values_list("name", flat=True))
                  return groups != {"visitors"}
            - model: authentik_stages_deny.denystage
              id: not-visitor-deny
              identifiers:
                name: ukubi-world-not-visitor-deny
              attrs:
                deny_message: >-
                  This page is for world visitors. Sign in to authentik
                  directly with any other account.
            # The deny stage is the message; this is the lock. An expression
            # that raises returns its binding's failure_result
            # (policies/process.py execute; `true` on the deny bindings, so it
            # still denies), but an error outside the expression (the process
            # wrapper's own `except`, a timeout) is a plain False, which would
            # DROP the deny stage. `is-visitor` is bound to the stages that do
            # harm (login, the recovery password write), so any failure there
            # drops them instead and no session or password exists.
            - model: authentik_policies_expression.expressionpolicy
              id: is-visitor
              identifiers:
                name: ukubi-world-is-visitor
              attrs:
                name: ukubi-world-is-visitor
                expression: |
                  # Fresh from the DB, as in not-visitor: the recovery write
                  # does a full save of the plan's user, so a stale
                  # is_active=True must never get that far.
                  from authentik.core.models import User
                  user = User.objects.filter(pk=request.user.pk, is_active=True).first()
                  if user is None:
                      return False
                  groups = set(user.all_groups().values_list("name", flat=True))
                  return groups == {"visitors"}

            # --- local sign-up ------------------------------------------------
            # Shapes from authentik-blueprint-wird-enrollment.yaml (upstream's
            # flows-enrollment-email-verification.yaml), minus the name field
            # (mountain's reason: unmoderated text in the profile claims).
            - model: authentik_flows.flow
              id: local-enrollment-flow
              identifiers:
                slug: ukubi-world-enrollment
              attrs:
                name: ukubi world sign-up
                title: Join the world
                designation: enrollment
                authentication: require_unauthenticated

            - model: authentik_stages_prompt.prompt
              id: prompt-username
              identifiers:
                name: ukubi-world-enrollment-field-username
              attrs:
                field_key: username
                label: Username
                # type username: the prompt stage refuses a name any user
                # already has (stages/prompt/stage.py, case-sensitive; the
                # policy below adds the case-insensitive check).
                type: username
                required: true
                placeholder: 3-20 of a-z 0-9 _ -
                placeholder_expression: false
                order: 0
            - model: authentik_stages_prompt.prompt
              id: prompt-email
              identifiers:
                name: ukubi-world-enrollment-field-email
              attrs:
                field_key: email
                label: Email
                type: email
                required: true
                placeholder: Email
                placeholder_expression: false
                order: 1
            - model: authentik_stages_prompt.prompt
              id: prompt-password
              identifiers:
                name: ukubi-world-field-password
              attrs:
                field_key: password
                label: Password
                type: password
                required: true
                placeholder: Password
                placeholder_expression: false
                order: 2
            - model: authentik_stages_prompt.prompt
              id: prompt-password-repeat
              identifiers:
                name: ukubi-world-field-password-repeat
              attrs:
                field_key: password_repeat
                label: Password (repeat)
                type: password
                required: true
                placeholder: Password (repeat)
                placeholder_expression: false
                order: 3

            # Wird's rules (its file), declared again rather than `!Find`-ed.
            - model: authentik_policies_password.passwordpolicy
              id: password-policy
              identifiers:
                name: ukubi-world-password-strength
              attrs:
                name: ukubi-world-password-strength
                password_field: password
                check_static_rules: true
                length_min: 8
                amount_digits: 0
                amount_uppercase: 0
                amount_lowercase: 0
                amount_symbols: 0
                check_have_i_been_pwned: true
                hibp_allowed_count: 0
                error_message: >-
                  Use at least 8 characters, and a password that has not
                  appeared in a known data breach.

            # A username is never taken over: the prompt type refuses an exact
            # match, this refuses a case variant (`Moha` next to `moha`) and
            # the reserved prefixes. Service accounts (ADR-0066, ADR-0068) are
            # matched by username, so an enrolled `atlas-game` would be taken
            # over when its blueprint lands; `gh-`/`google-` are the OAuth
            # visitors' names (header), squatting one would break that
            # person's first GitHub/Google sign-in. An email already on any
            # account is refused too: the sign-in and recovery pages look a
            # user up by email and take the first match.
            # ponytail: no profanity list (mountain-handle has one); copy it
            # if strangers, not friends, start signing up.
            - model: authentik_policies_expression.expressionpolicy
              id: username-policy
              identifiers:
                name: ukubi-world-username
              attrs:
                name: ukubi-world-username
                expression: |
                  import re
                  data = request.context.get("prompt_data", {})
                  username = data.get("username", "")
                  email = data.get("email", "")
                  if not re.fullmatch(r"[a-z0-9_-]{3,20}", username):
                      ak_message("Username: 3 to 20 characters, a-z, 0-9, _ or -.")
                      return False
                  reserved = ("atlas-", "bridge-", "netbird-", "ak-", "wird-", "gh-", "google-")
                  parts = ("admin", "authentik", "ukubi", "bnei")
                  if (username.startswith(reserved) or any(p in username for p in parts)
                          or ak_user_by(username__iexact=username)):
                      ak_message("That username is not available.")
                      return False
                  if not email or ak_user_by(email__iexact=email):
                      ak_message("That email is already used. Sign in, or reset your password.")
                      return False
                  return True

            - model: authentik_stages_prompt.promptstage
              id: enrollment-prompt
              identifiers:
                name: ukubi-world-enrollment-prompt
              attrs:
                fields:
                  - !KeyOf prompt-username
                  - !KeyOf prompt-email
                  - !KeyOf prompt-password
                  - !KeyOf prompt-password-repeat
                validation_policies:
                  - !KeyOf password-policy
                  - !KeyOf username-policy

            # Inactive until the OWNER activates it: the email stage proves the
            # address but activate_user_on_success is false, so the mail link
            # never opens the account. External like the OAuth visitors, in
            # `visitors` only.
            # always_create: a racing duplicate username fails the save
            # (IntegrityError, stages/user_write/stage.py), never updates.
            - model: authentik_stages_user_write.userwritestage
              id: local-enrollment-write
              identifiers:
                name: ukubi-world-enrollment-write
              attrs:
                user_creation_mode: always_create
                create_users_as_inactive: true
                create_users_group: !KeyOf visitors
                user_type: external
            - model: authentik_stages_email.emailstage
              id: local-enrollment-email
              identifiers:
                name: ukubi-world-enrollment-email-verification
              attrs:
                use_global_settings: true
                template: email/account_confirmation.html
                activate_user_on_success: false
            - model: authentik_stages_user_login.userloginstage
              id: local-login
              identifiers:
                name: ukubi-world-user-login

            - model: authentik_flows.flowstagebinding
              identifiers:
                target: !KeyOf local-enrollment-flow
                stage: !KeyOf enrollment-prompt
                order: 10
            - model: authentik_flows.flowstagebinding
              identifiers:
                target: !KeyOf local-enrollment-flow
                stage: !KeyOf local-enrollment-write
                order: 20
            - model: authentik_flows.flowstagebinding
              identifiers:
                target: !KeyOf local-enrollment-flow
                stage: !KeyOf local-enrollment-email
                order: 30
            # The end of a sign-up: no login stage. Reached only past the
            # email stage, which moves on solely from its own mailed link for
            # this same pending user (stages/email/stage.py get(): restore
            # token, user match; a POST just resends the mail). The policy on
            # this binding marks the address verified, which keeps the user
            # out of the cleanup CronJob (ukubi-world-signup-cleanup.yaml),
            # and raises the event the owner is notified by. It never touches
            # is_active and always passes, so the message always shows. If it
            # errors the message still shows but the user is unmarked and the
            # cleanup deletes it after 24h: safe for approval, the person signs
            # up again.
            - model: authentik_policies_expression.expressionpolicy
              id: mark-verified
              identifiers:
                name: ukubi-world-mark-verified
              attrs:
                name: ukubi-world-mark-verified
                expression: |
                  user = request.user
                  key = "ukubi_world/email_verified"
                  if user.pk and not user.is_active and not user.attributes.get(key):
                      user.attributes[key] = True
                      user.save(update_fields=["attributes"])
                      # `message` keeps the bell's text short (Event.summary
                      # is the whole context otherwise; passwords in it are
                      # masked by key name, events/utils.py cleanse_dict).
                      ak_create_event(
                          "ukubi_world_signup_pending",
                          message=f"Sign-up verified, awaiting approval: {user.username}",
                          username=user.username,
                      )
                  return True
            - model: authentik_stages_deny.denystage
              id: awaiting-approval
              identifiers:
                name: ukubi-world-awaiting-approval
              attrs:
                deny_message: >-
                  Email confirmed. The owner approves new accounts; you can
                  sign in once approved.
            - model: authentik_flows.flowstagebinding
              id: awaiting-approval-binding
              identifiers:
                target: !KeyOf local-enrollment-flow
                stage: !KeyOf awaiting-approval
                order: 40
              attrs:
                evaluate_on_plan: false
                re_evaluate_policies: true
            - model: authentik_policies.policybinding
              identifiers:
                target: !KeyOf awaiting-approval-binding
                policy: !KeyOf mark-verified
                order: 0
              attrs:
                failure_result: true

            # --- owner notification ---------------------------------------------
            # The bell in the admin UI for every platform-admin when a sign-up
            # is verified. Its own local transport (a rule with no transport
            # sends nothing, events/tasks.py). ponytail: platform-admins by
            # `!Find`; a miss only silences the bell, the queue is still
            # Directory > Users filtered on inactive.
            - model: authentik_events.notificationtransport
              id: owner-bell
              identifiers:
                name: ukubi-world-local
              attrs:
                name: ukubi-world-local
                mode: local
            - model: authentik_policies_expression.expressionpolicy
              id: signup-event
              identifiers:
                name: ukubi-world-signup-pending-event
              attrs:
                name: ukubi-world-signup-pending-event
                expression: |
                  return request.context["event"].action == "custom_ukubi_world_signup_pending"
            - model: authentik_events.notificationrule
              id: signup-rule
              identifiers:
                name: ukubi-world-signup-pending
              attrs:
                name: ukubi-world-signup-pending
                severity: notice
                destination_group: !Find [authentik_core.group, [name, platform-admins]]
                transports:
                  - !KeyOf owner-bell
            - model: authentik_policies.policybinding
              identifiers:
                target: !KeyOf signup-rule
                policy: !KeyOf signup-event
                order: 0

            # --- password recovery ------------------------------------------------
            # Upstream's flows-recovery-email-verification.yaml, with two
            # changes. activate_user_on_success is FALSE: a mail click must not
            # re-enable a visitor the owner deactivated (an unverified sign-up
            # stays unverified too; it signs up again). And the visitors-only
            # gate sits AFTER the mail stage, so it is only reachable by
            # whoever holds the mailbox: before it, "unknown address", "admin"
            # and "visitor" all look the same (pretend_user_exists; the email
            # stage sends nothing for an unknown address in a recovery flow).
            # An admin's address still gets the mail, whose link then denies.
            - model: authentik_flows.flow
              id: recovery-flow
              identifiers:
                slug: ukubi-world-recovery
              attrs:
                name: ukubi world password reset
                title: Reset your password
                designation: recovery
                authentication: require_unauthenticated
            - model: authentik_stages_identification.identificationstage
              id: recovery-identification
              identifiers:
                name: ukubi-world-recovery-identification
              attrs:
                user_fields:
                  - email
                  - username
                pretend_user_exists: true
            - model: authentik_stages_email.emailstage
              id: recovery-email
              identifiers:
                name: ukubi-world-recovery-email
              attrs:
                use_global_settings: true
                template: email/password_reset.html
                token_expiry: minutes=15
                activate_user_on_success: false
            - model: authentik_stages_prompt.promptstage
              id: recovery-prompt
              identifiers:
                name: ukubi-world-recovery-prompt
              attrs:
                fields:
                  - !KeyOf prompt-password
                  - !KeyOf prompt-password-repeat
                validation_policies:
                  - !KeyOf password-policy
            # never_create: only the mail-proven pending user is written, and
            # only its password (the prompt's only fields).
            - model: authentik_stages_user_write.userwritestage
              id: recovery-write
              identifiers:
                name: ukubi-world-recovery-write
              attrs:
                user_creation_mode: never_create

            - model: authentik_flows.flowstagebinding
              identifiers:
                target: !KeyOf recovery-flow
                stage: !KeyOf recovery-identification
                order: 10
            - model: authentik_flows.flowstagebinding
              identifiers:
                target: !KeyOf recovery-flow
                stage: !KeyOf recovery-email
                order: 20
            - model: authentik_flows.flowstagebinding
              id: recovery-gate-binding
              identifiers:
                target: !KeyOf recovery-flow
                stage: !KeyOf not-visitor-deny
                order: 25
              attrs:
                evaluate_on_plan: false
                re_evaluate_policies: true
            - model: authentik_policies.policybinding
              identifiers:
                target: !KeyOf recovery-gate-binding
                policy: !KeyOf not-visitor
                order: 0
              attrs:
                failure_result: true
            - model: authentik_flows.flowstagebinding
              id: recovery-prompt-binding
              identifiers:
                target: !KeyOf recovery-flow
                stage: !KeyOf recovery-prompt
                order: 30
              attrs:
                evaluate_on_plan: false
                re_evaluate_policies: true
            - model: authentik_policies.policybinding
              identifiers:
                target: !KeyOf recovery-prompt-binding
                policy: !KeyOf is-visitor
                order: 0
            - model: authentik_flows.flowstagebinding
              id: recovery-write-binding
              identifiers:
                target: !KeyOf recovery-flow
                stage: !KeyOf recovery-write
                order: 40
              attrs:
                evaluate_on_plan: false
                re_evaluate_policies: true
            - model: authentik_policies.policybinding
              identifiers:
                target: !KeyOf recovery-write-binding
                policy: !KeyOf is-visitor
                order: 0
            - model: authentik_flows.flowstagebinding
              id: recovery-login-binding
              identifiers:
                target: !KeyOf recovery-flow
                stage: !KeyOf local-login
                order: 100
              attrs:
                evaluate_on_plan: false
                re_evaluate_policies: true
            - model: authentik_policies.policybinding
              identifiers:
                target: !KeyOf recovery-login-binding
                policy: !KeyOf is-visitor
                order: 0

            # --- the world's sign-in page --------------------------------------
            # Inbuilt backend only: no app-password tokens, no LDAP/Kerberos on
            # a public page.
            - model: authentik_stages_password.passwordstage
              id: world-password
              identifiers:
                name: ukubi-world-password
              attrs:
                backends:
                  - authentik.core.auth.InbuiltBackend
                failed_attempts_before_cancel: 5
            - model: authentik_stages_identification.identificationstage
              id: world-identification
              identifiers:
                name: ukubi-world-identification
              attrs:
                # Username or email + password, beside the two sources.
                user_fields:
                  - username
                  - email
                password_stage: !KeyOf world-password
                pretend_user_exists: true
                enrollment_flow: !KeyOf local-enrollment-flow
                recovery_flow: !KeyOf recovery-flow
                sources:
                  - !KeyOf github
                  - !KeyOf google
                show_source_labels: true

            - model: authentik_flows.flow
              id: world-authentication
              identifiers:
                slug: ukubi-world-authentication
              attrs:
                name: ukubi world sign-in
                title: Sign in to the world
                designation: authentication
                authentication: require_unauthenticated
            - model: authentik_flows.flowstagebinding
              identifiers:
                target: !KeyOf world-authentication
                stage: !KeyOf world-identification
                order: 10
            # A password that works here but is not a visitor's (an admin's)
            # is refused before any session exists: this page never becomes
            # a second, weaker login for the platform accounts.
            - model: authentik_flows.flowstagebinding
              id: world-gate-binding
              identifiers:
                target: !KeyOf world-authentication
                stage: !KeyOf not-visitor-deny
                order: 15
              attrs:
                evaluate_on_plan: false
                re_evaluate_policies: true
            - model: authentik_policies.policybinding
              identifiers:
                target: !KeyOf world-gate-binding
                policy: !KeyOf not-visitor
                order: 0
              attrs:
                failure_result: true
            - model: authentik_flows.flowstagebinding
              id: world-login-binding
              identifiers:
                target: !KeyOf world-authentication
                stage: !KeyOf local-login
                order: 100
              attrs:
                evaluate_on_plan: false
                re_evaluate_policies: true
            - model: authentik_policies.policybinding
              identifiers:
                target: !KeyOf world-login-binding
                policy: !KeyOf is-visitor
                order: 0

            # --- the public world's client ---------------------------------------
            - model: authentik_providers_oauth2.oauth2provider
              id: ukubi-world-provider
              identifiers:
                name: ukubi-world
              attrs:
                name: ukubi-world
                client_type: confidential
                client_id: "{{ .UKUBI_WORLD_OIDC_CLIENT_ID.Value }}"
                client_secret: "{{ .UKUBI_WORLD_OIDC_CLIENT_SECRET.Value }}"
                redirect_uris:
                  - matching_mode: strict
                    url: https://world.bnei.dev/auth/callback
                # Empty permits no grant (authentik-oidc skill).
                grant_types:
                  - authorization_code
                # sub stays the default hashed_user_id: a visitor's address is
                # mutable and not unique, so the game keys rows on `sub`.
                authentication_flow: !KeyOf world-authentication
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
                # The signing key is shared across apps: the game checks iss
                # and aud, not only the signature.
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
            - model: authentik_core.application
              identifiers:
                slug: ukubi-world
              attrs:
                name: ukubi world
                slug: ukubi-world
                provider: !KeyOf ukubi-world-provider
                meta_launch_url: https://world.bnei.dev
                meta_description: The cluster as a town (visitors)
