# NetBird's whole config.yaml, assembled here. ADR-0054.
#
# hq-secret.yaml's arrangement, for its reasons: the narrowing to NetBird's own
# keys happens in this repo, and every credential stays one Infisical entry.
# It is a whole FILE rather than env because netbird-server reads one
# config.yaml (the image's CMD is `--config /etc/netbird/config.yaml`), and
# common-app-chart's own infisical block can only feed envFrom.
#
# Keys verified against netbird v0.80.0's combined/cmd/config.go, not just the
# docs, which disagree with the code in two places:
#   - listenAddress: the docs say the default is :80, the code says :443.
#     Set explicitly. :80 because the gRPC routes go to it as h2c.
#   - the Postgres DSN: the docs name two different env vars. `dsn` here is
#     what the code reads; it sets NB_STORE_ENGINE_POSTGRES_DSN itself.
# authStore's engine name is `postgres`, but its sqlite default is `sqlite3`,
# unlike the other two stores. Not a typo.
#
# encryptionKey: losing it loses the encrypted columns in netbirddb, so a
# pgBackRest restore without it is useless. If it were ever empty the server
# would generate a fresh one on every start, silently.
#
# DSNs are libpq key=value, the form NetBird's docs use. sslmode=disable
# follows ente-museum, the other lib/pq client here: the Dex store goes
# through lib/pq, which has no `prefer` mode, and whether Pigsty's server
# certificate satisfies `require` was never measured on this cluster. LAN
# traffic to the .232 VIP, the same exposure every DB client here accepts.
# The password is random 32B urlsafe (docs/secrets.md), so it needs no
# quoting. Rotate it to something with a space or quote and every DSN breaks.
#
# owner: the first admin, created on first boot. Without it the first visitor
# to /setup becomes the admin, and this host is on the internet.
# localAuthDisabled stays false until authentik is wired and a login through it
# works (ADR-0054's PR 2) — flipping it first locks everyone out.
#
# trustedHTTPProxies is the pod CIDR because Traefik is the only proxy and
# reaches this pod from a pod address. It is what makes NetBird read the real
# client IP from X-Forwarded-For.
#
# A config change is not picked up live: the Deployment carries the operator's
# auto-reload annotation (values/netbird/values.yaml), which restarts it.
#
# The `netbird` namespace is created by the platform-common-apps
# ApplicationSet; until it exists the operator retries on its 60s resync.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: netbird-config
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: netbird-config
    secretNamespace: netbird
    creationPolicy: Orphan
    template:
      data:
        config.yaml: |
          server:
            listenAddress: ":80"
            exposedAddress: "https://netbird.bnei.dev:443"
            stunPorts:
              - 3478
            metricsPort: 9090
            healthcheckAddress: ":9000"
            logLevel: "info"
            logFile: "console"
            authSecret: "{{ .NETBIRD_RELAY_AUTH_SECRET.Value }}"
            dataDir: "/var/lib/netbird"
            disableAnonymousMetrics: true
            auth:
              issuer: "https://netbird.bnei.dev/oauth2"
              signKeyRefreshEnabled: true
              sessionCookieEncryptionKey: "{{ .NETBIRD_SESSION_COOKIE_KEY.Value }}"
              localAuthDisabled: false
              dashboardRedirectURIs:
                - "https://netbird.bnei.dev/nb-auth"
                - "https://netbird.bnei.dev/nb-silent-auth"
              cliRedirectURIs:
                - "http://localhost:53000/"
              owner:
                email: "account@bnei.dev"
                password: "{{ .NETBIRD_OWNER_PASSWORD.Value }}"
            reverseProxy:
              trustedHTTPProxies:
                - "10.233.64.0/18"
            store:
              engine: "postgres"
              dsn: "host=postgres.bnei.lan port=5432 user=dbuser_netbird password={{ .DBUSER_NETBIRD_PASSWORD.Value }} dbname=netbirddb sslmode=disable"
              encryptionKey: "{{ .NETBIRD_STORE_ENCRYPTION_KEY.Value }}"
            activityStore:
              engine: "postgres"
              dsn: "host=postgres.bnei.lan port=5432 user=dbuser_netbird password={{ .DBUSER_NETBIRD_PASSWORD.Value }} dbname=netbirdeventsdb sslmode=disable"
            authStore:
              engine: "postgres"
              dsn: "host=postgres.bnei.lan port=5432 user=dbuser_netbird password={{ .DBUSER_NETBIRD_PASSWORD.Value }} dbname=netbirdidpdb sslmode=disable"
