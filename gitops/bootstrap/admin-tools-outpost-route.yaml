# The callback legs for the admin tools' forwardAuth (pgweb.bnei.dev,
# alertmanager.bnei.dev). ADR-0039 Decision 3, #183.
#
# Their proxy providers are forward_single, so authentik sends the browser back
# to https://<host>/outpost.goauthentik.io/callback; that path must reach
# authentik, not the tool. A copy of mountain-outpost-route.yaml (itself drop's,
# itself wird-admin-outpost-route.yaml's), which explains the priority
# (load-bearing) and why no middleware sits on it.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: admin-tools-outpost
  namespace: authentik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`pgweb.bnei.dev`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 100
      services:
        - name: platform-authentik-server
          port: 80
    - kind: Rule
      match: Host(`alertmanager.bnei.dev`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 100
      services:
        - name: platform-authentik-server
          port: 80
  tls:
    certResolver: le
