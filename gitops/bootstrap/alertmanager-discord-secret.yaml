# InfisicalSecret that materialises the Discord webhook Alertmanager posts
# to. Applied at bootstrap time but only becomes active once Infisical
# (wave 1) and infisical-operator (wave 1) are running.
#
# Required secret in the infra-bootstrap Infisical project (see docs/secrets.md):
#   ALERTMANAGER_DISCORD_WEBHOOK_URL — a Discord channel webhook
#   (Discord channel → Integrations → Webhooks).
#
# Consumed by gitops/platform/values/prometheus/values.yaml's
# alertmanager.alertmanagerSpec.secrets + alertmanager.config's
# slack_configs[].api_url_file, which reads the mounted `webhook-url` key.
#
# This CR lives in ns infisical (not monitoring) for the same reason
# grafana-admin-secret.yaml does — monitoring doesn't exist yet at bootstrap
# Step 3 time, it's only created later when the Prometheus Application
# (wave 5, CreateNamespace=true) first syncs. The managedSecretReference
# below targets monitoring directly; the operator retries (resyncInterval)
# until that namespace exists.
#
# The `/slack` suffix is baked into the templated value here (not appended
# in prometheus/values.yaml) because Discord webhooks only accept
# Slack-formatted payloads at that suffixed path — this lets Alertmanager's
# native slack_configs receiver post to Discord with no adapter container.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: alertmanager-discord-secret
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: alertmanager-discord-webhook
    secretNamespace: monitoring
    creationPolicy: Orphan
    template:
      data:
        webhook-url: "{{ .ALERTMANAGER_DISCORD_WEBHOOK_URL.Value }}/slack"
