# Standalone Application for the realm's fence (mountain plan/21 phase 0b):
# its CiliumNetworkPolicy as a plain manifest, reviewed here beside the game's
# own (platform-ukubi-game-bounds, ukubi-game-application.yaml), not in the
# game repo's values.
#
# Wave 1, before user apps (10): the namespace and its fence exist before the
# realm's first pod, so it never runs unfenced. The realm itself (registry
# entry `ukubi-realm`) deploys into this same namespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-ukubi-realm-bounds
  namespace: argocd
  labels:
    gitops.bnei.dev/tier: platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:MohammadBnei/infra-bootstrap.git
    targetRevision: main
    path: gitops/platform/ukubi-realm
  destination:
    server: https://kubernetes.default.svc
    namespace: ukubi-realm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
