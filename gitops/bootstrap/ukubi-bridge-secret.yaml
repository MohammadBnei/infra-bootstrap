# ukubi-bridge's credentials, assembled here. ADR-0060.
#
# mountain-secret.yaml's arrangement, for its reasons: pointing the app's
# `infisical` block at the root project would mount EVERY root secret into the
# ukubi-bridge namespace, so the narrowing happens here; and building the DSN
# from DBUSER_BRIDGE_PASSWORD keeps the password in one Infisical entry.
#
# The password is "random 32B urlsafe" (docs/secrets.md), so it needs no
# escaping in the URL's userinfo. Rotate it to anything with `@`, `:` or `/`
# and this silently becomes a different DSN.
#
# postgres.bnei.lan:5432 is the Pigsty VIP (vip-manager, follows the primary)
# on Postgres's own port, so this reaches the primary directly. Not 6432: the
# bridge LISTENs, which needs a session-mode connection, and Pigsty's
# pgbouncer pools in transaction mode (dbuser_bridge and `bridge` set
# pgbouncer: false anyway). pool_max_conns=8 is read by pgxpool from the URL:
# the role's connlimit is 10, and pgxpool's default max(4, NumCPU) would pass
# it on a node with more than 10 CPUs (hq's measured failure).
#
# The ukubi-bridge app's helm/values.yaml loads the Secret `ukubi-bridge-config`
# by envFrom. BRIDGE_GITHUB_APP_ID and BRIDGE_GITHUB_APP_PRIVATE_KEY are read by
# the reconcile loop once it exists; BRIDGE_ALERT_TOKEN by the Alertmanager
# ingest once it exists. Shipping them now means no second secret change later.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: ukubi-bridge-secret
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: ukubi-bridge-config
    secretNamespace: ukubi-bridge
    creationPolicy: Orphan
    template:
      data:
        BRIDGE_DATABASE_URL: "postgres://dbuser_bridge:{{ .DBUSER_BRIDGE_PASSWORD.Value }}@postgres.bnei.lan:5432/bridge?pool_max_conns=8"
        BRIDGE_GITHUB_WEBHOOK_SECRET: "{{ .BRIDGE_GITHUB_WEBHOOK_SECRET.Value }}"
        BRIDGE_GITHUB_APP_ID: "{{ .BRIDGE_GITHUB_APP_ID.Value }}"
        BRIDGE_GITHUB_APP_PRIVATE_KEY: "{{ .BRIDGE_GITHUB_APP_PRIVATE_KEY.Value }}"
        BRIDGE_ALERT_TOKEN: "{{ .BRIDGE_ALERT_TOKEN.Value }}"
