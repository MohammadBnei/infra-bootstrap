# mountain's OIDC client credentials + session key (mountain detail mode,
# ADR-0056), the fleet-oidc-secret.yaml shape.
#
# The SAME client pair is consumed twice: authentik registers it on its
# provider (authentik-blueprint-mountain.yaml), the relay presents it at the
# token endpoint (this Secret). Its own Secret rather than keys in
# mountain-config: a render failure here must not take DATABASE_URL with it.
#
# mountain's helm/values.yaml loads `mountain-oidc` by envFrom, optional: without
# it the relay starts with detail mode off. Keys are the relay's env names.
# Env is bound at container start: restart the mountain pod after a rotation.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: mountain-oidc-secret
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: mountain-oidc
    secretNamespace: mountain
    creationPolicy: Orphan
    template:
      data:
        # Not secret, but here so the four arrive (or are missing) together.
        MOUNTAIN_OIDC_ISSUER: "https://authentik.bnei.dev/application/o/mountain/"
        MOUNTAIN_OIDC_CLIENT_ID: "{{ .MOUNTAIN_OIDC_CLIENT_ID.Value }}"
        MOUNTAIN_OIDC_CLIENT_SECRET: "{{ .MOUNTAIN_OIDC_CLIENT_SECRET.Value }}"
        # HMAC key of the relay's own session + login-flow cookies. Not an
        # authentik credential, but it shares the lifecycle and the restart.
        # Rotating signs everyone out (sessions last 1 h anyway).
        MOUNTAIN_SESSION_KEY: "{{ .MOUNTAIN_SESSION_KEY.Value }}"
