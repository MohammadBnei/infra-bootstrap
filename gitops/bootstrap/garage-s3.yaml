# Bridges Traefik-in-cluster to Garage's S3 API, which runs off-cluster on
# the garage-storage LXC (192.168.1.199:3900, LAN-only —
# ansible/playbooks/garage-configure.yml).
#
# ExternalName, not a headless ClusterIP + hand-authored Endpoints — that
# was tried first and silently never worked: argocd-cm excludes both
# Endpoints and EndpointSlice cluster-wide (standard resource.exclusions
# tuning, to cut watch/UI churn from the control-plane-managed ones), so a
# hand-authored Endpoints object is dropped on every sync, leaving Traefik
# with "no available server" for every request — confirmed live (zero
# Endpoints/EndpointSlice existed despite this manifest defining one).
# Same failure mode already documented in gitops/redirectors/proxmox.yaml,
# which uses ExternalName for exactly this reason. Traefik's
# kubernetesCRD provider resolves spec.externalName directly, no
# Endpoints needed either way.
#
# Auth: Garage's own S3 SigV4 signing (per-bucket, per-key via `garage
# bucket allow`) is the only access control here — there's no
# anonymous/public read. Garage's admin API (port 3903) is deliberately
# NOT part of this — it stays bound to 127.0.0.1 on the LXC and is never
# reachable through this Service. See ADR-0030.
#
# tls.certResolver: le (not a cert-manager Certificate) is this repo's
# standard TLS pattern — see gitops/bootstrap/grafana-ingressroute.yaml —
# and requests its own per-hostname cert via HTTP-01 on first request.
apiVersion: v1
kind: Namespace
metadata:
  name: garage
---
apiVersion: v1
kind: Service
metadata:
  name: garage-s3
  namespace: garage
spec:
  type: ExternalName
  externalName: "192.168.1.199"
  ports:
    - port: 3900
      protocol: TCP
      name: s3
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: garage-s3
  namespace: garage
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`s3.bnei.dev`)
      services:
        - name: garage-s3
          port: 3900
  tls:
    certResolver: le
