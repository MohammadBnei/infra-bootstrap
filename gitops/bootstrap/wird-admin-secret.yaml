# wird-adminweb's two credentials, assembled here rather than stored assembled —
# same reasoning as wird-secret.yaml above, which this file deliberately mirrors
# rather than extends. ADR-0052.
#
# WHY A SECOND SECRET AND NOT TWO MORE KEYS IN `wird-config`. adminweb and
# wird-api are different Deployments with different database roles, and the whole
# point of the wird_admin role is that adminweb cannot write what wird-api can.
# Putting both DSNs in one Secret and relying on each Deployment to envFrom the
# right key would make that boundary a naming convention. Separate Secret,
# separate role, nothing shared.
#
# DATABASE_URL — least privilege, enumerated. The role has SELECT on exactly the
# six tables adminweb reads and UPDATE on three columns of one of them; it owns
# nothing and can create nothing. The grant list and its verification live in
# docs/runbook-wird-admin-db-role.md, which is also where the SQL is, because
# this file cannot create a role — it only carries the password that one was
# created with.
#
# Deliberately NOT dbrole_readonly, which Pigsty would have made a one-liner:
# that grants SELECT on every table in the database, including `report_inbox`,
# which wird's ADR-0026 explicitly keeps out of adminweb's reach.
#
# OIDC_CLIENT_SECRET is the HMAC key for the forwarded token, not a client secret
# adminweb ever presents anywhere. A proxy provider has no signing key
# (set_oauth_defaults() forces signing_key = None), so authentik signs the JWT in
# X-authentik-jwt with HS256 using the provider's client_secret —
# authentik-blueprint-wird-admin.yaml declares the same Infisical value on the
# authentik side. If these two ever disagree, every request 401s with a
# signature error and nothing says why: one value, two consumers, one row.
#
# The password is generated as 43 alphanumeric characters, so it needs no
# percent-encoding in the DSN userinfo — the same trap wird-secret.yaml records
# for DBUSER_WIRD_PASSWORD.
#
# postgres.bnei.lan:5432, not the VIP literal and not pgbouncer's 6432, for the
# reasons wird-secret.yaml gives: CoreDNS forwards to Pi-hole so pods can resolve
# the Pigsty VIP by name, and wirddb sets pgbouncer: false.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: wird-admin-secret
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: wird-admin-config
    secretNamespace: wird
    creationPolicy: Orphan
    template:
      data:
        DATABASE_URL: "postgres://wird_admin:{{ .DBUSER_WIRD_ADMIN_PASSWORD.Value }}@postgres.bnei.lan:5432/wirddb"
        OIDC_CLIENT_SECRET: "{{ .WIRD_ADMIN_OIDC_CLIENT_SECRET.Value }}"
