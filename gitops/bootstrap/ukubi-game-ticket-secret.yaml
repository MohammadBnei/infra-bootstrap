# The two game pods' realm-ticket SIGNING keys (mountain plan/21 phase 0b):
# each pod mints tickets with its own Ed25519 private key, and the realm
# verifies them with the matching public key (ukubi-realm-secret.yaml). Two
# keys, never one shared: the public pod could otherwise mint an owner.
#
# One Secret per pod, each in that pod's namespace, apart from the pods'
# other Secrets: a missing ticket key leaves only this Secret unrendered, and
# the game's values reference it by secretKeyRef with optional: true, so the
# pod still starts and plays solo (the realm is additive, plan/21 Failure).
#
# Root project: the keys carry an OWNER or FRIEND infix there and arrive under
# each pod's own variable name, so the public namespace never holds the
# owner's key. Env is bound at start: restart the pod after a rotation, and
# rotate each private key together with its public half.
#
# TODO(realm): enable with cmd/game's ticket minting (plan/21 phase 4). The
# game's values keep both secretKeyRefs commented out until then, so these
# keys reach no pod before cmd/game mints tickets.
#
# Encoding (decided): base64, std alphabet, padded, of the 32-byte Ed25519
# seed. TODO(realm): confirm the variable names against cmd/game's minting.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: ukubi-game-ticket
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: ukubi-game-ticket
    secretNamespace: ukubi-game
    creationPolicy: Orphan
    template:
      data:
        UKUBI_GAME_OWNER_TICKET_KEY: "{{ .UKUBI_REALM_OWNER_TICKET_KEY.Value }}"
---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: ukubi-game-public-ticket
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: ukubi-game-public-ticket
    secretNamespace: ukubi-game-public
    creationPolicy: Orphan
    template:
      data:
        UKUBI_GAME_FRIEND_TICKET_KEY: "{{ .UKUBI_REALM_FRIEND_TICKET_KEY.Value }}"
