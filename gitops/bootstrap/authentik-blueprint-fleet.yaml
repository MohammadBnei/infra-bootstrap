# authentik blueprint declaring the agent-fleet console's OIDC provider +
# application (ADR-0039, "Native OIDC" tier — amended by ADR-0041, which moves
# `fleet` out of the forwardAuth tier this ADR originally assigned it to).
#
# WHY NATIVE OIDC AND NOT forwardAuth, for the one host ADR-0039 put in the
# other tier: forwardAuth runs at Traefik, so it does nothing for a caller that
# does not traverse the ingress. A worker pod dialling
# agent-fleet-core.agent-fleet.svc.cluster.local:8080 on the pod network is
# exactly such a caller, and that hole is agent-fleet#200. A gate inside core
# applies regardless of network position; a middleware cannot.
#
# The e2e preview hosts stay on forwardAuth — see
# authentik-blueprint-forwardauth.yaml. They route to a session's own dev-server
# pod, with no core code anywhere in the request path.
#
# Delivered as a SECRET rather than a ConfigMap because it embeds an OAuth2
# client secret. The chart discovers any key ending in `.yaml` under
# blueprints.configMaps / blueprints.secrets; a ConfigMap would put the client
# secret in plaintext in git. The blueprint's STRUCTURE still lives here —
# reviewable and diffable — with only the two credential values interpolated by
# the Infisical operator.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authentik-blueprint-fleet
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: authentik-blueprint-fleet
    secretNamespace: authentik
    creationPolicy: Orphan
    template:
      data:
        fleet-oidc.yaml: |
          version: 1
          metadata:
            name: fleet-oidc
            labels:
              blueprints.goauthentik.io/instantiate: "true"
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              id: fleet-provider
              identifiers:
                name: fleet
              attrs:
                name: fleet
                client_type: confidential
                client_id: "{{ .FLEET_OIDC_CLIENT_ID.Value }}"
                client_secret: "{{ .FLEET_OIDC_CLIENT_SECRET.Value }}"
                # Object form is required in 2026.x. A bare string list parses
                # fine and then rejects every callback with no useful error.
                redirect_uris:
                  - matching_mode: strict
                    url: https://fleet.bnei.dev/auth/callback
                # WITHOUT THIS THE PROVIDER REJECTS EVERY LOGIN. Defaults to
                # empty, and empty permits no grant at all — authentik logs
                # "Invalid grant_type for provider" while the client sees only a
                # generic malformed-request error, and the discovery document
                # still advertises authorization_code as though nothing were
                # wrong.
                grant_types:
                  - authorization_code
                  - refresh_token
                # core keys authorization on the email claim and stores it as
                # the author of a session/proposal/decision. user_email keeps
                # `sub` and that attribution the same string.
                sub_mode: user_email
                # Single-operator homelab: a consent screen on every login to
                # your own console is friction with no corresponding gain.
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
                # `profile` is what carries the `groups` claim core checks for
                # platform-admins. VERIFY THIS ON A REAL TOKEN before relying on
                # it: if groups is absent, core fails closed on every login and
                # it reads like a core bug rather than a missing scope mapping.
                #   curl -s https://authentik.bnei.dev/application/o/fleet/.well-known/openid-configuration
                # then decode an actual id_token — the discovery document does
                # not tell you which claims are populated.
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
            - model: authentik_core.application
              identifiers:
                slug: fleet
              attrs:
                name: Agent Fleet
                slug: fleet
                provider: !KeyOf fleet-provider
                meta_launch_url: https://fleet.bnei.dev
                meta_description: The agent fleet console
