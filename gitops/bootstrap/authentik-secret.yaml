# InfisicalSecret that materialises authentik's entire configuration Secret
# (ADR-0039). Applied at bootstrap time but only becomes active once Infisical
# (wave 1) and infisical-operator (wave 1) are running.
#
# Required secrets in the infra-bootstrap Infisical project (docs/secrets.md):
#   AUTHENTIK_SECRET_KEY        — cookie signing + unique user IDs. Changing it
#                                 after first install invalidates every session
#                                 and is documented upstream as "don't".
#   DBUSER_AUTHENTIK_PASSWORD   — the PLAINTEXT password authentik connects
#                                 with. Its SCRAM-SHA-256 verifier (not this
#                                 value) is what lives in pigsty/pigsty.yml.
#                                 Rotating means regenerating both together.
#
# WHY every key lives here rather than in the values file:
# `authentik.existingSecret.secretName` makes the chart skip creating its own
# Secret entirely and read ALL configuration from this one — the chart's own
# warning is "when set, authentik.* secret values are ignored". So the
# non-secret values (host, db name, user, port) have to be here too, or they
# are simply absent. They are not secrets; they are here because the mechanism
# is all-or-nothing.
#
# Key naming is the chart's, not ours: templates/_helpers.tpl flattens nested
# maps with a DOUBLE underscore and uppercases, so authentik.postgresql.password
# becomes AUTHENTIK_POSTGRESQL__PASSWORD. A single underscore silently does
# nothing.
#
# postgres.bnei.lan rather than 192.168.1.232: ARCHITECTURE.md §3 records that
# CoreDNS forwards to Pi-hole explicitly *because* pods need to resolve the
# Pigsty VIP by name. The name survives an IP change; the IP does not.
#
# Port 5432 (Postgres) rather than 6432 (pgbouncer) deliberately. Pigsty's
# pgbouncer defaults to transaction pooling, which breaks Django's prepared
# statements and persistent connections — authentik is a Django application.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: authentik-secret
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: authentik-config
    secretNamespace: authentik
    creationPolicy: Orphan
    template:
      data:
        AUTHENTIK_SECRET_KEY: "{{ .AUTHENTIK_SECRET_KEY.Value }}"
        AUTHENTIK_POSTGRESQL__HOST: "postgres.bnei.lan"
        AUTHENTIK_POSTGRESQL__NAME: "authentik"
        AUTHENTIK_POSTGRESQL__USER: "dbuser_authentik"
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .DBUSER_AUTHENTIK_PASSWORD.Value }}"
        AUTHENTIK_POSTGRESQL__PORT: "5432"
