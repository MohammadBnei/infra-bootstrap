# Standalone Application, not part of apps.applicationset.yaml's shared
# list generator — same reasoning as traefik-application.yaml: ArgoCD
# Go-templates individual string fields only, so the shared template can't
# emit a variable-length valueFiles list. vos-monolith-dev is the only user
# app needing 2 files (base + dev override), so it gets its own manifest
# instead of forcing that limitation onto the shared template.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vos-monolith-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  # Source 1: shared Helm chart from infra-bootstrap
  - repoURL: git@github.com:MohammadBnei/infra-bootstrap.git
    path: gitops/platform/common-app-chart
    targetRevision: HEAD
    helm:
      valueFiles:
      - $values/back/helm/values.yaml
      - $values/back/helm/values-dev.yaml
      parameters:
      - name: ingress.hostname
        value: dev.api.voconsteroid.com
  # Source 2: per-app values repo (private, HTTPS + PAT — see
  # gitops/README.md's "Bootstrap credential chain" for how
  # repo-creds-github-bnei is injected)
  #
  # targetRevision is explicitly `dev`, NOT HEAD — vos-monolith's default
  # branch happens to currently be `dev` too, but relying on that would be
  # a coincidence: .github/workflows/back_ci_dev.yml/migrate_dev.yml/
  # db_check_dev.yml all push their tag bumps to the literal `dev` branch,
  # so that's what this Application needs to track regardless of which
  # branch GitHub calls "default".
  - repoURL: https://github.com/MohammadBnei/vos-monolith.git
    targetRevision: dev
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vos-dev
  ignoreDifferences:
  - group: secrets.infisical.com
    kind: InfisicalSecret
    jsonPointers:
    - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
