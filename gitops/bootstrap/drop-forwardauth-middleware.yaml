# drop's own forwardAuth Middleware (files.bnei.dev). ADR-0059.
#
# WHY NOT THE SHARED `authentik-forwardauth`. That one is the previews
# provider's gate, bound to platform-admins; drop is gated on shared-notes
# (authentik-blueprint-drop-policy.yaml), and the outpost picks the provider
# from the forwarded host, so a dedicated object only keeps the header list
# honest. No X-authentik-jwt: drop trusts X-authentik-username and admits
# Traefik alone through its NetworkPolicy (drop's helm/values.yaml).
#
# Address and trustForwardHeader copied from wird-admin-forwardauth-middleware.yaml,
# for its reasons (same embedded outpost, port 80).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: drop-forwardauth
  namespace: default
spec:
  forwardAuth:
    address: http://platform-authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-email
      - X-authentik-groups
      - X-authentik-uid
