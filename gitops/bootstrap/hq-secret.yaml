# hq's database credential, assembled here. ADR-0053.
#
# gitops/bootstrap/wird-secret.yaml's arrangement, for its reasons — read its
# header. In short: hq's values.yaml pointing common-app-chart's `infisical`
# block at the root project would mount EVERY root secret into the hq
# namespace, so the narrowing happens here, in the repo that reviews its own
# changes; and building the DSN from DBUSER_HQ_PASSWORD keeps the password in
# one Infisical entry, so rotation is one edit.
#
# The password is "random 32B urlsafe" (docs/secrets.md), so it needs no
# escaping in the URL's userinfo. Rotate it to anything with `@`, `:` or `/`
# and this silently becomes a different DSN.
#
# postgres.bnei.lan:5432, not 6432: dbuser_hq and hqdb set pgbouncer: false.
#
# The `hq` namespace is created by the apps ApplicationSet; until it exists the
# operator retries on its 60s resync.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: hq-secret
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: hq-config
    secretNamespace: hq
    creationPolicy: Orphan
    template:
      data:
        DATABASE_URL: "postgres://dbuser_hq:{{ .DBUSER_HQ_PASSWORD.Value }}@postgres.bnei.lan:5432/hqdb"
