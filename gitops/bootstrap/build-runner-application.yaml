# Standalone Application for the image-building runner (ADR-0034) — plain
# manifests, not common-app-chart, same reasoning as
# actions-runner-application.yaml (not a web app: no ingress, no service).
#
# Separate from actions-runner-application.yaml on purpose, not for tidiness:
# the two runners exist precisely so that build execution and the identity
# that can reach the Kubernetes API never share a pod. Keeping them separate
# Applications means neither can quietly acquire the other's manifests.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-build-runner
  namespace: argocd
  labels:
    gitops.bnei.dev/tier: platform
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:MohammadBnei/infra-bootstrap.git
    targetRevision: main
    path: gitops/platform/build-runner
  destination:
    server: https://kubernetes.default.svc
    namespace: build-runner
  ignoreDifferences:
  - group: secrets.infisical.com
    kind: InfisicalSecret
    jsonPointers:
    - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
