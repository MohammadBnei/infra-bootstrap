# drop's Garage credential and its authentik provider's client pair
# (files.bnei.dev). ADR-0059.
#
# Narrowed here, not in drop's values, for wird-secret.yaml's reason: an app
# repo pointing infisical.projectSlug at the root project would mount every
# secret in it. This template hands drop these four keys and nothing else.
#
# DROP_S3_ACCESS_KEY/_SECRET: garage-configure.yml writes them to the root
# project. The key is scoped to the `drop` bucket alone.
#
# DROP_OIDC_CLIENT_ID/_SECRET: the `drop` proxy provider's pair
# (authentik-blueprint-forwardauth.yaml). Both are GENERATED BY AUTHENTIK and
# read back into Infisical with `ak shell` (docs/runbook-wird-admin-db-role.md
# §3, name='drop'): ProxyProviderSerializer has read_only client_id and no
# client_secret field, so a declared pair is silently ignored
# (wird-admin-secret.yaml has the full reason). The secret is the HS256 key of
# the forwarded X-authentik-jwt; the id is the `aud` drop pins. Re-read both
# after any provider recreation.
#
# GUARDED, unlike wird-admin-secret.yaml. On operator v0.11.11
# (internal/services/infisicalsecret/reconciler.go:141-160, text/template, no
# missingkey option) an unguarded `{{ .K.Value }}` for a missing key renders
# the literal `<no value>`, also on resync over a good value (ADR-0049). drop
# would start, verify every token against a bogus key, and 401 everyone. The
# guard renders "" instead, so drop fails at startup naming the missing key.
# The S3 lines predate this and stay as they are.
#
# The endpoints, region and bucket are plain values in drop's helm/values.yaml.
#
# NAMESPACE ORDERING. The `drop` namespace is created by the apps
# ApplicationSet; until then the operator retries on its 60s resync.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: drop-secret
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: drop-config
    secretNamespace: drop
    creationPolicy: Orphan
    template:
      data:
        DROP_S3_ACCESS_KEY: "{{ .DROP_S3_ACCESS_KEY.Value }}"
        DROP_S3_SECRET: "{{ .DROP_S3_SECRET.Value }}"
        DROP_OIDC_CLIENT_ID: "{{ if .DROP_OIDC_CLIENT_ID }}{{ .DROP_OIDC_CLIENT_ID.Value }}{{ end }}"
        DROP_OIDC_CLIENT_SECRET: "{{ if .DROP_OIDC_CLIENT_SECRET }}{{ .DROP_OIDC_CLIENT_SECRET.Value }}{{ end }}"
