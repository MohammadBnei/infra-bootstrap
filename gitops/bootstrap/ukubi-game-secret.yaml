# The game owner pod's env, assembled here (mountain plan/17). wird-secret.yaml's
# arrangement, for its reasons: the narrowing to these keys happens in this
# repo, and the DSN is built from DBUSER_GAME_PASSWORD so the password stays in
# one Infisical entry.
#
# Why the root project and not the game's own (ADR-0069 Decision 5): every key
# here already has to live in the root project for another reader (the OIDC
# pair for authentik's blueprint, DBUSER_GAME_PASSWORD for Pigsty's SCRAM
# verifier). Infisical references do not cross projects, so a copy in
# `ukubi-game` would be a second entry to rotate by hand. The game's other
# secrets (GitHub and fleet tokens, the atlas app password) stay in its own
# project, read by its own identity.
#
# One Secret, not mountain's two: the game needs all four sign-in variables or
# none, and a game without its sign-in has nothing to serve on this host.
# Missing any key, the Secret does not render and the pod waits on it (the
# values load it without `optional`).
#
# DSN: postgres.bnei.lan:5432, not 6432 (dbuser_game and gamedb set
# pgbouncer: false, mountain's reason). The password is "random 32B urlsafe"
# (docs/secrets.md), so it needs no escaping in the URL's userinfo.
#
# The game's helm/values.yaml loads `ukubi-game-config` by envFrom. Env is
# bound at container start: restart the pod after a rotation. The namespace is
# created at wave 1 (platform-ukubi-game-bounds); until it exists the operator
# retries on its 60 s resync.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: ukubi-game-secret
  namespace: infisical
spec:
  hostAPI: http://platform-infisical-backend.infisical.svc.cluster.local:8080/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: "infra-bootstrap-1-ge1"
        envSlug: dev
        secretsPath: "/"
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
  managedSecretReference:
    secretName: ukubi-game-config
    secretNamespace: ukubi-game
    creationPolicy: Orphan
    template:
      data:
        # Not secret, but here so the four arrive (or are missing) together.
        UKUBI_GAME_OIDC_ISSUER: "https://authentik.bnei.dev/application/o/ukubi-game/"
        UKUBI_GAME_OIDC_CLIENT_ID: "{{ .UKUBI_GAME_OIDC_CLIENT_ID.Value }}"
        UKUBI_GAME_OIDC_CLIENT_SECRET: "{{ .UKUBI_GAME_OIDC_CLIENT_SECRET.Value }}"
        # HMAC key of the game's session and login-flow cookies (32 bytes at
        # least). Rotating signs everyone out (sessions last 1 h anyway).
        UKUBI_GAME_SESSION_KEY: "{{ .UKUBI_GAME_SESSION_KEY.Value }}"
        UKUBI_GAME_DATABASE_URL: "postgres://dbuser_game:{{ .DBUSER_GAME_PASSWORD.Value }}@postgres.bnei.lan:5432/gamedb"
