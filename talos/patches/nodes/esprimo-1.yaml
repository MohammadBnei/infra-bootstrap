# esprimo-1: static address, hostname, Wake-on-LAN, install disk.
# The DHCP reservation (plan §0.1.5) is only for maintenance mode; an
# explicit link config turns Talos's own DHCP off.
#
# UNVERIFIED field shapes for LinkConfig, HostnameConfig and EthernetConfig
# in 1.14: check with `talosctl validate`. Fill the disk serial from the
# hardware session (plan §1.2: lsblk -o NAME,MODEL,SERIAL).
apiVersion: v1alpha1
kind: HostnameConfig
hostname: esprimo-1
---
apiVersion: v1alpha1
kind: LinkConfig
name: eth0
up: true
addresses:
  - address: 192.168.1.21/24
routes:
  - gateway: 192.168.1.254
---
apiVersion: v1alpha1
kind: EthernetConfig
name: eth0
wakeOnLAN:
  - magic
---
machine:
  install:
    diskSelector:
      serial: FILL-ME-esprimo-1-ssd-serial
